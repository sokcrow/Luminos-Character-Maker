<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Bastiones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Header: Stats Panel -->
    <header id="stats-panel" class="limbus-panel">
        <div class="stat-box">
            <span class="stat-label">SEMANA</span>
            <span class="stat-value" id="ui-week">1</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">ORO</span>
            <span class="stat-value" id="ui-gold">1000</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">MORAL</span>
            <span class="stat-value" id="ui-morale">0</span>
        </div>
    </header>

    <div id="main-container">
        <!-- Main Area: Map / Canvas -->
        <main id="map-area">
            <div id="canvas-wrapper">
                <canvas id="bastion-canvas" width="1024" height="768"></canvas>
            </div>
        </main>

        <!-- Sidebar: Controls and Hirelings Table -->
        <aside id="sidebar-panel" class="limbus-panel-sidebar">
            <div class="controls-section" style="margin-bottom: 15px; padding-bottom: 15px;">
                <h2>MODO CONSTRUCCIÓN (DM)</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button id="btn-build-corridor" class="btn-secondary btn-build" data-mode="corridor">PASILLO</button>
                    <button id="btn-build-door" class="btn-secondary btn-build" data-mode="door">PUERTA</button>
                    <button id="btn-build-erase" class="btn-secondary btn-build" data-mode="erase">BORRAR</button>
                </div>
            </div>

            <div class="controls-section">
                <h2>CONTROLES OPERATIVOS</h2>
                <button id="btn-hire" class="btn-primary">CONTRATAR ASALARIADO</button>
                <button id="btn-advance-week" class="btn-secondary">AVANZAR SEMANA</button>
            </div>

            <div class="hirelings-section">
                <h2>REGISTRO DE ASALARIADOS</h2>
                <div class="table-container">
                    <table id="hirelings-table">
                        <thead>
                            <tr>
                                <th>NOMBRE</th>
                                <th>GRADO</th>
                                <th>SEMANAS</th>
                                <th>SALARIO</th>
                            </tr>
                        </thead>
                        <tbody id="hirelings-tbody">
                            <!-- Rows dynamically populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
