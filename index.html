<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINOUS SYSTEM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Share Tech Mono', sans-serif; /* sans-serif fallback as requested, though Share Tech Mono is monospace */
            cursor: pointer;
        }

        /* Dark background generic image with a dark overlay */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://i.imgur.com/kS9Tz6F.png'); /* Generic dark placeholder */
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 2;
        }

        /* Content layout */
        .content {
            position: relative;
            z-index: 3;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* Logo / Large Title */
        .logo-title {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Requested sans-serif */
            font-size: 5rem;
            font-weight: bold;
            text-align: center;
            margin: 0;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff; /* Cyan glow */
            /* Alternativamente, dorado: text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 40px #ffd700; */
        }

        @media (max-width: 768px) {
            .logo-title {
                font-size: 3rem;
            }
        }

        /* Blinking text */
        .blinking-text {
            margin-top: 40px;
            font-size: 1.5rem;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
            color: #00ffff; /* subtle cyan to match glow */
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Bottom copyright */
        .copyright {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #aaaaaa;
            letter-spacing: 1px;
        }

        /* CRT Scanlines and overlay effects for cyberpunk feel */
        .content::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                to bottom,
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="content">
        <h1 class="logo-title">LUMINOUS SYSTEM</h1>
        <div class="blinking-text">[ PULSE PARA INICIAR CONEXIÓN ]</div>
        <div class="copyright">Ver. 1.0.4 - Lobotomy Corp</div>
    </div>

    <script>
        document.body.addEventListener('click', function() {
            // Optional: visual connection delay simulation
            const blinkText = document.querySelector('.blinking-text');
            blinkText.textContent = "[ CONECTANDO... ]";
            blinkText.style.animation = "none";
            blinkText.style.opacity = 1;
            blinkText.style.color = "#44ff44"; // green success

            // Optional: Simple beep sound using AudioContext
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (e) {
                // Ignore audio errors if not supported or blocked by policy
                console.log("Audio no soportado o bloqueado");
            }

            // Redirect logic with slight delay
            setTimeout(() => {
                const charName = localStorage.getItem('luminous_char_name');
                if (!charName) {
                    // Empty or null
                    window.location.href = 'creacion_personaje.html';
                } else {
                    // Has data
                    window.location.href = 'hoja_personaje.html';
                }
            }, 500); // 500ms delay to simulate connection
        });
    </script>
</body>
</html>
