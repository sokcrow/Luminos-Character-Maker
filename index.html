<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        :root {
            --cream: #E8E4D9;
            --brown: #3E2723;
            --red: #D32F2F;
            --gold: #FFD700;
            --black: #0B0A0A;
        }

        * {
            box-shadow: none !important;
            text-shadow: none !important;
            border-radius: 0 !important;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--black);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--cream);
        }

        #main-bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -10;
            object-fit: cover;
            filter: brightness(0.25) sepia(0.5) hue-rotate(-20deg) contrast(1.2);
        }

        /* View Containers */
        .view-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .fade-to-black {
            opacity: 1;
            background-color: var(--black);
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1.5s ease, background-color 1.5s ease;
        }

        /* VISTA 1: TITLE SCREEN */
        #title-screen {
            cursor: pointer;
            z-index: 10;
            transition: opacity 1.5s ease;
        }

        .luminous-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 6rem;
            color: var(--gold);
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 15px;
            text-align: center;
        }

        .title-prompt {
            font-size: 1.2rem;
            color: var(--cream);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .gradient-line {
            width: 60%;
            height: 2px;
            background: var(--gold);
        }

        /* VISTA 2: LOGIN SCREEN */
        #login-screen {
            z-index: 20;
        }

        .save-slot-card {
            background-color: var(--cream);
            border: 6px solid var(--brown);
            padding: 30px 40px;
            min-width: 350px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: var(--brown);
            /* repeating scanline gradient with 0.08 opacity */
            background-image: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 2px,
                rgba(62, 39, 35, 0.08) 2px,
                rgba(62, 39, 35, 0.08) 4px
            );
        }

        .save-slot-card::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid var(--red);
            pointer-events: none;
        }

        .slot-header {
            font-size: 1.2rem;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--brown);
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            font-weight: bold;
        }

        .slot-status {
            color: var(--brown);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            background: var(--cream);
            border: 2px solid var(--brown);
            color: var(--brown);
            text-align: center;
            outline: none;
            font-weight: bold;
            transition: all 0.2s;
        }

        input:focus {
            background: var(--black);
            color: var(--cream);
            border: 2px solid var(--gold);
        }

        input::placeholder {
            color: rgba(62, 39, 35, 0.5);
        }

        input:focus::placeholder {
            color: rgba(232, 228, 217, 0.5);
        }

        button.limbus-btn {
            background: var(--cream);
            border: 2px solid var(--brown);
            color: var(--brown);
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        button.limbus-btn:hover {
            background: var(--black);
            color: var(--cream);
            border: 2px solid var(--gold);
        }

        .text-muted {
            font-size: 0.9rem;
            color: var(--brown);
            font-weight: bold;
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--red);
            font-family: inherit;
            font-size: 0.9rem;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
            padding: 5px;
        }

        .link-btn:hover {
            color: var(--brown);
        }

        @media (max-width: 768px) {
            .luminous-title {
                font-size: 3.5rem;
                letter-spacing: 8px;
            }
            .save-slot-card {
                min-width: 90%;
            }
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="main-bg-video">
        <source src="https://i.imgur.com/OzCik5N.mp4" type="video/mp4">
    </video>

    <div id="title-screen" class="view-screen">
        <h1 class="luminous-title">LUMINOUS</h1>
        <div id="title-prompt" class="title-prompt"></div>
        <div class="gradient-line"></div>
    </div>

    <div id="login-screen" class="view-screen hidden">
        <div class="save-slot-card" id="login-card" style="text-align: center; width: 400px; max-width: 90%;">

            <div id="login-form-wrapper">
                <div class="slot-header">
                    <span class="slot-status">SISTEMA DE IDENTIFICACIÓN (LOGIN)</span>
                </div>
                <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 15px;">
                    <input type="email" id="login-email-input" placeholder="Correo Electrónico..." autocomplete="off">
                    <input type="password" id="login-password-input" placeholder="Contraseña..." autocomplete="off">
                </div>
                <button id="btn-login" class="limbus-btn">Identificarse</button>
                <div id="login-status" style="margin-top: 15px; color: var(--red); height: 20px; font-size: 0.9rem; font-weight: bold;"></div>

                <div style="margin-top: 15px;">
                    <span class="text-muted">¿No tienes credenciales?</span>
                    <button id="btn-to-register" class="link-btn">Solicitar Registro</button>
                </div>
            </div>

            <div id="register-form-wrapper" style="display: none;">
                <div class="slot-header">
                    <span class="slot-status">SISTEMA DE REGISTRO (SIGN UP)</span>
                </div>
                <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 15px;">
                    <input type="email" id="register-email-input" placeholder="Nuevo Correo..." autocomplete="off">
                    <input type="password" id="register-password-input" placeholder="Nueva Contraseña..." autocomplete="off">
                    <input type="text" id="register-player-id-input" placeholder="ID Personaje (Nombre)..." autocomplete="off">
                </div>
                <button id="btn-register" class="limbus-btn">Registrarse</button>
                <div id="register-status" style="margin-top: 15px; color: var(--red); height: 20px; font-size: 0.9rem; font-weight: bold;"></div>

                <div style="margin-top: 15px;">
                    <span class="text-muted">¿Ya estás registrado?</span>
                    <button id="btn-to-login" class="link-btn">Volver al Login</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase App (núcleo) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Script de autenticación -->
    <script src="js/auth.js"></script>
</body>
</html>
