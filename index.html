<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luminous</title>
    <link rel="stylesheet" href="styles/layout/main.css" />
  </head>
  <body>
    <video autoplay loop muted playsinline id="main-bg-video">
      <source src="https://i.imgur.com/OzCik5N.mp4" type="video/mp4" />
    </video>

    <div id="title-screen" class="view-screen">
      <h1 class="luminous-title">LUMINOUS</h1>
      <div id="title-prompt" class="title-prompt"></div>
      <div class="gradient-line"></div>
    </div>

    <div id="login-screen" class="view-screen hidden">
      <div class="save-slot-card" id="login-card" style="text-align: center">
        <div class="slot-header" style="justify-content: center">
          <span class="slot-status">SISTEMA DE IDENTIFICACIÓN</span>
        </div>
        <div style="margin: 20px 0">
          <label
            for="player-id-input"
            style="
              display: block;
              margin-bottom: 10px;
              color: var(--text-main);
              font-size: 1.1rem;
            "
            >INGRESE ID DE USUARIO (Nombre de Jugador)</label
          >
          <input
            type="text"
            id="player-id-input"
            placeholder="ID de Usuario..."
            autocomplete="off"
            style="
              width: 80%;
              padding: 10px;
              font-family: &quot;Share Tech Mono&quot;, monospace;
              font-size: 1.2rem;
              background: rgba(0, 0, 0, 0.6);
              border: 1px solid var(--cyan-tech);
              color: var(--gold-bright);
              text-align: center;
              outline: none;
            "
          />
        </div>
        <button
          id="btn-login"
          style="
            background: transparent;
            border: 1px solid var(--gold-bright);
            color: var(--gold-bright);
            padding: 10px 20px;
            font-family: &quot;Share Tech Mono&quot;, monospace;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            width: 80%;
          "
        >
          Identificarse
        </button>
        <div
          id="login-status"
          style="
            margin-top: 15px;
            color: var(--cyan-tech);
            height: 20px;
            font-size: 0.9rem;
          "
        ></div>
      </div>
    </div>

    <!-- Firebase App (núcleo) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script type="module" src="src/core/firebase-config.js"></script>
    <script type="module" src="src/features/login.js"></script>
  </body>
</html>
