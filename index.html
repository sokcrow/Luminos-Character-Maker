<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-red: #ff003c;
            --neon-gold: #ffcc00;
            --panel-bg: #111111;
            --metal-border: #4a4a4a;
            --brass: #b5a642;
            --text-main: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Oswald', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            /* Deep dark tones with red scanlines */
            background-image: repeating-linear-gradient(
                0deg,
                rgba(255, 0, 60, 0.05),
                rgba(255, 0, 60, 0.05) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        /* Industrial Machinery Control Panel */
        .auth-terminal {
            background-color: var(--panel-bg);
            border: 4px solid var(--metal-border);
            border-radius: 8px; /* Industrial aesthetic */
            padding: 40px;
            width: 450px;
            max-width: 90%;
            position: relative;
            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.8),
                0 0 15px rgba(255, 0, 60, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        /* Screws/Rivets */
        .auth-terminal::before, .auth-terminal::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8);
        }
        .auth-terminal::before { top: 10px; left: 10px; }
        .auth-terminal::after { top: 10px; right: 10px; }

        .terminal-rivets-bottom::before, .terminal-rivets-bottom::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8);
            bottom: 10px;
        }
        .terminal-rivets-bottom::before { left: 10px; }
        .terminal-rivets-bottom::after { right: 10px; }


        /* Mechanical Gauges on Sides */
        .side-gauge {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 150px;
            background: #222;
            border: 2px solid var(--brass);
            border-radius: 10px;
            box-shadow: inset 0 0 10px black;
            overflow: hidden;
        }
        .side-gauge-left { left: -30px; }
        .side-gauge-right { right: -30px; }

        .gauge-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: var(--neon-red);
            box-shadow: 0 0 10px var(--neon-red);
            animation: pulse-gauge 3s infinite alternate;
        }

        @keyframes pulse-gauge {
            0% { height: 60%; }
            100% { height: 85%; }
        }

        h1 {
            font-size: 2.5rem;
            color: var(--neon-gold);
            text-align: center;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-gold);
            letter-spacing: 2px;
            border-bottom: 2px solid var(--neon-red);
            padding-bottom: 15px;
            box-shadow: 0 10px 10px -10px rgba(255, 0, 60, 0.5);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-family: 'Share Tech Mono', monospace;
            color: var(--brass);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        input {
            background-color: #0a0a0a;
            border: 2px solid var(--metal-border);
            color: var(--neon-gold);
            padding: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 5px black;
        }

        input:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red), inset 0 0 5px rgba(255,0,60,0.2);
        }

        .flavor-text {
            text-align: center;
            font-style: italic;
            color: #888;
            margin: 10px 0;
            font-size: 1.1rem;
        }

        .btn-glow {
            background: linear-gradient(45deg, #400, var(--neon-red));
            border: 2px solid var(--neon-gold);
            color: #fff;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 5px black;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.6);
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
        }

        .btn-glow:hover {
            box-shadow: 0 0 25px var(--neon-red), inset 0 0 10px var(--neon-gold);
            transform: scale(1.02);
            color: var(--neon-gold);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--brass);
            color: var(--brass);
            padding: 10px;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Oswald', sans-serif;
        }

        .btn-secondary:hover {
            background: rgba(181, 166, 66, 0.1);
            color: var(--neon-gold);
            border-color: var(--neon-gold);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .error-box {
            background: rgba(255, 0, 60, 0.1);
            border: 1px dashed var(--neon-red);
            color: var(--neon-red);
            padding: 10px;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            min-height: 20px;
            text-shadow: 0 0 5px rgba(255,0,60,0.5);
            display: none; /* hidden by default */
        }
    </style>
</head>
<body>

    <div class="auth-terminal">
        <div class="terminal-rivets-bottom"></div>
        <div class="side-gauge side-gauge-left"><div class="gauge-fill"></div></div>
        <div class="side-gauge side-gauge-right"><div class="gauge-fill"></div></div>

        <h1>SISTEMA DE IDENTIFICACIÓN</h1>

        <div class="input-group">
            <label for="auth-email">Email</label>
            <input type="email" id="auth-email" placeholder="Entrada de datos...">
        </div>

        <div class="input-group">
            <label for="auth-password">Contraseña</label>
            <input type="password" id="auth-password" placeholder="Clave de acceso...">
        </div>

        <!-- Legacy Player ID input for registration (unhidden via JS during register mode) -->
        <div class="input-group" id="player-id-group" style="display: none;">
            <label for="auth-player-id">Nombre de tu Personaje Anterior (Opcional, para recuperar datos)</label>
            <input type="text" id="auth-player-id" placeholder="Nombre exacto o déjalo en blanco...">
        </div>

        <div class="flavor-text">
            "No pierdas tiempo, entra ya!"
        </div>

        <div id="auth-error" class="error-box"></div>

        <button id="btn-login" class="btn-glow">INICIAR SESIÓN</button>
        <button id="btn-register-mode" class="btn-secondary">CREAR CUENTA</button>
        <!-- The actual register submission button, hidden initially -->
        <button id="btn-register-submit" class="btn-glow" style="display: none;">CONFIRMAR REGISTRO</button>
        <button id="btn-login-mode" class="btn-secondary" style="display: none;">VOLVER A INICIO</button>
    </div>

    <!-- Firebase App (núcleo) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Script de autenticación -->
    <script src="js/auth.js"></script>

    <script>
        // UI Logic to switch between Login and Register modes
        const btnLogin = document.getElementById('btn-login');
        const btnRegisterMode = document.getElementById('btn-register-mode');
        const btnRegisterSubmit = document.getElementById('btn-register-submit');
        const btnLoginMode = document.getElementById('btn-login-mode');
        const playerIdGroup = document.getElementById('player-id-group');
        const flavorText = document.querySelector('.flavor-text');
        const headerText = document.querySelector('h1');

        btnRegisterMode.addEventListener('click', () => {
            btnLogin.style.display = 'none';
            btnRegisterMode.style.display = 'none';
            btnRegisterSubmit.style.display = 'block';
            btnLoginMode.style.display = 'block';
            playerIdGroup.style.display = 'flex';
            headerText.innerText = "NUEVO RECLUTA";
            flavorText.innerText = "La maquinaria necesita carne fresca.";
        });

        btnLoginMode.addEventListener('click', () => {
            btnLogin.style.display = 'block';
            btnRegisterMode.style.display = 'block';
            btnRegisterSubmit.style.display = 'none';
            btnLoginMode.style.display = 'none';
            playerIdGroup.style.display = 'none';
            headerText.innerText = "SISTEMA DE IDENTIFICACIÓN";
            flavorText.innerText = '"No pierdas tiempo, entra ya!"';
        });
    </script>
</body>
</html>
