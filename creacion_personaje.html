<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creación de Personaje</title>
    <!-- Firebase App (núcleo) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link rel="stylesheet" href="styles/menus/character-creation.css" />
  </head>
  <body>
    <div id="app">
      <div id="phase-purple-intro" class="phase hidden">
        <div class="background-glow-purple"></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
          "
        >
          <p
            id="purple-dialogue-text"
            class="purple-text"
            style="animation: none; opacity: 1"
          ></p>
        </div>
      </div>

      <div id="phase-intro" class="phase">
        <div class="background-glow"></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
          "
        >
          <p
            id="intro-dialogue-text"
            class="golden-text"
            style="animation: none; opacity: 1"
          ></p>
          <div
            id="name-input-container"
            class="hidden"
            style="margin-top: 20px; text-align: center"
          >
            <input
              type="text"
              id="character-name-input"
              style="
                background: transparent;
                border: 1px solid #ffd700;
                color: #ffd700;
                font-family: &quot;Share Tech Mono&quot;, monospace;
                font-size: 1.5rem;
                padding: 10px;
                text-align: center;
                outline: none;
              "
            />
            <button
              id="confirm-name-btn"
              style="
                background: transparent;
                border: 1px solid #ffd700;
                color: #ffd700;
                font-family: &quot;Share Tech Mono&quot;, monospace;
                font-size: 1.5rem;
                padding: 10px;
                cursor: pointer;
                margin-left: 10px;
                outline: none;
                transition:
                  background 0.3s,
                  color 0.3s;
              "
              onmouseover="
                this.style.background = '#FFD700';
                this.style.color = 'black';
              "
              onmouseout="
                this.style.background = 'transparent';
                this.style.color = '#FFD700';
              "
            >
              Confirmar
            </button>
          </div>
        </div>
      </div>

      <div
        id="phase1"
        class="phase hidden"
        style="justify-content: flex-start; padding-top: 50px; overflow-y: auto"
      >
        <h1 class="question">¿Que eres?</h1>
        <div id="origin-grid" class="origin-grid">
          <!-- Las tarjetas se generarán dinámicamente aquí con JavaScript -->
        </div>
        <div class="nav-buttons" style="margin-bottom: 50px">
          <button id="btn-confirmar-origen" class="btn" disabled>
            Confirmar Origen
          </button>
        </div>
      </div>

      <div id="phase-dialogue" class="phase hidden">
        <div class="background-glow"></div>
        <p id="dialogue-text" class="golden-text"></p>
      </div>

      <div
        id="phase2"
        class="phase hidden"
        style="justify-content: flex-start; padding-top: 50px; overflow-y: auto"
      >
        <h1 class="question">¿De dónde vienes?</h1>
        <div id="background-grid" class="origin-grid">
          <!-- Las tarjetas se generarán dinámicamente aquí con JavaScript -->
        </div>
        <div class="nav-buttons" style="margin-bottom: 50px">
          <button id="btn-confirmar-trasfondo" class="btn" disabled>
            Confirmar Origen
          </button>
        </div>
      </div>

      <div id="phase-dialogue-2" class="phase hidden">
        <div class="background-glow"></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
          "
        >
          <p id="dialogue-text-2" class="golden-text"></p>
          <div
            id="name-input-container-2"
            class="hidden"
            style="margin-top: 20px; text-align: center"
          >
            <input
              type="text"
              id="character-name-input-2"
              style="
                background: transparent;
                border: 1px solid #ffd700;
                color: #ffd700;
                font-family: &quot;Share Tech Mono&quot;, monospace;
                font-size: 1.5rem;
                padding: 10px;
                text-align: center;
                outline: none;
              "
            />
            <button
              id="confirm-name-btn-2"
              style="
                background: transparent;
                border: 1px solid #ffd700;
                color: #ffd700;
                font-family: &quot;Share Tech Mono&quot;, monospace;
                font-size: 1.5rem;
                padding: 10px;
                cursor: pointer;
                margin-left: 10px;
                outline: none;
                transition:
                  background 0.3s,
                  color 0.3s;
              "
              onmouseover="
                this.style.background = '#FFD700';
                this.style.color = 'black';
              "
              onmouseout="
                this.style.background = 'transparent';
                this.style.color = '#FFD700';
              "
            >
              Confirmar
            </button>
          </div>
        </div>
      </div>

      <div id="phase-purple-intervention" class="phase hidden">
        <div class="background-glow-purple"></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 80%;
          "
        >
          <p
            id="purple-intervention-text"
            class="purple-text"
            style="font-style: italic"
          ></p>
          <div
            id="purple-buttons-container"
            class="hidden"
            style="
              margin-top: 30px;
              display: flex;
              justify-content: center;
              flex-wrap: wrap;
              max-height: 50vh;
              overflow-y: auto;
            "
          >
            <button class="purple-btn" data-action="Aprender">
              [ Aprender ]
            </button>
            <button class="purple-btn" data-action="Fortalecerme">
              [ Fortalecerme ]
            </button>
            <button class="purple-btn" data-action="Meditar">
              [ Meditar ]
            </button>
          </div>
        </div>
      </div>

      <div id="phase-dialogue-3" class="phase hidden">
        <div class="background-glow"></div>
        <p id="dialogue-text-3" class="golden-text"></p>
      </div>

      <div
        id="phase3"
        class="phase hidden"
        style="justify-content: flex-start; padding-top: 50px; overflow-y: auto"
      >
        <h1 class="question">¿Cuál fue tu truco para sobrevivir?</h1>
        <div id="profession-grid" class="origin-grid">
          <!-- Las tarjetas se generarán dinámicamente aquí con JavaScript -->
        </div>
        <div class="nav-buttons" style="margin-bottom: 50px">
          <button id="btn-confirmar-profesion" class="btn" disabled>
            Confirmar Profesión
          </button>
        </div>
      </div>

      <div id="phase-dialogue-4" class="phase hidden">
        <div class="background-glow"></div>
        <p id="dialogue-text-4" class="golden-text"></p>
      </div>

      <div
        id="phase4"
        class="phase hidden"
        style="justify-content: flex-start; padding-top: 50px; overflow-y: auto"
      >
        <h1 class="question">¿Cuál fue tu vida antes de esto?</h1>
        <div id="psychological-grid" class="origin-grid">
          <!-- Las tarjetas se generarán dinámicamente aquí con JavaScript -->
        </div>
        <div class="nav-buttons" style="margin-bottom: 50px">
          <button id="btn-confirmar-psicologia" class="btn" disabled>
            Confirmar Trasfondo Psicológico
          </button>
        </div>
      </div>

      <div id="phase-dialogue-5" class="phase hidden">
        <div class="background-glow"></div>
        <p id="dialogue-text-5" class="golden-text"></p>
      </div>

      <div
        id="phase5"
        class="phase hidden"
        style="justify-content: flex-start; padding-top: 50px; overflow-y: auto"
      >
        <h1 class="question">¿Cómo enfrentas a La Ciudad?</h1>
        <div id="class-grid" class="origin-grid"></div>

        <h1 class="question" style="margin-top: 40px; font-size: 2rem">
          Especialización (<span
            id="points-counter"
            style="color: var(--cyan-tech)"
            >20</span
          >
          Puntos)
        </h1>
        <p
          style="
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 20px;
          "
        >
          Distribuye hasta un máximo de +3 por habilidad.
        </p>
        <div
          id="skills-point-buy"
          style="
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
            box-sizing: border-box;
          "
        ></div>

        <div class="nav-buttons" style="margin-bottom: 50px">
          <button id="btn-confirmar-clase" class="btn" disabled>
            Despertar (Finalizar)
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="src/features/character-maker.js"></script>
  </body>
</html>
