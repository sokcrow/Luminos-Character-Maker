<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de Personaje</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --border-accent: #ffae00;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --red-dark: #500000;
            --red-bright: #ff0000;
            --red-neon: #ff4444;
            --green-success: #44ff44;
            --cyan-tech: #00ffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none; /* Prevent text selection */
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .phase {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        /* Fade out logic */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .fade-in {
            opacity: 1;
        }

        /* Question Phase */
        .question {
            color: yellow;
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }

        .roulette-container {
            height: 50vh;
            width: 100%;
            max-width: 400px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            /* Hide scrollbar for a cleaner look */
            -ms-overflow-style: none;
            scrollbar-width: none;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        }

        .roulette-container::-webkit-scrollbar {
            display: none;
        }

        .roulette {
            list-style: none;
            padding: 50vh 0; /* Add padding to allow scrolling past the first/last item */
            margin: 0;
            text-align: center;
        }

        .roulette li {
            font-size: 2rem;
            padding: 15px 0;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.3s, transform 0.3s, text-shadow 0.3s;
        }

        .roulette li:hover {
            color: white;
            transform: scale(1.1);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Origin Selection Grid Styles (Copied from index.html) */
        .origin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .origin-card {
            background-color: var(--bg-card);
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .origin-grid.has-selection .origin-card:not(.selected) {
            opacity: 0.5;
            transform: scale(0.98);
        }

        .origin-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-accent);
            box-shadow: 0 5px 15px rgba(255, 174, 0, 0.1);
            opacity: 1 !important;
        }

        .origin-card.selected {
            border-color: var(--border-accent);
            transform: translateY(-5px) scale(1.02);
            opacity: 1;
            animation: flicker 2s infinite alternate;
        }

        @keyframes flicker {
            0% { box-shadow: 0 0 10px var(--border-accent); border-color: var(--border-accent); }
            50% { box-shadow: 0 0 25px var(--border-accent), 0 0 5px inset var(--border-accent); border-color: #ffcc55; }
            100% { box-shadow: 0 0 10px var(--border-accent); border-color: var(--border-accent); }
        }

        .card-header {
            background: linear-gradient(to right, var(--red-dark), #2a0000);
            padding: 15px;
            border-bottom: 1px solid var(--red-bright);
        }

        .card-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .concept-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .stats-box {
            background-color: #111;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 15px;
            display: grid;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .stat-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-name-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-label {
            font-weight: bold;
            color: var(--text-main);
        }

        .stat-val-pos {
            color: var(--green-success);
            font-weight: bold;
        }

        .stat-val-neg {
            color: var(--red-neon);
            font-weight: bold;
        }

        .stat-val-skill {
            color: var(--cyan-tech);
            font-weight: bold;
        }

        .trait-box {
            margin-top: auto;
            border-top: 1px dashed #444;
            padding-top: 10px;
        }

        .trait-title {
            font-size: 12px;
            color: var(--border-accent);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .trait-desc {
            font-size: 12px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .human-selects, .subrace-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .origin-card.selected .human-selects,
        .origin-card.selected .subrace-container {
            display: flex;
        }

        .human-select-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .human-select-row label {
            font-size: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        .choice-select {
            width: 100%;
            background-color: #111;
            color: var(--text-main);
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            font-size: 13px;
        }

        .choice-select.error {
            border-color: var(--red-neon);
            box-shadow: 0 0 5px var(--red-neon);
        }

        .choice-select:focus {
            border-color: var(--border-accent);
        }

        .nav-buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background-color: var(--red-dark);
            color: var(--text-main);
            border: 1px solid var(--red-bright);
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--red-bright);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            transform: scale(1.02);
        }

        .btn:disabled {
            background-color: #333;
            border-color: #555;
            color: #777;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .human-error-msg {
            color: var(--red-neon);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Dialogue Phase */
        #phase-dialogue {
            cursor: pointer;
            display: flex;
        }

        .golden-text {
            color: #FFD700;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.5);
            z-index: 10;
            padding: 20px;
            max-width: 80%;
            opacity: 0;
            animation: textFadeIn 2s forwards ease-in-out;
        }

        @keyframes textFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Background Glow Animation */
        .background-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, rgba(0, 0, 0, 1) 70%);
            z-index: 1;
            animation: pulseGlow 5s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

                <button id="btn-confirmar-origen" class="btn" disabled>Confirmar Origen</button>

        <div id="phase-dialogue" class="phase hidden">

            <p id="dialogue-text" class="golden-text"></p>
        </div>

        <div id="phase2" class="phase hidden" style="justify-content: flex-start; padding-top: 50px; overflow-y: auto;">

            <div class="background-glow"></div>
            <p id="dialogue-text-2" class="golden-text"></p>

        // 6. Lógica de Selección y Validación
        function seleccionarOrigen(id) {
            luminousState.originId = id;

            const cards = document.querySelectorAll('.origin-card');
            cards.forEach(card => {
                if (card.dataset.id === id) {
                    card.classList.add('selected');

                if (raza.subrazas) {
                    validarOrigenConSubraza();
                } else {
                    luminousState.modifiers = {};
                    for (const [key, attrName] of Object.entries(raza.mods)) {
                        luminousState.modifiers[attrName] = modValues[key].val;
                    }
                    btnConfirmarOrigen.disabled = false;
                }
            }

        function validarOrigenConSubraza() {
            const raza = racesData.find(r => r.id === luminousState.originId);
            if (!raza || !raza.subrazas) return;

            const selectedCard = document.querySelector(`.origin-card[data-id="${luminousState.originId}"]`);
            const select = selectedCard.querySelector('.subrace-select');

            if (!select.value) {
                btnConfirmarOrigen.disabled = true;
            } else {
                luminousState.subraceId = select.value;
                const subraza = raza.subrazas.find(sr => sr.id === select.value);
                luminousState.modifiers = {};
                for (const [key, attrName] of Object.entries(subraza.mods)) {
                    luminousState.modifiers[attrName] = modValues[key].val;
                }
                btnConfirmarOrigen.disabled = false;
            }
        }

        function validarHumano() {
            if (luminousState.originId !== 'humano') return;

            const modSelects = document.querySelectorAll('.human-mod-select');
            const perkSelects = document.querySelectorAll('.human-perk-select');
            const errorMsg = document.getElementById('human-error');
            const modValuesSelected = [];
            const perkValuesSelected = [];
            let isValid = true;

            modSelects.forEach(s => s.classList.remove('error'));
            perkSelects.forEach(s => s.classList.remove('error'));

            // Validar modificadores
            modSelects.forEach(select => {
                const val = select.value;
                if (!val) {
                    isValid = false;
                } else if (modValuesSelected.includes(val)) {
                    isValid = false;
                    select.classList.add('error');
                    const firstDuplicate = Array.from(modSelects).find(s => s.value === val);
                    if (firstDuplicate) firstDuplicate.classList.add('error');
                } else {
                    modValuesSelected.push(val);
                }
            });

            // Validar perks
            perkSelects.forEach(select => {
                const val = select.value;
                if (!val) {
                    isValid = false;
                } else if (perkValuesSelected.includes(val)) {
                    isValid = false;
                    select.classList.add('error');
                    const firstDuplicate = Array.from(perkSelects).find(s => s.value === val);
                    if (firstDuplicate) firstDuplicate.classList.add('error');
                } else {
                    perkValuesSelected.push(val);
                }
            });

            if (!isValid) {
                errorMsg.style.display = 'block';
                btnConfirmarOrigen.disabled = true;
            } else {
                errorMsg.style.display = 'none';
                btnConfirmarOrigen.disabled = false;

                // Actualizar estado de modificadores
                luminousState.modifiers = {};
                modSelects.forEach(select => {
                    const modKey = select.dataset.mod;
                    const attrName = select.value;
                    luminousState.modifiers[attrName] = modValues[modKey].val;
                });

                // Actualizar estado de perks de humano
                luminousState.humanPerks = [];
                const humanRace = racesData.find(r => r.id === 'humano');
                perkSelects.forEach(select => {
                    const perkId = select.value;
                    const perkData = humanRace.perks.find(p => p.id === perkId);
                    if (perkData) {
                        luminousState.humanPerks.push(perkData);
                    }
                });
            }
        }

            const phaseIntro = document.getElementById('phase-intro');

            function typeIntroText(htmlText) {
                introDialogueText.innerHTML = "";
                isIntroTyping = true;

                // We need to handle <br> tags properly, so we create a temporary element
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlText;

                let nodes = Array.from(tempDiv.childNodes);
                let currentText = "";
                let nodeIndex = 0;
                let charIndex = 0;

                function typeNext() {
                    if (nodeIndex >= nodes.length) {
                        isIntroTyping = false;
                        if (introStep === 4) { // ¿Cómo te llamas?
                            nameInputContainer.classList.remove('hidden');
                            characterNameInput.focus();
                        }
                        if (introStep === 6) { // Last one before transition
                            finishIntroPhase();
                        }
                        return;
                    }

                    let node = nodes[nodeIndex];

                    if (node.nodeType === Node.TEXT_NODE) {
                        if (charIndex < node.textContent.length) {
                            currentText += node.textContent.charAt(charIndex);
                            introDialogueText.innerHTML = currentText;
                            charIndex++;
                            typingTimeout = setTimeout(typeNext, 50);
                        } else {
                            nodeIndex++;
                            charIndex = 0;
                            typeNext();
                        }
                    } else if (node.nodeType === Node.ELEMENT_NODE && node.nodeName === 'BR') {
                        currentText += "<br>";
                        introDialogueText.innerHTML = currentText;
                        nodeIndex++;
                        charIndex = 0;
                        typingTimeout = setTimeout(typeNext, 50);
                    } else {
                        // For other elements, just append them (not strictly needed here since we only use <br>)
                        currentText += node.outerHTML;
                        introDialogueText.innerHTML = currentText;
                        nodeIndex++;
                        charIndex = 0;
                        typeNext();
                    }
                }

                typeNext();
            }

            function finishIntroPhase() {
                setTimeout(() => {
                    phaseIntro.classList.add('fade-out');
                    setTimeout(() => {
                        phaseIntro.classList.add('hidden');
                        phase1.classList.remove('hidden');
                    }, 1500);
                }, 1000); // Wait a bit after typing finishes before transitioning
            }

            function handleIntroAdvance(e) {
                if (e.type === 'touchstart') e.preventDefault();

                // If we are waiting for name input, don't advance on click
                if (introStep === 4 && !isIntroTyping) return;
                // If we are at the last step, the transition handles itself
                if (introStep === 6) return;

                if (isIntroTyping) {
                    clearTimeout(typingTimeout);
                    introDialogueText.innerHTML = introDialogues[introStep];
                    isIntroTyping = false;

                    if (introStep === 4) {
                        nameInputContainer.classList.remove('hidden');
                        characterNameInput.focus();
                    }
                    if (introStep === 6) {
                        finishIntroPhase();
                    }
                } else {
                    introStep++;
                    if (introStep < introDialogues.length) {
                        typeIntroText(introDialogues[introStep]);
                    }
                }
            }

            phaseIntro.addEventListener('click', handleIntroAdvance);
            phaseIntro.addEventListener('touchstart', handleIntroAdvance, {passive: false});

                phase1.classList.add('fade-out');

                    showDialogue(currentDialogueStep);
                }, 1500); // Wait for fade out
            });

            // Handle dialogue progression
            phaseDialogue.addEventListener('click', () => {
                currentDialogueStep++;

                if (currentDialogueStep < dialogues.length) {

                } else {
                    // Transition to Phase 2 (Background Selection)
                    phaseDialogue.classList.add('fade-out');

            // Logic for Phase 2 (Backgrounds)
            let btnConfirmarTrasfondo = document.getElementById('btn-confirmar-trasfondo');
            const phase2 = document.getElementById('phase2');
            const phaseDialogue2 = document.getElementById('phase-dialogue-2');
            const dialogueText2 = document.getElementById('dialogue-text-2');

            btnConfirmarTrasfondo.addEventListener('click', () => {
                if (btnConfirmarTrasfondo.disabled) return;

                // Get selected background's response
                const selectedBg = backgroundsData.find(bg => bg.id === luminousState.backgroundId);
                const responseText = selectedBg ? selectedBg.entityResponse : "...";

                // Transition to Phase Dialogue 2
                phase2.classList.add('fade-out');

                setTimeout(() => {
                    phase2.classList.add('hidden');
                    phase2.classList.remove('fade-out');

                    // Show dialogue 2
                    phaseDialogue2.classList.remove('hidden');
                    showDialogue2(responseText);
                }, 1500); // Wait for fade out
            });

            // Handle dialogue 2 progression (Redirect to main creator)
            phaseDialogue2.addEventListener('click', () => {
                phaseDialogue2.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = 'index.html?tab=creator';
                }, 1000);
            });

            function showDialogue2(text) {
                dialogueText2.style.animation = 'none';
                dialogueText2.offsetHeight; /* trigger reflow */
                dialogueText2.style.animation = null;
                dialogueText2.textContent = text;
            }

            function showDialogue(step) {
                // Remove animation to re-trigger it
                dialogueText.style.animation = 'none';
                dialogueText.offsetHeight; /* trigger reflow */
                dialogueText.style.animation = null;

                dialogueText.textContent = dialogues[step];
            }
        });
    </script>
</body>
</html>
