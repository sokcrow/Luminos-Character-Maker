<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de DM - Luminous</title>
  <style>
    body {
      background-color: #0f0f14;
      color: #fff;
      font-family: 'Share Tech Mono', monospace, sans-serif;
      display: flex;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 40px 0;
      margin: 0;
    }
    #dm-time-panel {
      background-color: rgba(15, 15, 20, 0.9);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #8b0000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }
    #dm-time-panel label {
      font-size: 18px;
      color: #c49a00;
    }
    #dm-time-input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: #0df;
      font-family: inherit;
      font-size: 16px;
    }
    #btn-fijar-hora {
      padding: 10px 20px;
      border-radius: 4px;
      border: 1px solid #c49a00;
      background: #8b0000;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.2s;
    }
    #btn-fijar-hora:hover {
      background: #a00000;
      box-shadow: 0 0 10px rgba(196, 154, 0, 0.5);
    }
  </style>
</head>
<body>

  <div id="dm-time-panel">
    <label for="dm-time-input">Reloj Global:</label>
    <input type="time" id="dm-time-input">
    <button id="btn-fijar-hora">Fijar Hora</button>
  </div>

  <div id="dm-auto-panel" style="margin-top: 20px; background-color: rgba(15, 15, 20, 0.9); padding: 20px; border-radius: 8px; border: 1px solid #8b0000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; align-items: center;">
    <h3 style="margin: 0; color: #c49a00;">ZONA 1: PILOTO AUTOMÁTICO</h3>
    <div style="font-size: 16px;">Fecha Actual: <span id="lbl-auto-fecha">Año 984 / Mes 1 / Día 1</span></div>
    <div style="font-size: 16px;">Clima Actual: <span id="lbl-auto-clima">Despejado</span></div>
    <button id="btn-avanzar-dia" style="padding: 15px 30px; font-size: 18px; margin-top: 10px; background: #004400; border-color: #00ff00; color: white; cursor: pointer; border-radius: 4px;">Avanzar Día y Generar Clima</button>
  </div>

  <div id="dm-debug-panel" style="margin-top: 20px; background-color: rgba(15, 15, 20, 0.9); padding: 20px; border-radius: 8px; border: 1px solid #8b0000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; align-items: center;">
    <h3 style="margin: 0; color: #ff4444;">ZONA 2: MODO DEBUG</h3>

    <div style="display: flex; gap: 10px; align-items: center;">
      <label>Año:</label>
      <input type="number" id="debug-año" min="984" value="984" style="width: 70px; padding: 5px; border-radius: 4px; background: #222; color: #0df; border: 1px solid #444;">

      <label>Mes:</label>
      <input type="number" id="debug-mes" min="1" max="12" value="1" style="width: 50px; padding: 5px; border-radius: 4px; background: #222; color: #0df; border: 1px solid #444;">

      <label>Día:</label>
      <input type="number" id="debug-dia" min="1" max="31" value="1" style="width: 50px; padding: 5px; border-radius: 4px; background: #222; color: #0df; border: 1px solid #444;">
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
      <label>Nodo de Clima:</label>
      <select id="debug-clima" style="padding: 5px; border-radius: 4px; background: #222; color: #0df; border: 1px solid #444;">
        <option value="Despejado">Despejado</option>
        <option value="Nublado">Nublado</option>
        <option value="Húmedo">Húmedo</option>
        <option value="Lluvia">Lluvia</option>
        <option value="Lluvia Ácida">Lluvia Ácida</option>
        <option value="Tormenta">Tormenta</option>
        <option value="Tormenta Eléctrica">Tormenta Eléctrica</option>
        <option value="Niebla">Niebla</option>
        <option value="Niebla Densa">Niebla Densa</option>
        <option value="Ola de Calor">Ola de Calor</option>
        <option value="Nieve">Nieve</option>
        <option value="Nevada Extrema">Nevada Extrema</option>
        <option value="Vientos Fuertes">Vientos Fuertes</option>
        <option value="Vientos Huracanados">Vientos Huracanados</option>
      </select>
    </div>

    <button id="btn-forzar-estado" style="padding: 10px 20px; font-size: 16px; margin-top: 10px; background: #8b0000; border-color: #ff0000; color: white;">FORZAR ESTADO EN FIREBASE</button>
  </div>


  <div id="dm-banco-panel" style="margin-top: 20px; background-color: rgba(15, 15, 20, 0.9); padding: 20px; border-radius: 8px; border: 1px solid #8b0000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; align-items: center; width: 80%; max-width: 800px;">
    <h3 style="margin: 0; color: #0df;">ZONA A: RED BANCARIA (Monitoreo de Jugadores)</h3>

    <div style="background: #111; padding: 15px; border-radius: 6px; border: 1px solid #c49a00; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%;">
      <h4 style="margin: 0; color: #c49a00; width: 100%; text-align: center;">Terminal Bancaria</h4>
      <input type="text" id="banco-nombre" placeholder="Nombre del Personaje" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;" />
      <input type="number" id="banco-monto" placeholder="Monto (+ o -)" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;" />
      <input type="text" id="banco-concepto" placeholder="Concepto" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;" />
      <button id="btn-ejecutar-tx" style="padding: 8px 15px; background: #004400; border: 1px solid #00ff00; color: white; border-radius: 4px; cursor: pointer;">Ejecutar Transacción</button>
    </div>

    <div id="banco-jugadores-container" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%;">
      <!-- Tarjetas de jugadores generadas por JS -->
    </div>
  </div>

  <div id="dm-forja-panel" style="margin-top: 20px; background-color: rgba(15, 15, 20, 0.9); padding: 20px; border-radius: 8px; border: 1px solid #8b0000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; align-items: center; width: 80%; max-width: 800px;">
    <h3 style="margin: 0; color: #c49a00;">ZONA B: LA FORJA Y EL MERCADO</h3>
    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px;">
      <input type="text" id="forja-nombre" placeholder="Nombre del Ítem" style="padding: 10px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444;" />
      <select id="forja-tipo" style="padding: 10px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444;">
        <option value="Arma">Arma</option>
        <option value="Armadura">Armadura</option>
        <option value="Consumible">Consumible</option>
        <option value="Clave">Clave</option>
      </select>
      <input type="number" id="forja-costo" placeholder="Costo en Ahn" style="padding: 10px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444;" />
      <input type="number" id="forja-usos" placeholder="Usos Máximos (opcional)" style="padding: 10px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444;" />
      <textarea id="forja-desc" placeholder="Descripción" rows="3" style="padding: 10px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444; resize: vertical;"></textarea>
      <button id="btn-crear-item" style="padding: 10px 20px; font-size: 16px; background: #8b0000; border-color: #ff0000; color: white; cursor: pointer; border-radius: 4px;">Crear Ítem Global</button>
    </div>

    <h4 style="color: #fff; border-bottom: 1px solid #444; width: 100%; padding-bottom: 5px; margin-top: 20px;">Base de Datos de Ítems</h4>
    <div id="forja-lista-items" style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
      <!-- Lista de ítems generada por JS -->
    </div>
  </div>

  <!-- Firebase App (núcleo) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIVIuKgXUsdrb9Mmss9PH7R3FpWAMG2hU",
      authDomain: "luminous-system.firebaseapp.com",
      databaseURL: "https://luminous-system-default-rtdb.firebaseio.com",
      projectId: "luminous-system",
      storageBucket: "luminous-system.firebasestorage.app",
      messagingSenderId: "330473029689",
      appId: "1:330473029689:web:44a05e870d493a3b294de8",
      measurementId: "G-X775P4YS7W"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- LÓGICA DE CALENDARIO Y CLIMA AUTOMÁTICO ---

    // Días por mes (Año con meses variados)
    const diasPorMes = {
      1: 31, 2: 28, 3: 31, 4: 30, 5: 31, 6: 30,
      7: 31, 8: 31, 9: 30, 10: 31, 11: 30, 12: 31
    };

    // Red Climatica Hexagonal por Meses
    const redClimatica = {
      1: { // Frío y Seco
        "Despejado": { "Despejado": 0.6, "Nublado": 0.2, "Vientos Fuertes": 0.1, "Nieve": 0.1 },
        "Nublado": { "Despejado": 0.3, "Nublado": 0.5, "Nieve": 0.2 },
        "Vientos Fuertes": { "Despejado": 0.4, "Nublado": 0.3, "Vientos Huracanados": 0.1, "Vientos Fuertes": 0.2 },
        "Vientos Huracanados": { "Vientos Fuertes": 0.7, "Despejado": 0.3 },
        "Nieve": { "Nublado": 0.4, "Nieve": 0.4, "Nevada Extrema": 0.2 },
        "Nevada Extrema": { "Nieve": 0.8, "Nublado": 0.2 }
      },
      2: { // Deshielo
        "Despejado": { "Despejado": 0.4, "Nublado": 0.3, "Niebla": 0.2, "Húmedo": 0.1 },
        "Nublado": { "Despejado": 0.3, "Nublado": 0.4, "Lluvia": 0.2, "Niebla": 0.1 },
        "Niebla": { "Despejado": 0.2, "Nublado": 0.2, "Niebla": 0.5, "Niebla Densa": 0.1 },
        "Niebla Densa": { "Niebla": 0.8, "Lluvia": 0.2 },
        "Húmedo": { "Despejado": 0.2, "Nublado": 0.4, "Lluvia": 0.4 },
        "Lluvia": { "Nublado": 0.5, "Lluvia": 0.4, "Húmedo": 0.1 }
      },
      3: { // Lluvias Ácidas
        "Despejado": { "Nublado": 0.5, "Húmedo": 0.5 },
        "Nublado": { "Despejado": 0.1, "Nublado": 0.3, "Húmedo": 0.3, "Lluvia": 0.3 },
        "Húmedo": { "Nublado": 0.3, "Húmedo": 0.4, "Lluvia": 0.3 },
        "Lluvia": { "Húmedo": 0.2, "Nublado": 0.3, "Lluvia": 0.3, "Lluvia Ácida": 0.2 },
        "Lluvia Ácida": { "Lluvia": 0.7, "Tormenta": 0.3 },
        "Tormenta": { "Lluvia": 0.6, "Nublado": 0.4 }
      },
      4: { // Primavera Contaminada
        "Despejado": { "Despejado": 0.4, "Nublado": 0.3, "Niebla": 0.2, "Húmedo": 0.1 },
        "Nublado": { "Despejado": 0.3, "Nublado": 0.4, "Lluvia": 0.2, "Niebla": 0.1 },
        "Niebla": { "Nublado": 0.3, "Niebla": 0.5, "Niebla Densa": 0.2 },
        "Niebla Densa": { "Niebla": 0.9, "Lluvia Ácida": 0.1 },
        "Húmedo": { "Nublado": 0.5, "Lluvia": 0.5 },
        "Lluvia": { "Nublado": 0.6, "Lluvia": 0.4 },
        "Lluvia Ácida": { "Lluvia": 0.8, "Niebla Densa": 0.2 }
      },
      5: { // Vientos Fuertes
        "Despejado": { "Despejado": 0.4, "Nublado": 0.2, "Vientos Fuertes": 0.4 },
        "Nublado": { "Despejado": 0.3, "Nublado": 0.4, "Lluvia": 0.2, "Vientos Fuertes": 0.1 },
        "Vientos Fuertes": { "Despejado": 0.2, "Nublado": 0.2, "Vientos Fuertes": 0.4, "Vientos Huracanados": 0.2 },
        "Vientos Huracanados": { "Vientos Fuertes": 0.8, "Tormenta": 0.2 },
        "Lluvia": { "Nublado": 0.5, "Lluvia": 0.3, "Tormenta": 0.2 },
        "Tormenta": { "Lluvia": 0.6, "Vientos Huracanados": 0.4 }
      },
      6: { // Inicio del Calor
        "Despejado": { "Despejado": 0.6, "Nublado": 0.2, "Ola de Calor": 0.2 },
        "Nublado": { "Despejado": 0.4, "Nublado": 0.4, "Lluvia": 0.2 },
        "Ola de Calor": { "Despejado": 0.7, "Ola de Calor": 0.3 },
        "Lluvia": { "Nublado": 0.7, "Lluvia": 0.3 }
      },
      7: { // Verano Sofocante
        "Despejado": { "Despejado": 0.5, "Ola de Calor": 0.4, "Nublado": 0.1 },
        "Ola de Calor": { "Despejado": 0.4, "Ola de Calor": 0.6 },
        "Nublado": { "Despejado": 0.6, "Nublado": 0.2, "Tormenta": 0.2 },
        "Tormenta": { "Nublado": 0.7, "Despejado": 0.3 }
      },
      8: { // Tormentas de Verano
        "Despejado": { "Despejado": 0.3, "Nublado": 0.3, "Ola de Calor": 0.2, "Húmedo": 0.2 },
        "Ola de Calor": { "Despejado": 0.5, "Tormenta": 0.5 },
        "Nublado": { "Despejado": 0.2, "Nublado": 0.3, "Lluvia": 0.2, "Tormenta": 0.3 },
        "Húmedo": { "Despejado": 0.2, "Nublado": 0.2, "Lluvia": 0.3, "Tormenta": 0.3 },
        "Lluvia": { "Nublado": 0.3, "Lluvia": 0.3, "Tormenta": 0.4 },
        "Tormenta": { "Nublado": 0.2, "Lluvia": 0.2, "Tormenta": 0.4, "Tormenta Eléctrica": 0.2 },
        "Tormenta Eléctrica": { "Tormenta": 0.8, "Lluvia Ácida": 0.2 },
        "Lluvia Ácida": { "Lluvia": 0.8, "Tormenta": 0.2 }
      },
      9: { // Otoño Húmedo
        "Despejado": { "Despejado": 0.3, "Nublado": 0.4, "Húmedo": 0.3 },
        "Nublado": { "Despejado": 0.2, "Nublado": 0.4, "Húmedo": 0.2, "Lluvia": 0.2 },
        "Húmedo": { "Nublado": 0.3, "Húmedo": 0.4, "Niebla": 0.3 },
        "Lluvia": { "Nublado": 0.4, "Lluvia": 0.4, "Tormenta": 0.2 },
        "Tormenta": { "Lluvia": 0.7, "Nublado": 0.3 },
        "Niebla": { "Húmedo": 0.4, "Niebla": 0.4, "Niebla Densa": 0.2 },
        "Niebla Densa": { "Niebla": 0.8, "Lluvia": 0.2 }
      },
      10: { // Descenso de Temperaturas
        "Despejado": { "Despejado": 0.4, "Nublado": 0.3, "Vientos Fuertes": 0.3 },
        "Nublado": { "Despejado": 0.3, "Nublado": 0.4, "Lluvia": 0.3 },
        "Lluvia": { "Nublado": 0.6, "Lluvia": 0.4 },
        "Vientos Fuertes": { "Despejado": 0.3, "Nublado": 0.3, "Vientos Fuertes": 0.3, "Vientos Huracanados": 0.1 },
        "Vientos Huracanados": { "Vientos Fuertes": 0.9, "Tormenta": 0.1 },
        "Tormenta": { "Lluvia": 0.8, "Vientos Fuertes": 0.2 }
      },
      11: { // Vientos Helados
        "Despejado": { "Despejado": 0.5, "Nublado": 0.2, "Vientos Fuertes": 0.2, "Nieve": 0.1 },
        "Nublado": { "Despejado": 0.3, "Nublado": 0.4, "Nieve": 0.3 },
        "Vientos Fuertes": { "Despejado": 0.4, "Nublado": 0.3, "Vientos Huracanados": 0.2, "Nieve": 0.1 },
        "Vientos Huracanados": { "Vientos Fuertes": 0.8, "Nevada Extrema": 0.2 },
        "Nieve": { "Nublado": 0.4, "Nieve": 0.4, "Nevada Extrema": 0.2 },
        "Nevada Extrema": { "Nieve": 0.7, "Vientos Huracanados": 0.3 }
      },
      12: { // Invierno Crudo
        "Despejado": { "Nublado": 0.4, "Nieve": 0.4, "Vientos Fuertes": 0.2 },
        "Nublado": { "Despejado": 0.1, "Nublado": 0.3, "Nieve": 0.6 },
        "Nieve": { "Nublado": 0.3, "Nieve": 0.5, "Nevada Extrema": 0.2 },
        "Nevada Extrema": { "Nieve": 0.8, "Vientos Huracanados": 0.2 },
        "Vientos Fuertes": { "Nublado": 0.4, "Nieve": 0.4, "Vientos Huracanados": 0.2 },
        "Vientos Huracanados": { "Vientos Fuertes": 0.5, "Nevada Extrema": 0.5 }
      }
    };

    function calcularSiguienteClima(climaActual, mesActual) {
      // Fallback si el clima actual no existe en el mes nuevo por un salto raro
      let transiciones = redClimatica[mesActual][climaActual];
      if (!transiciones) {
        // Tomar un clima al azar del mes o Despejado
        const climasDisponibles = Object.keys(redClimatica[mesActual]);
        transiciones = redClimatica[mesActual][climasDisponibles[0]];
      }

      const rand = Math.random();
      let sum = 0;
      for (const [siguiente, prob] of Object.entries(transiciones)) {
        sum += prob;
        if (rand <= sum) {
          return siguiente;
        }
      }
      return Object.keys(transiciones)[0]; // Fallback
    }

    let estadoActual = {
      año: 984,
      dia: 1,
      mes: 1,
      clima: "Despejado"
    };

    // Escuchar el estado actual desde Firebase para inicializar las variables locales
    db.ref('campaña/calendario').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        estadoActual.año = data.año || 984;
        estadoActual.dia = data.dia || 1;
        estadoActual.mes = data.mes || 1;
        estadoActual.clima = data.clima || "Despejado";

        // Actualizar UI
        document.getElementById('lbl-auto-fecha').innerText = `Año ${estadoActual.año} / Mes ${estadoActual.mes} / Día ${estadoActual.dia}`;
        document.getElementById('lbl-auto-clima').innerText = estadoActual.clima;

        document.getElementById('debug-año').value = estadoActual.año;
        document.getElementById('debug-dia').value = estadoActual.dia;
        document.getElementById('debug-mes').value = estadoActual.mes;
        document.getElementById('debug-clima').value = estadoActual.clima;
      }
    });

    document.getElementById('btn-fijar-hora').addEventListener('click', () => {
      const newTime = document.getElementById('dm-time-input').value;

      if (newTime) {
        // Guardar (set) el valor en el nodo de Firebase
        db.ref('campaña/hora_actual').set(newTime)
          .then(() => {
            console.log('Hora global actualizada a:', newTime);
            alert('Hora fijada a: ' + newTime);
          })
          .catch((error) => {
            console.error('Error al actualizar la hora:', error);
            alert('Error al fijar la hora.');
          });
      }
    });

    document.getElementById('btn-avanzar-dia').addEventListener('click', () => {
      let nuevoAño = estadoActual.año;
      let nuevoMes = estadoActual.mes;
      let nuevoDia = estadoActual.dia + 1;

      const diasMesActual = diasPorMes[nuevoMes] || 30;

      if (nuevoDia > diasMesActual) {
        nuevoDia = 1;
        nuevoMes++;
        if (nuevoMes > 12) {
          nuevoMes = 1; // Un año nuevo
          nuevoAño++;
        }
      }

      const nuevoClima = calcularSiguienteClima(estadoActual.clima, nuevoMes);

      const nuevoEstado = {
        año: nuevoAño,
        dia: nuevoDia,
        mes: nuevoMes,
        clima: nuevoClima
      };

      db.ref('campaña/calendario').set(nuevoEstado)
        .then(() => {
          console.log('Calendario (Auto) actualizado:', nuevoEstado);
        })
        .catch((error) => {
          console.error('Error al actualizar calendario (Auto):', error);
          alert('Error al actualizar calendario.');
        });
    });

    document.getElementById('btn-forzar-estado').addEventListener('click', () => {
      const debugAño = parseInt(document.getElementById('debug-año').value) || 984;
      const debugDia = parseInt(document.getElementById('debug-dia').value) || 1;
      const debugMes = parseInt(document.getElementById('debug-mes').value) || 1;
      const debugClima = document.getElementById('debug-clima').value || "Despejado";

      const estadoForzado = {
        año: debugAño,
        dia: debugDia,
        mes: debugMes,
        clima: debugClima
      };

      db.ref('campaña/calendario').set(estadoForzado)
        .then(() => {
          console.log('Calendario (Debug) actualizado:', estadoForzado);
          alert('Estado del calendario forzado con éxito.');
        })
        .catch((error) => {
          console.error('Error al forzar calendario:', error);
          alert('Error al forzar calendario.');
        });
    });

    // --- ZONA A: RED BANCARIA ---
    const bancoContainer = document.getElementById('banco-jugadores-container');

    db.ref('campaña/jugadores/').on('value', (snapshot) => {
      bancoContainer.innerHTML = '';
      const jugadores = snapshot.val();

      if (jugadores) {
        for (const [nombre, data] of Object.entries(jugadores)) {
          const tarjeta = document.createElement('div');
          tarjeta.style.cssText = 'background: #222; padding: 15px; border-radius: 6px; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 200px;';

          const title = document.createElement('strong');
          title.style.color = '#fff';
          title.innerText = nombre;

          const inputAhn = document.createElement('input');
          inputAhn.type = 'number';
          inputAhn.value = data.ahn || 0;
          inputAhn.style.cssText = 'padding: 5px; width: 80%; text-align: center; background: #111; color: #0df; border: 1px solid #c49a00; border-radius: 3px; font-size: 16px; font-weight: bold;';

          const btnForzar = document.createElement('button');
          btnForzar.innerText = 'Forzar Transacción';
          btnForzar.style.cssText = 'background: #8b0000; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; width: 100%;';
          btnForzar.onclick = () => {
             const nuevoAhn = parseInt(inputAhn.value) || 0;
             db.ref(`campaña/jugadores/${nombre}`).update({ ahn: nuevoAhn })
               .then(() => alert(`Ahn actualizado para ${nombre}`))
               .catch(e => alert('Error: ' + e));
          };

          tarjeta.appendChild(title);
          tarjeta.appendChild(inputAhn);
          tarjeta.appendChild(btnForzar);
          bancoContainer.appendChild(tarjeta);
        }
      } else {
        bancoContainer.innerHTML = '<span style="color: #888;">No hay jugadores activos.</span>';
      }
    });

    document.getElementById('btn-ejecutar-tx').addEventListener('click', () => {
      const nombre = document.getElementById('banco-nombre').value.trim();
      const monto = parseInt(document.getElementById('banco-monto').value) || 0;
      const concepto = document.getElementById('banco-concepto').value.trim();

      if (!nombre) { alert("El nombre del personaje es requerido."); return; }
      if (!concepto) { alert("El concepto es requerido."); return; }
      if (monto === 0) { alert("El monto no puede ser cero."); return; }

      const playerRef = db.ref(`campaña/jugadores/${nombre}`);
      playerRef.child('ahn').once('value').then((snapshot) => {
        const currentAhn = parseInt(snapshot.val()) || 0;
        const newAhn = currentAhn + monto;

        // Actualizar saldo
        playerRef.update({ ahn: newAhn }).then(() => {
          // Guardar transacción
          const transaccion = {
            monto: monto,
            concepto: concepto,
            timestamp: Date.now()
          };
          playerRef.child('transacciones').push(transaccion).then(() => {
            alert(`Transacción ejecutada con éxito. Nuevo saldo de ${nombre}: ${newAhn} Ahn.`);
            document.getElementById('banco-nombre').value = '';
            document.getElementById('banco-monto').value = '';
            document.getElementById('banco-concepto').value = '';
          });
        }).catch(e => alert('Error actualizando saldo: ' + e));
      }).catch(e => alert('Error leyendo saldo actual: ' + e));
    });


    // --- ZONA B: LA FORJA Y EL MERCADO ---
    document.getElementById('btn-crear-item').addEventListener('click', () => {
       const nombre = document.getElementById('forja-nombre').value.trim();
       if (!nombre) { alert("El nombre es requerido"); return; }

       const tipo = document.getElementById('forja-tipo').value;
       const costo = parseInt(document.getElementById('forja-costo').value) || 0;
       const usos = parseInt(document.getElementById('forja-usos').value) || 0;
       const desc = document.getElementById('forja-desc').value.trim();

       const item = { nombre, tipo, costo, usos, descripcion: desc };

       db.ref(`campaña/base_datos_items/${nombre}`).set(item)
         .then(() => {
            alert('Ítem creado exitosamente');
            // Limpiar form
            document.getElementById('forja-nombre').value = '';
            document.getElementById('forja-costo').value = '';
            document.getElementById('forja-usos').value = '';
            document.getElementById('forja-desc').value = '';
         })
         .catch(e => alert('Error creando ítem: ' + e));
    });

    const forjaLista = document.getElementById('forja-lista-items');
    db.ref('campaña/base_datos_items').on('value', (snapshot) => {
       forjaLista.innerHTML = '';
       const items = snapshot.val();

       if (items) {
          for (const [key, data] of Object.entries(items)) {
             const row = document.createElement('div');
             row.style.cssText = 'display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px; border: 1px solid #333; border-radius: 4px;';

             const info = document.createElement('div');
             info.innerHTML = `<strong style="color:#c49a00;">${data.nombre}</strong> [${data.tipo}] - <span style="color:#0df;">${data.costo} Ahn</span>`;

             const btnAñadir = document.createElement('button');
             btnAñadir.innerText = 'Añadir a Tienda Actual';
             btnAñadir.style.cssText = 'background: #004400; border: 1px solid #00ff00; color: white; padding: 5px 10px; border-radius: 3px; cursor: pointer;';
             btnAñadir.onclick = () => {
                db.ref(`campaña/tienda_actual/${data.nombre}`).set(data)
                  .then(() => alert(`Añadido a tienda: ${data.nombre}`))
                  .catch(e => alert('Error: ' + e));
             };

             row.appendChild(info);
             row.appendChild(btnAñadir);
             forjaLista.appendChild(row);
          }
       } else {
          forjaLista.innerHTML = '<span style="color: #888;">No hay ítems en la base de datos.</span>';
       }
    });

  </script>

</body>
</html>
