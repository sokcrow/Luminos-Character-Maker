<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luminous · Codex Training Stage</title>
<style>
:root{--hp:#ff4a22;--font:'Arial Narrow',Impact,Arial,sans-serif;--field-scale:.78}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050010;color:#fff;font-family:Arial,sans-serif}
#game-container{position:relative;width:100%;height:100%;overflow:hidden;background:#050010}
#battlefield{position:absolute;inset:0;overflow:hidden;background-image:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.4)),url('https://limbuscompany.wiki.gg/images/Battle_Alleyways_of_T_Corp._2_BG.png');background-size:cover;background-position:center bottom;background-repeat:no-repeat}
#battlefield:after{content:'';position:absolute;inset:auto 0 0;height:43%;background:linear-gradient(to top,rgba(5,3,2,.78),transparent);pointer-events:none}
.sprite-container{position:absolute;transform:translateX(-50%);pointer-events:none;transition:left .52s cubic-bezier(.18,.76,.22,1),bottom .52s cubic-bezier(.18,.76,.22,1),filter .2s ease;z-index:20}
.combatant{position:relative;width:260px;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none;transform-origin:bottom center;transform:scale(var(--field-scale))}
.diegetic-floor{position:absolute;bottom:-110px;width:220px;height:220px;transform:rotateX(65deg);z-index:1;overflow:visible;pointer-events:auto}.floor-bg-poly{fill:rgba(255,80,0,.2);stroke:rgba(255,200,50,.5);stroke-width:3}.hp-track{fill:none;stroke:rgba(30,5,5,.8);stroke-width:22;stroke-linecap:butt}.hp-transition-line{fill:none;stroke:#fff;stroke-width:22;stroke-linecap:butt;opacity:0;pointer-events:none}.hp-fill-line{fill:none;stroke:var(--hp);stroke-width:22;stroke-linecap:butt;filter:drop-shadow(0 0 10px var(--hp));transition:stroke-dashoffset .38s ease}.stagger-threshold-outline{stroke:#000;stroke-width:5;stroke-linecap:round;pointer-events:none}.stagger-threshold-line{stroke:#fff;stroke-width:2.5;stroke-linecap:round;pointer-events:none}.stagger-threshold{transition:opacity .18s ease}.stagger-threshold.consumed{opacity:.08}
.sprite-anchor{position:absolute;display:flex;justify-content:center;width:100%;z-index:3;pointer-events:none;transform-origin:bottom center}.sprite-img{height:240px;max-width:260px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 15px 10px rgba(0,0,0,.8));pointer-events:none}.sprite-fallback{display:none;position:absolute;bottom:0;width:122px;height:210px;clip-path:polygon(50% 0,78% 12%,84% 35%,73% 46%,86% 100%,14% 100%,27% 46%,16% 35%,22% 12%);background:linear-gradient(#b69a63,#30291f);filter:drop-shadow(0 15px 10px rgba(0,0,0,.8));opacity:.75}.sprite-anchor.asset-failed .sprite-fallback{display:block}
.top-ui-panel{position:absolute;display:flex;align-items:flex-start;gap:6px;z-index:10;pointer-events:none;left:50%;transform:translateX(-50%)}.speed-number{color:#ffe877;font-size:50px;font-family:var(--font);line-height:.8;text-shadow:0 0 8px #ff4400,1px 1px 2px #000;margin-top:8px}.action-slots{display:flex;gap:2px}.action-slot-wrapper{position:relative}.action-slot-svg{width:44px;height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}.slot-heptagon-bg{fill:#1a1510;stroke:#4a3520;stroke-width:10}.slot-center-line{stroke:#a87030;stroke-width:8;stroke-linecap:round}
.floating-hp-group{position:absolute;bottom:5px;left:-10px;z-index:10;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}.name-plate{background:#050505;color:#ddd;font-size:14px;letter-spacing:1px;font-family:var(--font);padding:2px 6px;border:1px solid #333;border-radius:4px;text-transform:uppercase;margin-bottom:-2px}.hp-number{font-size:60px;color:var(--hp);font-family:var(--font);line-height:.85;text-shadow:2px 4px 6px rgba(0,0,0,.8)}.floating-sp-group{position:absolute;bottom:5px;right:5px;width:48px;height:48px;border-radius:50%;border:3px solid #3b2c20;outline:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:30px;font-family:var(--font);color:#fff;text-shadow:1px 1px 3px #000;z-index:10;pointer-events:none}.sp-neutral{background:radial-gradient(circle at 30% 30%,#55aaaa 0%,#113333 80%)}
.status-effect-strip{position:absolute;z-index:18;left:50%;bottom:-144px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,58px);grid-auto-rows:34px;align-items:center;justify-items:center;justify-content:center;gap:7px 5px;width:max-content;max-width:247px;min-height:34px;pointer-events:none}.status-effect{--status-tone:#d9d5ca;position:relative;display:grid;grid-template-columns:18px 30px 18px;align-items:end;justify-items:center;min-width:66px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.95))}.status-effect.positive{--status-tone:#f0d353}.status-effect.negative{--status-tone:#d63b3b}.status-effect.neutral{--status-tone:#c8b79a}.status-effect-icon{grid-column:2;grid-row:1;align-self:center;width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--status-tone) 34%,transparent))}.status-value{grid-row:1;align-self:end;font:25px/.72 var(--font);color:#f3eee5;-webkit-text-stroke:.7px #17130f;text-shadow:1px 2px 2px #000}.status-potency{grid-column:1;justify-self:end}.status-count{grid-column:3;justify-self:start}
.stagger-pop{position:absolute;left:50%;bottom:196px;transform:translateX(-50%);z-index:60;font:54px/.8 var(--font);color:#ffd400;text-shadow:0 3px 0 #000,0 0 12px #ff7a00;opacity:0;transition:.18s ease}.stagger-pop.show{opacity:1;transform:translate(-50%,-8px)}
.floating-number{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:95;font:54px/.8 var(--font);color:#ff765a;text-shadow:0 3px 0 #000;pointer-events:none;animation:floatNumber .8s ease forwards}.floating-number.crit{color:#ffe38a}@keyframes floatNumber{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}100%{opacity:0;transform:translate(-50%,-55px) scale(.95)}}
.training-highlight{filter:drop-shadow(0 0 15px #f4d66e) brightness(1.15)!important}
.coin-pop{position:absolute;z-index:96;width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 7px #000);animation:coinSpin .55s ease}.coin-pop.ally,.coin-pop.enemy{left:calc(50% - 32px);top:14px}@keyframes coinSpin{0%{transform:rotateY(0deg) scale(.6);opacity:.15}75%{transform:rotateY(540deg) scale(1.08);opacity:1}100%{transform:rotateY(720deg) scale(1)}}
.impact{position:absolute;left:50%;top:42%;width:78px;height:78px;transform:translate(-50%,-50%);z-index:100;pointer-events:none}.impact:before,.impact:after{content:'';position:absolute;left:50%;top:50%;width:74px;height:4px;background:#fff1a8;box-shadow:0 0 12px #ff9500;transform:translate(-50%,-50%) rotate(35deg);animation:impact .38s ease forwards}.impact:after{transform:translate(-50%,-50%) rotate(-35deg)}@keyframes impact{from{opacity:1;width:25px}to{opacity:0;width:108px}}
.critical-banner{position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:120;font:66px/.8 var(--font);color:#ffe38a;text-shadow:0 4px 0 #000,0 0 20px #ff9a00;pointer-events:none}
.clash-float-hud{--clash-sin:#a77434;position:absolute;z-index:90;left:50%;bottom:248px;width:186px;height:118px;transform:translateX(-50%) translateY(8px) scale(.96);transform-origin:50% 100%;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .14s ease,transform .18s cubic-bezier(.2,.78,.2,1);filter:drop-shadow(5px 7px 0 rgba(0,0,0,.58))}.clash-float-hud.open{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1)}.clash-float-hud.enemy-side{transform:translateX(-50%) translateY(8px) scale(.96)}.clash-float-hud.enemy-side.open{transform:translateX(-50%) translateY(0) scale(1)}.clash-float-coins{position:absolute;z-index:5;left:10px;right:10px;top:-5px;height:20px;display:flex;align-items:center;justify-content:center;gap:4px}.clash-float-coin{position:relative;width:17px;height:17px;border-radius:50%;background:center/contain no-repeat;filter:drop-shadow(0 1px 2px #000);transition:opacity .16s ease,transform .2s ease,filter .16s ease}.clash-float-coin img{width:100%;height:100%;object-fit:contain}.clash-float-coin.lost{opacity:.18;transform:scale(.68);filter:grayscale(1) brightness(.45)}.clash-float-coin.lost:after{content:'×';position:absolute;inset:-1px;display:grid;place-items:center;font:900 13px Arial,sans-serif;color:#d74a3f;text-shadow:1px 1px 0 #000}.clash-float-ribbon{position:absolute;z-index:2;left:0;right:34px;top:15px;min-height:33px;padding:5px 34px 5px 12px;display:flex;align-items:center;background:var(--clash-sin);clip-path:polygon(0 18%,8% 0,94% 0,100% 50%,94% 100%,7% 91%,0 68%);box-shadow:0 0 10px color-mix(in srgb,var(--clash-sin) 42%,transparent)}.clash-float-hud.enemy-side .clash-float-ribbon{left:34px;right:0;padding:5px 12px 5px 34px;justify-content:flex-end;clip-path:polygon(6% 0,92% 0,100% 18%,100% 68%,93% 91%,6% 100%,0 50%)}.clash-float-name{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:19px/.86 var(--font);color:#fff7e8;letter-spacing:.3px;text-shadow:1px 2px 0 rgba(0,0,0,.55)}.clash-float-power-shell{position:absolute;z-index:4;right:0;top:14px;width:74px;height:82px;display:grid;place-items:center;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--clash-sin) 48%,transparent)) drop-shadow(3px 4px 0 rgba(0,0,0,.62))}.clash-float-hud.enemy-side .clash-float-power-shell{right:auto;left:0}.clash-float-hept{position:absolute;inset:0;clip-path:polygon(50% 100%,10% 78%,0 35%,25% 0,75% 0,100% 35%,90% 78%);background:var(--clash-sin)}.clash-float-hept:after{content:'';position:absolute;inset:4px;clip-path:inherit;background:#090705}.clash-float-power{position:relative;z-index:2;transform:translateY(3px);font:54px/.72 var(--font);color:#fff9ef;-webkit-text-stroke:1.5px color-mix(in srgb,var(--clash-sin) 82%,#000 18%);text-shadow:0 0 10px color-mix(in srgb,var(--clash-sin) 34%,transparent),3px 4px 0 rgba(0,0,0,.55)}.clash-float-coin-power{position:absolute;z-index:6;right:5px;top:-2px;font:22px/.8 var(--font);color:#f4ead8;-webkit-text-stroke:1px color-mix(in srgb,var(--clash-sin) 70%,#000 30%);text-shadow:0 0 6px color-mix(in srgb,var(--clash-sin) 38%,transparent)}.clash-float-hud.enemy-side .clash-float-coin-power{right:auto;left:5px}.clash-float-meta{position:absolute;z-index:3;left:11px;right:78px;top:54px;min-height:34px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px}.clash-float-hud.enemy-side .clash-float-meta{left:78px;right:11px;align-items:flex-end;text-align:right}.clash-executing-coin-icon{width:22px;height:22px}.clash-executing-coin-icon img{width:22px;height:22px;object-fit:contain}.clash-executing-coin-index{font:10px/.9 var(--font);letter-spacing:.55px;color:#e7dac4;text-transform:uppercase;white-space:nowrap}.clash-executing-coin-effect{font:700 5.6px/1.15 Arial,sans-serif;letter-spacing:.2px;color:#a89d8d;text-transform:uppercase;white-space:normal;max-width:108px}.clash-float-result{position:absolute;z-index:8;left:7px;right:7px;bottom:-22px;text-align:center;font:11px/.9 var(--font);color:#eee5d6;text-shadow:1px 1px 0 #000}.clash-float-result.win{color:#f2d867}
.asset-warning{position:absolute;right:12px;bottom:10px;z-index:150;font:700 10px Arial;color:#d4c7b4;background:#090806d9;border:1px solid #57442d;padding:6px 8px;display:none}.asset-warning.show{display:block}@media(max-width:820px){:root{--field-scale:.56}.sprite-container.ally{left:28%!important}.sprite-container.enemy{left:72%!important}.clash-float-hud{bottom:232px;transform:translateX(-50%) scale(.82)}.clash-float-hud.open{transform:translateX(-50%) scale(.82)}}
</style>
</head>
<body>
<div id="game-container"><div id="battlefield"></div><div class="asset-warning" id="asset-warning">Algún sprite externo no cargó; el HUD sigue operativo.</div></div>
<script>
(()=>{'use strict';
const HEAD='https://i.imgur.com/yshLPnQ.png',TAIL='https://i.imgur.com/XDx0ICt.png';
const STATUS={burn:['https://i.imgur.com/L4bRd44.png','negative'],bleed:['https://i.imgur.com/mp9fbme.png','negative'],tremor:['https://i.imgur.com/fuDGjpn.png','negative'],sinking:['https://i.imgur.com/ZnulGzZ.png','negative'],poise:['https://i.imgur.com/KFEmJB5.png','positive']};
const UNITS={ally:{id:'ally',name:'Don Quixote',hp:176,maxHp:176,sp:0,speed:5,img:'https://limbuscompany.wiki.gg/images/LCB_Sinner_Don_Quixote_Idle_Sprite.png?879f2e=&format=original',x:25,y:18,flip:false},enemy:{id:'enemy',name:'Training Dummy',hp:158,maxHp:158,sp:0,speed:4,img:'https://limbuscompany.wiki.gg/images/8/87/Head_Hooligan_Idle_Sprite.png',x:75,y:18,flip:true}};
const state={ally:{},enemy:{}};let run=0;const field=document.getElementById('battlefield');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function emit(title,copy){parent.postMessage({type:'codex-stage-event',title,copy},'*')}
function generateHeptagonPoints(radius){const sides=7,p=[],start=Math.PI/2;for(let i=0;i<sides;i++){const a=start+i*2*Math.PI/sides;p.push({x:Number((radius*Math.cos(a)).toFixed(1)),y:Number((radius*Math.sin(a)).toFixed(1))})}const frontPoints=[p[2],p[1],p[0],p[6],p[5]];return{full:p.map(q=>`${q.x},${q.y}`).join(' '),front:frontPoints.map(q=>`${q.x},${q.y}`).join(' '),frontPoints}}
function pointOnPolyline(points,pct){const segs=[],total=points.slice(0,-1).reduce((sum,a,i)=>{const b=points[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);segs.push({a,b,len});return sum+len},0);let target=total*(pct/100);for(const s of segs){if(target<=s.len){const t=s.len?target/s.len:0,dx=(s.b.x-s.a.x)/(s.len||1),dy=(s.b.y-s.a.y)/(s.len||1);return{x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t,dx,dy}}target-=s.len}const s=segs[segs.length-1];return{x:s.b.x,y:s.b.y,dx:(s.b.x-s.a.x)/(s.len||1),dy:(s.b.y-s.a.y)/(s.len||1)}}
function thresholdMarkup(points,thresholds=[70,40,20]){return thresholds.map((pct,index)=>{const p=pointOnPolyline(points,pct),nx=-p.dy,ny=p.dx,half=15,g={x1:(p.x-nx*half).toFixed(2),y1:(p.y-ny*half).toFixed(2),x2:(p.x+nx*half).toFixed(2),y2:(p.y+ny*half).toFixed(2)};return `<g class="stagger-threshold" data-threshold-index="${index}" data-threshold="${pct}"><line class="stagger-threshold-outline" x1="${g.x1}" y1="${g.y1}" x2="${g.x2}" y2="${g.y2}"/><line class="stagger-threshold-line" x1="${g.x1}" y1="${g.y1}" x2="${g.x2}" y2="${g.y2}"/></g>`}).join('')}
function unitMarkup(u){const h=generateHeptagonPoints(85),pct=u.hp/u.maxHp*100;return `<div class="sprite-container ${u.id}" id="token-${u.id}" style="left:${u.x}%;bottom:${u.y}%"><div class="combatant"><svg class="diegetic-floor" viewBox="-100 -100 200 200"><polygon class="floor-bg-poly" points="${h.full}"/><polyline class="hp-track" points="${h.front}"/><polyline class="hp-transition-line" points="${h.front}" pathLength="100" style="stroke-dasharray:100;stroke-dashoffset:${100-pct}"/><polyline class="hp-fill-line" points="${h.front}" pathLength="100" style="stroke-dasharray:100;stroke-dashoffset:${100-pct}"/>${thresholdMarkup(h.frontPoints)}</svg><div class="top-ui-panel" style="top:60px"><div class="speed-number">${u.speed}</div><div class="action-slots"><div class="action-slot-wrapper"><svg class="action-slot-svg" viewBox="0 0 100 100"><polygon class="slot-heptagon-bg" points="50,95 15,78 6,40 30,9 70,9 94,40 85,78"/><line class="slot-center-line" x1="25" y1="50" x2="75" y2="50"/></svg></div></div></div><div class="sprite-anchor" style="bottom:0;margin-left:0;transform:scaleX(${u.flip?-1:1})"><img src="${u.img}" class="sprite-img" id="sprite-${u.id}"><div class="sprite-fallback"></div></div><div class="stagger-pop">STAGGER</div><div class="floating-hp-group"><div class="name-plate">${u.name}</div><div class="hp-number">${u.hp}</div></div><div class="floating-sp-group sp-neutral">0</div><div class="status-effect-strip" id="statuses-${u.id}"></div></div></div>`}
function bindImages(){document.querySelectorAll('.sprite-img').forEach(img=>{img.addEventListener('error',()=>{img.style.display='none';img.parentElement.classList.add('asset-failed');document.getElementById('asset-warning').classList.add('show')},{once:true})})}
function rebuild(){field.innerHTML=unitMarkup(UNITS.ally)+unitMarkup(UNITS.enemy);bindImages();reset()}
function token(id){return document.getElementById(`token-${id}`)}
function setHp(id,value){const s=state[id],u=UNITS[id];s.hp=Math.max(0,Math.min(u.maxHp,value));token(id).querySelector('.hp-number').textContent=Math.round(s.hp);token(id).querySelector('.hp-fill-line').style.strokeDashoffset=String(100-(s.hp/u.maxHp*100))}
function setSp(id,value){state[id].sp=Math.max(-45,Math.min(45,value));const node=token(id).querySelector('.floating-sp-group');node.textContent=state[id].sp;node.style.background=state[id].sp>0?'radial-gradient(circle at 30% 30%,#95f4ff 0%,#174d58 80%)':state[id].sp<0?'radial-gradient(circle at 30% 30%,#d96e83 0%,#4b121d 80%)':'radial-gradient(circle at 30% 30%,#55aaaa 0%,#113333 80%)'}
function setStatus(id,status,potency,count){const host=document.getElementById(`statuses-${id}`);host.innerHTML='';if(!status)return;const [src,tone]=STATUS[status]||['','neutral'];host.innerHTML=`<span class="status-effect ${tone}"><span class="status-value status-potency">${potency??''}</span><img class="status-effect-icon" src="${src}" alt="${status}"><span class="status-value status-count">${count??''}</span></span>`;const img=host.querySelector('img');img?.addEventListener('error',()=>img.style.visibility='hidden',{once:true})}
function clearTransient(){document.querySelectorAll('.coin-pop,.impact,.critical-banner,.clash-float-hud,.floating-number').forEach(n=>n.remove());document.querySelectorAll('.training-highlight').forEach(n=>n.classList.remove('training-highlight'));document.querySelectorAll('.stagger-threshold').forEach(n=>{n.classList.remove('consumed');n.removeAttribute('transform')});document.querySelectorAll('.stagger-pop').forEach(n=>n.classList.remove('show'))}
function reset(){run++;clearTransient();for(const id of ['ally','enemy']){state[id]={hp:UNITS[id].hp,sp:0};setHp(id,UNITS[id].hp);setSp(id,0);setStatus(id);const t=token(id);t.style.left=`${UNITS[id].x}%`;t.style.bottom=`${UNITS[id].y}%`;t.style.zIndex='20'}emit('Escena reiniciada','Don y Training Dummy vuelven a su estado inicial.')}
function highlight(id,selector,title,copy){const n=token(id).querySelector(selector);n?.classList.add('training-highlight');emit(title,copy);setTimeout(()=>n?.classList.remove('training-highlight'),900)}
function coin(id,side='head'){const img=document.createElement('img');img.className=`coin-pop ${id}`;img.src=side==='head'?HEAD:TAIL;img.alt=side;token(id).appendChild(img);setTimeout(()=>img.remove(),1150);return img}
function number(id,text,crit=false){const n=document.createElement('div');n.className=`floating-number${crit?' crit':''}`;n.textContent=text;token(id).appendChild(n);setTimeout(()=>n.remove(),850)}
function impact(){const n=document.createElement('div');n.className='impact';field.appendChild(n);setTimeout(()=>n.remove(),450)}
function clashHud(id,side,{name,power,coinPower,coins=2,sin='#a77434',effect='SIN EFECTO DE MONEDA'}){const h=document.createElement('div');h.className=`clash-float-hud ${side==='enemy'?'enemy-side':''}`;h.style.setProperty('--clash-sin',sin);h.innerHTML=`<div class="clash-float-coins">${Array.from({length:coins},(_,i)=>`<span class="clash-float-coin" data-coin="${i}"><img src="${TAIL}" alt="Coin"></span>`).join('')}</div><div class="clash-float-ribbon"><span class="clash-float-name">${name}</span></div><div class="clash-float-power-shell"><div class="clash-float-hept"></div><span class="clash-float-power">${power}</span><span class="clash-float-coin-power">${coinPower>=0?'+':''}${coinPower}</span></div><div class="clash-float-meta clash-float-coin-detail"><span class="clash-executing-coin-icon"><img src="${TAIL}" alt="Current Coin"></span><span class="clash-executing-coin-index">MONEDA 1/${coins}</span><span class="clash-executing-coin-effect">${effect}</span></div><div class="clash-float-result"></div>`;token(id).querySelector('.combatant').appendChild(h);requestAnimationFrame(()=>h.classList.add('open'));return h}
function resolveHudCoin(h,side,power,index=0){const img=h.querySelector(`.clash-float-coin[data-coin="${index}"] img`);if(img)img.src=side==='head'?HEAD:TAIL;const current=h.querySelector('.clash-executing-coin-icon img');if(current)current.src=side==='head'?HEAD:TAIL;h.querySelector('.clash-float-power').textContent=power}
async function demoHud(my){highlight('enemy','.diegetic-floor','HUD DE UNIDAD','El heptágono contiene HP y los Stagger Thresholds.');await sleep(950);if(my!==run)return;highlight('enemy','.top-ui-panel','SPEED + ACTION SLOT','Arriba están Speed y el Action Slot real.');await sleep(950);if(my!==run)return;highlight('enemy','.floating-sp-group','SP','El orbe lateral muestra SP.')}
async function demoSp(my){emit('SP = 0','0 SP = 50% Heads.');await sleep(600);if(my!==run)return;setSp('ally',25);highlight('ally','.floating-sp-group','SP +25','+25 SP = 75% Heads.');await sleep(700);if(my!==run)return;coin('ally','head');emit('HEADS','Heads añade Coin Power en una Coin positiva.')}
async function demoThreshold(my){setHp('enemy',115);emit('ANTES DEL THRESHOLD','El Dummy está justo por encima del 70%.');await sleep(700);if(my!==run)return;setHp('enemy',105);number('enemy','-10');token('enemy').querySelector('.stagger-threshold[data-threshold-index="0"]')?.classList.add('consumed');token('enemy').querySelector('.stagger-pop')?.classList.add('show');emit('STAGGER','Cruzar la marca consume ese Threshold y activa Stagger.')}
async function demoCoin(my){const h=clashHud('ally','ally',{name:'Training Thrust',power:5,coinPower:3,coins:1,sin:'#a63d2d'});emit('BASE POWER 5','La Coin todavía no se resolvió.');await sleep(650);if(my!==run)return;coin('ally','head');resolveHudCoin(h,'head',8,0);emit('HEADS → POWER 8','5 Base Power + 3 Coin Power = 8.')}
async function demoClash(my){emit('CLASH','Ambas unidades avanzan antes de cualquier daño.');const a=token('ally'),b=token('enemy');a.style.zIndex=b.style.zIndex='80';a.style.left='43%';b.style.left='57%';await sleep(600);if(my!==run)return;const ah=clashHud('ally','ally',{name:'Galloping Thrust',power:7,coinPower:3,coins:2,sin:'#a63d2d'}),bh=clashHud('enemy','enemy',{name:'Pipe Swing',power:6,coinPower:2,coins:2,sin:'#5c5143'});await sleep(500);if(my!==run)return;a.style.left='47%';b.style.left='53%';await sleep(310);impact();coin('ally','head');coin('enemy','tail');resolveHudCoin(ah,'head',10);resolveHudCoin(bh,'tail',6);await sleep(500);if(my!==run)return;bh.querySelector('.clash-float-coin[data-coin="0"]')?.classList.add('lost');bh.querySelector('.clash-float-result').textContent='CLASH LOSE';ah.querySelector('.clash-float-result').textContent='CLASH WIN';ah.querySelector('.clash-float-result').classList.add('win');b.style.left='60%';a.style.left='46%';emit('DON GANA LA RONDA','El Dummy pierde una Coin y retrocede. Todavía no hay daño.');await sleep(950);if(my!==run)return;a.style.left='25%';b.style.left='75%';setTimeout(()=>{ah.remove();bh.remove()},520)}
async function demoOnHit(my){emit('HIT','Primero conecta la Coin y baja HP.');coin('ally','head');await sleep(420);if(my!==run)return;setHp('enemy',146);number('enemy','-12');impact();await sleep(650);if(my!==run)return;setStatus('enemy','sinking',10,2);emit('[ON HIT]','Después del daño aparece Sinking 10 / 2.')}
async function demoBurn(my){setStatus('enemy','burn',12,3);emit('BURN 12 / 3','Aplicarlo no baja HP todavía.');await sleep(850);if(my!==run)return;setHp('enemy',146);setStatus('enemy','burn',12,2);number('enemy','-12');emit('TURN END','Burn hace 12 Fixed Damage y Count baja 3 → 2.')}
async function demoBleed(my){setStatus('ally','bleed',8,3);emit('BLEED ESTÁ EN DON','Bleed espera a que la propia unidad resuelva una Coin.');await sleep(650);if(my!==run)return;coin('ally','head');await sleep(420);if(my!==run)return;setHp('ally',168);setStatus('ally','bleed',8,2);number('ally','-8');emit('COIN RESOLVED → BLEED','Don pierde 8 HP por SU Bleed.');await sleep(760);if(my!==run)return;setHp('enemy',148);number('enemy','-10');impact();emit('DESPUÉS: HIT','Ahora la Skill golpea al Dummy por separado.')}
async function demoSinking(my){setSp('enemy',25);setStatus('enemy','sinking',10,2);emit('ANTES DEL HIT','Dummy: +25 SP y Sinking 10 / 2.');await sleep(650);if(my!==run)return;setHp('enemy',146);number('enemy','-12');impact();await sleep(620);if(my!==run)return;setSp('enemy',15);setStatus('enemy','sinking',10,1);emit('GETTING HIT → SINKING','SP 25 → 15 después del Hit; Count 2 → 1.')}
async function demoTremor(my){setStatus('enemy','tremor',25,2);emit('TREMOR 25 / 2','Mira los Thresholds; HP no cambiará.');await sleep(750);if(my!==run)return;const th=[...token('enemy').querySelectorAll('.stagger-threshold')];th.forEach((g,i)=>{g.setAttribute('transform',`translate(${[12,9,6][i]} 0)`)});setStatus('enemy','tremor',25,1);emit('TREMOR BURST','Se mueven las marcas; HP permanece igual.')}
async function demoPoise(my){setStatus('ally','poise',20,3);emit('POISE 20 / 3','La demo fuerza un Crit para que pueda verse.');await sleep(650);if(my!==run)return;coin('ally','head');await sleep(420);if(my!==run)return;const c=document.createElement('div');c.className='critical-banner';c.textContent='CRITICAL ×1.2';field.appendChild(c);setHp('enemy',134);number('enemy','-24',true);setStatus('ally','poise',20,2);impact();emit('CRITICAL','20 daño base ×1.2 = 24; Poise Count 3 → 2.');setTimeout(()=>c.remove(),1250)}
const DEMOS={hud:demoHud,sp:demoSp,threshold:demoThreshold,coin:demoCoin,clash:demoClash,onhit:demoOnHit,burn:demoBurn,bleed:demoBleed,sinking:demoSinking,tremor:demoTremor,poise:demoPoise};
async function play(name){reset();const my=run;const fn=DEMOS[name]||demoHud;try{await fn(my);return{ok:true,name}}catch(error){console.error('[CodexStage]',error);emit('ERROR DE DEMO',error?.message||String(error));return{ok:false,name,error:String(error)}}}
window.CodexStage={ready:true,reset,play,getState:()=>JSON.parse(JSON.stringify(state))};rebuild();parent.postMessage({type:'codex-stage-ready'},'*');
})();
</script>
</body>
</html>
