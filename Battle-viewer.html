<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luminous Combat v0.7.3</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#050010;color:#d8cbb7;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase}</style>
</head>
<body>
<div id="boot">Loading Luminous Combat v0.7.3…</div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream!=="function")throw new Error("DECOMPRESSION_STREAM_UNAVAILABLE");
    const urls=[
      "combat/combat-v073-live.bundle.part01",
      "combat/combat-v073-live.bundle.part02",
      "combat/combat-v073-live.bundle.part03",
      "combat/combat-v073-live.bundle.part04",
      "combat/combat-v073-live.bundle.part05",
      "combat/combat-v073-live.bundle.part06",
      "combat/repair/combat-v073-live.bundle.part07.r1",
      "combat/repair/combat-v073-live.bundle.part07.r2",
      "combat/repair/combat-v073-live.bundle.part07.r3",
      "combat/combat-v073-live.bundle.part08",
      "combat/combat-v073-live.bundle.part09",
      "combat/combat-v073-live.bundle.part10",
      "combat/combat-v073-live.bundle.part11"
    ];
    const responses=await Promise.all(urls.map(url=>fetch(url,{cache:"no-cache"})));
    const failed=responses.find(response=>!response.ok);
    if(failed)throw new Error(`COMBAT_BUNDLE_HTTP_${failed.status}`);
    const encoded=(await Promise.all(responses.map(response=>response.text()))).join("").replace(/\s+/g,"");
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    let html=await new Response(stream).text();

    const cancelNeedle="setStatus(`READY CANCELADO · Puedes corregir las acciones del Turn ${round}`);\n    return;";
    const readyNeedle="planReady=true;\n  ready.textContent='CANCEL READY';";
    if(!html.includes(cancelNeedle)||!html.includes(readyNeedle))throw new Error("COMBAT_READY_BRIDGE_PATCH_MISSING");
    html=html.replace(cancelNeedle,"setStatus(`READY CANCELADO · Puedes corregir las acciones del Turn ${round}`);\n    window.dispatchEvent(new CustomEvent('luminous:combat073-plan-ready-change',{detail:{version:'0.7.3',playerId:PLAYER_ID,round,ready:false,plans:JSON.parse(JSON.stringify(plannedActions))}}));\n    return;");
    html=html.replace(readyNeedle,"planReady=true;\n  window.dispatchEvent(new CustomEvent('luminous:combat073-plan-ready-change',{detail:{version:'0.7.3',playerId:PLAYER_ID,round,ready:true,plans:JSON.parse(JSON.stringify(plannedActions))}}));\n  ready.textContent='CANCEL READY';");

    // Live multiplayer authority patch: remote human Players are not local AI.
    const liveControlNeedle=`    unit.controlled=unit.id===PLAYER_ID?'player':'ai';
    unit.focusMenu=unit.id===PLAYER_ID;`;
    const liveControlPatch=`    unit.controlled=payload.viewerRole==='dm'?(unit.controlled==='ai'?'ai':'remote'):(unit.id===PLAYER_ID?'player':(unit.controlled==='remote'?'remote':'ai'));
    unit.focusMenu=payload.viewerRole!=='dm'&&unit.id===PLAYER_ID;`;
    const liveAllPlansNeedle="Object.values(combatData).filter(unit=>unit.controlled==='ai').forEach(unit=>{";
    const liveAllPlansPatch="Object.values(combatData).filter(unit=>unit.controlled==='ai'||unit.controlled==='remote').forEach(unit=>{";
    const liveArrowNeedle="Object.values(combatData).filter(unit=>unit.controlled==='ai'&&isUnitTargetable(unit)).forEach(unit=>{";
    const liveArrowPatch="Object.values(combatData).filter(unit=>(unit.controlled==='ai'||unit.controlled==='remote')&&isUnitTargetable(unit)).forEach(unit=>{";
    const livePlanRenderNeedle="function renderTargetArrows(){\n  const overlay=$('target-intent-overlay');";
    const livePlanRenderPatch="function renderTargetArrows(){\n  if(window.LuminousCombatLiveMode){const livePlanSignature=JSON.stringify([round,planReady,plannedActions]);if(renderTargetArrows.__luminousLivePlanSignature!==livePlanSignature){renderTargetArrows.__luminousLivePlanSignature=livePlanSignature;window.dispatchEvent(new CustomEvent('luminous:combat073-plan-change',{detail:{version:'0.7.3',playerId:PLAYER_ID,round,ready:planReady,plans:JSON.parse(JSON.stringify(plannedActions))}}))}}\n  const overlay=$('target-intent-overlay');";
    const liveNeedles=[liveControlNeedle,liveAllPlansNeedle,liveArrowNeedle,livePlanRenderNeedle];
    if(liveNeedles.some(needle=>!html.includes(needle)))throw new Error("COMBAT_LIVE_REMOTE_CONTROL_PATCH_MISSING");
    html=html.replace(liveControlNeedle,liveControlPatch)
      .replace(liveAllPlansNeedle,liveAllPlansPatch)
      .replace(liveArrowNeedle,liveArrowPatch)
      .replace(livePlanRenderNeedle,livePlanRenderPatch);

    // Combat-iframe-only renderer patch. It never installs hooks in Theatre runtime code.
    // Mobile/low-power clients keep DOM/CSS sprite compositing and reserve WebGL2 for VFX.
    // The DM always uses DOM for battlefield base layers and WebGL only for arrows/VFX;
    // this prevents an active-but-black WebGL canvas from hiding the Battle from the observer.
    const webglStateNeedle=`const particles=[];
  let cssW=0,cssH=0,dpr=1,lastFrame=0,enabled=true;`;
    const webglStatePatch=`const particles=[];
  const coarsePointer=window.matchMedia?.('(pointer:coarse)')?.matches===true;
  const lowPowerDevice=coarsePointer||((navigator.hardwareConcurrency||8)<=4)||((navigator.deviceMemory||8)<=4);
  const domSpriteMode=lowPowerDevice;
  const intentPathCache=new WeakMap();
  let cssW=0,cssH=0,dpr=1,lastFrame=0,enabled=true;`;
    const webglResizeNeedle="const w=Math.max(1,host.clientWidth||innerWidth),h=Math.max(1,host.clientHeight||innerHeight),nextDpr=Math.min(2,window.devicePixelRatio||1);";
    const webglResizePatch="const w=Math.max(1,host.clientWidth||innerWidth),h=Math.max(1,host.clientHeight||innerHeight),dprCap=lowPowerDevice?1:1.5,nextDpr=Math.min(dprCap,window.devicePixelRatio||1);";
    const webglTextureCacheNeedle="if(entry){if(entry.ready&&onReady)onReady(entry);return entry}";
    const webglTextureCachePatch="if(entry)return entry";
    const webglBackgroundNeedle="const bg=requestTexture(BG_URL,()=>host.classList.add('webgl2-background-ready'));";
    const webglBackgroundPatch="const bg=requestTexture(BG_URL,()=>{if(host.dataset.viewerRole!=='dm')host.classList.add('webgl2-background-ready');ensureFrame()});";
    const webglSpriteNeedle="const entry=requestTexture(url,()=>img.classList.add('webgl2-texture-backed'));";
    const webglSpritePatch="const entry=requestTexture(url,()=>{if(host.dataset.viewerRole!=='dm')img.classList.add('webgl2-texture-backed');ensureFrame()});";
    const webglRenderSpritesNeedle=`function renderSprites(){
    const rows=Array.from(document.querySelectorAll('.sprite-img')).map(img=>{`;
    const webglRenderSpritesPatch=`function renderSprites(){
    if(domSpriteMode||host.dataset.viewerRole==='dm')return;
    const rows=Array.from(document.querySelectorAll('.sprite-img')).map(img=>{`;
    const webglIntentNeedle="const local=parsePath(path.getAttribute('d')),tone=intentToneFromClass(path),color=[...intentColors[tone]],secondary=path.classList.contains('atk-weight-secondary');color[3]*=opacity;";
    const webglIntentPatch="const d=path.getAttribute('d')||'';let cached=intentPathCache.get(path);if(!cached||cached.d!==d){cached={d,points:parsePath(d)};intentPathCache.set(path,cached)}const local=cached.points,tone=intentToneFromClass(path),color=[...intentColors[tone]],secondary=path.classList.contains('atk-weight-secondary');color[3]*=opacity;";
    const webglBurstNeedle="particles.push({x,y,kind,range,start:performance.now(),life:310,seed:Math.random()*1000})";
    const webglBurstPatch="particles.push({x,y,kind,range,start:performance.now(),life:310,seed:Math.random()*1000});ensureFrame(340)";
    const webglParticleRaysNeedle="const rays=p.range?7:10;for(let r=0;r<rays;r++){";
    const webglParticleRaysPatch="const rays=p.range?(lowPowerDevice?4:7):(lowPowerDevice?6:10);for(let r=0;r<rays;r++){";
    const webglFrameNeedle=`let rafId=0;
  function frame(now){
    rafId=0;if(!enabled)return;resize();gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    renderBackground();renderSprites();renderIntentArrows();renderParticles(now);
    lastFrame=now;if(enabled&&!rafId)rafId=requestAnimationFrame(frame)
  }
  function ensureFrame(){if(enabled&&!rafId)rafId=requestAnimationFrame(frame)}

  host.classList.add('webgl2-renderer-ready');
  ensureFrame();`;
    const webglFramePatch=`let rafId=0,dirty=true,continuousUntil=0,surfaceActive=true,parentVisibilityObserver=null,cameraTransitionActive=false;
  function readSurfaceActive(){
    if(document.hidden)return false;
    try{
      const frameEl=window.frameElement;if(!frameEl||window.parent===window)return true;
      const rect=frameEl.getBoundingClientRect();if(rect.width<2||rect.height<2)return false;
      let node=frameEl;
      while(node&&node.nodeType===1){const style=parent.getComputedStyle(node);if(style.display==='none'||style.visibility==='hidden')return false;node=node.parentElement}
      return true
    }catch(_){return !document.hidden}
  }
  function syncSurfaceActive(){
    const next=readSurfaceActive();if(next===surfaceActive)return;
    surfaceActive=next;dirty=true;
    if(!surfaceActive){
      cameraTransitionActive=false;continuousUntil=0;
      if(rafId){cancelAnimationFrame(rafId);rafId=0}
    }else ensureFrame(100)
  }
  function bindParentVisibility(){
    try{
      const frameEl=window.frameElement;if(!frameEl||window.parent===window||!parent.MutationObserver)return;
      parentVisibilityObserver=new parent.MutationObserver(syncSurfaceActive);
      let node=frameEl;
      while(node&&node.nodeType===1){parentVisibilityObserver.observe(node,{attributes:true,attributeFilter:['class','style','aria-hidden']});node=node.parentElement}
    }catch(_){}
  }
  function needsContinuous(now){return surfaceActive&&!document.hidden&&(particles.length>0||host.classList.contains('round-running')||cameraTransitionActive||now<continuousUntil)}
  function frame(now){
    rafId=0;if(!enabled)return;
    if(!surfaceActive){dirty=true;return}
    const continuous=needsContinuous(now);if(!dirty&&!continuous)return;
    dirty=false;resize();gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    if(host.dataset.viewerRole!=='dm')renderBackground();renderSprites();renderIntentArrows();renderParticles(now);
    lastFrame=now;if(enabled&&(dirty||needsContinuous(now))&&!rafId)rafId=requestAnimationFrame(frame)
  }
  function ensureFrame(animateMs=0){
    dirty=true;if(animateMs>0)continuousUntil=Math.max(continuousUntil,performance.now()+animateMs);
    if(enabled&&surfaceActive&&!rafId)rafId=requestAnimationFrame(frame)
  }
  function handleCameraTransition(event){
    if(event.target!==field||event.propertyName!=='transform')return;
    if(event.type==='transitionrun'||event.type==='transitionstart')cameraTransitionActive=true;
    else cameraTransitionActive=false;
    ensureFrame()
  }
  field.addEventListener('transitionrun',handleCameraTransition);
  field.addEventListener('transitionstart',handleCameraTransition);
  field.addEventListener('transitionend',handleCameraTransition);
  field.addEventListener('transitioncancel',handleCameraTransition);
  const webglMutationObserver=new MutationObserver(mutations=>{
    let animate=false;
    for(const mutation of mutations){
      if(mutation.type==='attributes'&&(mutation.attributeName==='class'||mutation.attributeName==='style')){animate=true;break}
    }
    ensureFrame(animate&&!host.classList.contains('round-running')?140:0)
  });
  webglMutationObserver.observe(host,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','src','d','cx','cy']});
  const webglResizeObserver=typeof ResizeObserver==='function'?new ResizeObserver(()=>ensureFrame(120)):null;
  webglResizeObserver?.observe(host);if(field!==host)webglResizeObserver?.observe(field);
  window.addEventListener('resize',()=>ensureFrame(180),{passive:true});
  window.addEventListener('orientationchange',()=>ensureFrame(220),{passive:true});
  document.addEventListener('visibilitychange',()=>{syncSurfaceActive();if(surfaceActive)ensureFrame(100)});
  bindParentVisibility();surfaceActive=readSurfaceActive();

  host.dataset.webglSpriteMode=domSpriteMode?'dom-hybrid':'webgl';
  host.dataset.webglQuality=lowPowerDevice?'low-power':'full';
  host.classList.add('webgl2-renderer-ready');
  ensureFrame();`;
    const webglApiNeedle="version:'0.8.0',";
    const webglApiPatch="version:'0.8.3-review-fixes',requestRender:ensureFrame,renderMode:()=>rafId?'active':'idle',renderDpr:()=>dpr,spriteMode:()=>domSpriteMode?'dom-hybrid':'webgl',qualityMode:()=>lowPowerDevice?'low-power':'full',surfaceActive:()=>surfaceActive,";
    const webglNeedles=[webglStateNeedle,webglResizeNeedle,webglTextureCacheNeedle,webglBackgroundNeedle,webglSpriteNeedle,webglRenderSpritesNeedle,webglIntentNeedle,webglBurstNeedle,webglParticleRaysNeedle,webglFrameNeedle,webglApiNeedle];
    if(webglNeedles.some(needle=>!html.includes(needle)))throw new Error("COMBAT_WEBGL_PERF_PATCH_MISSING");
    html=html.replace(webglStateNeedle,webglStatePatch)
      .replace(webglResizeNeedle,webglResizePatch)
      .replace(webglTextureCacheNeedle,webglTextureCachePatch)
      .replace(webglBackgroundNeedle,webglBackgroundPatch)
      .replace(webglSpriteNeedle,webglSpritePatch)
      .replace(webglRenderSpritesNeedle,webglRenderSpritesPatch)
      .replace(webglIntentNeedle,webglIntentPatch)
      .replace(webglBurstNeedle,webglBurstPatch)
      .replace(webglParticleRaysNeedle,webglParticleRaysPatch)
      .replace(webglFrameNeedle,webglFramePatch)
      .replace(webglApiNeedle,webglApiPatch);

    html=html.replace("</body>",'<script src="js/combat-v073-plan-sync.js"><\/script><script src="js/combat-v073-remote-intents.js"><\/script><script src="js/combat-v073-camera-controls.js"><\/script><script src="js/combat-v073-dm-setup.js"><\/script><script src="js/combat-v073-speed-authority.js"><\/script><script src="js/combat-v073-dm-observer.js"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error("[Luminous Combat Bootstrap]",error);
    const boot=document.getElementById("boot");
    if(boot)boot.textContent=`Combat failed to load: ${error?.message||error}`;
  }
})();
</script>
</body>
</html>
