<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Luminous Lab · Crystal Cave</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07060b;color:#eee;font:13px system-ui}#view{width:100%;height:100%;display:block}
#hud{position:fixed;z-index:5;left:12px;top:12px;padding:10px 12px;border:1px solid #ffffff25;border-radius:10px;background:#0d0b12df;backdrop-filter:blur(8px)}
#hud b{display:block}.muted{opacity:.68}.seed{font-family:monospace;color:#f4c8ff}.row{display:flex;gap:6px;margin-top:8px}button{border:1px solid #ffffff2a;background:#211c2b;color:#fff;border-radius:7px;padding:7px 9px}
#status{position:fixed;right:12px;bottom:12px;background:#0d0b12d8;border-radius:8px;padding:8px 10px;font-size:11px}
</style></head><body><canvas id="view"></canvas>
<div id="hud"><b>CRYSTAL CAVE · PROCEDURAL MAP MODULE</b><span class="muted">GameRuntime + MapSystem · chunks cercanos</span><div class="row"><button id="regen">Regenerar</button><button id="newSeed">Nueva seed</button></div><span>Seed: <span id="seed" class="seed"></span> · WASD</span></div><div id="status">iniciando…</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { GameEngine } from "../../src/core/GameEngine.js";
import { GameRuntime } from "../../src/core/GameRuntime.js";
import { createCrystalCaveDefinition } from "../../src/map/procedural/CrystalCaveGenerator.js";

const canvas=document.querySelector("#view"),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x07060b);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x09070e,.009);
const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,500);camera.position.set(0,34,38);
scene.add(new THREE.HemisphereLight(0xc8d8ff,0x21172b,1.4));const keyLight=new THREE.DirectionalLight(0xffd7ef,1.15);keyLight.position.set(20,45,10);scene.add(keyLight);
const world=new THREE.Group();scene.add(world);
const avatar=new THREE.Mesh(new THREE.CapsuleGeometry(.7,1.4,4,8),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x333333}));scene.add(avatar);
const floorMat=new THREE.MeshStandardMaterial({color:0x292630,roughness:.98}),wallMat=new THREE.MeshStandardMaterial({color:0x18161d,roughness:1});
const waterMat=new THREE.MeshPhysicalMaterial({color:0x83a9c2,transparent:true,opacity:.55,roughness:.22});
const crystalGeo=new THREE.ConeGeometry(.65,3.2,5);const crystalMats=new Map();
let engine=null,runtime=null,map=null,seed=new URLSearchParams(location.search).get("seed")||String(Math.floor(Math.random()*1e9)),shown=new Map(),keys={};
function mat(hex){if(!crystalMats.has(hex)){const c=new THREE.Color(hex);crystalMats.set(hex,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.38,roughness:.28}))}return crystalMats.get(hex)}
function disposeGroup(g){world.remove(g);g.traverse(o=>{if(o.userData.ownedGeometry)o.geometry?.dispose?.();if(o.userData.ownedMaterial)o.material?.dispose?.()})}
function buildChunk(c){
 const g=new THREE.Group(),s=map.chunkSize,x=c.cx*s,z=c.cz*s;
 if(c.open&&!c.voidPit){const floor=new THREE.Mesh(new THREE.PlaneGeometry(s*.98,s*.98,4,4),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(x,0,z);g.add(floor)}
 if(c.voidPit){const rim=new THREE.Mesh(new THREE.TorusGeometry(s*.27,1.1,8,24),wallMat);rim.rotation.x=Math.PI/2;rim.position.set(x,.25,z);g.add(rim)}
 if(!c.open){const rock=new THREE.Mesh(new THREE.BoxGeometry(s*.94,8,s*.94),wallMat);rock.position.set(x,4,z);g.add(rock)}
 if(c.water&&!c.voidPit){const w=new THREE.Mesh(new THREE.CircleGeometry(s*.31,28),waterMat);w.rotation.x=-Math.PI/2;w.position.set(x,.2,z);g.add(w)}
 for(const q of c.crystals){const m=new THREE.Mesh(crystalGeo,mat(q.color));m.position.set(q.x,1.3,q.z);m.scale.setScalar(q.scale);m.rotation.z=q.lean;g.add(m)}
 world.add(g);return g
}
function syncChunks(){const cells=map.chunksAround(avatar.position),keep=new Set(cells.map(c=>c.cx+","+c.cz));for(const c of cells){const k=c.cx+","+c.cz;if(!shown.has(k))shown.set(k,buildChunk(c))}for(const[k,g]of shown)if(!keep.has(k)){disposeGroup(g);shown.delete(k)}document.querySelector("#status").textContent="Map authority: "+runtime.snapshot().map.authority+" · "+shown.size+" chunks activos";}
async function boot(){
 for(const g of shown.values())disposeGroup(g);shown.clear();engine?.dispose?.();engine=new GameEngine();runtime=new GameRuntime({engine}).mount();
 runtime.registerMap(createCrystalCaveDefinition({id:"crystal-cave-lab",seed,bounds:{minX:-160,maxX:160,minZ:-160,maxZ:160},chunkSize:24,activeRadius:2,hydrology:{type:"lake"}}));
 await runtime.loadMap("crystal-cave-lab");map=runtime.map.active.data;
 const spawn=map.chunksAround({x:0,z:0},2).find(c=>c.open&&!c.voidPit);avatar.position.set((spawn?.cx||0)*map.chunkSize,1.3,(spawn?.cz||0)*map.chunkSize);
 document.querySelector("#seed").textContent=seed;syncChunks();engine.start();
}
document.querySelector("#regen").onclick=boot;document.querySelector("#newSeed").onclick=()=>{seed=String(Math.floor(Math.random()*1e9));history.replaceState(null,"","?seed="+seed);boot()};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let last=performance.now();function loop(t){requestAnimationFrame(loop);if(!map)return;const dt=Math.min(.04,(t-last)/1000);last=t;const from={...avatar.position},p={x:avatar.position.x+(keys.d-keys.a)*10*dt,y:avatar.position.y,z:avatar.position.z+(keys.s-keys.w)*10*dt};const n=map.resolveMovement({from,proposed:p});avatar.position.set(n.x,n.y+1.3,n.z);camera.position.x+=(avatar.position.x-camera.position.x)*.08;camera.position.z+=(avatar.position.z+32-camera.position.z)*.08;camera.lookAt(avatar.position.x,0,avatar.position.z);syncChunks();renderer.render(scene,camera)}boot();requestAnimationFrame(loop);
</script></body></html>
