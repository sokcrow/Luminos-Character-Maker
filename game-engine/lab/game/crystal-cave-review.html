<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crystal Cave · PR819</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080910}#c{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:10px;left:10px;color:#fff;background:#000a;padding:8px 10px;border-radius:8px;font:12px system-ui;z-index:2}.pad{position:fixed;bottom:18px;left:18px;display:grid;grid-template-columns:52px 52px 52px;gap:5px;z-index:3}.pad button{height:52px;border:0;border-radius:12px;background:#ffffff28;color:white;font-size:22px}.pad .u{grid-column:2}.pad .l{grid-column:1}.pad .d{grid-column:2}.pad .r{grid-column:3}.fs{position:fixed;right:14px;top:12px;z-index:3;padding:10px;border:0;border-radius:9px}</style></head><body><div class="hud"><b>PR 819 · CRYSTAL CAVE</b><br><span id="s">cargando mapa procedural…</span></div><button class="fs" id="fs">Horizontal</button><canvas id="c"></canvas><div class="pad"><button class="u">▲</button><button class="l">◀</button><button class="d">▼</button><button class="r">▶</button></div><script type="module">import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";import{createCrystalCaveData}from"../../src/map/procedural/CrystalCaveGenerator.js";const map=createCrystalCaveData({seed:"pr819-review",chunkSize:24,activeRadius:2});const scene=new THREE.Scene();scene.background=new THREE.Color(0x080910);scene.fog=new THREE.FogExp2(0x080910,.018);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({canvas:document.querySelector("#c"),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);scene.add(new THREE.HemisphereLight(0xaac8ff,0x251d2b,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(20,35,10);scene.add(dl);const world=new THREE.Group();scene.add(world);const floorMat=new THREE.MeshStandardMaterial({color:0x343746,roughness:.92});const rockMat=new THREE.MeshStandardMaterial({color:0x20222b,roughness:1});const waterMat=new THREE.MeshPhysicalMaterial({color:0x386f92,transparent:true,opacity:.72,roughness:.22,metalness:0});const geoFloor=new THREE.BoxGeometry(23,.8,23),geoRock=new THREE.DodecahedronGeometry(7,0);function build(){world.clear();for(const cell of map.chunksAround(player.position,2)){const x=cell.cx*24,z=cell.cz*24;if(cell.open&&!cell.voidPit){const f=new THREE.Mesh(geoFloor,floorMat);f.position.set(x,-.45,z);world.add(f);if(cell.water){const w=new THREE.Mesh(new THREE.CircleGeometry(9,24),waterMat);w.rotation.x=-Math.PI/2;w.position.set(x,.04,z);world.add(w)}}else{for(let i=0;i<5;i++){const r=new THREE.Mesh(geoRock,rockMat);const a=i/5*Math.PI*2;r.position.set(x+Math.cos(a)*8,4,z+Math.sin(a)*8);r.scale.set(1.2,1.1+((i*3)%4)*.2,1.2);world.add(r)}}for(const q of cell.crystals){const g=new THREE.ConeGeometry(1.1*q.scale,5*q.scale,6);const m=new THREE.MeshStandardMaterial({color:q.color,emissive:q.color,emissiveIntensity:.22,roughness:.35});const c=new THREE.Mesh(g,m);c.position.set(q.x,2.2*q.scale,q.z);c.rotation.z=q.lean;world.add(c)}}}const player=new THREE.Mesh(new THREE.CapsuleGeometry(1.2,2.4,6,10),new THREE.MeshStandardMaterial({color:0xf4e8cf}));player.position.set(0,1,0);scene.add(player);let last="";function move(dx,dz){const p=map.resolveMovement({from:player.position,proposed:{x:player.position.x+dx,y:0,z:player.position.z+dz}});player.position.set(p.x,p.y+1.8,p.z);const k=map.chunkAt(p.x,p.z);const kk=k.cx+","+k.cz;if(kk!==last){last=kk;build()}document.querySelector("#s").textContent="seed pr819-review · chunk "+kk}document.querySelector(".u").onclick=()=>move(0,-3);document.querySelector(".d").onclick=()=>move(0,3);document.querySelector(".l").onclick=()=>move(-3,0);document.querySelector(".r").onclick=()=>move(3,0);addEventListener("keydown",e=>{if(e.key==="w"||e.key==="ArrowUp")move(0,-3);if(e.key==="s"||e.key==="ArrowDown")move(0,3);if(e.key==="a"||e.key==="ArrowLeft")move(-3,0);if(e.key==="d"||e.key==="ArrowRight")move(3,0)});document.querySelector("#fs").onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation?.lock?.("landscape")}catch(e){}};function loop(){requestAnimationFrame(loop);camera.position.lerp(new THREE.Vector3(player.position.x+16,player.position.y+24,player.position.z+22),.08);camera.lookAt(player.position);renderer.render(scene,camera)}addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});build();move(0,0);loop();</script></body></html>
