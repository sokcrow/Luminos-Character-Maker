<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Luminous · Early Alpha Visualizer</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0e1418; color: #eef2f5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0e1418; }
    body { min-height: 100vh; overflow: hidden; }
    button { font: inherit; }
    .shell { position: relative; min-height: 100vh; background: #0e1418; }
    .viewport { position: absolute; inset: 0; min-height: 100vh; background: linear-gradient(#9db7c2,#60757e); overflow: hidden; }
    .viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .viewport[data-renderer-error="true"]::after { content: "No se pudo iniciar el renderer 3D"; position: absolute; inset: 0; display: grid; place-items: center; color: #f7d7d7; background: #171b1e; font-weight: 700; }
    .topbar { position: absolute; z-index: 5; top: 14px; left: 14px; right: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; pointer-events: none; }
    .brand, .controls, .hud, .inventory-panel, .inventory-toggle { border: 1px solid rgba(255,255,255,.16); background: rgba(12,18,22,.86); backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,.22); }
    .brand { padding: 10px 12px; border-radius: 10px; }
    .brand strong { display: block; font-size: .92rem; }
    .brand span { display: block; margin-top: 3px; color: #a8b8c2; font-size: .72rem; }
    .controls { padding: 8px 10px; border-radius: 10px; color: #dfe8ed; font-size: .75rem; }
    kbd { border: 1px solid #62727c; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: rgba(255,255,255,.06); font: .72rem ui-monospace,monospace; }
    .hud { position: absolute; z-index: 5; right: 14px; bottom: 14px; width: min(330px,calc(100vw - 28px)); max-height: 31vh; padding: 12px; border-radius: 10px; overflow: auto; pointer-events: none; }
    .hud h2 { margin: 0 0 8px; font-size: .82rem; }
    .hud-line { margin: 6px 0; padding: 7px 8px; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; background: rgba(255,255,255,.035); font: .72rem ui-monospace,monospace; }
    pre { margin: 8px 0 0; padding: 8px; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; background: rgba(0,0,0,.18); overflow: auto; font: .66rem/1.4 ui-monospace,monospace; white-space: pre-wrap; }
    .crosshair { position: absolute; z-index: 4; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 999px; background: rgba(255,255,255,.46); box-shadow: 0 0 0 1px rgba(0,0,0,.25); pointer-events: none; }
    .inventory-toggle { position: absolute; z-index: 8; left: 14px; bottom: 14px; border-radius: 10px; padding: 10px 13px; color: #eef2f5; cursor: pointer; }
    .inventory-toggle:hover { background: rgba(26,38,46,.94); }
    .inventory-panel { position: absolute; z-index: 7; left: 14px; top: 78px; bottom: 64px; width: min(430px,calc(100vw - 28px)); padding: 12px; border-radius: 12px; overflow: auto; }
    .inventory-panel[hidden] { display: none; }
    .inventory-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .inventory-panel-header h2 { margin: 0; font-size: .95rem; }
    .inventory-close { border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: inherit; border-radius: 7px; padding: 5px 8px; cursor: pointer; }
    .inventory-section { margin-top: 14px; }
    .inventory-section-title { display: flex; justify-content: space-between; gap: 8px; color: #cdd9df; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 7px; }
    .inventory-list { display: grid; gap: 7px; }
    .inventory-item { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; background: rgba(255,255,255,.035); }
    .inventory-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 7px; background: rgba(255,255,255,.055); overflow: hidden; font-weight: 800; color: #9db1bc; }
    .inventory-icon img { width: 100%; height: 100%; object-fit: contain; }
    .inventory-item-info { min-width: 0; display: grid; gap: 3px; }
    .inventory-item-info strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .78rem; }
    .inventory-item-info span { color: #9eb0ba; font-size: .66rem; }
    .inventory-item-actions { display: flex; flex-direction: column; gap: 4px; }
    .inventory-action { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #eef2f5; border-radius: 6px; padding: 5px 7px; cursor: pointer; font-size: .65rem; }
    .inventory-action:hover { background: rgba(255,255,255,.12); }
    .inventory-empty { padding: 10px; border: 1px dashed rgba(255,255,255,.14); border-radius: 8px; color: #80929c; font-size: .72rem; text-align: center; }
    .equipment-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
    .equipment-slot { min-height: 78px; padding: 7px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: rgba(255,255,255,.03); display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 5px 7px; align-items: center; }
    .equipment-slot .inventory-icon { width: 34px; height: 34px; }
    .equipment-slot-label { grid-column: 1 / -1; color: #9fb0ba; font-size: .62rem; text-transform: uppercase; letter-spacing: .05em; }
    .equipment-slot strong { font-size: .7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .equipment-slot .inventory-action { grid-column: 1 / -1; }
    .equipment-slot-empty { grid-column: 1 / -1; color: #687982; font-size: .68rem; }
    .inventory-event { min-height: 18px; margin-top: 10px; color: #b7c8d1; font: .66rem ui-monospace,monospace; }
    @media (max-width: 720px) {
      .topbar { align-items: flex-start; }
      .controls { display: none; }
      .brand { max-width: calc(100vw - 28px); }
      .hud { display: none; }
      .inventory-panel { top: 70px; right: 10px; left: 10px; bottom: 62px; width: auto; }
      .inventory-toggle { left: 10px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="viewport" id="visualizerViewport" aria-label="Mundo 3D jugable"></section>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="topbar">
      <div class="brand">
        <strong>Luminous · Early Alpha</strong>
        <span data-renderer-status>Iniciando renderer 3D…</span>
      </div>
      <div class="controls"><kbd>WASD</kbd> / flechas · <kbd>I</kbd> inventario · cámara 2.5D</div>
    </div>

    <button class="inventory-toggle" type="button" data-inventory-toggle>Inventario <kbd>I</kbd></button>
    <aside class="inventory-panel" data-inventory-panel aria-label="Inventario y equipamiento del jugador">
      <div class="inventory-panel-header">
        <h2>Inventario / Equipamiento</h2>
        <button class="inventory-close" type="button" data-inventory-close aria-label="Cerrar inventario">×</button>
      </div>
      <section class="inventory-section">
        <div class="inventory-section-title"><span>Equipamiento</span><span>Runtime real</span></div>
        <div class="equipment-grid" data-equipment-slots></div>
      </section>
      <section class="inventory-section">
        <div class="inventory-section-title"><span>Activo</span><span data-active-count>0/0</span></div>
        <div class="inventory-list" data-inventory-active></div>
      </section>
      <section class="inventory-section">
        <div class="inventory-section-title"><span>Alijo</span><span data-stash-count>0/0</span></div>
        <div class="inventory-list" data-inventory-stash></div>
      </section>
      <div class="inventory-event" data-inventory-event>Listo para probar inventario.</div>
    </aside>

    <aside class="hud" aria-label="HUD runtime">
      <h2>Runtime modular</h2>
      <div class="hud-line" data-hud-status>Iniciando runtime…</div>
      <div class="hud-line" data-hud-map>Sin mapa activo</div>
      <div class="hud-line" data-hud-unit>Sin Unit objetivo</div>
      <pre data-hud-json aria-live="polite">Cargando contratos…</pre>
    </aside>
  </main>
  <script src="../../js/anatomy-equipment-engine.js"></script>
  <script src="../../js/item-runtime-engine.js"></script>
  <script src="../../js/item-icon-registry.js"></script>
  <script src="../../js/item-inventory-runtime.js"></script>
  <script src="../../js/item-equipment-bridge.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
