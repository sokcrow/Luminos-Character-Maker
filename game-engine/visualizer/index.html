<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Luminous · Early Alpha Visualizer</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101418; color: #eef2f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #2b343c; background: #151b20; }
    header strong { font-size: 0.95rem; }
    header span { color: #9aa9b5; font-size: 0.78rem; }
    main { display: grid; grid-template-columns: minmax(0,1fr) minmax(300px,380px); min-height: 0; }
    .viewport { position: relative; min-height: 65vh; display: grid; place-items: center; background: radial-gradient(circle at center,#1d272e,#0d1114 70%); overflow: hidden; }
    .viewport::before { content: "VISUALIZER HOST"; letter-spacing: 0.2em; color: #52616c; font: 600 0.72rem ui-monospace,monospace; }
    .hud { padding: 16px; border-left: 1px solid #2b343c; background: #12171b; overflow: auto; }
    .hud h2 { margin: 0 0 12px; font-size: 0.9rem; }
    .hud-line { margin: 8px 0; padding: 9px 10px; border: 1px solid #303a42; border-radius: 7px; background: #171e23; font: 0.78rem ui-monospace,monospace; }
    pre { margin: 12px 0 0; padding: 12px; border: 1px solid #303a42; border-radius: 7px; background: #0d1114; overflow: auto; font: 0.72rem/1.45 ui-monospace,monospace; }
    kbd { border: 1px solid #55636d; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; font: 0.72rem ui-monospace,monospace; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } .hud { border-left: 0; border-top: 1px solid #2b343c; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <strong>Luminous · Early Alpha Visualizer</strong>
      <span>Runtime modular · <kbd>WASD</kbd> / flechas</span>
    </header>
    <main>
      <section class="viewport" id="visualizerViewport" aria-label="Viewport del visualizador"></section>
      <aside class="hud" aria-label="HUD de diagnóstico">
        <h2>HUD Runtime</h2>
        <div class="hud-line" data-hud-status>Iniciando runtime…</div>
        <div class="hud-line" data-hud-map>Sin mapa activo</div>
        <div class="hud-line" data-hud-unit>Sin Unit objetivo</div>
        <pre data-hud-json aria-live="polite">Cargando contratos…</pre>
      </aside>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
