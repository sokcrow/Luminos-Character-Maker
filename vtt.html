<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa táctico deshabilitado</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #c49a00;
      font-family: "Share Tech Mono", monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    main {
      max-width: 720px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 12px;
      color: #ff334d;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      color: #c7bda8;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <h1>Mapa táctico temporalmente deshabilitado</h1>
    <p>Esta versión del VTT fue retirada del flujo activo mientras se prepara su reemplazo. No se cargarán runtimes, listeners, Firebase ni procesos de render del mapa antiguo.</p>
  </main>
</body>
</html>
