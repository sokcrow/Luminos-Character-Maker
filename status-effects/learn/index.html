<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luminous · Simulaciones de combate</title><style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700;900&display=swap');:root{color-scheme:dark;--g:#ffe877;--hp:#ff4a22;--sp:#88eeff;--b:#6e4b28;--f:'Bebas Neue','Arial Narrow',sans-serif}*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#eee6d9;font-family:Roboto,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.lesson{position:relative;height:100vh;display:flex;flex-direction:column;background:linear-gradient(#0d0a07,#050505 78%);border-right:2px solid var(--b);z-index:10}.head{padding:16px;border-bottom:1px solid #392d21}.kick{font:900 9px Roboto;letter-spacing:1.5px;color:#c5a567;text-transform:uppercase}.head h1{margin:5px 0;font:34px/.9 var(--f)}.head p{margin:0;color:#aaa08f;font-size:11px;line-height:1.4}.back{display:inline-block;margin-top:8px;color:#e8d39a;font:900 9px Roboto;text-decoration:none;text-transform:uppercase}.tabs{display:flex;gap:5px;padding:9px;overflow:auto;border-bottom:1px solid #2c251e}.tab{flex:0 0 49px;height:49px;border:1px solid #493927;background:#0b0907;padding:5px;cursor:pointer}.tab img{width:100%;height:100%;object-fit:contain}.tab.on{border-color:var(--g);box-shadow:0 0 9px #ffe87744}.content{flex:1;min-height:0;overflow:auto;padding:13px 15px 120px}.title{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}.title img{width:54px;height:54px;object-fit:contain}.title h2{margin:0;font:28px/.9 var(--f);color:#fff0d8}.title small{color:#918675;font:900 8px Roboto;text-transform:uppercase}.plain{margin:12px 0;padding:10px 11px;border-left:4px solid var(--g);background:#151109;font-size:14px;line-height:1.4}.goal{color:#aaa08f;font-size:10px;line-height:1.45}.compare{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.box{border:1px solid #342b22;background:#090806;padding:7px}.box>b{display:block;color:#81776a;font:900 8px Roboto;text-transform:uppercase;margin-bottom:4px}.metric{display:flex;justify-content:space-between;gap:6px;color:#a99e8e;font-size:9px}.metric strong{font:15px var(--f);font-weight:400;color:#eee1c9}.metric.ch strong{color:var(--g)}.step{border:1px solid #4e3d29;background:#0b0907}.steph{padding:7px 9px;border-bottom:1px solid #34281e;color:#d6bd82;font:900 8px Roboto;text-transform:uppercase}.stepc{padding:9px 10px;font-size:11px;line-height:1.45}.stepc strong{color:var(--g)}.hint{margin-top:6px;color:#948a7d;font-size:9px}.log{display:grid;gap:4px;margin-top:10px}.row{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:5px 6px;background:#0b0a08;border-left:2px solid #403428;color:#827a6e;font-size:9px}.row.cur{border-color:#fff;color:#fff}.row.done{border-color:var(--g);color:#cfc3b0}.row b{font:13px var(--f);color:#baa469}.controls{position:absolute;left:0;right:0;bottom:0;padding:9px 11px 11px;background:linear-gradient(transparent,#050505 22%);border-top:1px solid #30271e;display:grid;grid-template-columns:1fr 1fr;gap:5px}.controls button{min-height:34px;border:1px solid #58442d;background:#0e0a07;color:#eadcc5;cursor:pointer;font:16px var(--f)}.controls .primary{border-color:var(--g);color:var(--g)}.controls .wide{grid-column:1/-1}.controls button:disabled{opacity:.35}.battle{position:relative;overflow:hidden;min-height:100vh;background:linear-gradient(#0002,#0008),url('https://limbuscompany.wiki.gg/images/Battle_Alleyways_of_T_Corp._2_BG.png') center bottom/cover no-repeat}.fighter{position:absolute;bottom:16%;width:270px;height:450px;transform:translateX(-50%)}.ally{left:34%}.enemy{left:70%}.sprite{position:absolute;left:50%;bottom:92px;height:270px;max-width:240px;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 18px 10px #000b)}.name{position:absolute;left:50%;bottom:63px;transform:translateX(-50%);font:18px var(--f);white-space:nowrap;text-shadow:2px 2px #000}.hpbar{position:absolute;left:50%;bottom:39px;width:210px;height:14px;transform:translateX(-50%);background:#1a0806;border:2px solid #0b0504}.hpfill{height:100%;background:var(--hp);transition:width .55s}.thr{position:absolute;top:-5px;width:3px;height:22px;background:#fff;box-shadow:0 0 4px #fff;transition:left .4s}.hpnum{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:41px var(--f);color:var(--hp);text-shadow:3px 3px #000}.sp{position:absolute;right:12px;bottom:43px;width:49px;height:49px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#55aaaa,#113333 80%);border:3px solid #3b2c20;font:29px var(--f)}.statuses{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);display:flex;gap:7px}.status{display:grid;grid-template-columns:17px 40px 17px;align-items:center;justify-items:center;height:44px}.status img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 4px #d63b3b99)}.status.pos img{filter:drop-shadow(0 0 4px #f0d35399)}.status span{font:23px var(--f);text-shadow:1px 2px #000}.pulse{animation:p .45s}.float{position:absolute;z-index:5;left:50%;top:120px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;font:54px var(--f);text-shadow:3px 3px #000;animation:fl 1s forwards}.float img{width:36px;height:36px;object-fit:contain}.stag{position:absolute;left:50%;bottom:80px;width:220px;transform:translateX(-50%);opacity:0}.stag.show{opacity:1;animation:sg .55s}.stag img{width:100%;filter:brightness(0) saturate(100%) invert(86%) sepia(100%) saturate(1800%)}.stxt{position:absolute;left:50%;top:80px;transform:translateX(-50%);font:52px var(--f);color:#ffd400;text-shadow:0 0 14px #ffd400,3px 3px #000;opacity:0}.stxt.show{animation:st 1s}.caption{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:center}.caption div{max-width:730px;padding:9px 13px;background:#050505e9;border-top:2px solid var(--g);font-size:12px;text-align:center}.caption b{color:var(--g)}.flash{animation:fs .7s}@keyframes p{40%{transform:scale(1.2);filter:brightness(1.6)}}@keyframes fl{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.12)}80%{opacity:1;transform:translate(-50%,-28px)}100%{opacity:0;transform:translate(-50%,-48px)}}@keyframes sg{0%{transform:translateX(-50%) scale(.6);opacity:.2}45%{transform:translateX(-50%) scale(1.1);opacity:1}}@keyframes st{15%,70%{opacity:1}100%{opacity:0;transform:translate(-50%,-25px)}}@keyframes fs{35%{filter:brightness(2) drop-shadow(0 0 10px #fff)}}@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:48vh 52vh}.lesson{height:48vh;border-right:0;border-bottom:2px solid var(--b)}.battle{min-height:52vh}.head{padding:8px 11px}.head h1{font-size:24px}.head p,.goal,.compare{display:none}.content{padding:8px 10px 84px}.plain{margin:7px 0;font-size:12px}.fighter{width:185px;height:295px;bottom:9%}.ally{left:29%}.enemy{left:72%}.sprite{height:170px;bottom:72px}.hpbar{width:140px;bottom:35px}.name{bottom:55px;font-size:13px}.hpnum{font-size:29px}.sp{width:37px;height:37px;font-size:22px;right:1px}.status img{width:31px;height:31px}.caption{bottom:6px;left:6px;right:6px}.caption div{font-size:9px}}</style></head><body><main class="app"><aside class="lesson"><header class="head"><div class="kick">Luminous · Learn Lab · alpha v0.7.3</div><h1>Aprende viendo el combate</h1><p>Ejemplos guiados basados en las rutas del motor adjunto. Avanza y mira qué dato cambia.</p><a class="back" href="../">Volver a la referencia</a></header><nav class="tabs" id="tabs"></nav><section class="content"><div class="title"><img id="icon" alt=""><div><h2 id="title"></h2><small id="type"></small></div></div><div class="plain" id="plain"></div><p class="goal" id="goal"></p><div class="compare"><div class="box"><b>Antes</b><div id="before"></div></div><div class="box"><b>Ahora</b><div id="now"></div></div></div><div class="step"><div class="steph" id="steph"></div><div class="stepc" id="stepc"></div></div><div class="log" id="log"></div></section><footer class="controls"><button id="reset">Reiniciar</button><button class="primary" id="next">Siguiente paso</button><button class="wide" id="play">Reproducir completo</button></footer></aside><section class="battle"><div class="fighter ally" id="ally"><img class="sprite" src="https://limbuscompany.wiki.gg/images/LCB_Sinner_Don_Quixote_Idle_Sprite.png?879f2e=&format=original" alt="Don Quixote"><div class="name">Don Quixote</div><div class="hpbar"><div class="hpfill"></div><i class="thr" data-i="0"></i><i class="thr" data-i="1"></i><i class="thr" data-i="2"></i></div><div class="hpnum"></div><div class="sp"></div><div class="statuses"></div><div class="stag"><img src="https://imgur.com/I56BWDC.png" alt=""></div><div class="stxt">STAGGER</div></div><div class="fighter enemy" id="enemy"><img class="sprite" src="https://limbuscompany.wiki.gg/images/8/87/Head_Hooligan_Idle_Sprite.png" alt="Training Dummy"><div class="name">Training Dummy</div><div class="hpbar"><div class="hpfill"></div><i class="thr" data-i="0"></i><i class="thr" data-i="1"></i><i class="thr" data-i="2"></i></div><div class="hpnum"></div><div class="sp"></div><div class="statuses"></div><div class="stag"><img src="https://imgur.com/I56BWDC.png" alt=""></div><div class="stxt">STAGGER</div></div><div class="caption"><div id="caption"><b>Consejo:</b> mira HP, SP, iconos y líneas blancas.</div></div></section></main><script>(()=>{'use strict';const I={burn:'https://imgur.com/L4bRd44.png',bleed:'https://imgur.com/mp9fbme.png',tremor:'https://imgur.com/fuDGjpn.png',sinking:'https://imgur.com/ZnulGzZ.png',poise:'https://imgur.com/KFEmJB5.png',stagger:'https://imgur.com/I56BWDC.png'},B={ally:{hp:176,maxHp:176,sp:0,status:{},thresholds:[70,40,20],used:[],stage:0},enemy:{hp:158,maxHp:158,sp:0,speed:3,speedRange:[1,5],actionSlots:1,offensiveLevel:1,defensiveLevel:1,resistances:'Slash NORMAL · Pierce WEAK · Blunt RESIST',equipment:'Pipe Club · Scrap Token',status:{},thresholds:[70,40,20],used:[],stage:0}};let S,si=0,n=0,busy=false,before;const clone=o=>JSON.parse(JSON.stringify(o)),wait=m=>new Promise(r=>setTimeout(r,m)),pct=u=>u.hp/u.maxHp*100,st=(u,id)=>u.status[id]||null;function resetState(){S=clone(B);render()}function apply(u,id,p,c,type='negative'){u.status[id]={id,potency:p,count:c,type}}function consume(u,id){const x=st(u,id);if(!x)return;x.count=Math.max(0,x.count-1);if(!x.count)delete u.status[id]}function fx(side,amount,icon){const h=document.getElementById(side),e=document.createElement('div');e.className='float';e.innerHTML=`<span>${amount}</span>${icon?`<img src="${icon}" alt="">`:''}`;h.appendChild(e);setTimeout(()=>e.remove(),1050)}function pulse(side,id){requestAnimationFrame(()=>{const e=document.querySelector(`#${side} .status[data-id="${id}"]`);if(e){e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}})}function flash(side,q){const e=document.querySelector(`#${side} ${q}`);if(!e)return;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}function stagger(u,side,i){if(u.used.includes(i))return;u.used.push(i);u.stage=Math.max(u.stage,i+1);const h=document.getElementById(side),a=h.querySelector('.stag'),t=h.querySelector('.stxt');a.classList.remove('show');t.classList.remove('show');void h.offsetWidth;a.classList.add('show');t.classList.add('show')}function setHP(u,side,v,cross=true){const old=pct(u);u.hp=Math.max(0,Math.min(u.maxHp,v));const now=pct(u);if(cross&&now<old)u.thresholds.forEach((t,i)=>{if(old>t&&now<=t&&!u.used.includes(i))stagger(u,side,i)});renderUnit(side,u)}function damage(u,side,a,{cross=true,crit=false,icon=null}={}){const d=Math.max(1,Math.floor(a*(crit?1.2:1)));fx(side,d,icon);setHP(u,side,u.hp-d,cross);return d}function burn(u,side){const x=st(u,'burn');if(!x)return;damage(u,side,x.potency,{cross:false,icon:I.burn});consume(u,'burn');pulse(side,'burn')}function bleed(u,side){const x=st(u,'bleed');if(!x)return;damage(u,side,x.potency,{cross:false,icon:I.bleed});consume(u,'bleed');pulse(side,'bleed')}function sinking(u,side){const x=st(u,'sinking');if(!x)return;u.sp=Math.max(-45,u.sp-x.potency);consume(u,'sinking');renderUnit(side,u);pulse(side,'sinking');flash(side,'.sp')}function tremor(u,side){const x=st(u,'tremor');if(!x)return;const add=x.potency/u.maxHp*100,cur=pct(u);u.thresholds=u.thresholds.map((t,i)=>{if(u.used.includes(i))return t;const z=Math.min(100,t+add);if(cur>t&&cur<=z)stagger(u,side,i);return z});consume(u,'tremor');renderUnit(side,u);pulse(side,'tremor');flash(side,'.hpbar')}function critChance(){return Math.min(100,(st(S.ally,'poise')?.potency||0)*5)}function poise(){damage(S.enemy,'enemy',20,{crit:true});consume(S.ally,'poise');render();pulse('ally','poise')}function statuses(side,u){document.querySelector(`#${side} .statuses`).innerHTML=Object.values(u.status).map(x=>`<div class="status ${x.type==='positive'?'pos':''}" data-id="${x.id}"><span>${x.potency||''}</span><img src="${I[x.id]}" alt="${x.id}"><span>${x.count||''}</span></div>`).join('')}function renderUnit(side,u){const h=document.getElementById(side);h.querySelector('.hpfill').style.width=`${pct(u)}%`;h.querySelector('.hpnum').textContent=Math.round(u.hp);h.querySelector('.sp').textContent=Math.round(u.sp);h.querySelectorAll('.thr').forEach((e,i)=>{e.style.left=`${u.thresholds[i]}%`;e.style.display=u.used.includes(i)?'none':'block'});statuses(side,u)}function render(){renderUnit('ally',S.ally);renderUnit('enemy',S.enemy)}const Q=[{id:'burn',name:'Burn',es:'Quemadura',icon:I.burn,plain:'Hace daño al final del turno.',goal:'Potency es el daño que ocurrirá; Count es cuántas activaciones quedan.',focus:'enemy',steps:[['1 · Aplica Burn','El enemigo recibe <strong>Burn 12 / 3</strong>. Todavía no pierde HP.',()=>{apply(S.enemy,'burn',12,3);render();pulse('enemy','burn')}],['2 · Turn End','Burn inflige <strong>12 de daño fijo</strong> y Count baja de 3 a 2.',async()=>{burn(S.enemy,'enemy');await wait(300);flash('enemy','.hpnum')}]]},{id:'bleed',name:'Bleed',es:'Sangrado',icon:I.bleed,plain:'La unidad sangra cuando lanza una Coin.',goal:'Cada Coin Flip hace daño fijo igual a Potency y consume 1 Count.',focus:'enemy',steps:[['1 · Aplica Bleed','Aplicamos <strong>Bleed 8 / 3</strong>. No hace daño todavía.',()=>{apply(S.enemy,'bleed',8,3);render();pulse('enemy','bleed')}],['2 · Coin Flip','Bleed se activa: <strong>8 HP</strong> y Count baja a 2.',async()=>{bleed(S.enemy,'enemy');await wait(300);flash('enemy','.hpnum')}]]},{id:'tremor',name:'Tremor',es:'Temblor',icon:I.tremor,plain:'Guarda presión para mover las líneas de Stagger.',goal:'Tremor Burst eleva los Thresholds restantes usando Potency; no necesita quitar HP.',focus:'enemy',setup:()=>setHP(S.enemy,'enemy',130,false),steps:[['1 · Acumula Tremor','Aplicamos <strong>Tremor 25 / 2</strong>. Mira la primera línea blanca.',()=>{apply(S.enemy,'tremor',25,2);render();pulse('enemy','tremor')}],['2 · Tremor Burst','La línea sube hasta alcanzar el HP actual y activa <strong>Stagger</strong> sin quitar HP.',async()=>{tremor(S.enemy,'enemy');await wait(300)}]]},{id:'sinking',name:'Sinking',es:'Hundimiento',icon:I.sinking,plain:'Cuando recibe un Hit, pierde SP.',goal:'En una unidad con SP, Potency se convierte en daño de SP y Count se consume.',focus:'enemy',setup:()=>{S.enemy.sp=25;render()},steps:[['1 · Aplica Sinking','El enemigo tiene 25 SP y recibe <strong>Sinking 10 / 2</strong>.',()=>{apply(S.enemy,'sinking',10,2);render();pulse('enemy','sinking')}],['2 · Recibe un Hit','Sinking quita <strong>10 SP</strong>. El HP no cambia y Count baja a 1.',async()=>{sinking(S.enemy,'enemy');await wait(250)}]]},{id:'poise',name:'Poise',es:'Aplomo',icon:I.poise,plain:'Potency aumenta la probabilidad de crítico; Count se gasta al critar.',goal:'La prueba fuerza un crítico para hacerlo visible, pero usa el ×1.2 y consumo de Count del motor.',focus:'ally',steps:[['1 · Aplica Poise','Don recibe <strong>Poise 10 / 3</strong>: 10 Potency representa 50% de probabilidad crítica.',()=>{apply(S.ally,'poise',10,3,'positive');render();pulse('ally','poise')}],['2 · Crítico de prueba','Un golpe base 20 se vuelve <strong>24</strong> por ×1.2. Poise pierde 1 Count.',async()=>{poise();await wait(300);flash('enemy','.hpnum')}]]},{id:'stagger',name:'Stagger',es:'Tambaleo',icon:I.stagger,plain:'Cruzar una línea blanca de HP activa Stagger.',goal:'Los Thresholds son porcentajes del HP máximo y se consumen al cruzarlos.',focus:'enemy',setup:()=>setHP(S.enemy,'enemy',120,false),steps:[['1 · Antes del Threshold','El enemigo está en <strong>120 / 158 HP</strong>, todavía arriba del 70%.',()=>flash('enemy','.hpbar')],['2 · Recibe 20 de daño','El HP cae bajo 70%. La línea se consume y aparece <strong>Stagger</strong>.',async()=>{damage(S.enemy,'enemy',20);await wait(650)}]]}];function snap(s){const u=s.focus==='ally'?S.ally:S.enemy,x=s.id==='stagger'?null:st(u,s.id);return{hp:S.enemy.hp,sp:S.enemy.sp,p:x?.potency??'—',c:x?.count??'—',crit:critChance(),th:S.enemy.thresholds.map(v=>v.toFixed(1)).join(' / '),stag:S.enemy.stage?`Etapa ${S.enemy.stage}`:'No'}}function metrics(s,a,b=null){const r=[];const add=(l,k,v,t='')=>r.push(`<div class="metric${b&&String(b[k])!==String(a[k])?' ch':''}"><span>${l}</span><strong>${v}${t}</strong></div>`);add('HP enemigo','hp',a.hp);if(s.id==='sinking')add('SP enemigo','sp',a.sp);if(s.id==='poise')add('Prob. crítica','crit',a.crit,'%');if(s.id!=='stagger'){add('Potency','p',a.p);add('Count','c',a.c)}if(['tremor','stagger'].includes(s.id)){add('Thresholds','th',a.th);add('Stagger','stag',a.stag)}return r.join('')}function drawLog(){const s=Q[si];document.getElementById('log').innerHTML=s.steps.map((x,i)=>`<div class="row${i<n?' done':i===n?' cur':''}"><b>${String(i+1).padStart(2,'0')}</b><span>${x[0].replace(/^\d+\s*·\s*/,'')}</span></div>`).join('')}function drawState(){const s=Q[si],a=snap(s);document.getElementById('before').innerHTML=metrics(s,before);document.getElementById('now').innerHTML=metrics(s,a,before)}function drawStep(){const s=Q[si],done=n>=s.steps.length,x=s.steps[Math.min(n,s.steps.length-1)];document.getElementById('steph').textContent=done?'Simulación completada':x[0];document.getElementById('stepc').innerHTML=done?'Ya viste el efecto completo. Reinicia o elige otra simulación.':`${x[1]}<div class="hint">Pulsa “Siguiente paso” y mira el campo.</div>`;document.getElementById('next').disabled=busy||done;document.getElementById('play').disabled=busy||done}function drawTabs(){document.getElementById('tabs').innerHTML=Q.map((s,i)=>`<button class="tab${i===si?' on':''}" data-i="${i}" title="${s.name} (${s.es})"><img src="${s.icon}" alt="${s.name}"></button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>load(+b.dataset.i))}function cap(x){document.getElementById('caption').innerHTML=x}function load(i){if(busy)return;si=i;n=0;resetState();const s=Q[si];s.setup?.();before=snap(s);document.getElementById('icon').src=s.icon;document.getElementById('title').textContent=`${s.name} (${s.es})`;document.getElementById('type').textContent=s.id==='stagger'?'Mecánica de combate':'Efecto de estado';document.getElementById('plain').textContent=s.plain;document.getElementById('goal').textContent=s.goal;drawTabs();drawLog();drawState();drawStep();cap(`<b>${s.name}:</b> ${s.plain}`)}async function next(){if(busy)return;const s=Q[si];if(n>=s.steps.length)return;busy=true;drawStep();const x=s.steps[n];cap(`<b>${x[0]}</b> — ${x[1].replace(/<[^>]+>/g,'')}`);await x[2]();n++;drawState();drawLog();busy=false;drawStep();if(n>=s.steps.length)cap(`<b>Resultado:</b> ${s.plain}`)}async function play(){if(busy)return;busy=true;drawStep();const s=Q[si];while(n<s.steps.length){const x=s.steps[n];cap(`<b>${x[0]}</b> — ${x[1].replace(/<[^>]+>/g,'')}`);await x[2]();n++;drawState();drawLog();await wait(900)}busy=false;drawStep();cap(`<b>Resultado:</b> ${s.plain}`)}document.getElementById('reset').onclick=()=>load(si);document.getElementById('next').onclick=next;document.getElementById('play').onclick=play;load(0)})();</script></body></html>
