.clash-hud{position:absolute;z-index:260;left:50%;top:54px;width:min(660px,70vw);transform:translateX(-50%) translateY(-8px);display:grid;grid-template-columns:1fr 52px 1fr;grid-template-rows:auto auto 1fr auto;gap:5px 10px;padding:10px 14px 11px;background:linear-gradient(108deg,rgba(5,5,5,.97) 0 48%,rgba(19,15,8,.97) 48% 52%,rgba(5,5,5,.97) 52% 100%);clip-path:polygon(2% 0,98% 0,100% 14%,98% 93%,83% 100%,17% 100%,2% 93%,0 14%);filter:drop-shadow(8px 10px 0 rgba(0,0,0,.55));opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,transform .18s ease}

.clash-side.loser{opacity:.58}
.clash-side-a{grid-column:1}.clash-side-b{grid-column:3}
.clash-versus{grid-column:2;grid-row:3;align-self:center;text-align:center;font:28px/.8 var(--font);color:#8b806b}
.clash-side-head{display:flex;justify-content:space-between;gap:8px;align-items:end}
.clash-unit-name{font:800 6px/1 Arial,sans-serif;color:#8d969c;letter-spacing:.7px}
.clash-skill-name{font:17px/.9 var(--font);color:#eee7db;text-align:right}
.clash-power{position:absolute;right:8px;top:33px;text-align:right}
.clash-power-value{font:31px/.8 var(--font);color:#f0d86b;text-shadow:0 0 7px rgba(240,216,107,.3)}
.clash-power small{display:block;font:800 5px Arial,sans-serif;color:#777d80;letter-spacing:.7px}
.clash-max{margin-top:10px;font:800 6px Arial,sans-serif;color:#8d8170;letter-spacing:.6px}
.clash-stock-coins{display:flex;gap:4px;margin-top:7px;min-height:24px;align-items:center}
.clash-stock-coin{position:relative;width:23px;height:23px;border-radius:50%;background:url('https://imgur.com/yshLPnQ.png') center/contain no-repeat;filter:drop-shadow(0 2px 2px #000);transition:opacity .18s ease,transform .22s ease,filter .18s ease}
.clash-stock-coin.lost{opacity:.16;transform:scale(.72);filter:grayscale(1) brightness(.45)}
.clash-stock-coin.lost:after{content:'×';position:absolute;inset:0;display:grid;place-items:center;color:#d44b41;font:900 17px Arial,sans-serif;text-shadow:1px 1px 0 #000}

.clash-result{grid-column:1/4;min-height:18px;text-align:center;font:15px/.9 var(--font);color:#ddd5c7;letter-spacing:.5px}

#clash-hud{display:none!important}

/* FLOATING CLASH HUD — lives on the combatant, not the screen HUD */
.clash-float-hud{
  --clash-sin:#a77434;
  position:absolute;
  z-index:90;
  left:50%;
  bottom:248px;
  width:186px;
  height:118px;
  transform:translateX(-50%) translateY(8px) scale(.94);
  transform-origin:50% 100%;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .14s ease,transform .18s cubic-bezier(.2,.78,.2,1);
  filter:drop-shadow(5px 7px 0 rgba(0,0,0,.58));
}
.clash-float-hud.open{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) translateY(0) scale(1)
}
.clash-float-hud.enemy-side{transform:translateX(-50%) translateY(8px) scale(.94)}
.clash-float-hud.enemy-side.open{transform:translateX(-50%) translateY(0) scale(1)}

.clash-float-coins{
  position:absolute;
  z-index:5;
  left:10px;
  right:10px;
  top:-5px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px
}
.clash-float-coin{
  position:relative;
  width:17px;
  height:17px;
  border-radius:50%;
  background:url('https://imgur.com/yshLPnQ.png') center/contain no-repeat;
  filter:drop-shadow(0 1px 2px #000);
  transition:opacity .16s ease,transform .2s ease,filter .16s ease
}
.clash-float-coin.lost{
  opacity:.18;
  transform:scale(.68);
  filter:grayscale(1) brightness(.45)
}
.clash-float-coin.lost::after{
  content:'×';
  position:absolute;
  inset:-1px;

  place-items:center;

  letter-spacing:.3px;
  text-shadow:1px 2px 0 rgba(0,0,0,.55)

/* CAMERA / SUPPORT HUD / STATUS EFFECT PRESENTATION — v0.6.4 */
.status-effect-strip{
  position:absolute;
  z-index:18;
  left:50%;
  bottom:-144px;
  transform:translateX(-50%);
  transform-origin:50% 50%;
  display:grid;
  grid-template-columns:repeat(4,58px);
  grid-auto-rows:34px;
  align-items:center;
  justify-items:center;
  justify-content:center;
  gap:7px 5px;
  width:max-content;
  max-width:247px;
  min-height:34px;
  max-height:75px;
  pointer-events:auto;
  white-space:nowrap
}
.status-overflow-button{
  width:46px;
  height:32px;
  border:1px solid rgba(200,183,154,.66);
  background:rgba(7,7,7,.86);
  color:#d8c9b0;
  display:grid;
  place-items:center;
  cursor:pointer;
  font:25px/.55 var(--font);
  letter-spacing:2px;
  box-shadow:0 2px 4px rgba(0,0,0,.75);
  clip-path:polygon(8% 0,92% 0,100% 24%,94% 100%,6% 100%,0 24%)
}
.status-overflow-button:hover,.status-overflow-button:focus-visible{
  color:#fff0c4;
  border-color:#e4ca74;
  outline:none;
  filter:brightness(1.18)
}
#status-overflow-popover{
  position:fixed;
  z-index:10020;
  display:none;
  min-width:250px;
  max-width:360px;
  padding:10px 11px 12px;
  background:rgba(5,5,5,.97);
  border:1px solid #725537;
  box-shadow:0 12px 30px rgba(0,0,0,.8);
  pointer-events:auto
}
#status-overflow-popover.open{display:block}
.status-overflow-title{
  margin:0 0 9px;
  font:18px/.9 var(--font);
  letter-spacing:.8px;
  color:#d4c2a7
}
.status-overflow-grid{
  display:grid;
  grid-template-columns:repeat(4,58px);
  gap:7px 5px;
  align-items:center;
  justify-items:center
}
.status-overflow-grid .status-effect{margin:0}

/* v0.7.0 — Backup units exist off-field until a Turn Start deploys them. */
.sprite-container.backup-reserve{
  opacity:0;
  visibility:hidden;
  pointer-events:none!important
}
.sprite-container.backup-entering{
  opacity:1;
  visibility:visible;
  pointer-events:none!important;
  transition:left 900ms cubic-bezier(.18,.76,.24,1),bottom 900ms cubic-bezier(.18,.76,.24,1),opacity 240ms ease
}
.sprite-container.backup-replaced{
  opacity:0!important;
  transition:opacity 360ms ease!important;
  pointer-events:none!important
}
.status-effect{
  --status-tone:#d9d5ca;
  position:relative;
  cursor:pointer;
  pointer-events:auto;
  display:grid;
  grid-template-columns:18px 30px 18px;
  align-items:end;
  justify-items:center;
  min-width:66px;
  height:34px;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.95))
}
.status-effect.positive{--status-tone:#f0d353}
.status-effect.negative{--status-tone:#d63b3b}
.status-effect.neutral{--status-tone:#c8b79a}
.status-effect-icon{
  grid-column:2;
  grid-row:1;
  align-self:center;
  width:30px;
  height:30px;
  object-fit:contain;
  filter:drop-shadow(0 0 3px color-mix(in srgb,var(--status-tone) 34%,transparent))
}
.status-value{
  grid-row:1;
  align-self:end;
  padding-bottom:0;
  font:25px/.72 var(--font);
  color:#f3eee5;
  -webkit-text-stroke:.7px #17130f;
  text-shadow:1px 2px 2px #000,0 0 3px rgba(255,255,255,.12)
}
.status-potency{grid-column:1;justify-self:end}
.status-count{grid-column:3;justify-self:start}
.status-effect.single .status-potency,
.status-effect.zero .status-potency,
.status-effect.zero .status-count{visibility:hidden}
.status-effect.single{grid-template-columns:10px 30px 18px;min-width:58px}
.status-effect.zero{grid-template-columns:8px 30px 8px;min-width:46px}
.status-effect.pulse .status-effect-icon{animation:statusIconPulse .3s ease-out}
/* Status scheduled for the next Turn stays visible as a ghost preview.
   It uses the same icon/value layout as the real status, but is deliberately
   faded so the player can distinguish queued effects from active effects. */
.status-effect.pending-next-turn{
  opacity:.38;
  filter:grayscale(.18) saturate(.72) drop-shadow(0 2px 2px rgba(0,0,0,.78))
}
.status-effect.pending-next-turn .status-value{
  color:#eee5d7;
  text-shadow:1px 2px 2px #000
}
.status-effect.pending-next-turn .status-effect-icon{
  filter:drop-shadow(0 0 2px color-mix(in srgb,var(--status-tone) 20%,transparent))
}
@keyframes statusIconPulse{0%{transform:scale(.78);filter:brightness(.8)}45%{transform:scale(1.18);filter:brightness(1.4)}100%{transform:scale(1);filter:none}}

/* The focused/player HUD remains at full size. Only supporting ALLIES use the
   compact field HUD; their character sprite itself is deliberately untouched. */
.sprite-container.ally.support-token .diegetic-floor{
  transform:rotateX(65deg) scale(.78);
  transform-origin:50% 50%
}
.sprite-container.ally.support-token .top-ui-panel{
  transform:translateX(-50%) scale(.78);
  transform-origin:50% 0
}
.sprite-container.ally.support-token .floating-hp-group{
  transform:scale(.78);
  transform-origin:0 100%
}
.sprite-container.ally.support-token .floating-sp-group{
  transform:scale(.78);
  transform-origin:100% 100%
}
.sprite-container.ally.support-token .status-effect-strip{
  transform:translateX(-50%) scale(.78);
  transform-origin:50% 50%
}

/* STAGGER / INCAPACITATED ACTION STATE */
.action-slot-wrapper.unit-disabled{
  opacity:.28!important;
  filter:grayscale(.82) brightness(.72)!important;
  pointer-events:none!important;
}
.action-slot-wrapper.slot-cancelled::after{
  content:'×';
  position:absolute;
  z-index:20;
  inset:0;
  display:grid;
  place-items:center;
  font:32px/.8 var(--font);
  color:#ef6b58;
  text-shadow:2px 2px 0 #000,0 0 7px rgba(239,107,88,.55);
  pointer-events:none;
}
.sprite-container.stagger-locked:not(.incapacitated) .name-plate::after{
  content:' · STAGGERED';
  color:#ffd85f;
}
.sprite-container.incapacitated{
  filter:grayscale(.86) brightness(.52) contrast(.94);
}
.sprite-container.incapacitated .sprite-img{
  opacity:.58;
  pointer-events:none!important;
  cursor:default!important;
}
/* At 0 HP the unit remains as a battlefield body/sprite, but every combat HUD
   surface disappears immediately and the unit becomes fully untargetable. */
.sprite-container.incapacitated .top-ui-panel,
.sprite-container.incapacitated .diegetic-floor,
.sprite-container.incapacitated .floating-hp-group,
.sprite-container.incapacitated .floating-sp-group,
.sprite-container.incapacitated .shield-number,
.sprite-container.incapacitated .stagger-pop,
.sprite-container.incapacitated .status-effect-strip,
.sprite-container.incapacitated .clash-float-hud{
  opacity:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
}

.clash-float-active-coins .luminous-core-coin[data-side="tail"]{

/* Keep a clean pocket around the two active Clash units. Other units are only
   displaced for the Clash presentation and return to their Turn position after it. */
.sprite-container.clash-spectator-shift{
  transform:translate(calc(-50% + var(--clash-clear-dx,0px)),var(--clash-clear-dy,0px)) scale(1)!important;
  transition:transform .42s cubic-bezier(.18,.78,.2,1),filter .2s ease!important;
}

  transform:translate(calc(-50% + var(--clash-dx,0px) + var(--clash-clear-dx,0px)),calc(var(--clash-dy,0px) + var(--clash-clear-dy,0px))) scale(1)!important;
}

.sprite-container.clash-spectator-shift,
.sprite-container.combat-positioned.clash-spectator-shift{
  transform:translate(calc(-50% + var(--clash-dx,0px)),var(--clash-dy,0px)) scale(1)!important;
}

  text-align:center;
  pointer-events:none;

  text-shadow:0 0 7px #fff4a6,0 0 18px rgba(255,226,82,.88),3px 4px 0 rgba(0,0,0,.72);

  100%{opacity:0;transform:translate(-50%,-50%) scale(.94) translateY(-22px)}

/* v0.6.8 — Clash HUD scale hierarchy + protected center lane.
   Don keeps the close-up HUD scale; every other ally/enemy uses a compact HUD
   so two ribbons can never swallow the center of the Clash. */
.clash-float-hud.npc-clash-hud.clash-side-left{
  transform:translateX(-81%) translateY(4px) scale(1.55)!important;
}
.clash-float-hud.npc-clash-hud.clash-side-left.open{
  transform:translateX(-81%) translateY(0) scale(1.55)!important;
}
.clash-float-hud.npc-clash-hud.clash-side-right{
  transform:translateX(-17%) translateY(4px) scale(1.55)!important;
}
.clash-float-hud.npc-clash-hud.clash-side-right.open{
  transform:translateX(-17%) translateY(0) scale(1.55)!important;
}
/* Keep the controlled player's established Clash scale untouched. */
.clash-float-hud.player-clash-hud.clash-side-left{
  transform:translateX(-81%) translateY(4px) scale(2.35)!important;
}
.clash-float-hud.player-clash-hud.clash-side-left.open{
  transform:translateX(-81%) translateY(0) scale(2.35)!important;
}
.clash-float-hud.player-clash-hud.clash-side-right{
  transform:translateX(-17%) translateY(4px) scale(2.35)!important;
}
.clash-float-hud.player-clash-hud.clash-side-right.open{
  transform:translateX(-17%) translateY(0) scale(2.35)!important;
}


/* v0.7.0 — Clash Skill HUD reference pass.
   Composition follows the supplied Limbus-style reference: trapezoid skill
   ribbon points inward, the score sits in a large heptagon at the inner edge,
   Coin icons hug the heptagon's upper corner, and both ribbons grow AWAY from
   the protected center lane. The previously-required current-Coin detail is
   retained as a small unboxed readout below the ribbon. */
.clash-float-hud{
  --clash-main:#e84638;
  --clash-dark:#8c201d;
  width:320px!important;
  height:108px!important;
  bottom:248px!important;
  filter:drop-shadow(3px 5px 0 rgba(0,0,0,.42))!important;
}
.clash-float-hud.clash-side-left{
  --clash-main:#e84638;
  --clash-dark:#8c201d;
}
.clash-float-hud.clash-side-right{
  --clash-main:#16bdd8;
  --clash-dark:#08697e;
}

/* Name trapezoid.  Left participant aligns its text toward the right/heptagon;
   right participant aligns toward the left/heptagon. */
.clash-float-ribbon{
  top:22px!important;
  width:240px!important;
  height:23px!important;
  min-height:23px!important;
  padding:0!important;
  display:flex!important;
  align-items:center!important;
  background:linear-gradient(
    to bottom,
    color-mix(in srgb,var(--clash-main) 88%,white 12%),
    var(--clash-main) 58%,
    var(--clash-dark)
  )!important;
  box-shadow:0 3px 4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.18)!important;
  filter:none!important;
}
.clash-float-hud.clash-side-left .clash-float-ribbon{
  left:auto!important;
  right:58px!important;
  padding-left:13px!important;
  padding-right:17px!important;
  justify-content:flex-end!important;
  clip-path:polygon(5% 0,100% 0,100% 100%,0 100%)!important;
}
.clash-float-hud.clash-side-right .clash-float-ribbon{
  left:58px!important;
  right:auto!important;
  padding-left:17px!important;
  padding-right:13px!important;
  justify-content:flex-start!important;
  clip-path:polygon(0 0,95% 0,100% 100%,0 100%)!important;
}
.clash-float-name{
  min-width:0!important;
  max-width:100%!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
  font-family:'Mikodacs',sans-serif!important;
  font-size:13px!important;
  line-height:1!important;
  font-weight:400!important;
  letter-spacing:0!important;
  color:#fff1d8!important;
  text-shadow:0 1px 0 rgba(0,0,0,.25),1px 1px 2px rgba(0,0,0,.24)!important;
}

/* Score/heptagon at the protected inner edge. */
.clash-float-power-shell{
  top:0!important;
  width:73px!important;
  height:78px!important;
  display:grid!important;
  place-items:center!important;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.38))!important;
}
.clash-float-hud.clash-side-left .clash-float-power-shell{
  left:auto!important;
  right:0!important;
}
.clash-float-hud.clash-side-right .clash-float-power-shell{
  left:0!important;
  right:auto!important;
}
.clash-float-hept{
  position:absolute!important;
  top:9px!important;
  left:50%!important;
  width:66px!important;
  height:66px!important;
  inset:auto!important;
  transform:translateX(-50%)!important;
  background:var(--clash-main)!important;
  clip-path:polygon(28.31% 4.95%,71.69% 4.95%,98.75% 38.87%,89.09% 81.17%,50% 100%,10.91% 81.17%,1.25% 38.87%)!important;
  filter:none!important;
}
.clash-float-hept::after{
  content:''!important;
  position:absolute!important;
  top:2.5px!important;
  left:2.5px!important;
  width:61px!important;
  height:61px!important;
  inset:auto!important;
  background:#101010!important;
  clip-path:inherit!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -4px 7px rgba(0,0,0,.5)!important;
}
.clash-float-power,
.clash-float-power.coin-head,
.clash-float-power.coin-tail{
  position:relative!important;
  z-index:4!important;
  transform:translateY(2px)!important;
  font-family:var(--font)!important;
  font-size:45px!important;
  line-height:.85!important;
  letter-spacing:0!important;
  color:#fff0d7!important;
  -webkit-text-stroke:1.5px var(--clash-main)!important;
  paint-order:stroke fill!important;
  opacity:1!important;
  filter:none!important;
  text-shadow:0 2px 2px rgba(0,0,0,.25)!important;
}
.clash-float-power.head-pulse{animation:clashPowerHeadPulseReference .24s cubic-bezier(.16,.84,.28,1)!important}
@keyframes clashPowerHeadPulseReference{
  0%{transform:translateY(2px) scale(1)}
  42%{transform:translateY(2px) scale(1.11);filter:brightness(1.18)}
  100%{transform:translateY(2px) scale(1);filter:none}
}
.clash-float-coin-power,
.clash-float-coin-power.coin-head,
.clash-float-coin-power.coin-tail{
  top:0!important;
  left:50%!important;
  right:auto!important;
  transform:translateX(-50%)!important;
  font-family:var(--font)!important;
  font-size:15px!important;
  line-height:1!important;
  color:#fff0d8!important;
  -webkit-text-stroke:0!important;
  opacity:1!important;
  filter:none!important;
  text-shadow:1px 1px 0 rgba(0,0,0,.4)!important;
}

/* Coin stock is attached to the upper corner of the inner heptagon. */
.clash-float-coins{
  top:4px!important;
  bottom:auto!important;
  left:auto!important;
  right:auto!important;
  width:auto!important;
  height:11px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:0!important;
  z-index:7!important;
}
.clash-float-hud.clash-side-left .clash-float-coins{
  right:53px!important;
}
.clash-float-hud.clash-side-right .clash-float-coins{
  left:53px!important;
}
.clash-float-lost-coins,
.clash-float-active-coins{

  gap:0!important;
}
.clash-float-hud.clash-side-right .clash-float-active-coins{

}
.clash-float-coin,
.clash-float-active-coins .luminous-core-coin,
.clash-float-active-coins .luminous-core-coin img{
  width:11px!important;
  height:11px!important;

  border-radius:0!important;
  background:none!important;
  object-fit:contain!important;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))!important;
}

/* v0.7.0 — Clash HUD flat/Impact repair.
   Final override: stable absolute geometry, flat fills, no gradients/shadows.

/* ================================================================
   v0.7.3 — CLASH FORECAST + LEVEL 1 TEST
   The combat world (background, combatant sprites, intent lines and
   impact sparks) is GPU composited. DOM remains as the interaction/HUD
   layer so every existing menu, tooltip and click target keeps working.
   Individual textures fall back to their DOM source if CORS/WebGL upload
   is unavailable, so gameplay never disappears because of an asset host.
================================================================ */
#webgl2-dom-background{
  --camera-x:0px;
  --camera-y:0px;
  --camera-scale:1;
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.43)),url('assets/combat-stage/horizon.svg');
  background-size:cover;
  background-position:center bottom;
  background-repeat:no-repeat;
  transform:translate(var(--camera-x),var(--camera-y)) scale(var(--camera-scale));
  transform-origin:0 0;
  transition:transform .52s cubic-bezier(.18,.76,.22,1);
  will-change:transform;
}
#webgl2-combat-canvas{
  position:absolute;
  inset:0;
  z-index:1;
  width:100%;
  height:100%;
  display:block;
  pointer-events:none;
  background:transparent;
}
#battlefield{z-index:2}
/* Once WebGL2 is active the battlefield itself must stay transparent.  If an
   external background cannot be uploaded because the asset host blocks CORS,
   #webgl2-dom-background remains visible below the GPU canvas instead.  This
   keeps GPU intent lines/FX visible rather than burying them under the old
   battlefield background. */
#game-container.webgl2-renderer-ready #battlefield{
  background-image:none!important;
  background-color:transparent!important;
}
#game-container.webgl2-background-ready #webgl2-dom-background{opacity:0}
.sprite-img.webgl2-texture-backed{
  opacity:0!important;
  /* Keep the original element as an invisible interaction/measurement hitbox. */
  pointer-events:auto!important;
}
#game-container.webgl2-renderer-ready #target-intent-overlay{
  opacity:0!important;
}
#game-container.webgl2-renderer-ready .clash-contact-fx{
  display:none!important;
}
#webgl2-renderer-state{
  position:absolute;
  z-index:999;
  right:8px;
  top:8px;
  display:none;
  pointer-events:none;
  font:9px/1 monospace;
  color:#9de9ef;
  background:#06090a;
  border:1px solid #23545c;
  padding:4px 6px;
}

<style id="v072-combat-focus-sin-hud-patch">
/* v0.7.3 — Concurrent combat readability pass.
   During timeline resolution, only units participating in currently-running
   events stay fully opaque. Spectators remain present but visually recede. */
.sprite-container .sprite-anchor,
.sprite-container .diegetic-floor,
.sprite-container .top-ui-panel,
.sprite-container .floating-hp-group,
.sprite-container .floating-sp-group,
.sprite-container .status-effect-strip,
.sprite-container .shield-number{
  transition:opacity .13s ease!important;
}
#game-container.timeline-focus-active .sprite-container.timeline-spectator .sprite-anchor,
#game-container.timeline-focus-active .sprite-container.timeline-spectator .diegetic-floor,
#game-container.timeline-focus-active .sprite-container.timeline-spectator .top-ui-panel,
#game-container.timeline-focus-active .sprite-container.timeline-spectator .floating-hp-group,
#game-container.timeline-focus-active .sprite-container.timeline-spectator .floating-sp-group,
#game-container.timeline-focus-active .sprite-container.timeline-spectator .status-effect-strip,
#game-container.timeline-focus-active .sprite-container.timeline-spectator .shield-number{
  opacity:.17!important;
}
/* Participants in any concurrently-running event stay readable at full strength. */
#game-container.timeline-focus-active .sprite-container.timeline-participant .sprite-anchor,
#game-container.timeline-focus-active .sprite-container.timeline-participant .diegetic-floor,
#game-container.timeline-focus-active .sprite-container.timeline-participant .top-ui-panel,
#game-container.timeline-focus-active .sprite-container.timeline-participant .floating-hp-group,
#game-container.timeline-focus-active .sprite-container.timeline-participant .floating-sp-group,
#game-container.timeline-focus-active .sprite-container.timeline-participant .status-effect-strip{
  opacity:1!important;
}

/* v0.7.3 — Condition visibility. Invisible is observer-local; Blinded replaces
   battlefield information with only the blinded unit and enemy Action Slots. */
.sprite-container.invisible-hidden .sprite-anchor,
.sprite-container.invisible-hidden .diegetic-floor,
.sprite-container.invisible-hidden .top-ui-panel,
.sprite-container.invisible-hidden .floating-hp-group,
.sprite-container.invisible-hidden .floating-sp-group,
.sprite-container.invisible-hidden .status-effect-strip,
.sprite-container.invisible-hidden .shield-number{opacity:0!important;pointer-events:none!important}
.sprite-container.invisible-detected .sprite-anchor,
.sprite-container.invisible-detected .diegetic-floor,
.sprite-container.invisible-detected .top-ui-panel,
.sprite-container.invisible-detected .floating-hp-group,
.sprite-container.invisible-detected .floating-sp-group,
.sprite-container.invisible-detected .status-effect-strip,
.sprite-container.invisible-detected .shield-number{opacity:.34!important}
.sprite-container.invisible-detected .action-slots{pointer-events:auto!important}

#game-container.player-blinded #webgl2-dom-background,
#game-container.player-blinded #battlefield{background-image:none!important;background-color:#000!important}
#game-container.player-blinded .limbus-divider-plane,
#game-container.player-blinded #target-intent-overlay{opacity:0!important}
#game-container.player-blinded .sprite-container.blindness-other .sprite-anchor,
#game-container.player-blinded .sprite-container.blindness-other .diegetic-floor,
#game-container.player-blinded .sprite-container.blindness-other .top-ui-panel,
#game-container.player-blinded .sprite-container.blindness-other .floating-hp-group,
#game-container.player-blinded .sprite-container.blindness-other .floating-sp-group,
#game-container.player-blinded .sprite-container.blindness-other .status-effect-strip,
#game-container.player-blinded .sprite-container.blindness-other .shield-number{opacity:0!important;pointer-events:none!important}
#game-container.player-blinded .sprite-container.blindness-enemy .sprite-anchor,
#game-container.player-blinded .sprite-container.blindness-enemy .diegetic-floor,
#game-container.player-blinded .sprite-container.blindness-enemy .floating-hp-group,
#game-container.player-blinded .sprite-container.blindness-enemy .floating-sp-group,
#game-container.player-blinded .sprite-container.blindness-enemy .status-effect-strip,
#game-container.player-blinded .sprite-container.blindness-enemy .shield-number{opacity:0!important}
#game-container.player-blinded .sprite-container.blindness-enemy .top-ui-panel{opacity:1!important}
#game-container.player-blinded .sprite-container.blindness-enemy .speed-number{opacity:0!important}
#game-container.player-blinded .sprite-container.blindness-enemy .action-slots{opacity:1!important;pointer-events:auto!important}
/* Invisible remains hidden even when Blindness would otherwise reveal enemy Slots. */
#game-container.player-blinded .sprite-container.invisible-hidden .top-ui-panel{opacity:0!important;pointer-events:none!important}
</style>

function statusModifier(unit,statusId){return Math.max(0,Number(getCombatStatus(unit,statusId)?.count)||0)}

// DMG % is additive across the attacker and defender before it becomes a multiplier.

function skillConditionalDamagePercent(attacker,defender,skillData=null){

  const threshold=Math.max(0,Math.min(100,Number(rule.targetHpBelowPct)||0)),
        pct=(Math.max(0,Number(defender.hp)||0)/(Math.max(1,Number(defender.maxHp)||1)))*100;
  return pct<=threshold?Number(rule.percent)||0:0
}

  if(!state)return 0;
  const grappler=combatData[state.attackerId];
  // Only allies of the unit maintaining the Grapple receive the +15% bonus.
  // The grappler themself does not receive it.
  if(!grappler||attacker.id===grappler.id||attacker.faction!==grappler.faction)return 0;

}
function statusDamagePercent(attacker,defender,skillData=null){
  const attackerPct=10*(statusModifier(attacker,'damage_up')-statusModifier(attacker,'damage_down')),
        defenderPct=10*(statusModifier(defender,'fragile')-statusModifier(defender,'protection')),

function statusOffenseLevel(unit){const base=Number(unit?.offensiveLevel??unit?.offenseLevel??unit?.level??TEST_COMBAT_LEVEL),corrosion=Math.floor(statusModifier(unit,'corrosion')/2);return Math.max(1,(Number.isFinite(base)?base:TEST_COMBAT_LEVEL)+statusModifier(unit,'offense_level_up')-statusModifier(unit,'offense_level_down')-corrosion)}

  const raiseHp=Math.max(0,Number(s.potency)||0),raisePct=(raiseHp/(Number(unit.maxHp)||1))*100,
        old=(unit.staggerThresholds||[]).map(Number),consumed=new Set(unit.triggeredStaggerThresholds||[]),
        currentPct=combatantHpPct(unit),crossed=[];
  const next=old.map((pct,index)=>{

function applySkillStatusEffects(entry,targetId,trigger,context={}){

          input={potency:Number(effect.potency)||0,count:Number(effect.count)||0,sourceUnitId:entry.ownerId,
            sourceType:effect.sourceType||sourceType,sourceElement:effect.sourceElement||sourceElement,durationType,
            saveAbility:effect.saveAbility||data.save?.ability||null,saveThreshold:effect.saveThreshold??data.save?.threshold??null,
            exitMode:effect.exitMode||null,detectThreshold:effect.detectThreshold??data.detectThreshold??data.save?.threshold??null,
            concentrationId:conc?.id||null,sourceLabel:data.name||null};

function clampCameraTranslation(field,scale,rawX,rawY){
  const viewport=$('game-container'),
        viewW=Number(viewport?.clientWidth)||innerWidth,
        viewH=Number(viewport?.clientHeight)||innerHeight,
        worldW=Number(field?.offsetWidth)||viewW,
        worldH=Number(field?.offsetHeight)||viewH,
        minX=Math.min(0,viewW-(worldW*scale)),
        minY=Math.min(0,viewH-(worldH*scale));
  return{
    x:Math.max(minX,Math.min(0,Number(rawX)||0)),
    y:Math.max(minY,Math.min(0,Number(rawY)||0))
  }
}
function setCameraTransform(field,mode,scale,rawX,rawY){
  if(!field)return;
  const clamped=clampCameraTranslation(field,scale,rawX,rawY);
  field.dataset.cameraMode=mode;
  field.style.setProperty('--camera-x',`${clamped.x}px`);
  field.style.setProperty('--camera-y',`${clamped.y}px`);
  field.style.setProperty('--camera-scale',scale);
  // The DOM background is the CORS-safe fallback for the map. It is a sibling
  // of #battlefield so it does not inherit the battlefield camera transform;
  // mirror the exact same camera values onto it so map + units stay in one world.
  const backgroundLayer=$('webgl2-dom-background');
  if(backgroundLayer){
    backgroundLayer.style.setProperty('--camera-x',`${clamped.x}px`);
    backgroundLayer.style.setProperty('--camera-y',`${clamped.y}px`);
    backgroundLayer.style.setProperty('--camera-scale',scale);
    backgroundLayer.dataset.cameraMode=mode;
  }
  window.LuminousCombatStage073?.camera({x:clamped.x,y:clamped.y,scale});
  field.classList.toggle('camera-focus',scale!==1||clamped.x!==0||clamped.y!==0);
  window.LuminousCombatHudMotion073?.scheduleStatusLayout?.()
}
function combatantVisualScale(id){
  const combatant=$(`token-${id}`)?.querySelector('.combatant');
  if(!combatant)return .30;
  const transform=getComputedStyle(combatant).transform;
  if(!transform||transform==='none')return 1;
  try{
    const matrix=new DOMMatrixReadOnly(transform);
    const scale=Math.hypot(matrix.a,matrix.b);
    return Number.isFinite(scale)&&scale>0?scale:.30
  }catch(_){
    return .30
  }
}
function playerVisualFocusPoint(viewW,viewH){

        spriteHeight=Number(sprite?.offsetHeight)||240,

        offsetX=(Number(unit?.spriteX)||0)*visualScale,

function setCameraFocus(mode='player',enabled=true){

  if(conditionTargetBlocked(player,owner)||!invisibleTargetableBy(player,owner,plan))return false;
  if(rule==='ally'){
    const key=String(plan?.data?.actionKey||'').toLowerCase();
    if(key==='help'&&owner.id===PLAYER_ID)return false;
    if(key==='calm'&&!unitHasStatus(owner,'frightened'))return false;
    if(key==='wake_up'&&!unitHasStatus(owner,'sleep'))return false;
    if(key==='liberate'&&statusModifier(owner,'restrained')<=0)return false;

  }
  plan.targetId=slot.dataset.ownerId;
  plan.targetSlotIndex=Number(slot.dataset.slotIndex)||0;
  plan.sourceSlotIndex=completedIndex;
  if(!universalPlanPreview(plannedActions).ok){plan.targetId=null;plan.targetSlotIndex=null;setStatus('No puedes repetir Help sobre ese aliado ni otra universal de la misma fase.');return}
  configureAtkWeightTargets(plan,PLAYER_ID);
  configurePlayerClashChoice(plan,completedIndex);
  targetingModeActive=false;
  syncReadyControl();
  $('game-container').classList.remove('targeting-mode');
  clearTargetSelectionClasses();
  pendingTargetPlan=null;
  pendingTargetSlotIndex=-1;
  renderTargetArrows();
  if(isClashIntent(PLAYER_ID,completedIndex,plan)){
    beginClashConfirmation(completedIndex,plan,clashSnapshot);
    return
  }
  delete plan.clashConfirmed;
  const blocked=plan._clashBlocked;
  finalizePlannedAction(completedIndex);

function setUnitActionSlotCount(id,count){

function removeGrappleInheritance(state){

function distributeGrappleInheritance(state){
  if(!state?.active)return;
  removeGrappleInheritance(state);
  let remaining=Math.max(0,(Number(state.attackerOriginalSlots)||1)-1);
  if(!remaining)return;
  const attacker=combatData[state.attackerId];
  const candidates=Object.values(combatData)
    .filter(unit=>unit.faction===attacker?.faction&&unit.id!==state.attackerId&&unit.id!==state.defenderId&&isUnitTargetable(unit)&&!activeGrappleForUnit(unit.id))
    .sort((a,b)=>(Number(b.speed)||0)-(Number(a.speed)||0)||(Number(a.speedTie)||0)-(Number(b.speedTie)||0));
  let guard=0;
  while(remaining>0&&candidates.length&&guard<24){
    guard++;
    let granted=false;
    for(const unit of candidates){
      if(remaining<=0)break;
      const before=unitSlots(unit.id).length;
      if(before>=3)continue;
      setUnitActionSlotCount(unit.id,before+1);
      let row=state.inherited.find(x=>x.unitId===unit.id);
      if(!row){row={unitId:unit.id,count:0};state.inherited.push(row)}

function autoActionScore(unitId,entry){

    if(defenseType==='evade')return (expectedPower*.58)+(missing*5.5)+(Math.random()*1.25);
    if(defenseType==='counter')return (expectedPower*.52)+(missing*4.25)+(Math.random()*1.25);

    d._hpTimers.push(setTimeout(()=>{
      if(d._hpAnimToken!==animToken)return;
      transition.style.opacity='0'
    },560));
  }else{
    transition.style.opacity='0'
  }
  return true
}

  resetPlayerDeckForUnit(backup.id);
  return true
}
function finalizeExitWithoutReplacement(){
  Object.values(combatData).filter(unit=>unit.retreatVacancy||unit.escapeVacancy).forEach(unit=>{
    const token=$(`token-${unit.id}`);
    unit.battleActive=false;
    if(unit.retreatVacancy){unit.isBackup=true;unit.replacementClaimed=false;unit.retreatVacancy=false;token?.classList.add('backup-reserve')}
    if(unit.escapeVacancy){unit.escaped=true;unit.xpEligible=false;unit.replacementClaimed=true;unit.escapeVacancy=false}
    if(token)token.style.display='none'
  })
}
function activeBattleUnits(faction=null){
  return Object.values(combatData).filter(unit=>unit.battleActive!==false&&!unit.incapacitated&&(!faction||unit.faction===faction))
}
function prepareBackupDeployment(faction='enemy'){
  const vacancies=vacantBattleUnits(faction),reserve=backupReserveForFaction(faction),deployments=[];
  vacancies.slice(0,reserve.length).forEach((fallen,index)=>{
    const backup=reserve[index],token=$(`token-${backup.id}`),fallenToken=$(`token-${fallen.id}`),fromX=faction==='enemy'?108:-8,fromY=Math.max(18,Math.min(48,Number(fallen.y)||28)),
          wasRetreat=Boolean(fallen.retreatVacancy),wasEscape=Boolean(fallen.escapeVacancy);
    fallen.replacementClaimed=true;
    fallen.battleActive=false;
    if(wasRetreat){fallen.isBackup=true;fallen.retreatVacancy=false;fallen.replacementClaimed=false}
    if(wasEscape){fallen.escapeVacancy=false;fallen.escaped=true;fallen.xpEligible=false;fallen.isBackup=false}
    backup.battleActive=true;backup.isBackup=false;backup.deploymentState='field';
    if(window.LuminousDeathSaveRuntime?.isRetreated(backup))window.LuminousDeathSaveRuntime.returnFromRetreat(backup,{force:true});
    backup.deployedRound=round;
    backup.replacementClaimed=false;
    backup._backupEntry={fallenId:fallen.id,fromX,fromY};
    transferPlayerControlToBackup(fallen,backup);
    if(!AUTO_UNIT_IDS.includes(backup.id)&&backup.controlled==='ai')AUTO_UNIT_IDS.push(backup.id);
    if(fallenToken)fallenToken.classList.add('backup-replaced');
    if(token){
      token.style.display='';
      token.classList.remove('backup-reserve');
      token.classList.add('backup-entering');
      token.style.left=`${fromX}%`;
      token.style.bottom=`${fromY}%`;
    }
    syncUnitActionState(backup.id);
    deployments.push({fallen,backup,wasRetreat,wasEscape})
  });
  return deployments
}
async function animatePreparedBackupDeployments(deployments=[]){
  if(!deployments.length)return;
  // layoutSpeedFormation has already assigned the deployed unit's final x/y.
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  deployments.forEach(({backup})=>{
    const token=$(`token-${backup.id}`);
    if(!token)return;
    token.style.left=`${backup.x}%`;
    token.style.bottom=`${backup.y}%`
  });
  setStatus(`TURN ${round} · BACKUP DEPLOYMENT · ${deployments.map(row=>row.backup.name).join(' / ')}`);
  await wait(940);
  deployments.forEach(({fallen,backup,wasRetreat})=>{
    const token=$(`token-${backup.id}`),fallenToken=$(`token-${fallen.id}`);
    token?.classList.remove('backup-entering');
    if(fallenToken){fallenToken.style.display='none';if(wasRetreat)fallenToken.classList.add('backup-reserve')}
    delete backup._backupEntry
  })
}

function processShortRestStatuses(unitId){
  const unit=combatData[unitId];if(!unit)return false;
  const poison=getCombatStatus(unit,'poison');
  if(poison){const store=ensureCombatStatusStore(unit);store.poison.potency=Math.max(0,(Number(poison.potency)||0)-3);if(!statusIsValid(statusDefinition('poison'),store.poison))delete store.poison}
  if(statusModifier(unit,'decay')>0){const decay=getCombatStatus(unit,'decay');applyCombatStatus(unitId,'decay',{mode:'set',count:Math.floor((Number(decay?.count)||0)/2)})}
  if(statusModifier(unit,'radiance')>0)consumeStatusCount(unitId,'radiance',5);
  recalcPersistentMaxHp(unitId);renderStatusEffects(unitId);return true
}
function processLongRestStatuses(unitId){
  const unit=combatData[unitId];if(!unit)return false;
  const poison=getCombatStatus(unit,'poison');
  if(poison){const store=ensureCombatStatusStore(unit);store.poison.potency=Math.max(0,(Number(poison.potency)||0)-6);if(!statusIsValid(statusDefinition('poison'),store.poison))delete store.poison}
  removeCombatStatus(unitId,'decay');removeCombatStatus(unitId,'radiance');
  if(statusModifier(unit,'exhaustion')>0)consumeStatusCount(unitId,'exhaustion',1);
  recalcPersistentMaxHp(unitId);renderStatusEffects(unitId);return true
}
function processEncounterEndStatuses(){
  Object.values(combatData).forEach(unit=>{if(statusModifier(unit,'radiance')>0)consumeStatusCount(unit.id,'radiance',2)});
  return true
}

function fbEnsureSlot(i){
  if(fallback.slots[i])return fallback.slots[i];
  const s={pile:shuffle(templates().map(x=>({...x}))),hand:[],used:null};
  s.hand=[fbDraw(s),fbDraw(s)];

function fbTurn(count=playerSlots().length){
  for(let i=0;i<count;i++){
    const s=fbEnsureSlot(i),
          newest=s.hand[1],
          usedNewest=newest&&s.used===newest.drawId;
    s.hand=usedNewest?[]:(newest?[newest]:[]);
    s.used=null;
    while(s.hand.length<2)s.hand.push(fbDraw(s))

}

function buildExecutionQueue(){
  const queue=[];

  playerSlots().forEach((slot,index)=>{
    const plan=plannedActions[index];
    if(plan){
      queue.push({
        ownerId:PLAYER_ID,
        ownerName:combatData[PLAYER_ID]?.name||'Player',
        slot,
        localIndex:index,
        worldX:Number(combatData[PLAYER_ID]?.x)||0,
        plan,
        controller:'player'
      })
    }
  });

  AUTO_UNIT_IDS.forEach(id=>{
    const unit=combatData[id];
    if(!unit)return;
    unitSlots(id).forEach((slot,index)=>{
      const plan=unit.autoPlans?.[index];
      if(plan){
        queue.push({
          ownerId:id,
          ownerName:unit.name,
          slot,
          localIndex:index,
          worldX:Number(unit.x)||0,
          plan,
          controller:'ai'
        })
      }
    })
  });

  // Frozen Speed decides Unit order. A Unit's own Slots stay left -> right.
  queue.forEach(entry=>{
    const unit=combatData[entry.ownerId];
    entry.speed=Number(unit?.speed)||0;
    entry.tieSeed=Number(unit?.speedTie)||0
  });
  queue.sort((a,b)=>{
    const speedDelta=b.speed-a.speed;
    if(speedDelta)return speedDelta;
    if(a.ownerId===b.ownerId)return a.localIndex-b.localIndex;
    return a.tieSeed-b.tieSeed

}

function buildTimelineEvents(queue=[]){
  const assigned=new Set(),events=[];

    assigned.add(key);
    if(partner){entries.push(partner);assigned.add(entryKey(partner))}
    const speed=partner?Math.max(Number(entry.speed)||0,Number(partner.speed)||0):(Number(entry.speed)||0);
    events.push({
      id:`timeline-${events.length+1}`,
      entries,
      speed,
      queueIndex,
      kind:partner?'clash':'action',
      participants:timelineParticipantsForEntries(entries)

  events.sort((a,b)=>b.speed-a.speed||a.queueIndex-b.queueIndex);

async function executeTimelineEvent(event,queue,resolvedKeys){

  // Run every still-unresolved entry in the event; a successful Clash consumes
  // its partner and the second pass becomes a no-op.
  for(const entry of event.entries){
    if(!resolvedKeys.has(entryKey(entry)))await executeQueueEntry(entry,queue,resolvedKeys)
  }
}
async function executeCombatTimeline(queue,resolvedKeys){
  if(window.LuminousCombatLiveMode===true){
    try{
      for(const event of buildTimelineEvents(queue)){
        setTimelineVisualFocus(event.participants);
        await executeTimelineEvent(event,queue,resolvedKeys)
      }
    }finally{clearTimelineVisualFocus()}
    return
  }
  const pending=buildTimelineEvents(queue),active=new Map(),lockedParticipants=new Set(),activeParticipantEvents=new Map();
  if(!pending.length){clearTimelineVisualFocus();return}
  const startedAt=performance.now();
  const canLaunch=event=>event.participants.every(id=>!lockedParticipants.has(id));
  const refreshVisualFocus=()=>{
    const ids=new Set();
    activeParticipantEvents.forEach(participants=>participants.forEach(id=>ids.add(id)));
    setTimelineVisualFocus([...ids])
  };
  const launch=event=>{
    event.participants.forEach(id=>lockedParticipants.add(id));
    activeParticipantEvents.set(event.id,new Set(event.participants));
    refreshVisualFocus();
    const task=(async()=>{
      try{await executeTimelineEvent(event,queue,resolvedKeys)}
      finally{
        event.participants.forEach(id=>lockedParticipants.delete(id));
        activeParticipantEvents.delete(event.id);
        refreshVisualFocus()
      }
    })();
    active.set(event.id,task);
    task.finally(()=>active.delete(event.id));
  };

  try{
    while(pending.length||active.size){
      const elapsed=performance.now()-startedAt;
      let launched=false;
      // Speed determines WHEN an event becomes eligible. Once its time arrives,
      // participant locks are the only reason it waits. This lets a slower Clash
      // begin the instant a faster Unopposed hit releases its shared target while
      // unrelated events continue animating elsewhere.
      for(let i=0;i<pending.length;){
        const event=pending[i];
        if(elapsed+1<event.readyAt){i++;continue}
        if(!canLaunch(event)){i++;continue}
        pending.splice(i,1);
        launch(event);
        launched=true
      }

      if(!pending.length){
        if(active.size)await Promise.race([...active.values()].map(task=>task.catch(()=>null)));
        continue
      }

      if(launched){await wait(18);continue}
      const nextReady=Math.min(...pending.map(event=>event.readyAt)),untilReady=Math.max(18,nextReady-(performance.now()-startedAt));
      const wake=[wait(Math.min(55,untilReady))];
      if(active.size)wake.push(Promise.race([...active.values()].map(task=>task.catch(()=>null))));
      await Promise.race(wake)
    }
  }finally{
    clearTimelineVisualFocus()
  }
}

function findClashPartner(entry,queue,resolvedKeys){

    if(available(direct)&&defenses.isClashableDefensePlan(direct.plan))return direct;
    if(slotIndex==null){

async function finishRoundExecution(queue,resolvedKeys){

      processConcentrationChecks(round);
      processStatusRoundEnd(round);
      processDeathSavesRoundEnd(round);
      roundEndProgress={round,phase:'turn_end'}

  }

    for(const entry of queue)if(!resolvedKeys.has(entryKey(entry))&&window.LuminousUnitUniversalActionPolicy.definitionFor(entry.plan?.data?.actionKey)?.phase==='on_turn_end')await executeQueueEntry({...entry,_turnEnd:true},queue,resolvedKeys);

  }

function plannedItemReservations(d,ignoreSlot=-1){

    const targets=plan?planTargetUnitIds(plan,sourceId):[recipient],results=[];

    if(Number(roundEndProgress.round)!==round)roundEndProgress={round,phase:'actions'};
    const domain=value=>JSON.parse(JSON.stringify(value,(key,value)=>
      (key==='slot'&&value?.classList)||key.startsWith('_hp')||value?.nodeType||typeof value==='function'?undefined:key==='combatDeck'&&window.LuminousCombatSlotDeck073?window.LuminousCombatSlotDeck073.compact(value):value));
    return domain({units:combatData,plansByUnit:universalPlansByUnit(),roundEndProgress,queue,resolvedKeys:[...resolvedKeys],activeGrapples,grappleSerial})
  },
  restoreExecution(queue,resolvedKeys,saved){
    const attach=value=>{
      if(Array.isArray(value))return value.map(attach);
      if(value&&typeof value==='object'){
        const result=Object.fromEntries(Object.entries(value).map(([key,item])=>[key,attach(item)]));
        if(result.ownerId&&result.plan)result.slot=unitSlots(result.ownerId)[result.localIndex??0]||null;
        return result
      }
      return value
    };
    for(const [id,unit]of Object.entries(saved.units||{}))if(combatData[id]){
      Object.assign(combatData[id],attach(unit));
      // A pre-effect snapshot must also clear a newer in-memory ledger.
      combatData[id].equipmentEffectTurnLedger=attach(unit.equipmentEffectTurnLedger||{});
    }
    roundEndProgress=Number(saved.roundEndProgress?.round)===round?attach(saved.roundEndProgress):{round,phase:'actions'};
    if(saved.queue?.length)queue.splice(0,queue.length,...attach(saved.queue));
    // JSON duplicates queue plans and roster plans. Reattach by Unit and Slot,
    // preserving the action fingerprint checked by Help rather than searching
    // structurally equal Skills across Units or Slots.
    for(const [id,plans]of Object.entries(saved.plansByUnit||{})){
      if(id===PLAYER_ID&&combatData[id]?.controlled==='player')plannedActions=attach(plans);
      else if(combatData[id])combatData[id].autoPlans=attach(plans);
    }
    for(const entry of queue){
      const plans=plansForUnit(entry.ownerId),index=entry.localIndex??0;
      const canonical=plans[index];
      if(canonical&&window.LuminousUnitUniversalActionRuntime.fingerprint(canonical)===window.LuminousUnitUniversalActionRuntime.fingerprint(entry.plan))entry.plan=canonical;
    }
    for(const key of saved.resolvedKeys||[])resolvedKeys.add(key);
    activeGrapples=attach(saved.activeGrapples||[]);grappleSerial=Number(saved.grappleSerial)||0
  },
  async present(cue,args,visual){
    this.flushPlaybackRefresh();
    const entry=value=>{
      if(Array.isArray(value))return value.map(entry);
      if(value?.ownerId&&value?.plan)return {...value,slot:unitSlots(value.ownerId)[value.localIndex??0]||null};
      return value
    };
    await combatStepRuntime().present(cue,args.map(entry),visual)
  },
  lockPlanning(locked){
    roundRunning=Boolean(locked);
    if(locked){
      planReady=true;
      if(navState!=='root')goRoot();
      if(viewModeActive||analyseModeActive||targetingModeActive)exitSpecialView();
      hideClashForecast()
    }
    $('game-container')?.classList.toggle('round-running',Boolean(locked));
    if($('ready'))$('ready').disabled=Boolean(locked);
    syncReadyControl();window.LuminousCombatHudMotion073?.refresh()
  },
  beginPlayback(turn){
    clearPlaybackVisualChanges();
    round=Math.max(1,Number(turn)||1);
    $('round').textContent=round;
    this.lockPlanning(true);
    timelineResolutionActive=true;
    combatStepRuntime().resetJournal();
    setCameraFocus('full',false)
  },
  cancelPlaybackRefresh:clearPlaybackVisualChanges,
  queuePlaybackRefresh(changes){
    for(const {unitId,fields}of changes){
      let dirty=playbackVisualChanges.get(unitId);
      if(!dirty)playbackVisualChanges.set(unitId,dirty=new Set());
      for(const field of fields)dirty.add(field)
    }
    if(playbackVisualChanges.size&&playbackVisualFrame===null)playbackVisualFrame=requestAnimationFrame(()=>this.flushPlaybackRefresh())
  },
  flushPlaybackRefresh(){
    if(playbackVisualFrame!==null)cancelAnimationFrame(playbackVisualFrame);
    playbackVisualFrame=null;
    if(!playbackVisualChanges.size)return;
    const changes=[...playbackVisualChanges].map(([unitId,fields])=>({unitId,fields:[...fields]}));
    playbackVisualChanges.clear();
    try{this.refreshPlayback(changes)}catch(error){console.warn('[Combat playback visual refresh]',error)}
  },
  refreshPlayback(changes){
    const full=!Array.isArray(changes);
    if(full){window.LuminousCombatStage073?.refresh();window.LuminousCombatHudMotion073?.refresh()}
    const rows=full?Object.keys(combatData).map(unitId=>({unitId,fields:null})):changes;
    let conditions=false,layout=false,fieldHeight=null;
    for(const {unitId:id,fields}of rows){
      const unit=combatData[id];if(!unit)continue;
      const has=(...keys)=>full||keys.some(key=>fields.includes(key));
      if(has('hp','maxHp','sp','shieldPools','observationKnown','lifeState','dead','defeated')){
        syncCombatantVitalNumber(id);
        const token=$(`token-${id}`),pct=combatantHpPct(unit,unit.hp);
        for(const line of token?.querySelectorAll('.hp-fill-line,.hp-transition-line')||[])setHpLinePct(line,pct,0);
        const orb=token?.querySelector('.floating-sp-group');if(orb)orb.textContent=Math.round(unit.sp);
        if(!full&&has('shieldPools'))renderCombatantShield(id,0)
      }
      if(has('statusEffects','pendingStatusEffects')){renderStatusEffects(id);conditions=true;layout=true}
      if(!full&&has('staggerStage','staggerActivatedRound','staggerUntilRound','incapacitated','lifeState','isDowned','isDead','dead','defeated','statusEffects')){syncUnitActionState(id);conditions=true}
      if(!full&&has('x','y','scale','spriteY','deploymentState','battleActive','isBackup')){
        if(fieldHeight===null)fieldHeight=$('battlefield')?.offsetHeight;
        window.LuminousCombatStage073?.refreshUnit(unit,fieldHeight);layout=true
      }
    }
    if(!full&&conditions)syncConditionVisuals();
    if(!full&&layout)window.LuminousCombatHudMotion073?.scheduleStatusLayout?.()
  },
  finishPlayback(next){
    this.flushPlaybackRefresh();
    closeAllFloatingClashHuds();clearTimelineVisualFocus();
    round=Math.max(1,Number(next)||1);$('round').textContent=round;
    plannedActions=[];planReady=false;timelineResolutionActive=false;
    $('game-container').classList.remove('ready-plan-visible');
    Object.values(combatData).forEach(unit=>{unit.autoPlans=[]});
    turnStartDeck();
    this.lockPlanning(false);
    const ready=$('ready');ready.textContent='READY';ready.classList.remove('locked');ready.setAttribute('aria-pressed','false');
    renderAllPlannedSlots();
    setStatus(`TURN ${round} · Planning`)
  }
});
window.LuminousCombat073=Object.freeze({
  version:'0.7.3-live',
  uiState:()=>({round,running:roundRunning,ready:planReady,view:viewModeActive,analyse:analyseModeActive,targeting:targetingModeActive,nav:navState,menu:activeMenu,selectedSlot:selectedSlotIndex}),
  hydrate:hydrateLiveCombat,
  reset:resetLiveCombatants,
  initialize:initializeCombatSurface,
  playerId:()=>PLAYER_ID,
  combatants:()=>combatData,
  speedForBaseRoll,
  kit:id=>UNIT_KITS[id],
  plans:()=>plannedActions,
  chooseTarget(ownerId,slotIndex=0){
    if(!targetingModeActive||!pendingTargetPlan)return false;
    const slot=unitSlots(ownerId).find(node=>Number(node.dataset.slotIndex)===Number(slotIndex));
    if(!slot||!targetSlotIsValid(slot,planTargetRule(pendingTargetPlan,combatData[PLAYER_ID])))return false;
    choosePlayerTarget(slot);
    return !targetingModeActive
  },
  restorePlanning(plans,ready){
    plannedActions=plans;planReady=Boolean(ready);
    $('game-container').classList.toggle('ready-plan-visible',planReady);
    const button=$('ready');button.textContent=planReady?'CANCEL READY':'READY';button.classList.toggle('locked',planReady);button.setAttribute('aria-pressed',String(planReady));
    if(planReady)setCameraFocus('full',false);
    renderAllPlannedSlots();renderTargetArrows();
  },
  setPlayerId:id=>{PLAYER_ID=String(id||'');deckSkills=playerDeckForUnit(PLAYER_ID);return PLAYER_ID},
  setKits:kits=>{Object.entries(kits||{}).forEach(([id,kit])=>{UNIT_KITS[id]=kit});deckSkills=playerDeckForUnit(PLAYER_ID)},
  setRound:value=>{round=Math.max(1,Number(value)||1);return round},
  camera:(mode='player',enabled=true)=>setCameraFocus(mode,enabled),
  render:()=>{if(!combatData[PLAYER_ID]||!$(`sprite-${PLAYER_ID}`))return false;window.LuminousCombatStage073?.refresh();window.LuminousCombatHudMotion073?.refresh();renderAllPlannedSlots();renderTargetArrows();layoutRadialCommands()}
});
window.dispatchEvent(new CustomEvent('luminous:combat073-runtime-ready',{detail:{version:'0.7.3-live'}}));
if(!window.LuminousCombatLiveMode)initializeCombatSurface();
</script>

<script>
/* ========================================================================
   LUMINOUS v0.7.3 — Clash forecast + Level 1 test
   ------------------------------------------------------------------------
   Rendering is intentionally separated from combat rules. Existing JS still
   owns HP, Skills, Coins, Saves, Status, targeting, backup deployment, Clash
   choreography and camera state. This renderer observes that state and paints
   the moving combat world through one WebGL2 canvas.

   DOM remains an invisible/visible interaction overlay where appropriate:
   - menus/tooltips/action-slot hit targets remain DOM;
   - unit HUD text and status popovers remain DOM for readability/accessibility;
   - background, character sprite compositing, target intent curves and Clash
     spark FX are moved to WebGL2;
   - if WebGL2 or an individual cross-origin texture cannot be used, that
     individual visual automatically remains on the old DOM path.
======================================================================== */
(function(){
  const canvas=document.getElementById('webgl2-combat-canvas');
  const host=document.getElementById('game-container');
  const field=document.getElementById('battlefield');
  if(!canvas||!host||!field)return;

  const gl=canvas.getContext('webgl2',{
    alpha:true,
    antialias:true,
    premultipliedAlpha:true,
    depth:false,
    stencil:false,
    preserveDrawingBuffer:false,
    powerPreference:'high-performance'
  });
  if(!gl){
    console.warn('[Luminous] WebGL2 unavailable; keeping DOM renderer.');
    return;
  }

  const VERT_TEX=`#version 300 es
  precision highp float;
  in vec2 a_position;
  in vec2 a_uv;
  uniform vec2 u_resolution;
  out vec2 v_uv;
  void main(){
    vec2 zeroToOne=a_position/u_resolution;
    vec2 clip=zeroToOne*2.0-1.0;
    gl_Position=vec4(clip.x,-clip.y,0.0,1.0);
    v_uv=a_uv;
  }`;
  const FRAG_TEX=`#version 300 es
  precision mediump float;
  uniform sampler2D u_texture;
  uniform float u_alpha;
  in vec2 v_uv;
  out vec4 outColor;
  void main(){
    vec4 c=texture(u_texture,v_uv);
    outColor=vec4(c.rgb,c.a*u_alpha);
  }`;
  const VERT_COLOR=`#version 300 es
  precision highp float;
  in vec2 a_position;
  uniform vec2 u_resolution;
  void main(){
    vec2 zeroToOne=a_position/u_resolution;
    vec2 clip=zeroToOne*2.0-1.0;
    gl_Position=vec4(clip.x,-clip.y,0.0,1.0);
  }`;
  const FRAG_COLOR=`#version 300 es
  precision mediump float;
  uniform vec4 u_color;
  out vec4 outColor;
  void main(){outColor=u_color;}`;

  function shader(type,src){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'Shader compile failed');
    return s
  }
  function program(vs,fs){
    const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p)||'Program link failed');
    return p
  }

  let texProgram,colorProgram;
  try{texProgram=program(VERT_TEX,FRAG_TEX);colorProgram=program(VERT_COLOR,FRAG_COLOR)}
  catch(err){console.error('[Luminous] WebGL2 shader init failed',err);return}

  const texLoc={
    pos:gl.getAttribLocation(texProgram,'a_position'),
    uv:gl.getAttribLocation(texProgram,'a_uv'),
    resolution:gl.getUniformLocation(texProgram,'u_resolution'),
    texture:gl.getUniformLocation(texProgram,'u_texture'),
    alpha:gl.getUniformLocation(texProgram,'u_alpha')
  };
  const colorLoc={
    pos:gl.getAttribLocation(colorProgram,'a_position'),
    resolution:gl.getUniformLocation(colorProgram,'u_resolution'),
    color:gl.getUniformLocation(colorProgram,'u_color')
  };
  const texBuffer=gl.createBuffer(),colorBuffer=gl.createBuffer();
  const textureCache=new Map();
  const particles=[];
  let cssW=0,cssH=0,dpr=1,lastFrame=0,enabled=true;

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.DEPTH_TEST);

  function resize(){
    const w=Math.max(1,host.clientWidth||innerWidth),h=Math.max(1,host.clientHeight||innerHeight),nextDpr=Math.min(2,window.devicePixelRatio||1);
    if(w===cssW&&h===cssH&&nextDpr===dpr)return;
    cssW=w;cssH=h;dpr=nextDpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));
    gl.viewport(0,0,canvas.width,canvas.height)
  }

  function makeTextureFromImage(img,entry){
    try{
      const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      entry.texture=t;entry.width=img.naturalWidth||img.width;entry.height=img.naturalHeight||img.height;entry.ready=true;entry.failed=false;
      return true
    }catch(err){
      entry.failed=true;entry.ready=false;
      return false
    }
  }

  function canUploadTextureUrl(url){
    if(!url)return false;
    try{
      const raw=String(url);
      if(raw.startsWith('data:')||raw.startsWith('blob:'))return true;
      const parsed=new URL(raw,location.href);
      // WebGL cannot legally upload a cross-origin image unless that server
      // explicitly grants CORS. wiki.gg does not, and file:// pages have the
      // opaque origin "null". Do not even request those textures here: the
      // existing DOM image/background remains the visual fallback with zero
      // CORS console spam. Repository/local assets will render through WebGL.
      if(location.protocol==='file:')return parsed.protocol==='file:';
      return parsed.origin===location.origin
    }catch(_){return false}
  }
  function requestTexture(url,onReady){
    if(host.classList.contains('layered-stage')&&url===BG_URL)return null;
    if(!url)return null;
    let entry=textureCache.get(url);
    if(entry){if(entry.ready&&onReady)onReady(entry);return entry}
    entry={url,ready:false,failed:false,blocked:false,texture:null,width:0,height:0};textureCache.set(url,entry);
    if(!canUploadTextureUrl(url)){
      entry.failed=true;entry.blocked=true;
      return entry
    }
    const img=new Image();img.decoding='async';
    img.onload=()=>{if(makeTextureFromImage(img,entry)&&onReady)onReady(entry)};
    img.onerror=()=>{entry.failed=true};
    img.src=url;
    return entry
  }

  function drawTextured(entry,x,y,w,h,{alpha=1,flipX=false,uv=[0,0,1,1]}={}){
    if(!entry?.ready||!entry.texture||w<=0||h<=0)return false;
    const [u0,v0,u1,v1]=uv,lu=flipX?u1:u0,ru=flipX?u0:u1;
    const data=new Float32Array([
      x,y,lu,v0, x+w,y,ru,v0, x,y+h,lu,v1,
      x,y+h,lu,v1, x+w,y,ru,v0, x+w,y+h,ru,v1
    ]);
    gl.useProgram(texProgram);gl.bindBuffer(gl.ARRAY_BUFFER,texBuffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(texLoc.pos);gl.vertexAttribPointer(texLoc.pos,2,gl.FLOAT,false,16,0);
    gl.enableVertexAttribArray(texLoc.uv);gl.vertexAttribPointer(texLoc.uv,2,gl.FLOAT,false,16,8);
    gl.uniform2f(texLoc.resolution,cssW,cssH);gl.uniform1f(texLoc.alpha,alpha);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,entry.texture);gl.uniform1i(texLoc.texture,0);
    gl.drawArrays(gl.TRIANGLES,0,6);return true
  }

  function drawTriangles(points,color){
    if(!points?.length)return;
    gl.useProgram(colorProgram);gl.bindBuffer(gl.ARRAY_BUFFER,colorBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(points),gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(colorLoc.pos);gl.vertexAttribPointer(colorLoc.pos,2,gl.FLOAT,false,0,0);
    gl.uniform2f(colorLoc.resolution,cssW,cssH);gl.uniform4fv(colorLoc.color,color);gl.drawArrays(gl.TRIANGLES,0,points.length/2)
  }

  function lineSegment(a,b,width,color){
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.01)return;
    const nx=-dy/len*width*.5,ny=dx/len*width*.5;
    drawTriangles([
      a.x+nx,a.y+ny,b.x+nx,b.y+ny,a.x-nx,a.y-ny,
      a.x-nx,a.y-ny,b.x+nx,b.y+ny,b.x-nx,b.y-ny
    ],color)
  }
  function circle(cx,cy,r,color,segments=14){
    const pts=[];for(let i=0;i<segments;i++){const a=i*Math.PI*2/segments,b=(i+1)*Math.PI*2/segments;pts.push(cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,cx+Math.cos(b)*r,cy+Math.sin(b)*r)}drawTriangles(pts,color)
  }
  function arrowHead(a,b,size,color){
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    drawTriangles([b.x,b.y,b.x-ux*size+nx*size*.55,b.y-uy*size+ny*size*.55,b.x-ux*size-nx*size*.55,b.y-uy*size-ny*size*.55],color)
  }

  function cssMatrixFlipX(el){
    try{const t=getComputedStyle(el).transform;if(!t||t==='none')return false;const m=new DOMMatrixReadOnly(t);return m.a<0}catch(_){return false}
  }

  const BG_URL='https://limbuscompany.wiki.gg/images/Battle_Alleyways_of_T_Corp._2_BG.png';
  const bg=requestTexture(BG_URL,()=>host.classList.add('webgl2-background-ready'));

  function backgroundUV(entry,w,h){
    if(!entry?.width||!entry?.height)return[0,0,1,1];
    const imageAspect=entry.width/entry.height,viewAspect=w/h;
    if(imageAspect>viewAspect){
      const visible=viewAspect/imageAspect,cut=(1-visible)/2;return[cut,0,1-cut,1]
    }
    const visible=imageAspect/viewAspect;
    // CSS background-position:center bottom: crop from the top, preserve bottom.
    return[0,1-visible,1,1]
  }

  function renderBackground(){
    if(host.classList.contains('player-blinded')){drawTriangles([0,0,cssW,0,0,cssH,0,cssH,cssW,0,cssW,cssH],[0,0,0,1]);return}
    if(host.classList.contains('layered-stage')||!bg?.ready)return;
    const r=field.getBoundingClientRect(),baseW=field.offsetWidth||cssW,baseH=field.offsetHeight||cssH;
    drawTextured(bg,r.left,r.top,r.width,r.height,{uv:backgroundUV(bg,baseW,baseH)});
    // Preserve the original dark readability wash without a CSS gradient pass.
    drawTriangles([0,0,cssW,0,0,cssH,0,cssH,cssW,0,cssW,cssH],[0,0,0,.17])
  }

  function spriteTexture(img){
    const url=img.currentSrc||img.src;if(!url)return null;
    const entry=requestTexture(url,()=>img.classList.add('webgl2-texture-backed'));
    if(entry?.ready)img.classList.add('webgl2-texture-backed');
    return entry
  }

  function renderSprites(){
    const rows=Array.from(document.querySelectorAll('.sprite-img')).map(img=>{
      const token=img.closest('.sprite-container'),style=token?getComputedStyle(token):null,r=img.getBoundingClientRect();
      return{img,token,r,z:Number.parseInt(style?.zIndex)||0,visible:!!token&&style.display!=='none'&&style.visibility!=='hidden'&&r.width>0&&r.height>0}
    }).filter(row=>row.visible).sort((a,b)=>(a.z-b.z)||(a.r.bottom-b.r.bottom));
    rows.forEach(({img,token,r})=>{
      const tex=spriteTexture(img);if(!tex?.ready)return;
      // Mirror DOM spectator, Invisible and Blinded visibility in WebGL2.
      let alpha=token?.classList.contains('timeline-spectator')?0.17:1;
      if(token?.classList.contains('invisible-hidden'))alpha=0;
      else if(token?.classList.contains('invisible-detected'))alpha=Math.min(alpha,.34);
      if(host.classList.contains('player-blinded')&&!token?.classList.contains('blindness-self'))alpha=0;
      drawTextured(tex,r.left,r.top,r.width,r.height,{alpha,flipX:cssMatrixFlipX(img)})
    })
  }

  function parsePath(d){
    const toks=(d||'').match(/[A-Za-z]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi)||[];let i=0,cmd=null,p={x:0,y:0},out=[];
    const n=()=>Number(toks[i++]);
    while(i<toks.length){if(/[A-Za-z]/.test(toks[i]))cmd=toks[i++];if(cmd==='M'){p={x:n(),y:n()};out=[p];cmd=null}
      else if(cmd==='Q'){
        const c={x:n(),y:n()},e={x:n(),y:n()},s=p;for(let k=1;k<=24;k++){const t=k/24,u=1-t;out.push({x:u*u*s.x+2*u*t*c.x+t*t*e.x,y:u*u*s.y+2*u*t*c.y+t*t*e.y})}p=e;cmd=null
      }else if(cmd==='C'){
        const c1={x:n(),y:n()},c2={x:n(),y:n()},e={x:n(),y:n()},s=p;for(let k=1;k<=28;k++){const t=k/28,u=1-t;out.push({x:u*u*u*s.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*e.x,y:u*u*u*s.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*e.y})}p=e;cmd=null
      }else break
    }return out
  }

  const intentColors={
    unopposed:[143/255,215/255,1,0.88],clash:[1,232/255,119/255,0.94],enemy:[1,101/255,82/255,0.9],
    'support-ally':[103/255,221/255,134/255,0.92],'support-enemy':[180/255,124/255,1,0.92]
  };
  function intentToneFromClass(el){for(const k of ['support-ally','support-enemy','enemy','clash','unopposed'])if(el.classList.contains(k))return k;return'unopposed'}
  function renderIntentArrows(){
    const overlay=document.getElementById('target-intent-overlay');if(!overlay)return;
    // The DOM SVG is intentionally transparent while WebGL2 is active. Reading
    // its computed opacity therefore returned 0 and accidentally disabled the
    // GPU arrows too. Visibility comes from combat state instead.
    const opacity=host.classList.contains('round-running')?0:.92;
    if(opacity<=.01)return;
    const fr=field.getBoundingClientRect(),sx=fr.width/(field.offsetWidth||1),sy=fr.height/(field.offsetHeight||1);
    overlay.querySelectorAll('.intent-arrow').forEach(path=>{
      const local=parsePath(path.getAttribute('d')),tone=intentToneFromClass(path),color=[...intentColors[tone]],secondary=path.classList.contains('atk-weight-secondary');color[3]*=opacity;
      const pts=local.map(p=>({x:fr.left+p.x*sx,y:fr.top+p.y*sy}));let dist=0;
      for(let i=1;i<pts.length;i++){
        const seg=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y),draw=!secondary||Math.floor(dist/6)%2===0;
        if(draw)lineSegment(pts[i-1],pts[i],secondary?1.25:1.6,color);dist+=seg
      }
      if(pts.length>1)arrowHead(pts[pts.length-2],pts[pts.length-1],secondary?6:8,color)
    });
    overlay.querySelectorAll('.intent-origin').forEach(dot=>{
      const tone=intentToneFromClass(dot),c=intentColors[tone],x=Number(dot.getAttribute('cx')),y=Number(dot.getAttribute('cy'));circle(fr.left+x*sx,fr.top+y*sy,2.6,c,12)
    })
  }

  function burst(x,y,{kind='clash',range=false}={}){
    particles.push({x,y,kind,range,start:performance.now(),life:310,seed:Math.random()*1000})
  }
  function renderParticles(now){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i],age=now-p.start,t=age/p.life;if(t>=1){particles.splice(i,1);continue}
      const alpha=(1-t)*(t<.18?t/.18:1),core=4+10*Math.sin(Math.min(1,t)*Math.PI),base=p.kind==='hit'?[1,1,.82,alpha]:[1,.84,.35,alpha];
      circle(p.x,p.y,Math.max(1,core*.35),[1,1,.9,alpha],8);
      const rays=p.range?7:10;for(let r=0;r<rays;r++){const a=(r/rays)*Math.PI*2+p.seed*.01,len=(p.range?17:24)+(r%4)*6,travel=7+t*8,A={x:p.x+Math.cos(a)*travel,y:p.y+Math.sin(a)*travel},B={x:p.x+Math.cos(a)*(travel+len*(.25+.75*t)),y:p.y+Math.sin(a)*(travel+len*(.25+.75*t))};lineSegment(A,B,p.range?1:1.6,base)}
    }
  }

  // Route future Clash contact flashes directly to the GPU particle layer.
  const domSpawn=window.spawnClashContactFx;
  if(typeof domSpawn==='function'){
    window.spawnClashContactFx=function(entryA,entryB,opts={}){
      if(enabled&&typeof window.clashFxPoint==='function'){
        const point=window.clashFxPoint(entryA,entryB,{hitTargetId:opts.hitTargetId||null});
        const mode=typeof window.clashPairMode==='function'?window.clashPairMode(entryA,entryB):'';
        burst(point.x,point.y,{kind:opts.kind||'clash',range:mode==='range-range'});return
      }
      return domSpawn(entryA,entryB,opts)
    };
    // Global function declarations can also be referenced directly by old code.
    try{spawnClashContactFx=window.spawnClashContactFx}catch(_){/* ignored */}
  }

  let rafId=0;
  function frame(now){
    rafId=0;if(!enabled)return;resize();gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    renderBackground();renderSprites();renderIntentArrows();renderParticles(now);
    lastFrame=now;if(enabled&&!rafId)rafId=requestAnimationFrame(frame)
  }
  function ensureFrame(){if(enabled&&!rafId)rafId=requestAnimationFrame(frame)}

  host.classList.add('webgl2-renderer-ready');
  ensureFrame();
  window.addEventListener('webglcontextlost',e=>{e.preventDefault();enabled=false;host.classList.remove('webgl2-renderer-ready','webgl2-background-ready');document.querySelectorAll('.webgl2-texture-backed').forEach(el=>el.classList.remove('webgl2-texture-backed'));console.warn('[Luminous] WebGL2 context lost; DOM fallback restored.')});

  window.LuminousWebGL2Renderer={
    version:'0.8.0',
    gl,
    canvas,
    isEnabled:()=>enabled,
    textureCount:()=>Array.from(textureCache.values()).filter(t=>t.ready).length,
    failedTextureCount:()=>Array.from(textureCache.values()).filter(t=>t.failed&&!t.blocked).length,
    blockedTextureCount:()=>Array.from(textureCache.values()).filter(t=>t.blocked).length,
    burst,
    setEnabled(value){
      const next=Boolean(value);if(next===enabled){if(enabled)ensureFrame();return enabled}enabled=next;host.classList.toggle('webgl2-renderer-ready',enabled);if(!enabled){if(rafId){cancelAnimationFrame(rafId);rafId=0}host.classList.remove('webgl2-background-ready');document.querySelectorAll('.webgl2-texture-backed').forEach(el=>el.classList.remove('webgl2-texture-backed'))}else{if(bg?.ready)host.classList.add('webgl2-background-ready');ensureFrame()}return enabled
    }
  };
  console.info('[Luminous] WebGL2 combat renderer active.');
})();
</script>

</body>
