function focusRing(){const panel=$('ui-panel-agatha'),ring=$('command-ring');if(!panel||!ring)return;const r=panel.getBoundingClientRect();ring.style.left=`${r.left+r.width/2-490}px`;ring.style.top=`${r.top-18}px`;if(navState!=='root')positionSubmenu()}function commandFor(m){return document.querySelector(`.command[data-menu="${m}"]`)}function positionSubmenu(){const sub=$('submenu'),cmd=commandFor(activeMenu);if(!cmd)return;const r=cmd.getBoundingClientRect(),gap=20,left=activeMenu==='skills'||activeMenu==='defense';sub.classList.toggle('leftward',left);sub.classList.toggle('rightward',!left);if(left){sub.style.left=`${Math.max(12,r.left-sub.offsetWidth-gap)}px`;sub.style.top=`${Math.max(92,r.top-4)}px`}else{sub.style.left=`${Math.min(innerWidth-sub.offsetWidth-12,r.right+gap)}px`;sub.style.top=`${Math.max(92,r.top-4)}px`}}
function showTooltip(d,e,k='Combat Action'){const t=$('tooltip');tipK('tip-kicker',k);tipK('tip-name',d.name);tipK('tip-body',d.description||'');const ev=$('tip-evolution');ev.style.display=d.evolution?'block':'none';ev.textContent=d.evolution||'';tipK('tip-cost',d.cost||(d.tier?`Tier ${['','I','II','III'][d.tier]} · Deck Skill`:''));t.style.left=`${Math.min(innerWidth-335,e.clientX+18)}px`;t.style.top=`${Math.min(innerHeight-205,e.clientY+16)}px`;t.classList.add('show')}function hideTooltip(){$('tooltip').classList.remove('show')}function makeOption(d,x={}){const b=document.createElement('button');b.className=`option ${x.className||''}`;b.innerHTML=`<div class="option-ink"><b>${d.name}</b><small>${x.meta||d.tag||d.cost||''}</small></div>`;b.onmousemove=e=>showTooltip(d,e,x.kicker||d.tag||'Combat Action');b.onmouseleave=hideTooltip;b.onclick=()=>enterAction(x.selection||{type:activeMenu,slotIndex:selectedSlotIndex,data:d});return b}function stack(){const s=document.createElement('div');s.className='option-stack';return s}
function renderCategory(){const titles={skills:'SKILLS',defense:'DEFENSE',spells:'SPELLS',items:'ITEMS',global:'GLOBAL'};tipK('submenu-title',titles[activeMenu]);tipK('context-slot',`ACTION SLOT ${selectedSlotIndex+1}`);const body=$('submenu-body');body.innerHTML='';const s=stack();if(activeMenu==='skills'){getHand(selectedSlotIndex).forEach((c,i)=>s.appendChild(makeOption(c.skill,{className:i?'newest':'oldest',meta:`${i?'NEWEST':'OLDEST'} · T${['','I','II','III'][c.tier]}`,selection:{type:'deck',slotIndex:selectedSlotIndex,drawId:c.drawId,data:c.skill}})));const l=document.createElement('div');l.className='separator-label';l.textContent='GRANTED / FREE';s.appendChild(l);permanent.granted.forEach(d=>s.appendChild(makeOption(d,{className:'granted',selection:{type:'granted',slotIndex:selectedSlotIndex,data:d}})))}else{const cls=activeMenu==='defense'?'defense':activeMenu==='spells'?'spell':activeMenu==='items'?'item':'global';permanent[activeMenu].forEach(d=>s.appendChild(makeOption(d,{className:cls,selection:{type:activeMenu,slotIndex:selectedSlotIndex,data:d}})))}body.appendChild(s)}
function renderAction(){tipK('submenu-title',activeMenu.toUpperCase());tipK('context-slot',`ACTION SLOT ${selected.slotIndex+1}`);const d=selected.data,body=$('submenu-body');body.innerHTML='';const box=document.createElement('div');box.className='action-focus';box.innerHTML=`<div class="action-focus-name">${d.name}</div><div class="action-focus-meta">${d.tag||d.cost||(d.tier?`Tier ${['','I','II','III'][d.tier]}`:'Combat Action')}</div><div class="action-focus-actions"><button id="action-back">REGRESAR</button><button class="confirm" id="action-confirm">CONFIRMAR</button></div>`;body.appendChild(box);$('action-back').onclick=goBack;$('action-confirm').onclick=executeSelected}
function enterCategory(menu){if(navState!=='root')return;activeMenu=menu;selected=null;navState='category';const ring=$('command-ring');ring.classList.add('category-open');document.querySelectorAll('.command').forEach(b=>b.classList.toggle('active',b.dataset.menu===menu));renderCategory();requestAnimationFrame(()=>{positionSubmenu();$('submenu').classList.add('open')});setStatus(`CATEGORY · ${menu.toUpperCase()} · Slot ${selectedSlotIndex+1}`)}function enterAction(sel){selected=sel;navState='action';$('command-ring').classList.add('action-open');$('submenu').classList.remove('open');setTimeout(()=>{renderAction();positionSubmenu();$('submenu').classList.add('open')},130);setStatus(`ACTION · ${sel.data.name} · Slot ${sel.slotIndex+1}`)}function goRoot(){navState='root';activeMenu=null;selected=null;$('submenu').classList.remove('open');$('command-ring').classList.remove('category-open','action-open');document.querySelectorAll('.command').forEach(b=>b.classList.remove('active'));hideTooltip();setStatus(`ROOT · Slot ${selectedSlotIndex+1} activo`)}function goBack(){if(navState==='action'){navState='category';selected=null;$('command-ring').classList.remove('action-open');$('submenu').classList.remove('open');setTimeout(()=>{renderCategory();positionSubmenu();$('submenu').classList.add('open')},120);setStatus(`CATEGORY · ${activeMenu.toUpperCase()} · Slot ${selectedSlotIndex+1}`)}else if(navState==='category')goRoot()}function selectSlot(i){selectedSlotIndex=i;document.querySelectorAll('.action-slot-wrapper').forEach((n,idx)=>n.classList.toggle('prototype-focus',idx===i));if(navState==='category'){renderCategory();positionSubmenu()}else if(navState==='action'){goBack()}setStatus(`${navState.toUpperCase()} · Slot ${i+1} activo${activeMenu?` · ${activeMenu.toUpperCase()}`:''}`)}function executeSelected(){if(!selected)return setStatus('No hay acción seleccionada');const msg=`${selected.data.name} confirmada en Slot ${selected.slotIndex+1}`;if(selected.type==='deck')markUsed(selected.slotIndex,selected.drawId);goRoot();setStatus(msg)}
document.querySelectorAll('.command').forEach(b=>b.onclick=()=>enterCategory(b.dataset.menu));document.querySelectorAll('.action-slot-wrapper').forEach((s,i)=>s.onclick=()=>selectSlot(i));$('back').onclick=goBack;$('execute').onclick=executeSelected;$('next').onclick=()=>{round++;turnStartDeck();tipK('round',round);goRoot();setStatus(`ON TURN START R${round} · ROOT · Slot ${selectedSlotIndex+1}`)};window.addEventListener('resize',focusRing);window.addEventListener('keydown',e=>{if((e.key==='Escape'||e.key==='Backspace')&&navState!=='root'){e.preventDefault();goBack();return}if(['1','2','3'].includes(e.key)){selectSlot(Number(e.key)-1);return}if(navState==='root'){const map={s:'skills',d:'defense',m:'spells',i:'items',g:'global'},m=map[e.key.toLowerCase()];if(m)enterCategory(m)}});window.addEventListener('contextmenu',e=>{if(navState!=='root'){e.preventDefault();goBack()}});selectSlot(0);goRoot();requestAnimationFrame(focusRing);
</script></body></html>
