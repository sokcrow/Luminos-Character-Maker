ition:relative;z-index:2;font:45px/.78 var(--font-limbus);white-space:nowrap;text-shadow:3px 3px 0 #000}.command .sub{display:block;margin-top:9px;font:900 9px Arial,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:#d4cfc6}.command.left .ink{justify-content:flex-end;text-align:right;padding:14px 78px 12px 20px}.command.left .pivot{right:-8px}.command.right .ink{justify-content:flex-start;text-align:left;padding:14px 20px 12px 78px}.command.right .pivot{left:-8px}.command.right .splash{transform:scaleX(-1)}.command:hover{transform:rotate(var(--rot)) scale(1.08);filter:drop-shadow(11px 12px 0 #000) brightness(1.12)}.command.active .ink{background:#f5efe3;color:#08080b}.command.active .label{text-shadow:none}.command.active .sub{color:#3b352f}.cmd-skills{--accent:var(--menu-red);--rot:-10deg;--w:330px;--origin:100% 55%;left:25px;top:105px}.cmd-defense{--accent:var(--menu-cyan);--rot:7deg;--w:285px;--origin:100% 42%;left:63px;top:225px}.cmd-spells{--accent:var(--menu-violet);--rot:8deg;--w:305px;--origin:0 55%;right:42px;top:95px}.cmd-items{--accent:var(--menu-gold);--rot:-5deg;--w:282px;--origin:0 50%;right:62px;top:222px}.cmd-global{--accent:var(--menu-green);--rot:10deg;--w:310px;--origin:0 45%;right:28px;top:345px}.submenu{position:absolute;z-index:85;display:none;pointer-events:auto}.submenu.open{display:block}.submenu.skills{left:50%;top:67%;transform:translateX(-50%);width:650px}.submenu.left{left:80px;top:370px;width:410px}.submenu.right{right:60px;top:400px;width:420px}.submenu-title{display:inline-block;margin:0 0 7px 10px;font:25px var(--font-limbus);text-shadow:3px 3px 0 #000}.skill-row{display:grid;grid-template-columns:68px 240px 240px;gap:5px;margin-bottom:5px}.slot-tag{min-height:54px;display:flex;align-items:center;justify-content:center;background:#08080b;color:var(--limbus-speed-yellow);font:18px var(--font-limbus);clip-path:polygon(0 18%,80% 0,100% 50%,80% 100%,0 82%)}.option{--accent:#9e8155;position:relative;min-height:54px;border:0;p </style></head><body><div id="game-container"><div class="layer"><div id="battlefield"></div></div><div class="prototype-title">LUMINOUS <b>COMMAND MENU</b> · R<span id="round">1</span></div><div class="prototype-status" id="status">HUD real de Unit + menú externo.</div><div class="prototype-controls"><button id="execute">Simular ejecución</button><button id="next">ON TURN START</button></div><div class="quick-badge">QUICK ACTION <strong>1 / 1</strong></div><div class="offdeck-badge">OFF-DECK: <b>Blood Reprise</b> · Trigger automático</div><nav class="command-ring"><button class="command left cmd-skills active" data-menu="skills"><span class="splash"></span><span class="ink"><span class="label">SKILLS<span class="sub">Deck + Granted</span></span></span><span class="pivot">S</span></button><button class="command left cmd-defense" data-menu="defense"><span class="splash"></span><span class="ink"><span class="label">DEFENSE<span class="sub">Permanent</span></span></span><span class="pivot">D</span></button><button class="command right cmd-spells" data-menu="spells"><span class="splash"></span><span class="ink"><span class="label">SPELLS<span class="sub">Spellbook</span></span></span><span class="pivot">M</span></button><button class="command right cmd-items" data-menu="items"><span class="splash"></span><span class="ink"><span class="label">ITEMS<span class="sub">Inventory</span></span></span><span class="pivot">I</span></button><button class="command right cmd-global" data-menu="global"><span class="splash"></span><span class="ink"><span class="label">GLOBAL<span class="sub">Universal Actions</span></span></span><span class="pivot">G</span></button></nav><section class="submenu skills open" id="submenu"><div class="submenu-title" id="submenu-title">SKILLS · ACTION SLOTS</div><div id="submenu-body"></div></section><aside class="tooltip" id="tooltip"><div class="tip-kicker" id="tip-kicker"></div><div class="tip-name" id="tip-name"></div><div class="tip-body" id="tip-bod let combatData={},round=1,activeMenu='skills',selected=null;const Deck=window.LuminousDeckEngine||window.DeckEngine;function updateDepthSorting(){document.querySelectorAll('.sprite-container').forEach(s=>{const y=parseFloat(s.style.bottom);s.style.zIndex=Math.floor(1000-y*10)})}function generateHeptagonPoints(radius){const sides=7,points=[],startAngle=Math.PI/2;for(let i=0;i<sides;i++){const angle=startAngle+i*2*Math.PI/sides;points.push({x:(radius*Math.cos(angle)).toFixed(1),y:(radius*Math.sin(angle)).toFixed(1)})}const fullPoly=points.map(p=>`${p.x},${p.y}`).join(' '),frontHalf=`${points[5].x},${points[5].y} ${points[6].x},${points[6].y} ${points[0].x},${points[0].y} ${points[1].x},${points[1].y} ${points[2].x},${points[2].y}`;return{full:fullPoly,front:frontHalf}}function spawnCombatant(data){const battlefield=document.getElementById('battlefield'),hpPct=Math.max(0,Math.min(100,data.hp/data.maxHp*100));if(!combatData[data.id])combatData[data.id]={...data};const unit=combatData[data.id],slotsHtml=Array.from({length:unit.actionSlots}).map((_,i)=>{const slotId=`${data.id}_slot_${i}`;return `<div class="action-slot-wrapper" id="${slotId}" data-faction="${data.faction}"><svg class="action-slot-svg" viewBox="0 0 100 100"><polygon class="slot-heptagon-bg" points="50,95 15,78 6,40 30,9 70,9 94,40 85,78"/><line class="slot-center-line" x1="25" y1="50" x2="75" y2="50"/></svg></div>`}).join(''),container=document.createElement('div');container.className=`sprite-container ${data.faction} ${data.menuFocus?'menu-focus-token':''}`;container.id=`token-${data.id}`;container.style.bottom=`${data.y}%`;container.style.left=`${data.x}%`;const heptagon=generateHeptagonPoints(85),uiHtml=`<svg class="diegetic-floor" viewBox="-100 -100 200 200"><polygon class="floor-bg-poly" points="${heptagon.full}"/><polyline class="hp-track" points="${heptagon.front}"/><polyline class="hp-fill-line" points="${heptagon.front}" pathLength="100" style="stroke-dasharray:100;stroke-dashoffset:${100-hpPct};"/></svg>`;container.innerHTML=`<div class="combatant">${uiHtml}<div class="top-ui-panel" style="top:calc(60px + ${unit.uiY}px);left:calc(80px + ${unit.uiX}px);"><div class="speed-number">${data.speed}</div><div class="action-slots">${slotsHtml}</div></div><div class="sprite-anchor" style="bottom:${unit.spriteY}px;margin-left:${unit.spriteX}px;transform:scale(${unit.scale});"><img src="${data.img}" class="sprite-img"></div><div class="floating-hp-group"><div class="name-plate">${data.name}</div><div class="hp-number">${data.hp}</div></div><div class="floating-sp-group sp-neutral">${data.sp??0}</div></div>`;battlefield.appendChild(container);updateDepthSorting()}
const skill=(id,name,tier,description,evolution='')=>({id,name,tier,availability:{type:'deck'},description,evolution,economy:{action:true}}),deckSkills=[skill('needle_drive','Needle Drive',1,'Pierce · 2 Coins · aplica Bleed.','Skill 1-1 — Si Target tiene 6+ Bleed, cambia al ejecutar.'),skill('rupture_line','Rupture Line',1,'Pierce · mantiene Rupture Count.'),skill('blood_arc','Blood Arc',2,'Slash · gana Coin Power según Bleed.'),skill('severing_step','Severing Step',2,'Slash · aplica Bleed Count.'),skill('red_nail','Red Nail',3,'Pierce · 3 Coins.','Skill 3-1 — Si Target Bleed ≥ 6 al ejecutar: Open Wound.'),skill('scarlet_end','Scarlet End',3,'Heavy Pierce · usa Rupture.')],unit={id:'agatha'};Deck.initDeck(unit,deckSkills);Deck.onTurnStart(unit,{round,slotCount:3});const permanent={granted:[{name:'Perforar',tag:'Granted · Weapon',description:'Skill otorgada por arma. No ocupa Deck.',cost:'Action / Quick / Reaction según definición'}],defense:[{name:'Guard',tag:'Defense',description:'Defensive Skill permanente.',cost:'1 Action Slot'}],spells:[{name:'Blood Sigil',tag:'Spell',description:'Spell fuera del Deck.',cost:'1 Action Slot + recurso'}],items:[{name:'Healing Vial',tag:'Item',description:'Recupera HP.',cost:'Action o Quick si se permite'}],global:[{name:'Grapple',tag:'Universal',description:'STR/Athletics vs DEX/Acrobatics.',cost:'1 Action Slot'},{name:'Help',tag:'Universal',description:'+1 Final Power.',cost:'1 Action Slot'},{name:'Retreat',tag:'Universal',description:'On Turn End.',cost:'1 Action Slot'},{name:'Escape',tag:'Universal',description:'Salida del Encounter.',cost:'1 Action Slot'}]};function tipK(id,v){document.getElementById(id).textContent=v}function showTooltip(data,e,k='Combat Action'){const t=document.getElementById('tooltip');tipK('tip-kicker',k);tipK('tip-name',data.name);tipK('tip-body',data.description||'');const ev=document.getElementById('tip-evolution');ev.style.display=data.evolution?'block':'none';ev.textContent=data.evolution||'';tipK('tip-cost',data.cost||(data.tier?`Tier ${['','I','II','III'][data.tier]} · Deck Skill`:''));t.style.left=`${Math.min(innerWidth-345,e.clientX+18)}px`;t.style.top=`${Math.min(innerHeight-210,e.clientY+16)}px`;t.classList.add('show')}function hideTooltip(){document.getElementById('tooltip').classList.remove('show')}function makeOption(data,x={}){const b=document.createElement('button');b.className=`option ${x.className||''}`;b.innerHTML=`<div class="option-ink"><b>${data.name}</b><small>${x.meta||data.tag||data.cost||''}</small></div>`;b.onmousemove=e=>showTooltip(data,e,x.kicker||data.tag||'Combat Action');b.onmouseleave=hideTooltip;b.onclick=()=>{document.querySelectorAll('.option.selected').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');selected=x.selection||{type:activeMenu,data};tipK('status',`${data.name} seleccionada.`)};return b}function renderSkills(){const body=document.getElementById('submenu-body');body.innerHTML='';for(let i=0;i<3;i++){const slotId=`agatha_slot_${i}`,hand=Deck.getSlotHand(unit,slotId),row=document.createElement('div');row.className='skill-row';const tag=document.createElement('div');tag.className='slot-tag';tag.textContent=`SLOT ${i+1}`;row.appendChild(tag);hand.forEach((card,index)=>row.appendChild(makeOption(card.skill,{className:index?'newest':'oldest',meta:`${index?'NEWEST':'OLDEST'} · T${['','I','II','III'][card.tier]}`,selection:{type:'deck',slotId,drawId:card.drawId,data:card.skill}})));body.appendChild(row)}const l=document.createElement('div');l.className='permanent-label';l.textContent='GRANTED / FREE — FUERA DEL DECK';body.appendChild(l);permanent.granted.forEach(d=>body.appendChild(makeOption(d,{className:'granted',selection:{type:'granted',data:d}})))}function renderSimple(key){const body=document.getElementById('submenu-body');body.innerHTML='';const s=document.createElement('div');s.className='simple-stack';permanent[key].forEach(d=>s.appendChild(makeOption(d,{selection:{type:key,data:d}})));body.appendChild(s)}function renderMenu(){const titles={skills:'SKILLS · ACTION SLOTS',defense:'DEFENSE',spells:'SPELLS',items:'ITEMS',global:'GLOBAL ACTIONS'};tipK('submenu-title',titles[activeMenu]);const sub=document.getElementById('submenu');sub.className=`submenu open ${activeMenu==='skills'?'skills':activeMenu==='defense'?'left':'right'}`;activeMenu==='skills'?renderSkills():renderSimple(activeMenu);document.querySelectorAll('.command').forEach(b=>b.classList.toggle('active',b.dataset.menu===activeMenu))}document.querySelectorAll('.command').forEach(b=>b.onclick=()=>{activeMenu=b.dataset.menu;selected=null;renderMenu()});document.getElementById('execute').onclick=()=>{if(!selected)return tipK('status','Selecciona una acción.');if(selected.type==='deck'){Deck.markCardUsed(unit,selected.slotId,selected.drawId);tipK('status',`${selected.data.name} comenzó ejecución: cuenta como usada.`)}else tipK('status',`${selected.data.name} ejecutada; no altera Deck.`)};document.getElementById('next').onclick=()=>{round++;Deck.onTurnStart(unit,{round,slotCount:3});tipK('round',round);selected=null;renderMenu();tipK('status',`ON TURN START R${round}: Slots rotaron independientemente.`)};spawnCombatant({id:'agatha',name:'Agatha',faction:'ally',speed:8,hp:216,maxHp:216,sp:0,actionSlots:3,img:'https://i.imgur.com/24qV5kD.png',x:50,y:31,scale:1,spriteX:0,spriteY:0,uiX:0,uiY:0,menuFocus:true});document.querySelectorAll('.action-slot-wrapper').forEach((slot,i)=>slot.onclick=()=>{activeMenu='skills';document.querySelectorAll('.action-slot-wrapper').forEach(n=>n.classList.toggle('prototype-focus',n===slot));renderMenu();tipK('status',`Slot ${i+1} enfocado.`)});document.getElementById('agatha_slot_0').classList.add('prototype-focus');renderMenu();
</script></body></html>
