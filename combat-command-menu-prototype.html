<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminous Combat Command Menu Prototype v4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

/* === HUD DE UNIT: copiado de la estructura entregada para el motor === */
:root {
    --limbus-hp-orange: #ff4a22;
    --limbus-hp-boss: #dd0000;
    --limbus-sp-cyan: #88eeff;
    --limbus-speed-yellow: #ffe877;
    --limbus-speed-glow: #ff4400;
    --limbus-slot-dark: #1a1510;
    --limbus-slot-border: #4a3520;
    --limbus-slot-dash: #a87030;
    --limbus-boss-ui-bg: rgba(10, 5, 5, 0.9);
    --limbus-boss-ui-border: #664422;
    --font-limbus: 'Bebas Kai', 'Bebas Neue', sans-serif;
    --menu-red:#ff3423;
    --menu-cyan:#5ce9ff;
    --menu-violet:#b888ff;
    --menu-gold:#ffd34e;
    --menu-green:#7ce28d;
}

* { box-sizing: border-box; }
body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #050010; font-family: 'Arial', sans-serif; color: #fff; }
button { font: inherit; }
#game-container { position: relative; width: 100vw; height: 100vh; }
.layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: opacity 0.4s ease; }
#battlefield {
    position: relative; width: 100%; height: 100%;
    background-image: linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.32)), url('https://limbuscompany.wiki.gg/images/Battle_Alleyways_of_T_Corp._2_BG.png');
    background-size: cover; background-position: center bottom; background-repeat: no-repeat;
}

.sprite-container { position: absolute; transform: translateX(-50%); transition: transform 0.6s ease, left 0.6s ease, bottom 0.6s ease; pointer-events: none; }
.combatant { position: relative; width: 260px; height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; pointer-events: none; transform-origin: bottom center; transform: scale(0.30); }

.diegetic-floor { position: absolute; bottom: -110px; width: 220px; height: 220px; transform: rotateX(65deg); z-index: 1; overflow: visible; pointer-events: auto; }
.floor-bg-poly { fill: rgba(255, 80, 0, 0.2); stroke: rgba(255, 200, 50, 0.5); stroke-width: 3; }
.hp-track { fill: none; stroke: rgba(30, 5, 5, 0.8); stroke-width: 22; stroke-linecap: butt; }
.hp-fill-line { fill: none; stroke: var(--limbus-hp-orange); stroke-width: 22; transition: stroke-dashoffset 0.4s ease-out; filter: drop-shadow(0px 0px 10px var(--limbus-hp-orange)); }

.boss-ui-rect { position: absolute; bottom: -90px; width: 350px; height: 60px; background: var(--limbus-boss-ui-bg); border: 3px solid var(--limbus-boss-ui-border); border-radius: 4px; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(100,50,0,0.5); pointer-events: auto; }
.boss-hp-bar-container { width: 95%; height: 25px; background: #220000; border: 2px solid #441111; position: relative; overflow: hidden; }
.boss-hp-fill-rect { height: 100%; background: var(--limbus-hp-boss); width: 100%; transition: width 0.4s ease-out; filter: drop-shadow(0px 0px 8px var(--limbus-hp-boss)); }
.boss .floating-hp-group { bottom: 10px; left: 15px; }
.boss .name-plate { font-size: 18px; }
.boss .hp-number { font-size: 45px; color: var(--limbus-hp-boss); text-shadow: 2px 2px 0 #000; }

.sprite-anchor { position: absolute; display: flex; justify-content: center; width: 100%; z-index: 3; pointer-events: none; transition: transform 0.2s ease, left 0.2s ease, bottom 0.2s ease; transform-origin: bottom center; }
.sprite-img { height: 240px; object-fit: contain; object-position: bottom; filter: drop-shadow(0px 15px 10px rgba(0,0,0,0.8)); transition: transform 0.2s; pointer-events: auto; cursor: pointer; }
.sprite-img:hover { transform: scale(1.05); }
.enemy.boss .sprite-img { transform: scaleX(-1); }

.top-ui-panel { position: absolute; display: flex; align-items: flex-start; gap: 6px; z-index: 10; pointer-events: none; }
.boss .top-ui-panel { transform: translateX(-50%); left: 50% !important; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.boss .action-slots { gap: 1px; }
.speed-number { color: var(--limbus-speed-yellow); font-size: 50px; font-family: var(--font-limbus); line-height: 0.8; text-shadow: 0 0 8px var(--limbus-speed-glow), 1px 1px 2px #000; margin-top: 8px; }
.action-slots { display: flex; gap: 2px; pointer-events: auto; }
.action-slot-wrapper { position: relative; touch-action: none; cursor: crosshair; pointer-events: auto; }
.action-slot-svg { width: 44px; height: 44px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8)); pointer-events: none; }
.slot-heptagon-bg { fill: var(--limbus-slot-dark); stroke: var(--limbus-slot-border); stroke-width: 10; }
.slot-center-line { stroke: var(--limbus-slot-dash); stroke-width: 8; stroke-linecap: round; }
.action-slot-wrapper.prototype-focus { filter: drop-shadow(0 0 5px var(--limbus-speed-yellow)); }

.floating-hp-group { position: absolute; bottom: 5px; left: -10px; z-index: 10; display: flex; flex-direction: column; align-items: flex-start; pointer-events: none; }
.name-plate { background: #050505; color: #ddd; font-size: 14px; letter-spacing: 1px; font-family: var(--font-limbus); padding: 2px 6px; border: 1px solid #333; border-radius: 4px; text-transform: uppercase; margin-bottom: -2px; }
.hp-number { font-size: 60px; color: var(--limbus-hp-orange); font-family: var(--font-limbus); line-height: 0.85; text-shadow: 2px 4px 6px rgba(0,0,0,0.8); }
.floating-sp-group { position: absolute; bottom: 5px; right: 5px; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #3b2c20; outline: 1px solid #000; display: flex; align-items: center; justify-content: center; font-size: 30px; font-family: var(--font-limbus); color: white; text-shadow: 1px 1px 3px black; z-index: 10; pointer-events: none; }
.sp-neutral { background: radial-gradient(circle at 30% 30%, #55aaaa 0%, #113333 80%); }

/* Sólo la cámara/foco del prototipo amplía el token entero. El HUD interno no se reacomoda. */
.sprite-container.menu-focus-token { transform: translateX(-50%) scale(2.35); transform-origin: bottom center; }

/* === PROTOTIPO DEL MENÚ: capa externa, no toca el HUD === */
.prototype-title { position:absolute; z-index:100; left:24px; top:18px; font:28px var(--font-limbus); letter-spacing:1.6px; text-shadow:3px 3px 0 #000; }
.prototype-title b { color:var(--limbus-hp-orange); }
.prototype-status { position:absolute; z-index:100; left:25px; top:55px; max-width:560px; font-size:10px; color:#c8bfb1; background:rgba(0,0,0,.5); padding:5px 8px; }
.prototype-controls { position:absolute; z-index:100; right:25px; top:20px; display:flex; gap:7px; }
.prototype-controls button { background:rgba(7,7,10,.9); color:#ddd; border:1px solid #6f5e49; padding:6px 10px; cursor:pointer; text-transform:uppercase; font-size:10px; font-weight:900; }
.prototype-controls button:hover { border-color:var(--limbus-hp-orange); color:#fff; }
.quick-badge { position:absolute; z-index:100; right:28px; top:59px; font:18px var(--font-limbus); letter-spacing:1px; text-shadow:2px 2px 0 #000; }
.quick-badge strong { color:var(--limbus-speed-yellow); }
.offdeck-badge { position:absolute; z-index:100; left:26px; bottom:18px; font-size:9px; letter-spacing:1px; color:#a69d90; text-transform:uppercase; }
.offdeck-badge b { color:#f0cf8a; }

.command-ring { position:absolute; z-index:70; left:50%; top:50%; width:1000px; height:650px; transform:translate(-50%,-50%); pointer-events:none; }
.command { --accent:#fff; --rot:0deg; --w:285px; position:absolute; width:var(--w); height:92px; border:0; background:transparent; color:#fff; cursor:pointer; pointer-events:auto; transform:rotate(var(--rot)); transform-origin:var(--origin,50% 50%); transition:transform .1s ease,filter .1s ease; filter:drop-shadow(8px 9px 0 rgba(0,0,0,.65)); }
.command .splash { position:absolute; inset:13px -18px 4px -24px; background:var(--accent); clip-path:polygon(0 58%,14% 30%,39% 16%,63% 23%,79% 0,100% 25%,88% 55%,100% 78%,67% 73%,41% 100%,17% 76%); opacity:.97; }
.command .ink { position:absolute; inset:0; background:#050507; display:flex; align-items:center; clip-path:polygon(0 34%,8% 14%,36% 7%,68% 0,100% 22%,94% 53%,100% 84%,61% 80%,21% 100%,4% 79%); }
.command .pivot { position:absolute; z-index:4; top:16px; width:60px; height:60px; border-radius:50%; background:#050507; border:5px solid #fff; box-shadow:0 0 0 4px #050507; color:var(--accent); display:grid; place-items:center; font:31px var(--font-limbus); }
.command .label { position:relative; z-index:2; font:45px/.78 var(--font-limbus); letter-spacing:1px; white-space:nowrap; text-shadow:3px 3px 0 #000; }
.command .sub { display:block; margin-top:9px; font:900 9px Arial,sans-serif; letter-spacing:1.4px; text-transform:uppercase; color:#d4cfc6; }
.command.left .ink { justify-content:flex-end; text-align:right; padding:14px 78px 12px 20px; }
.command.left .pivot { right:-8px; }
.command.right .ink { justify-content:flex-start; text-align:left; padding:14px 20px 12px 78px; }
.command.right .pivot { left:-8px; }
.command.right .splash { transform:scaleX(-1); }
.command:hover { transform:rotate(var(--rot)) scale(1.08); filter:drop-shadow(11px 12px 0 #000) brightness(1.12); }
.command.active .ink { background:#f5efe3; color:#08080b; }
.command.active .label { text-shadow:none; }
.command.active .sub { color:#3b352f; }
.cmd-skills { --accent:var(--menu-red); --rot:-10deg; --w:330px; --origin:100% 55%; left:25px; top:105px; }
.cmd-defense { --accent:var(--menu-cyan); --rot:7deg; --w:285px; --origin:100% 42%; left:63px; top:225px; }
.cmd-spells { --accent:var(--menu-violet); --rot:8deg; --w:305px; --origin:0 55%; right:42px; top:95px; }
.cmd-items { --accent:var(--menu-gold); --rot:-5deg; --w:282px; --origin:0 50%; right:62px; top:222px; }
.cmd-global { --accent:var(--menu-green); --rot:10deg; --w:310px; --origin:0 45%; right:28px; top:345px; }

.submenu { position:absolute; z-index:85; display:none; pointer-events:auto; }
.submenu.open { display:block; }
.submenu.skills { left:50%; top:67%; transform:translateX(-50%); width:650px; }
.submenu.left { left:80px; top:370px; width:410px; }
.submenu.right { right:60px; top:400px; width:420px; }
.submenu-title { display:inline-block; margin:0 0 7px 10px; font:25px var(--font-limbus); letter-spacing:1.2px; text-shadow:3px 3px 0 #000; transform:rotate(-2deg); }
.skill-row { display:grid; grid-template-columns:68px 240px 240px; gap:5px; margin-bottom:5px; }
.slot-tag { min-height:54px; display:flex; align-items:center; justify-content:center; background:#08080b; color:var(--limbus-speed-yellow); font:18px var(--font-limbus); clip-path:polygon(0 18%,80% 0,100% 50%,80% 100%,0 82%); }
.option { --accent:#9e8155; position:relative; min-height:54px; border:0; padding:0; background:transparent; color:#fff; cursor:pointer; text-align:left; transition:transform .08s ease, filter .08s ease; }
.option::before { content:""; position:absolute; inset:4px -7px -2px 0; background:var(--accent); clip-path:polygon(0 45%,17% 12%,80% 0,100% 40%,89% 100%,24% 86%); opacity:.82; }
.option-ink { position:relative; z-index:1; min-height:54px; padding:8px 13px 7px 16px; background:#07070a; clip-path:polygon(0 14%,88% 0,100% 44%,91% 100%,7% 88%); }
.option b { display:block; font:21px/.92 var(--font-limbus); }
.option small { display:block; margin-top:5px; font-size:9px; font-weight:900; letter-spacing:.7px; text-transform:uppercase; opacity:.72; }
.option.oldest { --accent:#a57b3c; }
.option.newest { --accent:var(--menu-red); }
.option.granted { --accent:#d4ad56; }
.option:hover,.option.selected { transform:translateX(7px) rotate(-1deg); filter:brightness(1.18) drop-shadow(5px 6px 0 #000); }
.option:hover .option-ink,.option.selected .option-ink { background:#f4efe6; color:#09090b; }
.permanent-label { margin:7px 0 4px 74px; font:14px var(--font-limbus); letter-spacing:1px; color:#d6ccbe; }
.simple-stack { width:360px; display:flex; flex-direction:column; gap:6px; }

.tooltip { position:absolute; z-index:110; display:none; width:330px; pointer-events:none; background:rgba(5,5,8,.97); border-left:5px solid var(--tip-accent,var(--menu-gold)); padding:10px 13px; box-shadow:8px 8px 0 rgba(0,0,0,.58); clip-path:polygon(0 0,95% 0,100% 12%,100% 100%,5% 100%,0 88%); }
.tooltip.show { display:block; }
.tip-kicker { font-size:9px; text-transform:uppercase; letter-spacing:1.4px; color:#c7bcad; font-weight:900; }
.tip-name { font:25px/1 var(--font-limbus); margin:3px 0 6px; }
.tip-body { font-size:11px; line-height:1.35; color:#ddd5ca; }
.tip-evolution { display:none; margin-top:7px; padding:6px 8px; border-left:3px solid var(--menu-red); background:rgba(255,52,35,.1); font-size:10px; line-height:1.3; }
.tip-cost { margin-top:7px; font-size:9px; color:#aaa194; text-transform:uppercase; letter-spacing:.6px; }

@media (max-width:1300px) {
    .command-ring { transform:translate(-50%,-50%) scale(.88); }
    .submenu.skills { transform:translateX(-50%) scale(.9); transform-origin:top center; }
}
</style>
</head>
<body>
<div id="game-container">
    <div id="combat-mode" class="layer"><div id="battlefield"></div></div>

    <div class="prototype-title">LUMINOUS <b>COMMAND MENU</b> · R<span id="round">1</span></div>
    <div class="prototype-status" id="status">El HUD de la Unit lo genera spawnCombatant(). El menú es una capa externa.</div>
    <div class="prototype-controls"><button id="execute">Simular ejecución</button><button id="next">ON TURN START</button></div>
    <div class="quick-badge">QUICK ACTION <strong>1 / 1</strong></div>
    <div class="offdeck-badge">OFF-DECK: <b>Blood Reprise</b> · Trigger automático</div>

    <nav class="command-ring">
        <button class="command left cmd-skills active" data-menu="skills"><span class="splash"></span><span class="ink"><span class="label">SKILLS<span class="sub">Deck + Granted</span></span></span><span class="pivot">S</span></button>
        <button class="command left cmd-defense" data-menu="defense"><span class="splash"></span><span class="ink"><span class="label">DEFENSE<span class="sub">Permanent</span></span></span><span class="pivot">D</span></button>
        <button class="command right cmd-spells" data-menu="spells"><span class="splash"></span><span class="ink"><span class="label">SPELLS<span class="sub">Spellbook</span></span></span><span class="pivot">M</span></button>
        <button class="command right cmd-items" data-menu="items"><span class="splash"></span><span class="ink"><span class="label">ITEMS<span class="sub">Inventory</span></span></span><span class="pivot">I</span></button>
        <button class="command right cmd-global" data-menu="global"><span class="splash"></span><span class="ink"><span class="label">GLOBAL<span class="sub">Universal Actions</span></span></span><span class="pivot">G</span></button>
    </nav>

    <section class="submenu skills open" id="submenu"><div class="submenu-title" id="submenu-title">SKILLS · ACTION SLOTS</div><div id="submenu-body"></div></section>
    <aside class="tooltip" id="tooltip"><div class="tip-kicker" id="tip-kicker"></div><div class="tip-name" id="tip-name"></div><div class="tip-body" id="tip-body"></div><div class="tip-evolution" id="tip-evolution"></div><div class="tip-cost" id="tip-cost"></div></aside>
</div>

<script src="js/deckEngine.js"></script>
<script>
let combatData = {};
let round = 1;
let activeMenu = 'skills';
let selected = null;
const Deck = window.LuminousDeckEngine || window.DeckEngine;

function updateDepthSorting() {
    const sprites = document.querySelectorAll('.sprite-container');
    sprites.forEach(sprite => {
        const y = parseFloat(sprite.style.bottom);
        sprite.style.zIndex = Math.floor(1000 - (y * 10));
    });
}

/* Literal de la geometría entregada para el HUD. */
function generateHeptagonPoints(radius) {
    const sides = 7; const points = []; const startAngle = Math.PI / 2;
    for (let i = 0; i < sides; i++) {
        const angle = startAngle + (i * 2 * Math.PI / sides);
        points.push({ x: (radius * Math.cos(angle)).toFixed(1), y: (radius * Math.sin(angle)).toFixed(1) });
    }
    const fullPoly = points.map(p => `${p.x},${p.y}`).join(' ');
    const frontHalf = `${points[5].x},${points[5].y} ${points[6].x},${points[6].y} ${points[0].x},${points[0].y} ${points[1].x},${points[1].y} ${points[2].x},${points[2].y}`;
    return { full: fullPoly, front: frontHalf };
}

/* El menú no replica este HUD: ésta es la Unit real del prototipo. */
function spawnCombatant(data) {
    const battlefield = document.getElementById('battlefield');
    const hpPct = Math.max(0, Math.min(100, (data.hp / data.maxHp) * 100));

    if (!combatData[data.id]) combatData[data.id] = { ...data };
    const unit = combatData[data.id];

    const slotsHtml = Array.from({length: unit.actionSlots}).map((_, i) => {
        const slotId = `${data.id}_slot_${i}`;
        return `
            <div class="action-slot-wrapper" id="${slotId}" data-faction="${data.faction}">
                <svg class="action-slot-svg" viewBox="0 0 100 100">
                    <polygon class="slot-heptagon-bg" points="50,95 15,78 6,40 30,9 70,9 94,40 85,78" />
                    <line class="slot-center-line" x1="25" y1="50" x2="75" y2="50" />
                </svg>
            </div>`;
    }).join('');

    const container = document.createElement('div');
    container.className = `sprite-container ${data.faction} ${unit.type || ''} ${data.menuFocus ? 'menu-focus-token' : ''}`;
    container.id = `token-${data.id}`;
    container.style.bottom = `${data.y}%`;
    container.style.left = `${data.x}%`;

    let uiHtml = '';
    if (unit.type === 'boss') {
        uiHtml = `<div class="boss-ui-rect"><div class="boss-hp-bar-container"><div id="svg-hp-${data.id}" class="boss-hp-fill-rect" pathLength="100" style="width:${hpPct}%;"></div></div></div>`;
    } else {
        const heptagon = generateHeptagonPoints(85);
        uiHtml = `
            <svg class="diegetic-floor" viewBox="-100 -100 200 200">
                <polygon class="floor-bg-poly" points="${heptagon.full}" />
                <polyline class="hp-track" points="${heptagon.front}" />
                <polyline id="svg-hp-${data.id}" class="hp-fill-line" points="${heptagon.front}" pathLength="100" style="stroke-dasharray:100;stroke-dashoffset:${100-hpPct};" />
            </svg>`;
    }

    container.innerHTML = `
        <div class="combatant">
            ${uiHtml}
            <div class="top-ui-panel" id="ui-panel-${data.id}" style="top:calc(60px + ${unit.uiY}px);left:calc(80px + ${unit.uiX}px);margin-left:${unit.type === 'boss' ? unit.uiX : 0}px;">
                <div class="speed-number">${data.speed}</div>
                <div class="action-slots">${slotsHtml}</div>
            </div>
            <div class="sprite-anchor" id="anchor-${data.id}" style="bottom:${unit.spriteY}px;margin-left:${unit.spriteX}px;transform:scale(${unit.scale});">
                <img src="${data.img}" class="sprite-img" onerror="this.src='https://via.placeholder.com/200x200/500/fff?text=Error'">
            </div>
            <div class="floating-hp-group"><div class="name-plate">${data.name}</div><div class="hp-number" id="text-hp-${data.id}">${data.hp}</div></div>
            <div class="floating-sp-group sp-neutral">${data.sp ?? 0}</div>
        </div>`;
    battlefield.appendChild(container);
    updateDepthSorting();
}

const skill = (id,name,tier,description,evolution='') => ({id,name,tier,availability:{type:'deck'},description,evolution,economy:{action:true,quickAction:false,reaction:false}});
const deckSkills = [
    skill('needle_drive','Needle Drive',1,'Pierce · 2 Coins · aplica Bleed.','Skill 1-1 — Si Target tiene 6+ Bleed, la ejecución cambia temporalmente.'),
    skill('rupture_line','Rupture Line',1,'Pierce · mantiene Rupture Count.'),
    skill('blood_arc','Blood Arc',2,'Slash · gana Coin Power según Bleed.','Skill 2-1 — Si la Unit cumple su criterio, cambia al ejecutar.'),
    skill('severing_step','Severing Step',2,'Slash · en Clash Win aplica Bleed Count.'),
    skill('red_nail','Red Nail',3,'Pierce · 3 Coins · alto impacto.','Skill 3-1 — Si Target Bleed ≥ 6 al ejecutar: Open Wound.'),
    skill('scarlet_end','Scarlet End',3,'Heavy Pierce · usa Rupture para daño adicional.','Skill 3-1 — Su propia definición controla la evolución.')
];

const unit = { id:'agatha', name:'Agatha' };
Deck.initDeck(unit, deckSkills);
Deck.onTurnStart(unit,{round,slotCount:3});

const permanent = {
    granted:[{name:'Perforar',tag:'Granted · Weapon',description:'Skill otorgada por arma. No ocupa Deck.',cost:'Action / Quick / Reaction según su definición'}],
    defense:[{name:'Guard',tag:'Defense',description:'Defensive Skill permanente, fuera del Deck.',cost:'1 Action Slot',evolution:'Defense-1 — La carta describe cuándo cambia al ejecutar.'},{name:'Counter',tag:'Defense',description:'Defensive Skill permanente.',cost:'1 Action Slot'}],
    spells:[{name:'Blood Sigil',tag:'Spell',description:'Spell fuera del Deck.',cost:'1 Action Slot + recurso de Spell'},{name:'Binding Word',tag:'Spell · Save',description:'El objetivo realiza su Save.',cost:'1 Action Slot + recurso de Spell'}],
    items:[{name:'Healing Vial',tag:'Item',description:'Recupera HP y usa el runtime de Items.',cost:'Action o Quick si el Item lo permite'},{name:'Rupture Bomb',tag:'Throwable',description:'Item arrojable enlazado a una Skill.',cost:'1 Action Slot'}],
    global:[{name:'Grapple',tag:'Universal',description:'STR/Athletics vs DEX/Acrobatics.',cost:'1 Action Slot'},{name:'Help',tag:'Universal',description:'+1 Final Power a una Action aliada válida.',cost:'1 Action Slot'},{name:'Retreat',tag:'Universal',description:'Se resuelve On Turn End.',cost:'1 Action Slot'},{name:'Escape',tag:'Universal',description:'Salida del Encounter si tiene éxito.',cost:'1 Action Slot'}]
};

function showTooltip(data, event, kicker='Combat Action') {
    const tip = document.getElementById('tooltip');
    document.getElementById('tip-kicker').textContent = kicker;
    document.getElementById('tip-name').textContent = data.name || '—';
    document.getElementById('tip-body').textContent = data.description || 'Sin descripción.';
    const evo = data.evolution || '';
    const evoEl = document.getElementById('tip-evolution');
    evoEl.style.display = evo ? 'block' : 'none';
    evoEl.textContent = evo;
    document.getElementById('tip-cost').textContent = data.cost || (data.tier ? `Tier ${['','I','II','III'][data.tier]} · Deck Skill` : '');
    tip.style.left = `${Math.min(window.innerWidth-345, event.clientX+18)}px`;
    tip.style.top = `${Math.min(window.innerHeight-210, event.clientY+16)}px`;
    tip.classList.add('show');
}
function hideTooltip(){ document.getElementById('tooltip').classList.remove('show'); }

function makeOption(data, extra={}) {
    const b = document.createElement('button');
    b.className = `option ${extra.className||''}`;
    b.innerHTML = `<div class="option-ink"><b>${data.name}</b><small>${extra.meta || data.tag || data.cost || ''}</small></div>`;
    b.addEventListener('mousemove',e=>showTooltip(data,e,extra.kicker||data.tag||'Combat Action'));
    b.addEventListener('mouseleave',hideTooltip);
    b.addEventListener('click',()=>{
        document.querySelectorAll('.option.selected').forEach(n=>n.classList.remove('selected'));
        b.classList.add('selected');
        selected = extra.selection || {type:activeMenu,data};
        document.getElementById('status').textContent = `${data.name} seleccionada.`;
    });
    return b;
}

function focusSlot(slotId) {
    document.querySelectorAll('.action-slot-wrapper').forEach(n=>n.classList.toggle('prototype-focus',n.id===slotId));
}

function renderSkills() {
    const body = document.getElementById('submenu-body'); body.innerHTML='';
    for(let i=0;i<3;i++) {
        const slotId=`agatha_slot_${i}`;
        const hand=Deck.getSlotHand(unit,slotId);
        const row=document.createElement('div'); row.className='skill-row';
        const tag=document.createElement('div'); tag.className='slot-tag'; tag.textContent=`SLOT ${i+1}`; row.appendChild(tag);
        hand.forEach((card,index)=>row.appendChild(makeOption(card.skill,{
            className:index===0?'oldest':'newest',
            meta:`${index===0?'OLDEST':'NEWEST'} · T${['','I','II','III'][card.tier]}`,
            kicker:`Deck Skill · Slot ${i+1}`,
            selection:{type:'deck',slotId,drawId:card.drawId,data:card.skill}
        })));
        body.appendChild(row);
    }
    const label=document.createElement('div'); label.className='permanent-label'; label.textContent='GRANTED / FREE — FUERA DEL DECK'; body.appendChild(label);
    permanent.granted.forEach(data=>body.appendChild(makeOption(data,{className:'granted',selection:{type:'granted',data}})));
}

function renderSimple(key) {
    const body=document.getElementById('submenu-body'); body.innerHTML='';
    const stack=document.createElement('div'); stack.className='simple-stack';
    permanent[key].forEach(data=>stack.appendChild(makeOption(data,{selection:{type:key,data}})));
    body.appendChild(stack);
}

function renderMenu() {
    const titles={skills:'SKILLS · ACTION SLOTS',defense:'DEFENSE',spells:'SPELLS',items:'ITEMS',global:'GLOBAL ACTIONS'};
    document.getElementById('submenu-title').textContent=titles[activeMenu];
    const sub=document.getElementById('submenu');
    sub.className=`submenu open ${activeMenu==='skills'?'skills':(activeMenu==='defense'?'left':'right')}`;
    if(activeMenu==='skills') renderSkills(); else renderSimple(activeMenu);
    document.querySelectorAll('.command').forEach(b=>b.classList.toggle('active',b.dataset.menu===activeMenu));
}

document.querySelectorAll('.command').forEach(btn=>btn.addEventListener('click',()=>{ activeMenu=btn.dataset.menu; selected=null; renderMenu(); }));
document.getElementById('execute').addEventListener('click',()=>{
    if(!selected) return document.getElementById('status').textContent='Selecciona una acción.';
    if(selected.type==='deck') {
        Deck.markCardUsed(unit,selected.slotId,selected.drawId);
        document.getElementById('status').textContent=`${selected.data.name} comenzó ejecución: cuenta como usada.`;
    } else document.getElementById('status').textContent=`${selected.data.name} ejecutada; no altera el Deck.`;
});
document.getElementById('next').addEventListener('click',()=>{
    round++;
    Deck.onTurnStart(unit,{round,slotCount:3});
    document.getElementById('round').textContent=round;
    selected=null;
    renderMenu();
    document.getElementById('status').textContent=`ON TURN START R${round}: cada Slot rotó independientemente.`;
});

/* Spawn real de la Unit del prototipo. */
spawnCombatant({
    id:'agatha', name:'Agatha', faction:'ally', speed:8,
    hp:216, maxHp:216, sp:0, actionSlots:3,
    img:'https://i.imgur.com/24qV5kD.png',
    x:50, y:31, scale:1.0, spriteX:0, spriteY:0, uiX:0, uiY:0,
    menuFocus:true
});

document.querySelectorAll('.action-slot-wrapper').forEach((slot,i)=>slot.addEventListener('click',()=>{
    activeMenu='skills'; focusSlot(slot.id); renderMenu();
    document.getElementById('status').textContent=`Slot ${i+1} enfocado.`;
}));
focusSlot('agatha_slot_0');
renderMenu();
</script>
