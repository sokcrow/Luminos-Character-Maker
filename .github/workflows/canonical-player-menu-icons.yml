name: Canonical player menu icons

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-canonical-icons:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download canonical Skills and Spells icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Assets/Images/Buttons
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors \
            "https://limbuscompany.wiki.gg/images/SkillAttack.png?97118e" \
            -o Assets/Images/Buttons/Skills.png
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors \
            "https://imgur.com/DJ5lKid.png" \
            -o Assets/Images/Buttons/Spells.png
          python3 - <<'PY'
          from pathlib import Path
          signature = b"\x89PNG\r\n\x1a\n"
          for name in ("Skills.png", "Spells.png"):
              path = Path("Assets/Images/Buttons") / name
              data = path.read_bytes()
              if not data.startswith(signature):
                  raise SystemExit(f"{name} is not a PNG")
              if len(data) < 256:
                  raise SystemExit(f"{name} is unexpectedly small")
              print(f"{name}: {len(data)} bytes")
          PY

      - name: Commit downloaded canonical assets
        shell: bash
        run: |
          set -euo pipefail
          git add Assets/Images/Buttons/Skills.png Assets/Images/Buttons/Spells.png
          if git diff --cached --quiet; then
            echo "Canonical assets already match sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): replace Skills and Spells with canonical icons"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
