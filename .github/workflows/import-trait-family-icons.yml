name: Import trait family icons from Imgur

on:
  push:
    branches:
      - feat/trait-family-icons
    paths:
      - .github/workflows/import-trait-family-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PNG validator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Fetch and validate images
        id: images
        continue-on-error: true
        run: python scripts/import-trait-family-icons.py
      - name: Commit valid images to current branch
        shell: bash
        run: |
          if [ -d Assets/Icons/trait-families ] && find Assets/Icons/trait-families -maxdepth 1 -type f -name '*.png' | grep -q .; then
            git add -- Assets/Icons/trait-families
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Import verified trait family PNG icons"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
      - name: Flag missing images
        if: steps.images.outcome == 'failure'
        run: exit 1
