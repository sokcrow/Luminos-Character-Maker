name: Update training dummy tutorial

on:
  push:
    branches:
      - docs/status-effects-training-dummy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/status-effects-training-dummy
      - name: Patch Learn Lab
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('status-effects/learn/index.html')
          s=p.read_text()
          if 'id="dummy-card"' not in s:
              css=""".dummy-card{position:absolute;z-index:12;right:18px;top:18px;width:270px;background:rgba(5,5,5,.94);border:1px solid #6a5133;border-top:3px solid var(--g);box-shadow:0 10px 30px #000a;padding:11px 12px}.dummy-kicker{color:#c3a45f;font:900 8px/1 Roboto;letter-spacing:1.1px;text-transform:uppercase}.dummy-card h3{margin:4px 0 8px;font:24px/.9 var(--f);color:#fff0d8}.dummy-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dummy-stat{background:#0b0907;border:1px solid #30271f;padding:6px}.dummy-stat b{display:block;color:#82786a;font:900 7px/1 Roboto;text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px}.dummy-stat span{font:16px/.95 var(--f);color:#efe2cb}.dummy-wide{grid-column:1/-1}.dummy-wide span{font:10px/1.35 Roboto,Arial,sans-serif;color:#d2c5b1}.dummy-note{margin-top:7px;color:#8f8578;font:9px/1.35 Roboto,Arial,sans-serif}.dummy-note strong{color:var(--g)}"""
              s=s.replace('@media(max-width:820px){',css+'@media(max-width:820px){',1)
              s=s.replace('.caption div{font-size:9px}', '.caption div{font-size:9px}.dummy-card{top:6px;right:6px;width:190px;padding:7px}.dummy-grid{gap:3px}.dummy-stat{padding:4px}.dummy-stat span{font-size:12px}.dummy-wide,.dummy-note{display:none}',1)
              s=s.replace('← Volver a la referencia','Volver a la referencia').replace('▶ Reproducir completo','Reproducir completo')
              s=s.replace('Hooligan Leader','Training Dummy')
              marker='<div class="caption"><div id="caption"><b>Consejo:</b> mira HP, SP, iconos y líneas blancas.</div></div>'
              card='''<aside class="dummy-card" id="dummy-card" aria-label="Datos completos del Training Dummy"><div class="dummy-kicker">Objetivo de práctica · Datos revelados</div><h3>Training Dummy</h3><div class="dummy-grid"><div class="dummy-stat"><b>HP</b><span id="dummy-hp"></span></div><div class="dummy-stat"><b>SP</b><span id="dummy-sp"></span></div><div class="dummy-stat"><b>Speed</b><span id="dummy-speed"></span></div><div class="dummy-stat"><b>Action Slots</b><span id="dummy-slots"></span></div><div class="dummy-stat"><b>Offensive Lv</b><span id="dummy-off"></span></div><div class="dummy-stat"><b>Defensive Lv</b><span id="dummy-def"></span></div><div class="dummy-stat dummy-wide"><b>Stagger Thresholds</b><span id="dummy-thresholds"></span></div><div class="dummy-stat dummy-wide"><b>Resistencias</b><span id="dummy-resists"></span></div><div class="dummy-stat dummy-wide"><b>Equipo</b><span id="dummy-equipment"></span></div></div><div class="dummy-note"><strong>Dummy:</strong> no requiere Analyse. Toda su información está disponible durante la demostración.</div></aside>'''
              if marker not in s:
                  raise SystemExit('caption marker not found')
              s=s.replace(marker,card+marker,1)
              old="enemy:{hp:158,maxHp:158,sp:0,status:{},thresholds:[70,40,20],used:[],stage:0}"
              new="enemy:{hp:158,maxHp:158,sp:0,speed:3,speedRange:[1,5],actionSlots:1,offensiveLevel:1,defensiveLevel:1,resistances:'Slash NORMAL · Pierce WEAK · Blunt RESIST',equipment:'Pipe Club · Scrap Token',status:{},thresholds:[70,40,20],used:[],stage:0}"
              if old not in s:
                  raise SystemExit('enemy baseline not found')
              s=s.replace(old,new,1)
              render="function render(){renderUnit('ally',S.ally);renderUnit('enemy',S.enemy)}"
              helper="function renderDummyInfo(){const u=S.enemy;if(!u)return;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};set('dummy-hp',`${Math.round(u.hp)} / ${u.maxHp}`);set('dummy-sp',String(Math.round(u.sp)));set('dummy-speed',`${u.speed} (${u.speedRange[0]}–${u.speedRange[1]})`);set('dummy-slots',String(u.actionSlots));set('dummy-off',String(u.offensiveLevel));set('dummy-def',String(u.defensiveLevel));set('dummy-thresholds',u.thresholds.map((n,i)=>u.used.includes(i)?`${n.toFixed(1)}% consumido`:`${n.toFixed(1)}%`).join(' · '));set('dummy-resists',u.resistances);set('dummy-equipment',u.equipment)}function render(){renderUnit('ally',S.ally);renderUnit('enemy',S.enemy);renderDummyInfo()}"
              if render not in s:
                  raise SystemExit('render function not found')
              s=s.replace(render,helper,1)
              p.write_text(s)
          assert 'id="dummy-card"' in s
          assert 'Training Dummy' in s
          assert 'Hooligan Leader' not in s
          assert '←' not in s and '▶' not in s
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('status-effects/learn/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/learn.js').write_text(scripts[-1])
          PY
          node --check /tmp/learn.js
      - name: Commit tutorial update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status-effects/learn/index.html
          git commit -m "feat: reveal training dummy in status simulations"
          git push origin HEAD:docs/status-effects-training-dummy
