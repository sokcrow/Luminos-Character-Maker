name: Loot Foundation Validation

on:
  pull_request:
    paths:
      - "js/unit-loot-profile-contract.js"
      - "js/item-harvest-integrity-engine.js"
      - "js/corpse-harvest-runtime.js"
      - "js/loot-ammo-reconciliation.js"
      - "js/combat-analyze-check-contract.js"
      - "js/item-economy-standard.js"
      - "js/creature-type-catalog.js"
      - "js/loot-social-profile-contract.js"
      - "js/loot-encounter-context.js"
      - "js/loot-instance-runtime.js"
      - "js/loot-check-runtime.js"
      - "js/loot-postcombat-runtime.js"
      - "js/unit-catalog-kobold-tier1.js"
      - "js/unit-catalog-goblin.js"
      - "js/unit-catalog-wolf.js"
      - "js/combat-unit-library-sync.js"
      - "tests/unit-loot-profile-contract-smoke.mjs"
      - "tests/corpse-harvest-runtime-smoke.mjs"
      - "tests/loot-ammo-reconciliation-smoke.mjs"
      - "tests/loot-social-profile-contract-smoke.mjs"
      - "tests/loot-encounter-context-smoke.mjs"
      - "tests/loot-instance-runtime-smoke.mjs"
      - "tests/loot-postcombat-runtime-smoke.mjs"
      - "tests/ranger-class-runtime-smoke.mjs"
      - "tests/battle-master-archetype-runtime-smoke.mjs"
      - ".github/workflows/unit-loot-profile-validation.yml"
  push:
    branches:
      - main
      - "loot-update/**"
    paths:
      - "js/unit-loot-profile-contract.js"
      - "js/item-harvest-integrity-engine.js"
      - "js/corpse-harvest-runtime.js"
      - "js/loot-ammo-reconciliation.js"
      - "js/combat-analyze-check-contract.js"
      - "js/item-economy-standard.js"
      - "js/creature-type-catalog.js"
      - "js/loot-social-profile-contract.js"
      - "js/loot-encounter-context.js"
      - "js/loot-instance-runtime.js"
      - "js/loot-check-runtime.js"
      - "js/loot-postcombat-runtime.js"
      - "js/unit-catalog-kobold-tier1.js"
      - "js/unit-catalog-goblin.js"
      - "js/unit-catalog-wolf.js"
      - "js/combat-unit-library-sync.js"
      - "tests/unit-loot-profile-contract-smoke.mjs"
      - "tests/corpse-harvest-runtime-smoke.mjs"
      - "tests/loot-ammo-reconciliation-smoke.mjs"
      - "tests/loot-social-profile-contract-smoke.mjs"
      - "tests/loot-encounter-context-smoke.mjs"
      - "tests/loot-instance-runtime-smoke.mjs"
      - "tests/loot-postcombat-runtime-smoke.mjs"
      - "tests/ranger-class-runtime-smoke.mjs"
      - "tests/battle-master-archetype-runtime-smoke.mjs"
      - ".github/workflows/unit-loot-profile-validation.yml"

jobs:
  loot-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Unit Loot / Body Profile contracts
        run: node tests/unit-loot-profile-contract-smoke.mjs
      - name: Validate corpse harvest yield and integrity
        run: node tests/corpse-harvest-runtime-smoke.mjs
      - name: Validate post-combat ammunition reconciliation
        run: node tests/loot-ammo-reconciliation-smoke.mjs
      - name: Validate Wealth and Role loot profiles
        run: node tests/loot-social-profile-contract-smoke.mjs
      - name: Validate Encounter Zone and Event loot context
        run: node tests/loot-encounter-context-smoke.mjs
      - name: Validate deterministic Loot Instance generation and lock lifecycle
        run: node tests/loot-instance-runtime-smoke.mjs
      - name: Validate finite post-combat Loot interactions and D&D checks
        run: node tests/loot-postcombat-runtime-smoke.mjs
      - name: Validate Ranger Analyze bypass
        run: node tests/ranger-class-runtime-smoke.mjs
      - name: Validate Battle Master Analyze bypass
        run: node tests/battle-master-archetype-runtime-smoke.mjs
