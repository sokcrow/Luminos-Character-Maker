name: VTT Multiclient Realtime Field

on:
  pull_request:
    paths:
      - 'js/vtt/main.js'
      - 'js/vtt/token-state.js'
      - 'js/vtt/token-state-dynamic-patch.js'
      - 'js/vtt/physical-state-patch.js'
      - 'js/vtt/player-discovery-core.js'
      - 'js/vtt/player-discovery-runtime.js'
      - 'js/vtt/regional-local-transition-runtime.js'
      - 'js/vtt/engine.js'
      - 'js/vtt/camera-follow.js'
      - 'js/vtt/dm-observer.js'
      - 'js/vtt/movement-bootstrap.js'
      - 'js/vtt/movement-realtime.js'
      - 'js/vtt/movement-connectivity.js'
      - 'js/vtt/movement-destination-claims.js'
      - 'js/vtt/movement-door-runtime.js'
      - 'js/vtt/movement-rules.js'
      - 'js/vtt/movement-rules-runtime.js'
      - 'js/vtt/jump-fall-physics.js'
      - 'js/vtt/jump-fall-checks.js'
      - 'js/vtt/jump-fall-damage.js'
      - 'js/vtt/jump-fall-bootstrap.js'
      - 'tests/vtt_multiclient_realtime_field.spec.js'
      - 'tests/vtt_movement_realtime.spec.js'
      - 'tests/vtt_movement_connectivity.spec.js'
      - 'tests/vtt_movement_destination_claims.spec.js'
      - 'tests/vtt_movement_pathfinding.spec.js'
      - 'tests/vtt_movement_rules_closure.spec.js'
      - 'tests/vtt_jump_fall_physics.spec.js'
      - 'tests/vtt_canonical_token_state.spec.js'
      - 'tests/vtt_player_discovery_realtime.spec.js'
      - 'tests/vtt_player_discovery_fog.spec.js'
      - 'tests/vtt_camera_pov_observer_realtime.spec.js'
      - 'tests/vtt_world_token_multiclient_stress.spec.js'
      - 'tests/vtt_map_field_test_sandbox.spec.js'
      - 'tests/vtt_map_field_test_hardening.spec.js'
      - 'tests/regional_local_transition_realtime.spec.js'
      - 'tests/vtt_token_drag.spec.js'
      - 'tests/vtt_map_theatre_lifecycle.spec.js'
      - '.github/workflows/vtt-multiclient-realtime-field.yml'
  push:
    branches: [main]
    paths:
      - 'js/vtt/main.js'
      - 'js/vtt/token-state.js'
      - 'js/vtt/physical-state-patch.js'
      - 'js/vtt/engine.js'
      - 'js/vtt/camera-follow.js'
      - 'js/vtt/dm-observer.js'
      - 'js/vtt/movement-bootstrap.js'
      - 'js/vtt/movement-realtime.js'
      - 'js/vtt/movement-connectivity.js'
      - 'js/vtt/movement-destination-claims.js'
      - 'js/vtt/movement-door-runtime.js'
      - 'js/vtt/movement-rules.js'
      - 'js/vtt/movement-rules-runtime.js'
      - 'js/vtt/jump-fall-physics.js'
      - 'js/vtt/jump-fall-checks.js'
      - 'js/vtt/jump-fall-damage.js'
      - 'js/vtt/jump-fall-bootstrap.js'
      - 'tests/vtt_multiclient_realtime_field.spec.js'
      - 'tests/vtt_movement_realtime.spec.js'
      - 'tests/vtt_movement_connectivity.spec.js'
      - 'tests/vtt_movement_destination_claims.spec.js'
      - 'tests/vtt_movement_rules_closure.spec.js'
      - 'tests/vtt_jump_fall_physics.spec.js'
      - 'tests/vtt_camera_pov_observer_realtime.spec.js'
      - '.github/workflows/vtt-multiclient-realtime-field.yml'

permissions:
  contents: read

jobs:
  multiclient-realtime-field:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax
        run: |
          node --input-type=module --check < js/vtt/main.js
          node --input-type=module --check < js/vtt/token-state.js
          node --input-type=module --check < js/vtt/physical-state-patch.js
          node --input-type=module --check < js/vtt/camera-follow.js
          node --input-type=module --check < js/vtt/dm-observer.js
          node --input-type=module --check < js/vtt/movement-realtime.js
          node --input-type=module --check < js/vtt/movement-connectivity.js
          node --input-type=module --check < js/vtt/movement-destination-claims.js
          node --input-type=module --check < js/vtt/movement-door-runtime.js
          node --input-type=module --check < js/vtt/movement-rules.js
          node --input-type=module --check < js/vtt/movement-rules-runtime.js
          node --input-type=module --check < js/vtt/jump-fall-physics.js
          node --input-type=module --check < js/vtt/jump-fall-checks.js
          node --input-type=module --check < js/vtt/jump-fall-damage.js
          node --input-type=module --check < js/vtt/jump-fall-bootstrap.js
          node --check tests/vtt_multiclient_realtime_field.spec.js
          node --check tests/vtt_movement_realtime.spec.js
          node --check tests/vtt_movement_connectivity.spec.js
          node --check tests/vtt_movement_destination_claims.spec.js
          node --check tests/vtt_movement_rules_closure.spec.js
          node --check tests/vtt_jump_fall_physics.spec.js
          node --check tests/vtt_camera_pov_observer_realtime.spec.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Multiclient movement jump fall camera and DM contracts
        run: >-
          npx playwright test --workers=1
          tests/vtt_movement_realtime.spec.js
          tests/vtt_movement_connectivity.spec.js
          tests/vtt_movement_destination_claims.spec.js
          tests/vtt_movement_pathfinding.spec.js
          tests/vtt_movement_rules_closure.spec.js
          tests/vtt_jump_fall_physics.spec.js
          tests/vtt_multiclient_realtime_field.spec.js
          tests/vtt_canonical_token_state.spec.js
          tests/vtt_player_discovery_realtime.spec.js
          tests/vtt_player_discovery_fog.spec.js
          tests/vtt_camera_pov_observer_realtime.spec.js
          tests/vtt_world_token_multiclient_stress.spec.js
          tests/vtt_map_field_test_sandbox.spec.js
          tests/vtt_map_field_test_hardening.spec.js
          tests/regional_local_transition_realtime.spec.js
          tests/vtt_token_drag.spec.js
          tests/vtt_map_theatre_lifecycle.spec.js
