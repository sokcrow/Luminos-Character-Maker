name: L777 Biome Validation V2 Runtime

on:
  push:
    branches:
      - feat/item-icon-families
    paths:
      - ".github/workflows/l777-biome-validation-v2.yml"

permissions:
  contents: read

jobs:
  validate-biomes-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static game-engine smoke tests
        run: |
          node game-engine/tests/core-smoke.mjs
          node game-engine/tests/continuous-movement-smoke.mjs
          node game-engine/tests/visual-lab-smoke.mjs

      - name: Install browser runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate all seven biome regions
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/l777-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > l777-biomes-v2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const regionIds=['gNW','gN','gNE','gC','gSW','gS','gSE'];
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const region of regionIds){
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(`http://127.0.0.1:4173/game-engine/lab/game/forest-0.3.3.1.html?qa=procedural&region=${region}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__BIOME_VALIDATION_QA__&&typeof window.__BIOME_VALIDATION_QA__.ok==='boolean',null,{timeout:120000});
            const qa=await page.evaluate(()=>window.__BIOME_VALIDATION_QA__);
            results.push({region,qa,pageErrors});
            console.log('BIOME_QA',region,JSON.stringify(qa));
            await page.screenshot({path:`biome-${region}.png`,fullPage:false});
            await page.close();
          }
          fs.writeFileSync('biome-validation-v2.json',JSON.stringify(results,null,2));
          await browser.close();

          const failures=results.filter(r=>!r.qa.ok||r.pageErrors.length);
          if(failures.length){
            console.error('BIOME_FAILURES',JSON.stringify(failures,null,2));
            process.exit(1);
          }

          assert.equal(results.length,7);
          assert.ok(results.every(r=>r.qa.checks.gridHidden===true));
          assert.ok(results.filter(r=>['gNW','gSE'].includes(r.region)).every(r=>r.qa.checks.coast===true));
          assert.ok(results.filter(r=>['gNW','gSW'].includes(r.region)).every(r=>r.qa.checks.forest===true));
          EOF
          node l777-biomes-v2.mjs
          rm -f l777-biomes-v2.mjs

      - name: Build L777.zip
        shell: python
        run: |
          import os,zipfile
          root=os.getcwd()
          out=os.path.join(root,"L777.zip")
          skip={".git","node_modules"}
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for base,dirs,files in os.walk(root):
                  dirs[:]=[d for d in dirs if d not in skip]
                  for name in files:
                      path=os.path.join(base,name)
                      rel=os.path.relpath(path,root).replace(os.sep,"/")
                      if rel=="L777.zip" or rel.startswith("biome-") or rel=="biome-validation-v2.json" or rel==".github/workflows/l777-biome-validation-v2.yml":
                          continue
                      z.write(path,rel)

      - name: Upload validated package and QA
        uses: actions/upload-artifact@v4
        with:
          name: L777-biome-validation-v2
          path: |
            L777.zip
            biome-validation-v2.json
            biome-*.png
          if-no-files-found: error
          retention-days: 1
