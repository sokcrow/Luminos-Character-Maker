name: PR777 Procedural Hydrology Validation
on:
  push:
    branches: [feat/item-icon-families]
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static regression checks
        run: |
          node --check js/global-map-water-textures.js
          node --check js/vtt/global-map-runtime.js
          node tests/global-map-terrain-textures-smoke.mjs
          node tests/global-map-water-textures-smoke.mjs
          node game-engine/tests/core-smoke.mjs
          node game-engine/tests/continuous-movement-smoke.mjs
          node game-engine/tests/visual-lab-smoke.mjs
          ! grep -q "GENERAR HIDROLOGÍA V1" js/vtt/global-map-runtime.js
          test -f LuminousLab/START_ANDROID.sh
      - name: Install browser runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate automatic rivers and lake in real biome pipeline
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/hydro777-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > hydro777-browser-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const cases=[
            {region:'gC',expected:'river'},
            {region:'gSW',expected:'lake'},
            {region:'gNE',expected:'river'}
          ];
          const browser=await chromium.launch({headless:true});
          const out=[];
          for(const item of cases){
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`http://127.0.0.1:4173/game-engine/lab/game/forest-0.3.3.1.html?qa=procedural&region=${item.region}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__BIOME_VALIDATION_QA__&&typeof window.__BIOME_VALIDATION_QA__.ok==='boolean',null,{timeout:120000});
            const data=await page.evaluate(({region,expected})=>{
              const qa=window.__BIOME_VALIDATION_QA__;
              const global=window.PaperGlobalMap.regions().find(r=>r.id===region);
              const active=window.BiomeComposer.active();
              let waterPoint=null;
              for(let x=-60;x<=60&&!waterPoint;x+=2)for(let z=-60;z<=60;z+=2){
                const f=window.BiomeComposer.fieldAt('owC',x,z);
                if(f.waterDepth>0){waterPoint={x,z,depth:f.waterDepth,hydrologyClass:f.hydrologyClass};break;}
              }
              return {
                qa,requested:global?.hydrology?.type||null,resolved:active?.hydrology?.type||null,
                waterPoint,expected,
                deterministic:window.BiomeComposer.determinismCheck({
                  id:'qa-hydro',seed:84521,biomeProfile:'temperate',moisture:.58,altitude:2.6,
                  landform:{hills:.72,rolling:.32,ridges:.18},hydrology:{type:'auto'}
                })
              };
            },item);
            console.log('HYDRO_QA',item.region,JSON.stringify(data));
            assert.equal(errors.length,0,`${item.region} page errors: ${errors.join(' | ')}`);
            assert.equal(data.requested,'auto',`${item.region} must request automatic hydrology`);
            assert.equal(data.resolved,item.expected,`${item.region} unexpected resolved hydrology`);
            assert.equal(data.qa.ok,true,`${item.region} BiomeValidationV2 failed`);
            assert.equal(data.qa.checks.inlandWater,true,`${item.region} inland water QA failed`);
            assert.ok(data.qa.waterSamples>0&&data.qa.landSamples>0,`${item.region} needs visible local land+water`);
            assert.ok(data.waterPoint&&data.waterPoint.depth>0,`${item.region} needs a sampled physical water point`);
            assert.equal(data.deterministic.ok,true,'BiomeComposer hydrology must stay deterministic');
            await page.screenshot({path:`hydro-${item.region}.png`,fullPage:false});
            out.push({region:item.region,...data,pageErrors:errors});
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('hydrology-validation.json',JSON.stringify(out,null,2));
          EOF
          node hydro777-browser-check.mjs
          rm -f hydro777-browser-check.mjs
      - name: Build clean project ZIP
        run: |
          zip -qr HydroP777.zip . -x ".git/*" "node_modules/*" "HydroP777.zip" "hydro-*.png" "hydrology-validation.json" ".github/workflows/pr777-procedural-hydrology-validation.yml"
          unzip -tq HydroP777.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HydroP777
          path: |
            HydroP777.zip
            hydro-*.png
            hydrology-validation.json
          if-no-files-found: error
          retention-days: 1
