name: Cantrip Validation

on:
  push:
    paths:
      - "js/spell-catalog-core.js"
      - "js/spell-batch-cantrips-runtime.js"
      - "js/spell-batch-cantrips-utility-runtime.js"
      - "js/spell-batch-weapon-cantrips-runtime.js"
      - "js/death-save-runtime.js"
      - "js/spell-visual-asset-registry.js"
      - "Assets/Icons/status/cantrips/**"
      - "Assets/Icons/items/utility/thought_strand.png"
      - "Assets/Images/SpellUnits/**"
      - "tests/cantrip-*-smoke.mjs"
      - "tests/weapon-cantrip-batch-smoke.mjs"
      - ".github/workflows/cantrip-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "js/spell-catalog-core.js"
      - "js/spell-batch-cantrips-runtime.js"
      - "js/spell-batch-cantrips-utility-runtime.js"
      - "js/spell-batch-weapon-cantrips-runtime.js"
      - "js/death-save-runtime.js"
      - "js/spell-visual-asset-registry.js"
      - "Assets/Icons/status/cantrips/**"
      - "Assets/Icons/items/utility/thought_strand.png"
      - "Assets/Images/SpellUnits/**"
      - "tests/cantrip-*-smoke.mjs"
      - "tests/weapon-cantrip-batch-smoke.mjs"
      - ".github/workflows/cantrip-validation.yml"

jobs:
  cantrip-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cantrip runtime syntax
        run: |
          node --check js/spell-catalog-core.js
          node --check js/spell-batch-cantrips-runtime.js
          node --check js/spell-batch-cantrips-utility-runtime.js
          node --check js/spell-batch-weapon-cantrips-runtime.js
          node --check js/death-save-runtime.js

      - name: Weapon cantrip smoke
        run: node tests/weapon-cantrip-batch-smoke.mjs

      - name: Cantrip batch smoke
        run: node tests/cantrip-batch-2-smoke.mjs

      - name: Utility cantrip smoke
        run: node tests/cantrip-utility-batch-smoke.mjs

      - name: Cantrip visual assets smoke
        run: node tests/cantrip-visual-assets-smoke.mjs

      - name: Spell visual registry smoke
        run: node tests/spell-visual-asset-registry-smoke.mjs
