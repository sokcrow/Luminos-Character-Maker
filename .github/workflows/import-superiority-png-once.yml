name: Import approved Superiority PNG (one-time)
on:
  pull_request:
    paths:
      - ".github/workflows/import-superiority-png-once.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  download-original:
    if: github.event.pull_request.number == 983 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download exact Imgur image and verify PNG
        run: |
          set -euo pipefail
          path="Assets/Icons/status/superiority.png"
          mkdir -p "$(dirname "$path")"
          if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 90 -A "Mozilla/5.0" -H "Referer: https://imgur.com/" "https://i.imgur.com/woxmGxM.png" -o "$path"; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 90 -A "Mozilla/5.0" "https://imgur.com/woxmGxM.png" -o "$path"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p = Path("Assets/Icons/status/superiority.png")
          data = p.read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "Imgur did not serve a PNG file"
          assert data[12:16] == b"IHDR", "Invalid PNG IHDR"
          w, h = struct.unpack(">II", data[16:24])
          assert 16 <= w <= 8192 and 16 <= h <= 8192, f"Bad PNG dimensions: {w}x{h}"
          assert len(data) > 64, "Empty PNG"
          print(f"VERIFIED PNG {w}x{h}, {len(data)} bytes, sha256={hashlib.sha256(data).hexdigest()}")
          PY
      - name: Commit approved binary asset to pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Icons/status/superiority.png
          if git diff --cached --quiet; then
            echo "Already downloaded"
          else
            git commit -m "assets(status): download approved Superiority icon from Imgur"
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          fi
