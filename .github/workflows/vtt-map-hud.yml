name: VTT Map HUD and Physical World

on:
  pull_request:
    paths:
      - 'js/vtt/camera.js'
      - 'js/vtt/camera-follow.js'
      - 'js/vtt/physical-resolver.js'
      - 'js/vtt/physical-state-patch.js'
      - 'js/vtt/lighting-physical-patch.js'
      - 'js/vtt/world-object-*.js'
      - 'js/vtt/environment-affordance-engine.js'
      - 'js/vtt/interaction-intent.js'
      - 'js/vtt/map-hud-bootstrap.js'
      - 'js/vtt/main.js'
      - 'vtt.html'
      - 'database.rules.json'
      - 'tests/vtt_world_objects.spec.js'
      - 'tests/vtt_map_hud_physical.spec.js'
      - 'tests/vtt_physical_state_persistence.spec.js'
      - 'tests/vtt_interaction_authority.spec.js'
      - '.github/workflows/vtt-map-hud.yml'
  workflow_dispatch:

jobs:
  map-hud-physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --input-type=module --check < js/vtt/camera.js
          node --check js/vtt/camera-follow.js
          node --check js/vtt/physical-resolver.js
          node --check js/vtt/physical-state-patch.js
          node --check js/vtt/lighting-physical-patch.js
          node --check js/vtt/world-object-core.js
          node --check js/vtt/world-object-catalog.js
          node --check js/vtt/world-object-components.js
          node --check js/vtt/environment-affordance-engine.js
          node --check js/vtt/interaction-intent.js
          node --input-type=module --check < js/vtt/world-object-bootstrap.js
          node --input-type=module --check < js/vtt/world-object-mainline-integration.js
          node --input-type=module --check < js/vtt/map-hud-bootstrap.js
          node --input-type=module --check < js/vtt/main.js
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
      - name: Focused contracts
        run: npx playwright test tests/vtt_world_objects.spec.js tests/vtt_map_hud_physical.spec.js tests/vtt_physical_state_persistence.spec.js tests/vtt_interaction_authority.spec.js --workers=1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Repository regression
        run: npx playwright test --workers=1
