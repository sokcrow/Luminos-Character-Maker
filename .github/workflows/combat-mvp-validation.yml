name: Combat and Session MVP
on:
  pull_request:
    paths:
      - 'js/*mvp*'
      - 'js/combat-results-ui.js'
      - 'js/combat-session-lifecycle.js'
      - 'js/combat-v073-authority.js'
      - 'js/combat-v073-steps.js'
      - 'js/combat-xp-runtime.js'
      - 'database.rules.json'
      - 'tests/*mvp*'
      - '.github/workflows/combat-mvp-validation.yml'
jobs:
  mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save @playwright/test@1.55.0 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mvp
      - run: node tests/combat-victory-cr-xp-delivery-smoke.mjs
      - name: Private ballots and Firebase authorization
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'node tests/session-mvp-rules-emulator.mjs'
      - name: Six viewport UI flows
        run: npx playwright test tests/mvp-ui-responsive.spec.mjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-ui-results
          path: test-results
          if-no-files-found: ignore
