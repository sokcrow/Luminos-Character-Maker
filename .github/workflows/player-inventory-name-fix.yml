name: Player Inventory Name Fix

on:
  push:
    branches:
      - refactor/player-inventory-runtime-cutover
    paths:
      - .github/workflows/player-inventory-name-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/player-inventory-runtime-cutover
          fetch-depth: 0
      - name: Prefer explicit ItemInstance names before definition fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/inventory-hud-v2.js')
          text = path.read_text()
          old = '''  function itemName(item = {}) {
    const resolved = runtime()?.resolveItem?.(item) || item;
    return String(resolved?.displayName || resolved?.nombre || resolved?.name || item.definitionId || "ITEM").trim();
  }
'''
          new = '''  function itemName(item = {}) {
    const explicit = item.displayName || item.nombre || item.name;
    if (explicit) return String(explicit).trim();
    const resolved = runtime()?.resolveItem?.(item) || item;
    return String(resolved?.displayName || resolved?.nombre || resolved?.name || item.definitionId || item.id || "ITEM").trim();
  }
'''
          if old not in text:
              raise SystemExit('itemName block not found; refusing an unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/inventory-hud-v2.js
      - name: Commit runtime HUD fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/player-inventory-name-fix.yml
          git add js/inventory-hud-v2.js
          git commit -m "fix(items): prefer canonical instance display names in player HUD"
          git push origin HEAD:refactor/player-inventory-runtime-cutover
