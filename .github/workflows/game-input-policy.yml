name: Game input policy
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/game-input-policy.js'
      - 'css/game-input-policy.css'
      - 'hoja_de_DM.html'
      - 'pantalla_dm.html'
      - 'hoja_personaje.html'
      - 'combate.html'
      - 'mirror.html'
      - 'Battle-viewer.html'
      - 'tests/game-input-policy*'
      - '.github/workflows/game-input-policy.yml'
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save jsdom@26.1.0 @playwright/test@1.55.0
      - run: node --check js/game-input-policy.js
      - run: node tests/game-input-policy-smoke.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/game-input-policy.spec.mjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-input-policy
          path: test-results/
