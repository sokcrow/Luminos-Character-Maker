name: DM Theatre Director Workspace

on:
  pull_request:
    branches: [main]
    paths:
      - 'hoja_de_DM.html'
      - 'js/theatre-dm-workspace.js'
      - 'js/theatre-controls.js'
      - 'js/theatre-engine.js'
      - 'js/theatre-intervention-ux-core.js'
      - 'js/luminous-audio-director.js'
      - 'css/luminous-audio-director.css'
      - 'database.rules.json'
      - 'tests/luminous-audio-director-smoke.mjs'
      - 'js/theatre-actor-studio.js'
      - 'js/theatre-director-menu-guard.js'
      - 'css/theatre-actor-studio.css'
      - 'css/theatre-dm-workspace.css'
      - 'tests/dm-theatre-director-workspace*'
      - 'tests/dm-theatre-director-dom-smoke.mjs'
      - 'tests/helpers/dm-director-fixture.mjs'
      - '.github/workflows/dm-theatre-director-workspace.yml'

jobs:
  director-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS syntax and canonical Theatre contracts
        run: |
          node --check js/luminous-audio-director.js
          node --check js/theatre-engine.js
          node --check js/theatre-intervention-ux-core.js
          node tests/luminous-audio-director-smoke.mjs
          node tests/unit-independent-rules-smoke.mjs
          node tests/theatre-dm-send-recovery-smoke.mjs
          node --check js/theatre-dm-workspace.js
          node --check js/theatre-controls.js
          node --check js/theatre-actor-studio.js
          node --check js/theatre-director-menu-guard.js
          node tests/dm-theatre-director-workspace-smoke.mjs
          node tests/dm-dialogue-composer-layout-smoke.mjs
          node tests/dm-dialogue-input-visible-smoke.mjs
      - name: Playwright Chromium dependencies
        run: |
          npm install --no-save @playwright/test@1.55.0 jsdom@26.1.0
          npx playwright install --with-deps chromium
      - name: Real Theatre modules with in-memory Firebase
        run: node tests/dm-theatre-director-dom-smoke.mjs
      - name: Mobile, tablet and desktop Director UI
        run: npx playwright test tests/dm-theatre-director-workspace.spec.mjs --reporter=line --workers=1

      - name: Director screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-mobile-desktop
          path: test-results/
