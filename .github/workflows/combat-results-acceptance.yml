name: Combat Results, Loot and Reinforcements
on:
  pull_request:
    branches: [main]
    paths:
      - 'combat/**'
      - 'database.rules.json'
      - 'firebase.json'
      - 'combat-results-firebase.json'
      - 'js/combat-*.js'
      - 'js/battle-viewer-*.js'
      - 'js/loot-*.js'
      - 'js/dm-loot-queue.js'
      - 'js/dm-combat-*.js'
      - 'js/player-postcombat-loot.js'
      - 'js/inventory-hud-v2.js'
      - 'js/unit-loot-profile-contract.js'
      - 'css/postcombat-loot-corpse.css'
      - 'Battle-viewer.html'
      - 'combate.html'
      - 'mirror.html'
      - 'tests/combat-results-and-loot.spec.mjs'
      - 'tests/loot-authority-emulator.mjs'
      - 'tests/npc-belongings-smoke.mjs'
      - 'tests/dm-loot-queue-smoke.mjs'
      - '.github/workflows/combat-results-acceptance.yml'
concurrency:
  group: combat-results-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-firebase-playback-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @playwright/test@1.55.0 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - run: npm run check:combat-live
      - run: node tests/combat-entry-auth-race-smoke.mjs
      - run: node tests/combat-p0-theatre-smoke.mjs
      - run: node tests/combat-p1-presentation-smoke.mjs
      - run: node tests/npc-belongings-smoke.mjs
      - run: node tests/dm-loot-queue-smoke.mjs
      - name: Auth, RTDB, live animations, real loot and production close controls
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'node tests/loot-authority-emulator.mjs && npx playwright test tests/combat-results-and-loot.spec.mjs --workers=1 --reporter=line && npx playwright test tests/combat-results-and-loot.spec.mjs --grep "PC and phone present" --repeat-each=3 --workers=1 --reporter=line'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-rollover-results
          path: test-results
          retention-days: 7
  npc-belongings-and-loot-queues:
    runs-on: ubuntu-latest
    # Cold dependency/browser installation can exceed eight minutes before the
    # 150-second NPC acceptance test starts. Keep its own test deadline intact.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @playwright/test@1.55.0 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/npc-belongings-smoke.mjs
      - run: node tests/dm-loot-queue-smoke.mjs
      - name: Real Firebase legacy cleanup and NPC consumable acceptance
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'npx playwright test tests/combat-results-and-loot.spec.mjs --grep "DM retires|NPC belongings enter" --workers=1 --reporter=line'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-belongings-loot-ui
          path: test-results
          retention-days: 7
