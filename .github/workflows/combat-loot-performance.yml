name: Combat and Loot Performance
on:
  pull_request:
    branches: [main]
jobs:
  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @playwright/test@1.55.0 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/combat-presentation-transport-smoke.mjs
      - name: Fetch actual PR main baseline
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Compare current main and candidate with identical browser workload
        shell: bash
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Avoid a 2025/early-2026 pinned source that predates today's Combat,
          # corpse leases and Planning contract. Benchmark *current main*.
          git diff "${BASELINE_SHA}" HEAD -- js css combat Battle-viewer.html combate.html mirror.html pantalla_dm.html hoja_personaje.html hoja_de_DM.html > /tmp/combat-performance.patch
          git restore --source="${BASELINE_SHA}" -- js css combat Battle-viewer.html combate.html mirror.html pantalla_dm.html hoja_personaje.html hoja_de_DM.html
          # Do not compare fundamentally different combat engines/old Planning
          # protocols. Both runs must complete; functional and wall-time gates
          # remain required and failures remain failures.
          baseline_exit=0
          npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'PERFORMANCE_BASELINE=1 npx playwright test tests/combat-loot-performance.spec.mjs --output=perf-baseline --workers=1 --reporter=line' || baseline_exit=$?
          git apply /tmp/combat-performance.patch
          candidate_exit=0
          npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'npx playwright test tests/combat-loot-performance.spec.mjs --output=perf-candidate --workers=1 --reporter=line' || candidate_exit=$?
          echo "Performance baseline exit code: ${baseline_exit}"
          echo "Performance candidate exit code: ${candidate_exit}"
          {
            echo "## Combat / loot browser profiling"
            echo "Current main baseline: exit ${baseline_exit}"
            echo "Candidate: exit ${candidate_exit}"
            echo "Results and trace artifacts are uploaded even when either fails."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( baseline_exit != 0 || candidate_exit != 0 )); then exit 1; fi
      - name: Enforce visible round and loot wall-time gains
        run: node tests/combat-loot-performance-compare.mjs perf-baseline perf-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-loot-performance
          path: |
            perf-baseline
            perf-candidate
