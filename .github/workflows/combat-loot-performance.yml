name: Combat and Loot Performance
on:
  pull_request:
    branches: [main]
jobs:
  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @playwright/test@1.55.0 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - name: Browser combat and loot, 250ms Firebase acknowledgements and 4x CPU
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'PERFORMANCE_BASELINE=1 npx playwright test tests/combat-loot-performance.spec.mjs --workers=1 --reporter=line'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-loot-performance
          path: test-results
