name: VTT Performance Guard

on:
  pull_request:
    paths:
      - 'vtt.html'
      - 'js/vtt/camera.js'
      - 'js/vtt/camera-follow.js'
      - 'js/vtt/dm-observer.js'
      - 'js/vtt/engine.js'
      - 'js/vtt/token-state.js'
      - 'js/vtt/token-state-dynamic-patch.js'
      - 'js/vtt/movement-zero-work-drag.js'
      - 'js/vtt/render/**'
      - 'js/vtt/procedural-chunk-streaming-runtime.js'
      - 'js/vtt/scene-dirty.js'
      - 'js/vtt/scene-dirty-token-state-patch.js'
      - 'js/vtt/scene-dirty-lighting-patch.js'
      - 'js/vtt/scene-dirty-memory-patch.js'
      - 'js/vtt/runtime-lifecycle.js'
      - 'js/vtt/performance-guard.js'
      - 'js/vtt/lighting-engine.js'
      - 'js/vtt/lighting-defaults-patch.js'
      - 'js/vtt/lighting-state.js'
      - 'js/vtt/environment-light-bridge.js'
      - 'js/vtt/pov-engine.js'
      - 'js/vtt/pov-state.js'
      - 'js/vtt/memory-state.js'
      - 'tests/vtt_webgl2_camera_contract.spec.js'
      - 'tests/vtt_webgl2_token_layer.spec.js'
      - 'tests/vtt_token_view_registry.spec.js'
      - 'tests/vtt_persistent_token_views.spec.js'
      - 'tests/vtt_token_state_incremental.spec.js'
      - 'tests/vtt_drag_preview_incremental.spec.js'
      - 'tests/vtt_drag_preview_raf.spec.js'
      - 'tests/vtt_scene_dirty.spec.js'
      - 'tests/vtt_scene_dirty_bridges.spec.js'
      - 'tests/vtt_scene_dirty_direct_emitters.spec.js'
      - 'tests/vtt_runtime_performance_phase1.spec.js'
      - 'tests/vtt_runtime_frame_scheduler.spec.js'
      - 'tests/vtt_performance_guard.spec.js'
      - 'tests/vtt_vision_cone_runtime.spec.js'
      - '.github/workflows/vtt-performance-guard.yml'
  workflow_dispatch:

concurrency:
  group: vtt-performance-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check js/vtt/token-state.js
          node --check js/vtt/token-state-dynamic-patch.js
          node --check js/vtt/scene-dirty.js
          node --input-type=module --check < js/vtt/scene-dirty-token-state-patch.js
          node --input-type=module --check < js/vtt/scene-dirty-lighting-patch.js
          node --input-type=module --check < js/vtt/scene-dirty-memory-patch.js
          node --input-type=module --check < js/vtt/camera.js
          node --check js/vtt/camera-follow.js
          node --check js/vtt/dm-observer.js
          node --input-type=module --check < js/vtt/engine.js
          node --input-type=module --check < js/vtt/movement-zero-work-drag.js
          node --input-type=module --check < js/vtt/render/world-transform.js
          node --input-type=module --check < js/vtt/render/webgl2-renderer.js
          node --input-type=module --check < js/vtt/render/webgl2-token-layer.js
          node --input-type=module --check < js/vtt/render/dm-observer-overlay.js
          node --input-type=module --check < js/vtt/render/token-view.js
          node --input-type=module --check < js/vtt/render/token-view-registry.js
          node --input-type=module --check < js/vtt/render/persistent-token-views.js
          node --input-type=module --check < js/vtt/render/transient-token-preview.js
          node --input-type=module --check < js/vtt/render/renderer-factory.js
          node --input-type=module --check < js/vtt/procedural-chunk-streaming-runtime.js
          node --check js/vtt/runtime-lifecycle.js
          node --input-type=module --check < js/vtt/performance-guard.js
          node --check tests/vtt_scene_dirty.spec.js
          node --check tests/vtt_scene_dirty_bridges.spec.js
          node --check tests/vtt_scene_dirty_direct_emitters.spec.js
          node --check tests/vtt_runtime_performance_phase1.spec.js
          node --check tests/vtt_runtime_frame_scheduler.spec.js
          node --check tests/vtt_performance_guard.spec.js
          node --input-type=module --check < tests/vtt_webgl2_camera_contract.spec.js
          node --input-type=module --check < tests/vtt_webgl2_token_layer.spec.js
          node --input-type=module --check < tests/vtt_token_view_registry.spec.js
          node --input-type=module --check < tests/vtt_persistent_token_views.spec.js
          node --input-type=module --check < tests/vtt_token_state_incremental.spec.js
          node --input-type=module --check < tests/vtt_drag_preview_incremental.spec.js
          node --input-type=module --check < tests/vtt_drag_preview_raf.spec.js
      - name: Persistent TokenView, incremental state, drag preview, and GPU token layer contracts
        run: >-
          npx playwright test --workers=1
          tests/vtt_token_view_registry.spec.js
          tests/vtt_persistent_token_views.spec.js
          tests/vtt_token_state_incremental.spec.js
          tests/vtt_drag_preview_incremental.spec.js
          tests/vtt_drag_preview_raf.spec.js
          tests/vtt_webgl2_token_layer.spec.js
      - name: WebGL2 camera and DM observer contracts
        run: npx playwright test --workers=1 tests/vtt_webgl2_camera_contract.spec.js
      - name: Canonical scene dirty contracts
        run: >-
          npx playwright test --workers=1
          tests/vtt_scene_dirty.spec.js
          tests/vtt_scene_dirty_bridges.spec.js
          tests/vtt_scene_dirty_direct_emitters.spec.js
      - name: Frame-coalesced input and adaptive scheduler contracts
        run: >-
          npx playwright test --workers=1
          tests/vtt_runtime_performance_phase1.spec.js
          tests/vtt_runtime_frame_scheduler.spec.js
      - name: Vision cone 120 degree regression
        run: npx playwright test tests/vtt_vision_cone_runtime.spec.js
      - name: Idle render scheduler and instrumentation budget
        run: npx playwright test tests/vtt_performance_guard.spec.js
      - name: Lighting/Fog focused regression
        run: >-
          npx playwright test --workers=1
          tests/vtt_dynamic_lighting.spec.js
          tests/vtt_dynamic_lighting_runtime.spec.js
          tests/vtt_pov*.spec.js
          tests/vtt_memory*.spec.js
