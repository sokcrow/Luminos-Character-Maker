name: VTT Rama 4 Simulated Chunk Performance

on:
  push:
    branches:
      - rama4-grid-topology-verticality
    paths:
      - 'js/vtt/visibility-working-set.js'
      - 'js/vtt/perception-scheduler.js'
      - 'scripts/vtt-chunk-visibility-performance-check.mjs'
      - 'scripts/vtt-chunk-movement-perception-performance-check.mjs'
      - '.github/workflows/vtt-rama4-chunk-performance.yml'
  pull_request:
    paths:
      - 'js/vtt/visibility-working-set.js'
      - 'js/vtt/perception-scheduler.js'
      - 'scripts/vtt-chunk-visibility-performance-check.mjs'
      - 'scripts/vtt-chunk-movement-perception-performance-check.mjs'
      - '.github/workflows/vtt-rama4-chunk-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chunk-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --input-type=module --check < js/vtt/visibility-working-set.js
          node --input-type=module --check < js/vtt/perception-scheduler.js
          node --check scripts/vtt-chunk-visibility-performance-check.mjs
          node --check scripts/vtt-chunk-movement-perception-performance-check.mjs
      - name: Simulated 40x40 chunk working-set benchmark
        run: node scripts/vtt-chunk-visibility-performance-check.mjs
      - name: Cached perception during 240-frame token movement
        run: node scripts/vtt-chunk-movement-perception-performance-check.mjs
