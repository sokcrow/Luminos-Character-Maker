name: Game Engine Lab Validation

on:
  push:
    paths:
      - "game-engine/**"
      - "Assets/Images/World/Water/**"
      - "scripts/vendor-world-water-textures.mjs"
      - ".github/workflows/game-engine-validation.yml"
  pull_request:
    paths:
      - "game-engine/**"
      - "Assets/Images/World/Water/**"
      - "scripts/vendor-world-water-textures.mjs"
      - ".github/workflows/game-engine-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check game-engine/lab/main.js

      - name: World floor texture syntax
        run: node --check game-engine/src/world/WorldFloorTextures.js

      - name: World water bodies syntax
        run: node --check game-engine/src/world/WorldWaterBodies.js

      - name: Core smoke
        run: node game-engine/tests/core-smoke.mjs

      - name: Visual Lab smoke
        run: node game-engine/tests/visual-lab-smoke.mjs

      - name: World floor texture smoke
        run: node game-engine/tests/world-floor-textures-smoke.mjs

      - name: World water body smoke
        run: node game-engine/tests/world-water-bodies-smoke.mjs

      - name: World water texture asset smoke
        run: node game-engine/tests/world-water-texture-assets-smoke.mjs
