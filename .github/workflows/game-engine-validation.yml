name: Game Engine Lab Validation

on:
  push:
    paths:
      - "game-engine/**"
      - ".github/workflows/game-engine-validation.yml"
  pull_request:
    paths:
      - "game-engine/**"
      - ".github/workflows/game-engine-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import official wake trail PNG unchanged
        run: |
          set -euo pipefail
          mkdir -p Assets/Images/World/Water
          curl -L --fail --retry 3 --retry-delay 2 \
            -A "Mozilla/5.0" \
            "https://i.imgur.com/xoMcBzD.png" \
            -o /tmp/wake_trail.png
          python - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p=Path("/tmp/wake_trail.png")
          b=p.read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          pos=8
          color_type=None
          has_trns=False
          width=height=None
          while pos+12 <= len(b):
              n=struct.unpack(">I",b[pos:pos+4])[0]
              typ=b[pos+4:pos+8]
              data=b[pos+8:pos+8+n]
              if typ == b'IHDR':
                  width,height,bit_depth,color_type,comp,filt,interlace=struct.unpack(">IIBBBBB",data)
              if typ == b'tRNS':
                  has_trns=True
              pos += 12+n
              if typ == b'IEND':
                  break
          assert width and height, "missing IHDR"
          assert color_type in (4,6) or has_trns, f"PNG lacks alpha/transparency (color_type={color_type})"
          print(f"wake_trail.png: {width}x{height}, color_type={color_type}, tRNS={has_trns}, bytes={len(b)}")
          print("sha256="+hashlib.sha256(b).hexdigest())
          PY
          cp /tmp/wake_trail.png Assets/Images/World/Water/wake_trail.png

      - name: Commit imported wake asset if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Images/World/Water/wake_trail.png
          if git diff --cached --quiet; then
            echo "Wake asset already identical."
          else
            git commit -m "asset(water): add official wake trail texture"
            git push origin HEAD:lab-preview
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check game-engine/lab/main.js

      - name: World floor texture syntax
        run: node --check game-engine/src/world/WorldFloorTextures.js

      - name: WaterBody syntax
        run: node --check game-engine/src/world/WaterBodySystem.js

      - name: WakeTrail syntax
        run: node --check game-engine/src/world/WakeTrailSystem.js

      - name: Core smoke
        run: node game-engine/tests/core-smoke.mjs

      - name: Visual Lab smoke
        run: node game-engine/tests/visual-lab-smoke.mjs

      - name: World floor texture smoke
        run: node game-engine/tests/world-floor-textures-smoke.mjs

      - name: WaterBody smoke
        run: node game-engine/tests/water-body-system-smoke.mjs

      - name: WakeTrail smoke
        run: node game-engine/tests/wake-trail-system-smoke.mjs
