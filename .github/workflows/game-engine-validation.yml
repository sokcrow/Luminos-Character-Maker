name: Game Engine Lab Validation

on:
  push:
    paths:
      - "game-engine/**"
      - "js/**"
      - "Assets/Images/World/**"
      - "Assets/Images/Buttons/**"
      - "lab-preview/**"
      - ".github/workflows/game-engine-validation.yml"
  pull_request:
    paths:
      - "game-engine/**"
      - ".github/workflows/game-engine-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check game-engine/lab/main.js

      - name: World floor texture syntax
        run: node --check game-engine/src/world/WorldFloorTextures.js

      - name: Core smoke
        run: node game-engine/tests/core-smoke.mjs

      - name: Visual Lab smoke
        run: node game-engine/tests/visual-lab-smoke.mjs

      - name: World floor texture smoke
        run: node game-engine/tests/world-floor-textures-smoke.mjs

  deploy-lab-preview:
    if: github.ref == 'refs/heads/lab-preview'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Lab Preview
        uses: actions/checkout@v4
        with:
          ref: lab-preview

      - name: Build lean Lab site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/Assets/Images
          cp -a game-engine _site/game-engine
          cp -a js _site/js
          cp -a Assets/Images/Buttons _site/Assets/Images/Buttons
          cp -a Assets/Images/World _site/Assets/Images/World
          cp -a lab-preview _site/lab-preview
          touch _site/.nojekyll

      - name: Verify Lab site
        shell: bash
        run: |
          test -f _site/lab-preview/index.html
          test -f _site/game-engine/lab/index.html
          test -f _site/game-engine/lab/game/forest-0.3.3.1.html
          test -f _site/game-engine/src/world/WorldFloorTextures.js
          test -f _site/Assets/Images/World/Floors/floor_grass_01.png
          test -f _site/Assets/Images/Buttons/Inventory.svg
          echo "Lab preview verified."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Lab Preview
        id: deployment
        uses: actions/deploy-pages@v4
