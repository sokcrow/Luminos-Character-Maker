name: Game Engine Lab Validation

on:
  push:
    paths:
      - "game-engine/**"
      - "js/anatomy-equipment-engine.js"
      - "js/item-runtime-engine.js"
      - "js/item-inventory-runtime.js"
      - "js/item-equipment-bridge.js"
      - "js/item-icon-registry.js"
      - "Assets/Icons/items/**"
      - ".github/workflows/game-engine-validation.yml"
  pull_request:
    paths:
      - "game-engine/**"
      - "js/anatomy-equipment-engine.js"
      - "js/item-runtime-engine.js"
      - "js/item-inventory-runtime.js"
      - "js/item-equipment-bridge.js"
      - "js/item-icon-registry.js"
      - "Assets/Icons/items/**"
      - ".github/workflows/game-engine-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Module hosts syntax
        run: |
          node --check game-engine/lab/runtime-lab.js
          node --check game-engine/visualizer/main.js
          node --check game-engine/visualizer/ThreeVisualizer.js

      - name: GameRuntime syntax
        run: |
          node --check game-engine/src/core/GameRuntime.js
          node --check game-engine/src/core/RuntimeContracts.js

      - name: Camera runtime syntax
        run: |
          node --check game-engine/src/camera/CameraBridgeAdapter.js
          node --check game-engine/src/camera/CameraProfiles.js
          node --check game-engine/src/camera/CameraSystem.js

      - name: Unit runtime syntax
        run: |
          node --check game-engine/src/units/UnitState.js
          node --check game-engine/src/units/UnitRegistry.js
          node --check game-engine/src/units/UnitControllerSystem.js
          node --check game-engine/src/units/UnitMovementSystem.js
          node --check game-engine/src/units/UnitEnvironmentSystem.js
          node --check game-engine/src/units/UnitRuntime.js

      - name: Map runtime syntax
        run: |
          node --check game-engine/src/map/MapRegistry.js
          node --check game-engine/src/map/MapBridgeAdapter.js
          node --check game-engine/src/map/MapSystem.js
          node --check game-engine/src/map/procedural/SeededRandom.js
          node --check game-engine/src/map/procedural/ProceduralMapSpec.js
          node --check game-engine/src/map/procedural/ProceduralHydrology.js
          node --check game-engine/src/map/procedural/ProceduralTerrain.js
          node --check game-engine/src/map/procedural/ProceduralMapGenerator.js

      - name: HUD and inventory UI runtime syntax
        run: |
          node --check game-engine/src/ui/HudViewModel.js
          node --check game-engine/src/ui/HudDomAdapter.js
          node --check game-engine/src/ui/InventoryEquipmentViewModel.js
          node --check game-engine/src/ui/InventoryEquipmentDomAdapter.js
          node --check game-engine/src/ui/TouchMovementAdapter.js

      - name: World runtime syntax
        run: |
          node --check game-engine/src/world/WorldFloorTextures.js
          node --check game-engine/src/world/TerrainMobility.js
          node --check game-engine/src/world/TerrainSurfaceStandard.js
          node --check game-engine/src/world/TerrainHeightField.js
          node --check game-engine/src/world/WaterBodySystem.js
          node --check game-engine/src/world/WakeTrailSystem.js

      - name: Core smoke
        run: node game-engine/tests/core-smoke.mjs

      - name: Continuous movement smoke
        run: node game-engine/tests/continuous-movement-smoke.mjs

      - name: Runtime contracts smoke
        run: node game-engine/tests/runtime-contracts-smoke.mjs

      - name: Universal Unit runtime smoke
        run: node game-engine/tests/universal-unit-runtime-smoke.mjs

      - name: Camera Units Map integration runtime
        run: node game-engine/tests/game-runtime-integration-smoke.mjs

      - name: Map module authority runtime
        run: node game-engine/tests/map-runtime-authority-smoke.mjs

      - name: Procedural map authority runtime
        run: node game-engine/tests/procedural-map-runtime-smoke.mjs

      - name: Lab and visualizer module boundary
        run: node game-engine/tests/lab-module-boundary-smoke.mjs

      - name: Inventory equipment visualizer smoke
        run: node game-engine/tests/inventory-equipment-visualizer-smoke.mjs

      - name: Terrain height field smoke
        run: node game-engine/tests/terrain-height-field-smoke.mjs

      - name: World floor texture smoke
        run: node game-engine/tests/world-floor-textures-smoke.mjs

      - name: Terrain surface standard smoke
        run: node game-engine/tests/terrain-surface-standard-smoke.mjs

      - name: WaterBody smoke
        run: node game-engine/tests/water-body-system-smoke.mjs

      - name: WakeTrail smoke
        run: node game-engine/tests/wake-trail-system-smoke.mjs
