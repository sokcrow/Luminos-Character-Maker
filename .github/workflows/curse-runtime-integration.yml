name: Curse Runtime Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/curse-runtime.js'
      - 'js/item-magic-runtime.js'
      - 'js/item-magic-knowledge-runtime.js'
      - 'js/item-equipment-bridge.js'
      - 'js/dm-item-instance-editor.js'
      - 'hoja_personaje.html'
      - 'Battle-viewer.html'
      - 'tests/curse-item-runtime-smoke.cjs'
      - 'tests/dm-item-instance-editor.spec.cjs'
      - '.github/workflows/curse-runtime-integration.yml'

jobs:
  curse-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/curse-runtime.js
          node --check js/item-magic-runtime.js
          node --check js/item-equipment-bridge.js
          node --check js/dm-item-instance-editor.js
          node --check tests/curse-item-runtime-smoke.cjs
          node --check tests/dm-item-instance-editor.spec.cjs
      - name: Playable Curse Item contract
        run: node tests/curse-item-runtime-smoke.cjs
      - name: Enchanter Bind regression
        run: node tests/item-bound-equipment-lock-smoke.cjs
      - name: Arcana and Curse knowledge regression
        run: node tests/item-magic-knowledge-runtime-smoke.cjs
