name: Curse Runtime Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/curse-catalog.js'
      - 'js/curse-runtime.js'
      - 'js/curse-enchanter-bridge.js'
      - 'js/item-enchanter-service-runtime.js'
      - 'js/item-enchantment-engine.js'
      - 'js/item-enchanter-ui.js'
      - 'functions/enchanter-atomic.cjs'
      - 'functions/build-enchanter-bundle.cjs'
      - 'functions/index.cjs'
      - 'js/item-magic-runtime.js'
      - 'js/item-magic-knowledge-runtime.js'
      - 'js/item-equipment-bridge.js'
      - 'js/dm-item-instance-editor.js'
      - 'hoja_personaje.html'
      - 'Battle-viewer.html'
      - 'tests/curse-item-runtime-smoke.cjs'
      - 'tests/curse-catalog-smoke.cjs'
      - 'tests/curse-enchanter-bridge-smoke.cjs'
      - 'tests/dm-item-instance-editor.spec.cjs'
      - '.github/workflows/curse-runtime-integration.yml'

jobs:
  curse-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/curse-catalog.js
          node --check js/curse-runtime.js
          node --check js/curse-enchanter-bridge.js
          node --check js/item-enchanter-service-runtime.js
          node --check js/item-enchantment-engine.js
          node --check js/item-enchanter-ui.js
          node --check functions/enchanter-atomic.cjs
          node --check functions/build-enchanter-bundle.cjs
          node --check js/item-magic-runtime.js
          node --check js/item-equipment-bridge.js
          node --check js/dm-item-instance-editor.js
          node --check tests/curse-item-runtime-smoke.cjs
          node --check tests/curse-catalog-smoke.cjs
          node --check tests/curse-enchanter-bridge-smoke.cjs
          node --check tests/dm-item-instance-editor.spec.cjs
      - name: Phase B catalog, schema and lifecycle
        run: node tests/curse-catalog-smoke.cjs
      - name: Phase C Enchanter selective removal and regression
        run: |
          node tests/curse-enchanter-bridge-smoke.cjs
          node tests/item-enchanter-service-runtime-smoke.cjs
          node tests/item-enchantment-engine-smoke.cjs
          node tests/item-enchanter-gem-procedure-smoke.cjs
      - name: Playable Curse Item contract
        run: node tests/curse-item-runtime-smoke.cjs
      - name: Enchanter Bind regression
        run: node tests/item-bound-equipment-lock-smoke.cjs
      - name: Arcana and Curse knowledge regression
        run: node tests/item-magic-knowledge-runtime-smoke.cjs
