name: Import Stat Skill icons from Imgur

on:
  push:
    branches:
      - feat/player-stat-skill-icons
    paths:
      - ".github/workflows/import-stat-skill-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-stat-skill-icons
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PNG validator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and verify all 18 Skill icons
        id: download
        continue-on-error: true
        run: python scripts/import-stat-skill-icons.py
      - name: Commit validated image assets
        shell: bash
        run: |
          if [ -d Assets/Icons/skills ] && find Assets/Icons/skills -maxdepth 1 -name '*.png' -type f | grep -q .; then
            git add -- Assets/Icons/skills
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Import verified Stat Skill icons"
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          else
            echo "No verified PNG files found."
          fi
      - name: Report incomplete download
        if: steps.download.outcome == 'failure'
        run: |
          echo "Some Skill icons are missing. Check the downloader output."
          exit 1
