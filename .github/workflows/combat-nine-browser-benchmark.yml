name: Nine browser Clash comparison
on:
  pull_request:
    paths:
      - 'tests/combat-nine-browser-*'
      - 'tests/helpers/combat-nine-fixture.mjs'
      - '.github/workflows/combat-nine-browser-benchmark.yml'
  workflow_dispatch:
jobs:
  before-and-after:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/combat-nine-browser-fixture-smoke.mjs
      - run: node tests/combat-spectator-presentation-smoke.mjs
      - run: node tests/combat-playback-dirty-render-smoke.mjs
      - run: node tests/combat-hud-coalescing-smoke.mjs
      - run: node tests/combat-shared-compositor-smoke.mjs
      - run: node tests/combat-overlay-batch-smoke.mjs
      - run: node scripts/build-combat-live.mjs --check
      - run: python -m pip install matplotlib
      - name: Reporter rejects incomplete visual coverage
        run: python tests/combat-nine-browser-report-test.py
      - name: Exact pre-optimization baseline
        run: |
          git fetch --no-tags --depth=1 origin cbba1548679606ed67a2d875ba27060920764dd1
          git worktree add "$RUNNER_TEMP/combat-baseline" cbba1548679606ed67a2d875ba27060920764dd1
      - name: Full combat with eight players and one DM
        env:
          COMBAT_BENCH_BASELINE_ROOT: ${{ runner.temp }}/combat-baseline
          COMBAT_BENCH_BASELINE_SHA: cbba1548679606ed67a2d875ba27060920764dd1
          COMBAT_BENCH_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'npx playwright test tests/combat-nine-browser-benchmark.spec.mjs --workers=1 --reporter=line --output=artifacts/combat-nine/playwright'
      - name: Measured latency and phase charts
        if: always()
        env:
          COMBAT_BENCH_CLASH_BUDGET_MS: '100'
        run: python tests/combat-nine-browser-report.py artifacts/combat-nine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-nine-before-after
          path: artifacts/combat-nine
          if-no-files-found: warn
