name: Resize Player Menu Icons Temp

on:
  push:
    branches:
      - feat/player-menu-icon-refresh
    paths:
      - ".github/workflows/resize-player-menu-icons-temp.yml"

permissions:
  contents: write

jobs:
  resize-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-menu-icon-refresh
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Resize menu icons to 96px
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; from PIL import Image; names=["Vitals.png","Stats.png","Progression.png","Apego.png","Terminal.png","Theatre.png","History.png"]; root=Path("Assets/Images/Buttons"); [(lambda p: (lambda im: im.resize((96,96), Image.Resampling.LANCZOS).save(p, format="PNG", optimize=True))(Image.open(p).convert("RGBA")))(root/n) for n in names]'
          python3 -c 'from pathlib import Path; from PIL import Image; names=["Vitals.png","Stats.png","Progression.png","Apego.png","Terminal.png","Theatre.png","History.png"]; root=Path("Assets/Images/Buttons"); [(lambda p: print(p, Image.open(p).size, p.stat().st_size))(root/n) for n in names]'

      - name: Commit resized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/resize-player-menu-icons-temp.yml
          git add Assets/Images/Buttons/Vitals.png
          git add Assets/Images/Buttons/Stats.png
          git add Assets/Images/Buttons/Progression.png
          git add Assets/Images/Buttons/Apego.png
          git add Assets/Images/Buttons/Terminal.png
          git add Assets/Images/Buttons/Theatre.png
          git add Assets/Images/Buttons/History.png
          git diff --cached --check
          git commit -m "perf: downscale player menu icon assets"
          git push origin HEAD:feat/player-menu-icon-refresh
