name: DM Live Session Entry

on:
  pull_request:
    branches: [main]
    paths:
      - 'pantalla_dm.html'
      - 'js/dm-tab-runtime-v2.js'
      - 'tests/dm-live-session-entry*'
      - '.github/workflows/dm-live-session-entry.yml'

jobs:
  live-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/dm-live-session-entry-smoke.mjs
      - run: node tests/combat-p0-theatre-smoke.mjs
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/dm-live-session-entry.spec.mjs --reporter=line
