name: Combat six viewer deadlines
on:
  pull_request:
    paths:
      - 'js/combat-v073-playback*.js'
      - 'js/combat-v073-steps.js'
      - 'combat/source/combat-v073-live.html'
      - 'Battle-viewer.html'
      - 'tests/combat-*clock*.mjs'
      - 'tests/combat-six-browser-deadlines.mjs'
      - '.github/workflows/combat-six-browser-deadlines.yml'
  workflow_dispatch:
jobs:
  live-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Deadline regression and recovery
        run: |
          node tests/combat-shared-clock-smoke.mjs
          node tests/combat-playback-six-viewers-recovery-smoke.mjs
          node tests/combat-playback-catchup-smoke.mjs
          node tests/combat-presentation-transport-smoke.mjs
      - name: DM and six real Coin renderers
        run: node tests/combat-six-browser-deadlines.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-six-viewer-deadlines
          path: artifacts/combat-deadlines
          if-no-files-found: warn
