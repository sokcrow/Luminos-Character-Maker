name: Combat six viewer deadlines
on:
  pull_request:
    paths:
      - 'js/combat-v073-playback*.js'
      - 'js/combat-v073-steps.js'
      - 'js/combat-v073-audiovisual.js'
      - 'css/combat-v073-audiovisual.css'
      - 'database.rules.json'
      - 'combat-results-firebase.json'
      - 'combat/source/combat-v073-live.html'
      - 'Battle-viewer.html'
      - 'tests/combat-*clock*.mjs'
      - 'tests/combat-six-browser-deadlines.mjs'
      - 'tests/combat-presentation-*.mjs'
      - 'tests/helpers/combat-presentation-assertions.mjs'
      - '.github/workflows/combat-six-browser-deadlines.yml'
  workflow_dispatch:
jobs:
  live-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - name: Deadline regression and recovery
        run: |
          node tests/combat-shared-clock-smoke.mjs
          node tests/combat-playback-six-viewers-recovery-smoke.mjs
          node tests/combat-playback-catchup-smoke.mjs
          node tests/combat-presentation-transport-smoke.mjs
          node tests/combat-presentation-assertions-smoke.mjs
          node tests/combat-presentation-phase-cancellation-smoke.mjs
          node scripts/build-combat-live.mjs --check
      - name: DM and six real Coin renderers
        run: |
          for attempt in 1 2 3; do
            COMBAT_DEADLINES_OUTPUT=artifacts/combat-deadlines/simulated-$attempt node tests/combat-six-browser-deadlines.mjs
          done
      - name: Seven authenticated browsers over RTDB with production rules
        env:
          COMBAT_FIREBASE_EMULATOR: '1'
          COMBAT_DEADLINES_OUTPUT: artifacts/combat-deadlines/firebase
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'node tests/combat-six-browser-deadlines.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-six-viewer-deadlines
          path: artifacts/combat-deadlines
          if-no-files-found: warn
