name: L777 Quarter Camera Validation

on:
  push:
    branches:
      - feat/item-icon-families
    paths:
      - ".github/workflows/l777-quarter-camera.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static game-engine smoke tests
        run: |
          node game-engine/tests/core-smoke.mjs
          node game-engine/tests/continuous-movement-smoke.mjs
          node game-engine/tests/visual-lab-smoke.mjs

      - name: Install browser runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate 90 degree camera steps
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/l777-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > l777-quarter-camera.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:720}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));\n          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});

          await page.goto('http://127.0.0.1:4173/game-engine/lab/game/forest-0.3.3.1.html?qa=procedural',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>window.PaperCameraControl&&window.__QA__,null,{timeout:120000});
          console.log('PROCEDURAL_CONTEXT',JSON.stringify(await page.evaluate(()=>window.__PROCEDURAL_QA__||null)));

          const initial=await page.evaluate(()=>({
            version:window.PaperCameraControl.version,
            quarter:window.PaperCameraControl.quarter(),
            yaw:window.PaperCameraControl.yaw(),
            degrees:window.PaperCameraControl.controls.quarterDegrees,
            threshold:window.PaperCameraControl.controls.swipeThresholdPx
          }));
          console.log('QUARTER_CAMERA_INITIAL',JSON.stringify(initial));
          assert.equal(initial.version,'player-quarter-camera-v2');
          assert.equal(initial.quarter,0);
          assert.equal(initial.yaw,0);
          assert.equal(initial.degrees,90);
          assert.ok(initial.threshold>=30);

          const canvas=page.locator('canvas').first();
          const box=await canvas.boundingBox();
          assert.ok(box);

          // Short drag below threshold must NOT rotate.
          await page.mouse.move(box.x+box.width*.65,box.y+box.height*.55);
          await page.mouse.down();
          await page.mouse.move(box.x+box.width*.63,box.y+box.height*.55,{steps:3});
          await page.mouse.up();
          await page.waitForTimeout(150);
          let state=await page.evaluate(()=>({quarter:window.PaperCameraControl.quarter(),yaw:window.PaperCameraControl.yaw()}));
          assert.equal(state.quarter,0);
          assert.equal(state.yaw,0);

          // One left swipe = exactly one +90 degree quarter, regardless of swipe length.
          await page.mouse.move(box.x+box.width*.75,box.y+box.height*.55);
          await page.mouse.down();
          await page.mouse.move(box.x+box.width*.25,box.y+box.height*.55,{steps:10});
          await page.mouse.up();
          await page.waitForTimeout(450);
          state=await page.evaluate(()=>({quarter:window.PaperCameraControl.quarter(),yaw:window.PaperCameraControl.yaw(),camera:window.__QA__.snapshot().camera}));
          console.log('QUARTER_CAMERA_SWIPE',JSON.stringify(state));
          assert.equal(state.quarter,1);
          assert.ok(Math.abs(state.yaw-Math.PI/2)<1e-9);

          // E = one +90 degree step, key hold/repeat must not accumulate arbitrary angles.
          await page.keyboard.press('e');
          await page.waitForTimeout(350);
          state=await page.evaluate(()=>({quarter:window.PaperCameraControl.quarter(),yaw:window.PaperCameraControl.yaw()}));
          assert.equal(state.quarter,2);
          assert.ok(Math.abs(state.yaw-Math.PI)<1e-9);

          // Q = one -90 degree step.
          await page.keyboard.press('q');
          await page.waitForTimeout(350);
          state=await page.evaluate(()=>({quarter:window.PaperCameraControl.quarter(),yaw:window.PaperCameraControl.yaw()}));
          assert.equal(state.quarter,1);
          assert.ok(Math.abs(state.yaw-Math.PI/2)<1e-9);

          // Four total clockwise quarters wrap exactly to zero.
          await page.evaluate(()=>window.PaperCameraControl.setQuarter(0));
          for(let i=0;i<4;i++) await page.evaluate(()=>window.PaperCameraControl.rotateQuarter(1));
          state=await page.evaluate(()=>({quarter:window.PaperCameraControl.quarter(),yaw:window.PaperCameraControl.yaw()}));
          assert.equal(state.quarter,0);
          assert.equal(state.yaw,0);

          assert.equal(errors.length,0,'page errors: '+errors.join(' | '));
          await page.screenshot({path:'quarter-camera.png',fullPage:false});
          await browser.close();
          EOF
          node l777-quarter-camera.mjs
          rm -f l777-quarter-camera.mjs

      - name: Build L777.zip
        shell: python
        run: |
          import os,zipfile
          root=os.getcwd()
          out=os.path.join(root,"L777.zip")
          skip={".git","node_modules"}
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for base,dirs,files in os.walk(root):
                  dirs[:]=[d for d in dirs if d not in skip]
                  for name in files:
                      path=os.path.join(base,name)
                      rel=os.path.relpath(path,root).replace(os.sep,"/")
                      if rel in {"L777.zip","quarter-camera.png",".github/workflows/l777-quarter-camera.yml"}: continue
                      z.write(path,rel)

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: L777-quarter-camera-package
          path: |
            L777.zip
            quarter-camera.png
          if-no-files-found: error
          retention-days: 1
