name: PR818 Local Spawn Fix

on:
  push:
    branches:
      - lab-preview
    paths:
      - ".github/workflows/pr818-local-spawn-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab-preview
        uses: actions/checkout@v4
        with:
          ref: lab-preview
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply local spawn architecture fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('game-engine/lab/game/forest-0.3.3.1.html')
          text = html_path.read_text(encoding='utf-8')

          old_validate = """function validateSceneGeometry(parent){
            parent?.traverse?.(o=>{
              if(o.isMesh&&o.geometry&&!geometryIsFinite(o.geometry)){
                console.error('Geometría inválida detectada y ocultada:',o);
                o.visible=false;
              }
            });
          }"""
          new_validate = """function validateSceneGeometry(parent){
            // Procedural terrain reuses geometries heavily. Validate each geometry once,
            // but still hide every mesh that references an invalid geometry.
            const validity=new Map();
            parent?.traverse?.(o=>{
              if(!o.isMesh||!o.geometry)return;
              let valid=validity.get(o.geometry);
              if(valid===undefined){
                valid=geometryIsFinite(o.geometry);
                validity.set(o.geometry,valid);
              }
              if(!valid){
                console.error('Geometría inválida detectada y ocultada:',o);
                o.visible=false;
              }
            });
          }"""
          if old_validate not in text:
              raise SystemExit('validateSceneGeometry block not found; refusing blind patch')
          text = text.replace(old_validate, new_validate, 1)

          spawn_pattern = re.compile(
              r"function resolveSafeSpawn\(mapDef,desired,\{requireDry=true\}=\{\}\)\{.*?\n\}\nconst SpawnSafetySystem=Object\.freeze\(\{",
              re.S,
          )
          new_spawn = r"""const SAFE_SPAWN_ROUTE_LIMIT=24;
          const SAFE_SPAWN_RING_RADII=Object.freeze([.75,1.5,2.5,4,6,8]);
          const SAFE_SPAWN_RING_SAMPLES=12;
          function resolveSafeSpawn(mapDef,desired,{requireDry=true}={}){
            // X/Z is an entry intent. On procedural sectors Y is intentionally ignored
            // until the final terrain exists and formalGroundYAtWorld can resolve it.
            const source=desired?.clone?.()||new THREE.Vector3(Number(desired?.x)||0,0,Number(desired?.z)||0);
            if(isOverworldSector(mapId))source.y=0;

            const candidates=[];
            const seen=new Set();
            const queueCandidate=(x,z,kind='local')=>{
              if(!Number.isFinite(x)||!Number.isFinite(z))return;
              const key=`${Math.round(x*1000)}:${Math.round(z*1000)}`;
              if(seen.has(key))return;
              seen.add(key);
              candidates.push({p:new THREE.Vector3(x,source.y,z),kind});
            };
            queueCandidate(source.x,source.z,'anchor');

            let routeFallback=null;
            if(isOverworldSector(mapId)&&proceduralSectorRecipe(mapId)){
              const routeCandidates=[];
              for(const route of proceduralTravelPathRoutes(mapId)){
                for(const point of route.points||[]){
                  const p=new THREE.Vector3(wt(point.x),0,wt(point.z));
                  routeCandidates.push({p,d:Math.hypot(p.x-source.x,p.z-source.z)});
                }
              }
              routeCandidates.sort((a,b)=>a.d-b.d);
              routeFallback=routeCandidates[0]?.p||null;
              for(const candidate of routeCandidates.slice(0,SAFE_SPAWN_ROUTE_LIMIT)){
                queueCandidate(candidate.p.x,candidate.p.z,'travel-path');
              }
            }

            for(const radiusTiles of SAFE_SPAWN_RING_RADII){
              const radius=wt(radiusTiles);
              for(let i=0;i<SAFE_SPAWN_RING_SAMPLES;i++){
                const a=i/SAFE_SPAWN_RING_SAMPLES*Math.PI*2;
                queueCandidate(source.x+Math.cos(a)*radius,source.z+Math.sin(a)*radius,'ring');
              }
            }

            const tryCandidates=dry=>{
              for(const candidate of candidates){
                if(spawnCandidateAllowed(candidate.p.x,candidate.p.z,mapDef,{requireDry:dry}))return candidate;
              }
              return null;
            };

            let selected=tryCandidates(requireDry);
            if(!selected&&requireDry)selected=tryCandidates(false);
            if(selected){
              if(selected.p.x!==source.x||selected.p.z!==source.z){
                console.info('Spawn safety relocated local entry',mapId,{kind:selected.kind,from:{x:source.x,z:source.z},to:{x:selected.p.x,z:selected.p.z}});
              }
              return selected.p;
            }

            // Generated travel paths are carved/cleared during terrain construction and
            // are the deterministic emergency anchor. Never scan the whole map at boot.
            if(routeFallback){
              console.warn('Spawn safety exhausted bounded candidates; using nearest generated travel path',mapId,{x:routeFallback.x,z:routeFallback.z});
              return routeFallback;
            }
            console.error('Spawn safety exhausted bounded candidates; keeping local entry anchor',mapId,{x:source.x,z:source.z});
            return source;
          }
          const SpawnSafetySystem=Object.freeze({"""
          text, count = spawn_pattern.subn(new_spawn, text, count=1)
          if count != 1:
              raise SystemExit(f'resolveSafeSpawn patch count={count}; refusing blind patch')

          old_progress = "window.setLoadProgress?.(78,'Revisando colisiones','Buscando un punto seguro para el jugador…');"
          new_progress = "window.setLoadProgress?.(78,'Validando terreno','Comprobando la geometría ya generada…');"
          if old_progress not in text:
              raise SystemExit('78% progress marker not found')
          text = text.replace(old_progress, new_progress, 1)

          old_entry = """window.setLoadProgress?.(82,'Verificando entrada','Buscando ruta segura…');
            const authoredSpawn=spawn?.clone?.()||new THREE.Vector3(wt(mapDef.spawn.x),wt(mapDef.spawn.y||0),wt(mapDef.spawn.z));
            // SPAWN SAFETY CONTRACT: every map entry is checked after the renderer has built
            // its actual colliders. Default spawns prefer dry land; authored transition spawns
            // may remain in swimmable water, but never inside a collider/non-walkable cell.
            const s=resolveSafeSpawn(mapDef,authoredSpawn,{requireDry:!spawn});"""
          new_entry = """window.setLoadProgress?.(82,'Resolviendo entrada local','Calculando spawn sobre el terreno final…');
            const spawnIntent=spawn?.clone?.()||new THREE.Vector3(wt(mapDef.spawn.x),wt(mapDef.spawn.y||0),wt(mapDef.spawn.z));
            // SPAWN SAFETY CONTRACT: Hexmap/map transitions provide an X/Z entry intent.
            // Procedural terrain is already built here, so only now do we resolve a safe
            // local position. Its final Y is derived from the generated terrain below.
            if(isOverworldSector(mapId))spawnIntent.y=0;
            const s=resolveSafeSpawn(mapDef,spawnIntent,{requireDry:!spawn});"""
          if old_entry not in text:
              raise SystemExit('loadMap spawn-entry block not found')
          text = text.replace(old_entry, new_entry, 1)

          old_place = """window.setLoadProgress?.(86,'Entrada confirmada','Acomodando jugador y compañero…');

            player.position.set(s.x,worldLayerBaseY+(s.y||0),s.z);
            if(isOverworldSector(mapId))player.position.y=formalGroundYAtWorld(player.position.x,player.position.z,currentWorldLayer);"""
          new_place = """window.setLoadProgress?.(86,'Entrada confirmada','Ajustando altura al terreno y colocando actores…');

            let resolvedSpawnY=worldLayerBaseY+(Number.isFinite(s.y)?s.y:0);
            if(isOverworldSector(mapId)){
              const terrainY=formalGroundYAtWorld(s.x,s.z,currentWorldLayer);
              if(Number.isFinite(terrainY))resolvedSpawnY=terrainY;
            }
            player.position.set(s.x,resolvedSpawnY,s.z);"""
          if old_place not in text:
              raise SystemExit('player placement block not found')
          text = text.replace(old_place, new_place, 1)

          html_path.write_text(text, encoding='utf-8')

          smoke = Path('game-engine/tests/spawn-loading-smoke.mjs')
          smoke.write_text(r"""import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const html=fs.readFileSync(new URL('../lab/game/forest-0.3.3.1.html',import.meta.url),'utf8');
          const resolver=html.match(/const SAFE_SPAWN_ROUTE_LIMIT=24;[\s\S]*?const SpawnSafetySystem=Object\.freeze\(\{/u)?.[0]||'';

          assert.ok(resolver,'bounded local spawn resolver must exist');
          assert.match(resolver,/SAFE_SPAWN_RING_RADII=Object\.freeze\(\[\.75,1\.5,2\.5,4,6,8\]\)/u);
          assert.match(resolver,/SAFE_SPAWN_RING_SAMPLES=12/u);
          assert.doesNotMatch(resolver,/for\(let tz=/u,'spawn resolver must never full-scan the map grid');
          assert.match(html,/if\(isOverworldSector\(mapId\)\)spawnIntent\.y=0;/u,'procedural spawn must be X\/Z intent until terrain is final');
          assert.match(html,/const terrainY=formalGroundYAtWorld\(s\.x,s\.z,currentWorldLayer\);/u,'final procedural Y must come from generated terrain');
          assert.match(html,/const validity=new Map\(\);/u,'geometry validation should cache shared geometry results');
          console.log('spawn-loading-smoke: ok');
          """, encoding='utf-8')
          PY

      - name: Validate spawn migration and engine smoke tests
        run: |
          node game-engine/tests/spawn-loading-smoke.mjs
          node game-engine/tests/core-smoke.mjs
          node game-engine/tests/continuous-movement-smoke.mjs
          node game-engine/tests/visual-lab-smoke.mjs
          node game-engine/tests/world-floor-textures-smoke.mjs
          node game-engine/tests/terrain-surface-standard-smoke.mjs
          node game-engine/tests/water-body-system-smoke.mjs
          node game-engine/tests/wake-trail-system-smoke.mjs

      - name: Commit engine update and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr818-local-spawn-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(engine): resolve spawn after procedural terrain"
          git push origin HEAD:lab-preview
