name: L777 Biome Validation Probe

on:
  push:
    branches:
      - feat/item-icon-families
    paths:
      - ".github/workflows/l777-biome-validation-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static smoke
        run: |
          node game-engine/tests/core-smoke.mjs
          node game-engine/tests/continuous-movement-smoke.mjs
          node game-engine/tests/visual-lab-smoke.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe all seven current regions
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/l777-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          cat > biome-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:720}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/game-engine/lab/game/forest-0.3.3.1.html?qa=procedural',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>window.PaperGlobalMap&&window.PaperZoneComposer&&window.LuminousGeographyGeology,{timeout:120000});
          const results=await page.evaluate(()=>{
            const rows=[];
            for(const region of window.PaperGlobalMap.regions()){
              window.PaperZoneComposer.activate(region);
              const audit=window.LuminousGeographyGeology.audit('owC');
              const active=window.PaperZoneComposer.active();
              rows.push({
                id:region.id,label:region.label,profile:region.biomeProfile,
                hydrology:active?.hydrology?.type||'none',
                forestBiome:!!active?.forestBiome,
                macroforms:active?.macroforms?.length||0,
                geographyFeatures:active?.geography?.features?.length||0,
                ...audit
              });
            }
            return rows;
          });
          console.log('BIOME_VALIDATION_PROBE',JSON.stringify(results));
          assert.equal(results.length,7);
          assert.equal(errors.length,0,'runtime errors: '+errors.join(' | '));
          await browser.close();
          EOF
          node biome-probe.mjs
          rm -f biome-probe.mjs
