name: Materialize Item Catalog V10

on:
  push:
    branches:
      - feat/item-database-v10-runtime
    paths:
      - 'tmp/item-catalog-v10/**'
      - '.github/workflows/item-catalog-v10-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/item-database-v10-runtime
          fetch-depth: 0
      - name: Verify and rebuild generated catalog
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/item-catalog.sha256 <<'SUMS'
          a944724548411c845cbf627e316ce0200c80f3f210a03e884f94f5717b5ce81e  tmp/item-catalog-v10/part-01.b64
          8b8c5836e4874715ee43f689411a04f0f563372e424071b20cfc57786c3d3547  tmp/item-catalog-v10/part-02.b64
          9bcdb416fa38213debbc86eaca19faaa8fee6ccfa2540de5c9d320de6fdb28d5  tmp/item-catalog-v10/part-03.b64
          84ac9dcc9cc359927f5d517e094a99822f97d5dacf621dfa212aa9238a16a163  tmp/item-catalog-v10/part-04.b64
          d3f406a9f93ec38b567718cf5ce85e1e24c520b4cc23a3f1a99640d1be2b84ca  tmp/item-catalog-v10/part-05.b64
          b921848afb0431c9a008a48d1de2e254a7e0057a5203274e905054ae74fa5449  tmp/item-catalog-v10/part-06.b64
          ab274998e6cd590766beac0b2da70164d81154915073b77d4cda669dce8e6664  tmp/item-catalog-v10/part-07.b64
          b5db651e6bc15b2a68cb427ef106a846430a8f2f80cccb859ecb9c4fbeadd29e  tmp/item-catalog-v10/part-08.b64
          SUMS
          sha256sum -c /tmp/item-catalog.sha256
          cat tmp/item-catalog-v10/part-*.b64 | base64 --decode | gzip --decompress > js/item-catalog-v10.js
          node --check js/item-catalog-v10.js
          node - <<'NODE'
          require('./js/content-registry.js');
          require('./js/item-icon-registry.js');
          const catalog = require('./js/item-catalog-v10.js');
          if (catalog.count !== 560) throw new Error(`Expected 560 definitions, got ${catalog.count}`);
          const registered = catalog.registerAll();
          if (registered.length !== 560) throw new Error(`Expected 560 registered definitions, got ${registered.length}`);
          const invalid = catalog.list().filter((item) => !globalThis.LuminousItemIconRegistry.has(item.iconGroup));
          if (invalid.length) throw new Error(`Invalid icon groups: ${invalid.map((x) => x.canonicalId).join(', ')}`);
          console.log(`Item Catalog V10 materialized: ${catalog.count}/560 definitions, ${invalid.length} invalid icon groups`);
          NODE
      - name: Commit generated catalog and remove staging payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/item-catalog-v10
          rm -f .github/workflows/item-catalog-v10-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'feat(items): materialize canonical V10 item catalog'
          git push origin HEAD:feat/item-database-v10-runtime
