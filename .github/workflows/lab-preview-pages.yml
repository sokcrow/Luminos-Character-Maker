name: Lab Preview

on:
  push:
    branches:
      - lab-preview
    paths:
      - "game-engine/**"
      - "js/**"
      - "Assets/Images/World/**"
      - "Assets/Images/Buttons/**"
      - "lab-preview/**"
      - ".github/workflows/lab-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lab-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab-preview
        uses: actions/checkout@v4
        with:
          ref: lab-preview

      - name: Build lean Lab site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/Assets/Images
          cp -a game-engine _site/game-engine
          cp -a js _site/js
          cp -a Assets/Images/Buttons _site/Assets/Images/Buttons
          cp -a Assets/Images/World _site/Assets/Images/World
          cp -a lab-preview _site/lab-preview
          touch _site/.nojekyll

      - name: Verify Lab entrypoint
        shell: bash
        run: |
          test -f _site/lab-preview/index.html
          test -f _site/game-engine/lab/index.html
          test -f _site/game-engine/lab/game/forest-0.3.3.1.html
          test -f _site/game-engine/src/world/WorldFloorTextures.js
          test -f _site/Assets/Images/World/Floors/floor_grass_01.png
          test -f _site/Assets/Images/Buttons/Inventory.svg
          echo "Lean Lab site verified."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Lab Preview
        id: deployment
        uses: actions/deploy-pages@v4
