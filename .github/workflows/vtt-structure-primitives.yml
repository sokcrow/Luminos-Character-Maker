name: VTT Structure Primitives

on:
  pull_request:
    paths:
      - 'js/vtt/structure-*.js'
      - 'js/vtt/main.js'
      - 'js/vtt/engine.js'
      - 'js/vtt/topology*.js'
      - 'js/vtt/token-interaction.js'
      - 'js/vtt/pathfinding.js'
      - 'js/vtt/physical-resolver.js'
      - 'tests/vtt_structure_primitives.spec.js'
      - '.github/workflows/vtt-structure-primitives.yml'
  workflow_dispatch:

jobs:
  structure-primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check js/vtt/structure-core.js
          node --check js/vtt/structure-authoring-patch.js
          node --check js/vtt/structure-topology-patch.js
          node --check js/vtt/structure-physical-patch.js
          node --check js/vtt/structure-renderer.js
          node --check js/vtt/token-interaction.js
          node --input-type=module --check < js/vtt/structure-bootstrap.js
          node --input-type=module --check < js/vtt/engine.js
          node --input-type=module --check < js/vtt/main.js
          node --check tests/vtt_structure_primitives.spec.js
      - name: Focused contracts
        run: npx playwright test tests/vtt_structure_primitives.spec.js tests/vtt_opening_edge_replacement.spec.js tests/vtt_wall_autotiling.spec.js tests/vtt_wall_builder_foundation.spec.js tests/vtt_surface_foundation.spec.js tests/vtt_map_hud_physical.spec.js --workers=1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Repository regression
        run: npx playwright test --workers=1
