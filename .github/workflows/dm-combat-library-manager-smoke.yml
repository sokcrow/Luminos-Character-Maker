name: DM Combat Library Manager Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'pantalla_dm.html'
      - 'Battle-viewer.html'
      - 'js/utils.js'
      - 'js/dm-combat-live-viewer.js'
      - 'js/combat-v073-dm-observer.js'
      - 'js/dm-combat-tab-manager.js'
      - 'js/combat-unit-library-sync.js'
      - 'js/combat-v073-dm-setup.js'
      - 'js/unit-catalog-kobold-tier1.js'
      - 'js/unit-catalog-goblin.js'
      - 'js/unit-catalog-wolf.js'
      - 'tests/dm-combat-library-manager-smoke.mjs'
      - 'tests/dm-combat-live-viewer-smoke.mjs'
      - 'tests/combat-v073-dm-observer-smoke.mjs'
      - 'tests/dm-combat-unit-library-real-ui-smoke.mjs'
      - '.github/workflows/dm-combat-library-manager-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check js/dm-combat-live-viewer.js
          node --check js/combat-v073-dm-observer.js
          node --check js/dm-combat-tab-manager.js
          node --check js/combat-unit-library-sync.js
          node --check js/combat-v073-dm-setup.js
      - name: Real DM tab contract
        run: node tests/dm-combat-library-manager-smoke.mjs
      - name: Real DM Battle Viewer visual evidence
        run: node tests/dm-combat-live-viewer-smoke.mjs
      - name: DM Battle DOM-base observer contract
        run: node tests/combat-v073-dm-observer-smoke.mjs
      - name: Empty Firebase real UI runtime
        run: node tests/dm-combat-unit-library-real-ui-smoke.mjs
