name: Universal Unit Decks
on:
  pull_request:
    paths:
      - 'js/deckEngine.js'
      - 'js/combat-v073-deck.js'
      - 'js/combat-v073-economy-menu.js'
      - 'js/combat-skill-loadout-074.js'
      - 'js/combat-v073-live-adapter.js'
      - 'js/combat-v073-authority.js'
      - 'js/combat-v073-dm-setup.js'
      - 'js/unit-combat-instantiator.js'
      - 'js/skill-deck-rules-v2.js'
      - 'Battle-viewer.html'
      - 'combat/**'
      - 'tests/universal-unit-decks-smoke.mjs'
      - 'tests/skill-deck-v2-smoke.mjs'
      - '.github/workflows/universal-unit-decks.yml'
  workflow_dispatch:
jobs:
  universal-decks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify universal decks and real live AI selection
        run: node tests/universal-unit-decks-smoke.mjs
      - name: Verify V2, legacy decks, equipment modes and loadout regressions
        run: |
          node tests/skill-deck-v2-smoke.mjs
          node tests/combat-deck-engine-smoke.mjs
          node tests/build-equipment-decks-smoke.mjs
          node tests/combat-v074-skill-loadout-smoke.mjs
          node tests/combat-v073-runtime-hotfix-smoke.mjs
          node tests/combat-v073-economy-menu-smoke.mjs
      - name: Verify shipped Combat bundle
        run: node scripts/build-combat-live.mjs --check
