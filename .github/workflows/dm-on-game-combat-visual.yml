name: DM ON GAME Combat Visual

on:
  pull_request:
    branches: [main]
    paths:
      - 'hoja_de_DM.html'
      - 'Battle-viewer.html'
      - 'combat/**'
      - 'js/instance-control.js'
      - 'js/combat-v073-live-adapter.js'
      - 'js/combat-v073-dm-observer.js'
      - 'js/dm-on-game-combat-viewer.js'
      - 'tests/dm-on-game-combat-visual.spec.mjs'
      - '.github/workflows/dm-on-game-combat-visual.yml'

jobs:
  dm-on-game-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium visual probe
        run: |
          npm install --no-save @playwright/test@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Syntax check ON GAME supervisor
        run: node --check js/dm-on-game-combat-viewer.js
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dm-on-game-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/hoja_de_DM.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dm-on-game-http.log
          exit 1
      - name: Prove ON GAME DM Combat pixels
        run: npx playwright test tests/dm-on-game-combat-visual.spec.mjs --reporter=line
      - name: Upload ON GAME DM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm-on-game-combat-visual
          path: |
            artifacts/dm-on-game-combat/*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
