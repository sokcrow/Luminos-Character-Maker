name: VTT Rama 4 Procedural ID P0

on:
  push:
    branches:
      - rama4-grid-topology-verticality
    paths:
      - 'js/vtt/map-authoring.js'
      - 'js/vtt/map-authoring-state.js'
      - 'js/vtt/live-map-creator-hotfix.js'
      - 'js/vtt/map-test-lab.js'
      - 'js/vtt/map-library-test-controls.js'
      - 'js/vtt/horizontal-plane-preload.js'
      - 'js/vtt/procedural-id-auditor.js'
      - 'js/vtt/procedural-generator-core.js'
      - 'js/vtt/procedural-building-generator.js'
      - 'js/vtt/procedural-building-mix-patch.js'
      - 'js/vtt/urban-fabric-core.js'
      - 'js/vtt/procedural-zone-core.js'
      - 'scripts/vtt-map-creation-id-regression-check.mjs'
      - 'scripts/vtt-map-deletion-regression-check.mjs'
      - 'scripts/vtt-map-test-lab-check.mjs'
      - 'scripts/vtt-map-create-procedural-flow-check.mjs'
      - 'scripts/vtt-procedural-id-regression-check.mjs'
      - '.github/workflows/vtt-rama4-procedural-id-p0.yml'
  pull_request:
    paths:
      - 'js/vtt/map-authoring.js'
      - 'js/vtt/map-authoring-state.js'
      - 'js/vtt/live-map-creator-hotfix.js'
      - 'js/vtt/map-test-lab.js'
      - 'js/vtt/map-library-test-controls.js'
      - 'js/vtt/horizontal-plane-preload.js'
      - 'js/vtt/procedural-id-auditor.js'
      - 'js/vtt/procedural-generator-core.js'
      - 'js/vtt/procedural-building-generator.js'
      - 'js/vtt/procedural-building-mix-patch.js'
      - 'js/vtt/urban-fabric-core.js'
      - 'js/vtt/procedural-zone-core.js'
      - 'scripts/vtt-map-creation-id-regression-check.mjs'
      - 'scripts/vtt-map-deletion-regression-check.mjs'
      - 'scripts/vtt-map-test-lab-check.mjs'
      - 'scripts/vtt-map-create-procedural-flow-check.mjs'
      - 'scripts/vtt-procedural-id-regression-check.mjs'
      - '.github/workflows/vtt-rama4-procedural-id-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procedural-id-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --input-type=module --check < js/vtt/map-authoring-state.js
          node --input-type=module --check < js/vtt/live-map-creator-hotfix.js
          node --check js/vtt/map-test-lab.js
          node --check js/vtt/map-library-test-controls.js
          node --check js/vtt/horizontal-plane-preload.js
          node --input-type=module --check < js/vtt/procedural-id-auditor.js
          node --check scripts/vtt-map-creation-id-regression-check.mjs
          node --check scripts/vtt-map-deletion-regression-check.mjs
          node --check scripts/vtt-map-test-lab-check.mjs
          node --check scripts/vtt-map-create-procedural-flow-check.mjs
          node --check scripts/vtt-procedural-id-regression-check.mjs
      - name: Collision-safe map creation
        run: node scripts/vtt-map-creation-id-regression-check.mjs
      - name: Safe map deletion
        run: node scripts/vtt-map-deletion-regression-check.mjs
      - name: Deterministic Test Lab
        run: node scripts/vtt-map-test-lab-check.mjs
      - name: New map to procedural flow
        run: node scripts/vtt-map-create-procedural-flow-check.mjs
      - name: Procedural ID regression matrix
        run: node scripts/vtt-procedural-id-regression-check.mjs
