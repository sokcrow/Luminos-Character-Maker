name: Combat Player Interaction Visual

on:
  pull_request:
    branches: [main]
    paths:
      - 'Battle-viewer.html'
      - 'combat/**'
      - 'js/combat-v073-economy-menu.js'
      - 'js/combat-v073-economy-review-fixes.js'
      - 'tests/combat-v073-player-menu-visual.spec.mjs'
      - 'tests/combat-v073-economy-review-install-retry-smoke.mjs'
      - '.github/workflows/combat-player-interaction-visual.yml'

jobs:
  player-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bounded install retry contract
        run: node tests/combat-v073-economy-review-install-retry-smoke.mjs
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/combat-player-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/Battle-viewer.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/combat-player-http.log
          exit 1
      - name: Physical click path
        run: npx playwright test tests/combat-v073-player-menu-visual.spec.mjs --reporter=line --grep "internal Combat buttons"
