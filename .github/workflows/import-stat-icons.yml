name: Import Stats Ability Icons

on:
  push:
    branches:
      - feat/stats-ability-png-icons
    paths:
      - 'scripts/import-stat-icons.py'
      - '.github/workflows/import-stat-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Fetch and validate Stats icons
        id: images
        continue-on-error: true
        run: python scripts/import-stat-icons.py
      - name: Commit validated PNG images
        shell: bash
        run: |
          git add -- Assets/Icons/stats
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Store six verified Stats Ability PNG icons"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Flag missing images
        if: steps.images.outcome == 'failure'
        run: exit 1
