name: Apply DM sync null freeze patch

on:
  push:
    branches:
      - fix/dm-sync-null-freeze

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dm-sync-null-freeze
          fetch-depth: 0
      - name: Apply guarded legacy control patch
        run: python3 scripts/apply-dm-sync-null-freeze.py
      - name: Verify diff
        run: git diff --check
      - name: Commit patched pantalla_dm
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pantalla_dm.html
          git commit -m "fix: guard removed DM crafting toggle"
          git push origin HEAD:fix/dm-sync-null-freeze
