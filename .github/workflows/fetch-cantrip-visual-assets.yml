name: Fetch Cantrip Visual Assets

on:
  push:
    branches:
      - feat/cantrip-visual-assets
    paths:
      - ".github/workflows/fetch-cantrip-visual-assets.yml"

permissions:
  contents: write

jobs:
  fetch-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: feat/cantrip-visual-assets

      - name: Download cantrip assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Assets/Icons/status/cantrips
          mkdir -p Assets/Images/SpellUnits
          mkdir -p Assets/Icons/items/utility

          fetch_png() {
            local id="$1"
            local output="$2"
            curl --fail --location --retry 4 --retry-delay 2 \
              -A "Mozilla/5.0" \
              "https://i.imgur.com/${id}.png" \
              --output "${output}"
            file "${output}" | grep -q "PNG image data"
          }

          fetch_png WvQvb9d Assets/Icons/status/cantrips/illusion.png
          fetch_png qs0vIeM Assets/Icons/status/cantrips/blade_guard.png
          fetch_png 2qOSMHz Assets/Icons/status/cantrips/dancing_light.png
          fetch_png VjpWv4j Assets/Icons/status/cantrips/light.png
          fetch_png MPDf6pi Assets/Icons/status/cantrips/guidance.png
          fetch_png Br6idw1 Assets/Icons/status/cantrips/resistance.png
          fetch_png 42ESliW Assets/Icons/status/cantrips/booming.png
          fetch_png OtAgwTp Assets/Icons/status/cantrips/shillelagh.png

          fetch_png 7MZLBdD Assets/Icons/items/utility/thought_strand.png

          fetch_png 1Gch4Vu Assets/Images/SpellUnits/infestation.png
          fetch_png jB5dvlv Assets/Images/SpellUnits/bonfire.png
          fetch_png fNicmZG Assets/Images/SpellUnits/produce_flame.png
          fetch_png 6uri14v Assets/Images/SpellUnits/mage_hand.png

      - name: Commit downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Icons/status/cantrips Assets/Icons/items/utility/thought_strand.png Assets/Images/SpellUnits
          if git diff --cached --quiet; then
            echo "Assets already present."
            exit 0
          fi
          git commit -m "assets: add cantrip visual assets"
          git push origin HEAD:feat/cantrip-visual-assets
