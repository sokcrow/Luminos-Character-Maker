name: Player UI Long Session Performance

concurrency:
  group: player-ui-long-session-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [fix/player-ui-long-session-performance]
  pull_request:
    branches: [main]
    paths:
      - 'js/instance-control.js'
      - 'js/on-game-dashboard.js'
      - 'hoja_de_DM.html'
      - 'js/player-trait-runtime.js'
      - 'js/trait-player-tray.js'
      - 'js/player-archetype-runtime-core.js'
      - 'js/player-archetype-runtime.js'
      - 'js/class-runtime-bootstrap.js'
      - 'js/theatre-check-retry-watchdog.js'
      - 'js/theatre-check-coordinator.js'
      - 'js/theatre-language-policy.js'
      - 'js/theatre-intervention-ux-core.js'
      - 'js/status-engine.js'
      - 'js/trait-catalog-core.js'
      - 'js/trait-standardization-runtime.js'
      - 'js/player-stats-ability-bar.js'
      - 'css/player-stats-ability-bar.css'
      - 'css/theatre-hud.css'
      - 'css/theatre-message-policy.css'
      - 'js/player-splash-framing.js'
      - 'js/player-ux-polish-core.js'
      - 'js/player-stat-tooltip-runtime.js'
      - 'js/derived-stats-runtime.js'
      - 'js/rest-runtime-integration.js'
      - 'js/theatre-special-language-enforcement-hotfix.js'
      - 'js/theatre-special-language-log-hotfix.js'
      - 'js/canonical-race-integration.js'
      - 'js/existing-racial-stat-integration.js'
      - 'js/unit-rank-runtime.js'
      - 'js/injury-engine.js'
      - 'js/trait-formula-view-patch.js'
      - 'js/skill-trait-breakdown-patch.js'
      - 'js/milestone-revert-patch.js'
      - 'js/devil-lineage-runtime.js'
      - 'js/college-of-whispers-runtime.js'
      - 'js/spellcasting-runtime.js'
      - 'js/injury-equipment-runtime.js'
      - 'js/caster-spellcasting-traits-runtime.js'
      - 'js/spellcasting-basic-rules-runtime.js'
      - 'js/scene-time-runtime.js'
      - 'js/fixed-damage-runtime.js'
      - 'hoja_personaje.js'
      - 'hoja_personaje.html'
      - 'hoja_personaje.css'
      - 'css/player-trait-tabs.css'
      - 'js/player-progression-tree.js'
      - 'js/player-progression-level-allocation.js'
      - 'Battle-viewer.html'
      - 'tests/player-combat-theatre-lifecycle.spec.mjs'
      - 'tests/player-theatre-spacing-smoke.mjs'
      - 'tests/dm-dialogue-composer-layout-smoke.mjs'
      - 'tests/theatre-queue-bank-hotfix-smoke.mjs'
      - 'tests/player-ui-long-session-performance.spec.mjs'
      - 'tests/trait-formula-display-contract.mjs'
      - '.github/workflows/player-combat-theatre-lifecycle.yml'

jobs:
  syntax-and-renderer-contract:
    name: Syntax + renderer contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check js/instance-control.js
          node --check js/on-game-dashboard.js
          node --check js/player-trait-runtime.js
          node --check js/trait-player-tray.js
          node --check js/player-archetype-runtime-core.js
          node --check js/player-archetype-runtime.js
          node --check js/class-runtime-bootstrap.js
          node --check js/theatre-check-retry-watchdog.js
          node --check js/theatre-check-coordinator.js
          node --check js/theatre-language-policy.js
          node --check js/theatre-intervention-ux-core.js
          node --check js/status-engine.js
          node --check js/trait-catalog-core.js
          node --check js/trait-standardization-runtime.js
          node --check js/player-stats-ability-bar.js
          node --check js/player-splash-framing.js
          node --check js/player-ux-polish-core.js
          node --check js/player-stat-tooltip-runtime.js
          node --check js/derived-stats-runtime.js
          node --check js/rest-runtime-integration.js
          node --check js/theatre-special-language-enforcement-hotfix.js
          node --check js/theatre-special-language-log-hotfix.js
          node --check js/canonical-race-integration.js
          node --check js/existing-racial-stat-integration.js
          node --check js/unit-rank-runtime.js
          node --check js/injury-engine.js
          node --check js/trait-formula-view-patch.js
          node --check js/skill-trait-breakdown-patch.js
          node --check js/milestone-revert-patch.js
          node --check js/devil-lineage-runtime.js
          node --check js/college-of-whispers-runtime.js
          node --check js/spellcasting-runtime.js
          node --check js/injury-equipment-runtime.js
          node --check js/caster-spellcasting-traits-runtime.js
          node --check js/spellcasting-basic-rules-runtime.js
          node --check js/scene-time-runtime.js
          node --check js/fixed-damage-runtime.js
          node --check hoja_personaje.js
          node --check js/player-progression-tree.js
          node --check js/player-progression-level-allocation.js
          node --check tests/player-ui-long-session-performance.spec.mjs
          node --check tests/player-theatre-spacing-smoke.mjs
          node --check tests/dm-dialogue-composer-layout-smoke.mjs
          node --check tests/theatre-queue-bank-hotfix-smoke.mjs
          node --check tests/trait-formula-display-contract.mjs
      - name: Trait formula display contract
        run: node tests/trait-formula-display-contract.mjs
      - name: Combat renderer performance contract
        run: node tests/combat-v073-player-renderer-performance-smoke.mjs
      - name: Player Theatre sprite spacing contract
        run: node tests/player-theatre-spacing-smoke.mjs
      - name: DM dialogue composer layout contract
        run: node tests/dm-dialogue-composer-layout-smoke.mjs
      - name: Theatre queue + Bank layout contract
        run: node tests/theatre-queue-bank-hotfix-smoke.mjs

  combat-lifecycle:
    name: Combat teardown + round preservation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/player-lifecycle-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/player-lifecycle-http.log
          exit 1
      - name: Run combat lifecycle regression
        run: npx playwright test tests/player-combat-theatre-lifecycle.spec.mjs --reporter=line

  player-ui-behavior-regressions:
    name: Stats HUD + trait display regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/player-regression-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/player-regression-http.log
          exit 1
      - name: Run Stats HUD and trait display regressions
        run: >
          npx playwright test tests/player-ui-long-session-performance.spec.mjs
          --grep "stats HUD keeps fixed geometry|shared trait formula display resolves|trait formula breakdown stays hidden"
          --reporter=line

  player-ui-performance:
    name: Performance / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Static source idle contract
            grep: source keeps the static player surface free
          - label: Real sheet reaches interval idle
            grep: real player sheet reaches interval-idle after boot
          - label: 60s background update stability
            grep: real player sheet stays stable for 60 seconds under background player updates
          - label: 720 terminal/combat visibility cycles
            grep: terminal/combat visibility can cycle 720 times without stacking Battle viewers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/player-performance-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/player-performance-http.log
          exit 1
      - name: Run ${{ matrix.label }}
        run: npx playwright test tests/player-ui-long-session-performance.spec.mjs --grep "${{ matrix.grep }}" --reporter=line
