name: Player UI Long Session Performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/instance-control.js'
      - 'js/player-trait-runtime.js'
      - 'js/player-archetype-runtime-core.js'
      - 'js/player-archetype-runtime.js'
      - 'js/class-runtime-bootstrap.js'
      - 'js/theatre-check-retry-watchdog.js'
      - 'hoja_personaje.js'
      - 'hoja_personaje.css'
      - 'js/player-progression-tree.js'
      - 'js/player-progression-level-allocation.js'
      - 'Battle-viewer.html'
      - 'tests/player-combat-theatre-lifecycle.spec.mjs'
      - 'tests/player-ui-long-session-performance.spec.mjs'
      - '.github/workflows/player-combat-theatre-lifecycle.yml'

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check js/instance-control.js
          node --check js/player-trait-runtime.js
          node --check js/player-archetype-runtime-core.js
          node --check js/player-archetype-runtime.js
          node --check js/class-runtime-bootstrap.js
          node --check js/theatre-check-retry-watchdog.js
          node --check hoja_personaje.js
          node --check js/player-progression-tree.js
          node --check js/player-progression-level-allocation.js
          node --check tests/player-ui-long-session-performance.spec.mjs
      - name: Combat renderer performance contract
        run: node tests/combat-v073-player-renderer-performance-smoke.mjs
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/player-lifecycle-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/player-lifecycle-http.log
          exit 1
      - name: Prove Combat teardown and round preservation
        run: npx playwright test tests/player-combat-theatre-lifecycle.spec.mjs --reporter=line
      - name: Prove 60-second Player UI stability
        run: npx playwright test tests/player-ui-long-session-performance.spec.mjs --reporter=line
