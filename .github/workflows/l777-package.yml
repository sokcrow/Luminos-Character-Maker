name: L777 Package Validation

on:
  push:
    branches:
      - feat/item-icon-families
    paths:
      - ".github/workflows/l777-package.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Validate Game Engine
        run: |
          node game-engine/tests/core-smoke.mjs
          node game-engine/tests/continuous-movement-smoke.mjs
          node game-engine/tests/visual-lab-smoke.mjs

      - name: Build L777.zip
        shell: python
        run: |
          import os, zipfile
          root = os.getcwd()
          out = os.path.join(root, "L777.zip")
          skip = {
              ".git",
              "node_modules",
          }
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for base, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in skip]
                  for name in files:
                      path = os.path.join(base, name)
                      rel = os.path.relpath(path, root).replace(os.sep, "/")
                      if rel == "L777.zip":
                          continue
                      if rel == ".github/workflows/l777-package.yml":
                          continue
                      z.write(path, rel)

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: L777-package
          path: L777.zip
          if-no-files-found: error
          retention-days: 1
