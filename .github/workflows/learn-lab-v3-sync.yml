name: Sync Learn Lab v3

on:
  push:
    branches:
      - feat/learn-lab-alpha-hud
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/learn-lab-alpha-hud
      - name: Unpack Learn Lab assets
        run: |
          gzip -dc .learn-lab-v3/learn.css.gz > status-effects/learn/learn.css
          gzip -dc .learn-lab-v3/learn.js.gz > status-effects/learn/learn.js
      - name: Validate alpha HUD and choreography
        run: |
          node --check status-effects/learn/learn.js
          grep -q 'diegetic-floor' status-effects/learn/learn.js
          grep -q 'status-effect-strip' status-effects/learn/learn.js
          grep -q 'clash-float-hud' status-effects/learn/learn.js
          grep -q 'moveClashUnitsToMidpoint' status-effects/learn/learn.js
          grep -q 'animateClashContact' status-effects/learn/learn.js
          grep -q 'https://imgur.com/yshLPnQ.png' status-effects/learn/learn.js
          grep -q 'https://imgur.com/XDx0ICt.png' status-effects/learn/learn.js
          ! grep -q 'class="fighter' status-effects/learn/index.html
          ! grep -q 'clash-center' status-effects/learn/index.html
      - name: Commit Learn Lab v3
        run: |
          if git diff --quiet status-effects/learn/learn.css status-effects/learn/learn.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status-effects/learn/learn.css status-effects/learn/learn.js
          git commit -m "feat: port alpha HUD and clash choreography into Learn Lab"
          git push origin HEAD:feat/learn-lab-alpha-hud
