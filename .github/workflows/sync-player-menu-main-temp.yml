name: Sync Player Menu PR Temp

on:
  push:
    branches:
      - feat/player-menu-icon-refresh
    paths:
      - ".github/workflows/sync-player-menu-main-temp.yml"

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-menu-icon-refresh
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "merge: sync player menu icon PR with latest main"

      - name: Validate affected smoke tests
        shell: bash
        run: |
          node tests/combat-v074-dm-console-smoke.mjs
          node tests/player-menu-canonical-icons-smoke.mjs

      - name: Remove helper and push merge
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-player-menu-main-temp.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/player-menu-icon-refresh
