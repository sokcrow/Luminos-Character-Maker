name: Equipment Effect Standards

on:
  pull_request:
    paths:
      - 'js/item-equipment-effects-runtime.js'
      - 'js/loot-check-runtime.js'
      - 'js/combat-analyze-runtime.js'
      - 'js/combatEngine.js'
      - 'js/elemental-status-runtime.js'
      - 'js/item-enchantment-combat-runtime.js'
      - 'js/combat-v073-authority.js'
      - 'js/combat-v073-live-adapter.js'
      - 'js/combat-v073-library-client.js'
      - 'combat/source/combat-v073-live.html'
      - 'combat/combat-v073-live.manifest.json'
      - 'scripts/build-combat-live.mjs'
      - 'Battle-viewer.html'
      - 'tests/equipment-effects-standard-smoke.mjs'
      - 'tests/equipment-effects-live-smoke.mjs'
      - '.github/workflows/equipment-effects-standard.yml'
  push:
    branches: [main]
    paths:
      - 'js/item-equipment-effects-runtime.js'
      - 'tests/equipment-effects-standard-smoke.mjs'
      - 'tests/equipment-effects-live-smoke.mjs'
      - 'js/combat-v073-library-client.js'
      - 'js/combat-v073-live-adapter.js'
      - 'combat/source/combat-v073-live.html'

jobs:
  validate-equipment-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: |
          for file in js/item-equipment-effects-runtime.js js/loot-check-runtime.js js/combat-analyze-runtime.js js/combatEngine.js js/elemental-status-runtime.js js/item-enchantment-combat-runtime.js js/combat-v073-authority.js js/combat-v073-live-adapter.js js/combat-v073-library-client.js; do
            node --check "$file"
          done
      - name: Equipment standards
        run: node tests/equipment-effects-standard-smoke.mjs
      - name: Live equipment paths and recovery
        run: node tests/equipment-effects-live-smoke.mjs
      - name: Packed viewer integrity and bootstrap
        run: |
          node scripts/build-combat-live.mjs --check
          node tests/combat-mobile-boot-smoke.mjs
      - name: Existing Analyze contract
        run: node tests/combat-analyze-end-to-end-smoke.mjs
      - name: Existing Deck contract
        run: node tests/combat-deck-engine-smoke.mjs
