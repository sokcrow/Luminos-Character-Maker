name: VTT DM Map Creator UI

on:
  pull_request:
    paths:
      - 'js/vtt/procedural-generator-bootstrap.js'
      - 'js/vtt/procedural-generator-authoring-bootstrap.js'
      - 'js/vtt/procedural-building-mix-patch.js'
      - 'js/vtt/procedural-preview-renderer-patch.js'
      - 'tests/vtt_procedural_building_mix.spec.js'
      - 'tests/vtt_zone_creator_completion.spec.js'
      - 'tests/vtt_procedural_dm_ui.spec.js'
      - 'tests/vtt_procedural_preview_crash.spec.js'
      - '.github/workflows/vtt-dm-map-creator-ui.yml'
  workflow_dispatch:

concurrency:
  group: vtt-dm-map-creator-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dm-map-creator-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check js/vtt/procedural-building-mix-patch.js
          node --check js/vtt/procedural-preview-renderer-patch.js
          node --input-type=module --check < js/vtt/procedural-generator-bootstrap.js
          node --input-type=module --check < js/vtt/procedural-generator-authoring-bootstrap.js
      - name: Focused contracts
        run: >-
          npx playwright test
          tests/vtt_procedural_building_mix.spec.js
          tests/vtt_zone_creator_completion.spec.js
          tests/vtt_procedural_dm_ui.spec.js
          tests/vtt_procedural_preview_crash.spec.js
          tests/vtt_dm_zone_persistence.spec.js
          tests/vtt_procedural_zone_engine.spec.js
          tests/vtt_building_navigation_graph.spec.js
          tests/vtt_building_archetypes.spec.js
          tests/vtt_building_semantic_model.spec.js
          tests/vtt_building_physics_closure.spec.js
          tests/vtt_semantic_map_foundation.spec.js
          tests/vtt_surface_foundation.spec.js
          tests/vtt_topology.spec.js
          tests/vtt_opening_edge_replacement.spec.js
          tests/vtt_vertical_portal.spec.js
          tests/world_objects_vtt.spec.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Broad repository regression except known unrelated UX baselines
        shell: bash
        run: |
          mapfile -t specs < <(find tests -name '*.spec.js' ! -name 'player_dm_ux_polish.spec.js' ! -name 'theatre_ui_polish.spec.js' -print | sort)
          npx playwright test "${specs[@]}"
