name: Import Stat or Trait milestone icon

on:
  push:
    paths:
      - ".github/workflows/import-milestone-choice-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-milestone-choice-icon
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PNG validator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and verify icon
        id: download
        continue-on-error: true
        run: python scripts/import-milestone-choice-icon.py
      - name: Commit downloaded image
        shell: bash
        run: |
          if [ -f Assets/Icons/milestones/stat-or-trait.png ]; then
            git add -- Assets/Icons/milestones/stat-or-trait.png
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Import Stat or Trait milestone choice icon"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          else
            echo "No verified PNG to commit."
          fi
      - name: Fail if icon was unavailable
        if: steps.download.outcome == 'failure'
        run: exit 1
