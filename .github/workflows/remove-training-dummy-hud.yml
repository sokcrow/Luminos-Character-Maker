name: Remove training dummy HUD

on:
  push:
    branches:
      - fix/remove-training-dummy-hud

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-training-dummy-hud
      - name: Remove custom Dummy overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('status-effects/learn/index.html')
          s=p.read_text()
          s=re.sub(r'<aside class="dummy-card"[^>]*>.*?</aside>','',s,flags=re.S)
          s=re.sub(r'\.dummy-card\{.*?\.dummy-note strong\{color:var\(--g\)\}','',s,flags=re.S)
          s=s.replace('.dummy-card{top:6px;right:6px;width:190px;padding:7px}.dummy-grid{gap:3px}.dummy-stat{padding:4px}.dummy-stat span{font-size:12px}.dummy-wide,.dummy-note{display:none}','')
          s=re.sub(r"function renderDummyInfo\(\)\{.*?\}function render\(\)\{renderUnit\('ally',S\.ally\);renderUnit\('enemy',S\.enemy\);renderDummyInfo\(\)\}","function render(){renderUnit('ally',S.ally);renderUnit('enemy',S.enemy)}",s,flags=re.S)
          assert 'dummy-card' not in s
          assert 'renderDummyInfo' not in s
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('status-effects/learn/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/learn.js').write_text(scripts[-1])
          PY
          node --check /tmp/learn.js
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status-effects/learn/index.html
          git commit -m "fix: remove training dummy overlay"
          git push origin HEAD:fix/remove-training-dummy-hud
