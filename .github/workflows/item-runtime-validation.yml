name: Item Runtime Validation

on:
  pull_request:
    paths:
      - "js/item-runtime-engine.js"
      - "js/item-inventory-runtime.js"
      - "js/workshop-runtime.js"
      - "js/status-engine.js"
      - "tests/item_runtime_engine.spec.js"
      - "tests/item_runtime_catalog_profile.spec.js"
      - "tests/item_inventory_runtime.spec.js"
      - "tests/workshop_runtime.spec.js"
      - ".github/workflows/item-runtime-validation.yml"

jobs:
  item-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/item_runtime_engine.spec.js tests/item_runtime_catalog_profile.spec.js tests/item_inventory_runtime.spec.js tests/workshop_runtime.spec.js
