name: Vendor Encounter Result Assets

permissions:
  contents: write

on:
  push:
    branches:
      - feat/encounter-end-combat-theatre
    paths:
      - '.github/workflows/vendor-encounter-result-assets.yml'

jobs:
  vendor-assets:
    if: "!contains(github.event.head_commit.message, 'chore: vendor encounter result assets')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/encounter-end-combat-theatre
      - name: Download canonical result PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Assets/Images/Combat
          curl -fL --retry 4 --retry-all-errors -A "Mozilla/5.0"             "https://limbuscompany.wiki.gg/images/Victory_Battle_Result.png?67eac9=&format=original"             -o Assets/Images/Combat/Victory_Battle_Result.png
          curl -fL --retry 4 --retry-all-errors -A "Mozilla/5.0"             "https://limbuscompany.wiki.gg/images/Defeat_Battle_Result.png?284168=&format=original"             -o Assets/Images/Combat/Defeat_Battle_Result.png
          file Assets/Images/Combat/Victory_Battle_Result.png
          file Assets/Images/Combat/Defeat_Battle_Result.png
          test "$(xxd -p -l 8 Assets/Images/Combat/Victory_Battle_Result.png)" = "89504e470d0a1a0a"
          test "$(xxd -p -l 8 Assets/Images/Combat/Defeat_Battle_Result.png)" = "89504e470d0a1a0a"
      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Images/Combat/Victory_Battle_Result.png Assets/Images/Combat/Defeat_Battle_Result.png
          git commit -m "chore: vendor encounter result assets"
          git push origin HEAD:feat/encounter-end-combat-theatre
