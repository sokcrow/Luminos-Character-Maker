name: Vendor Item Icon Assets Bootstrap

on:
  push:
    branches:
      - feat/item-icon-families
    paths:
      - scripts/vendor-item-icons.mjs
      - scripts/vendor-item-component-icons.mjs
      - tests/item-icon-assets-smoke.cjs
      - .github/workflows/vendor-item-icons-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: vendor-item-icons-bootstrap
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/item-icon-families
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vendor remote item icons
        run: node scripts/vendor-item-icons.mjs --apply

      - name: Vendor component item icons
        run: node scripts/vendor-item-component-icons.mjs --apply

      - name: Run registry smoke
        run: node tests/item-icon-registry-smoke.cjs

      - name: Run local asset smoke
        run: node tests/item-icon-assets-smoke.cjs

      - name: Commit vendored assets back to PR branch
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No vendoring changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Icons/items js/item-icon-registry.js js/item-catalog-armor-components.js js/item-catalog-firearm-ammo.js js/item-catalog-firearm-components.js js/item-catalog-ranged-weapon-components.js js/item-catalog-shield-components.js js/item-catalog-weapon-components.js tests/item-icon-registry-smoke.cjs tests/item-firearm-components-smoke.cjs tests/item-weapon-composition-smoke.cjs docs/item-cooking-handoff.md docs/item-firearms-handoff.md docs/item-general-chemistry-handoff.md docs/item-ranged-weapons-handoff.md docs/item-throwables-v1-handoff.md docs/item-tools-handoff.md docs/item-weapon-composition-handoff.md docs/item-weapons-handoff.md
          git commit -m "chore(items): vendor item icon assets"
          git push origin HEAD:feat/item-icon-families
