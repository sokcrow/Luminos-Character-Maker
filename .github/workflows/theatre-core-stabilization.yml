name: Theatre Core Stabilization

on:
  pull_request:
    paths:
      - "js/theatre-engine.js"
      - "js/theatre-controls.js"
      - "js/theatre-intervention-ux.js"
      - "js/theatre-intervention-ux-core.js"
      - "js/theatre-check-coordinator.js"
      - "js/theatre-opposed-checks.js"
      - "js/theatre-modern-identity-hotfix.js"
      - "js/theatre-language-policy.js"
      - "js/theatre-special-language-access.js"
      - "js/theatre-special-language-enforcement-hotfix.js"
      - "js/theatre-special-language-log-hotfix.js"
      - "js/scene-time-core.js"
      - "js/scene-time-runtime.js"
      - "js/scene-time-engine.js"
      - "tests/theatre_core_stabilization.spec.js"
      - "tests/theatre_issue_511.spec.js"
      - "tests/theatre_viewer_scope.spec.js"
      - "tests/theatre_realtime.spec.js"
      - "tests/player_theatre_regression.spec.js"
      - "tests/theatre_check_coordinator.spec.js"
      - "tests/theatre_intervention_ux.spec.js"
      - "tests/theatre_special_languages.spec.js"
      - "tests/theatre_special_language_enforcement.spec.js"
      - "tests/scene_time_engine.spec.js"
      - "docs/theatre-core-v1.md"
      - ".github/workflows/theatre-core-stabilization.yml"

permissions:
  contents: read

jobs:
  theatre-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax checks
        run: |
          node --check tests/theatre_core_stabilization.spec.js
          node --check js/theatre-engine.js
          node --check js/theatre-controls.js
          node --check js/theatre-check-coordinator.js
          node --check js/scene-time-core.js
          node --check js/scene-time-runtime.js
          node --check js/scene-time-engine.js

      - name: Theatre stabilization matrix
        run: >-
          npx playwright test
          tests/theatre_core_stabilization.spec.js
          tests/theatre_issue_511.spec.js
          tests/theatre_viewer_scope.spec.js
          tests/theatre_realtime.spec.js
          tests/player_theatre_regression.spec.js
          tests/theatre_check_coordinator.spec.js
          tests/theatre_intervention_ux.spec.js
          tests/theatre_special_languages.spec.js
          tests/theatre_special_language_enforcement.spec.js
          tests/scene_time_engine.spec.js
          --workers=1

      - name: Full regression suite
        run: npm test -- --workers=1
