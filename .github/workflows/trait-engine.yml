name: Trait Engine

on:
  pull_request:
    paths:
      - ".github/workflows/trait-engine.yml"
      - "js/racial-trait-catalog.js"

permissions:
  contents: write

jobs:
  finalize-pr565-wording:
    if: github.event.pull_request.number == 565
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: feat/racial-traits-automation
          fetch-depth: 0

      - name: Remove nonexistent Radiant damage wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/racial-trait-catalog.js')
          text = p.read_text()
          old = 'description: "Protector transformation for Count 6. Grants Flight and once per Turn adds Level/10 Radiant Fixed Damage.",'
          new = 'description: "Protector transformation for Count 6. Grants Flight and once per Turn adds at least 1 Fixed Damage based on Level/10.",'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy Radiant damage description, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog regressions
        run: |
          node --check js/racial-trait-catalog.js
          npx playwright test tests/racial_trait_catalog.spec.js tests/racial_trait_engine_regressions.spec.js --workers=1
          git diff --check

      - name: Commit wording fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/racial-trait-catalog.js
          git commit -m "fix: keep Aasimar fixed damage type-neutral"
          git push origin HEAD:feat/racial-traits-automation
