# Temporary verified patch runner for the final Codex review findings.
name: Trait Engine

on:
  pull_request:
    paths:
      - "Battle-viewer.html"
      - "hoja_de_DM.html"
      - "database.rules.json"
      - "js/trait-engine.js"
      - "js/trait-catalog-core.js"
      - "js/racial-trait-catalog.js"
      - "js/racial-trait-runtime-bridge.js"
      - "js/status-engine.js"
      - "js/statusManager.js"
      - "js/combatEngine.js"
      - "js/universal-modifier-engine.js"
      - "js/universal-speed-runtime.js"
      - "js/universal-action-economy.js"
      - "js/trait-standardization-runtime.js"
      - "js/player-trait-runtime.js"
      - "js/trait-player-tray.js"
      - "js/player-stats-ability-bar.js"
      - "js/instance-control.js"
      - "js/dm-managed-effect-engine.js"
      - "hoja_personaje.js"
      - "tests/racial_trait_engine_regressions.spec.js"
      - "tests/firebase_shared_trait_rules.spec.js"
      - ".github/scripts/apply_final_codex_round.py"
      - ".github/workflows/trait-engine.yml"

permissions:
  contents: write

jobs:
  trait-engine-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/racial-traits-automation

      - name: Apply final Codex fixes
        run: python .github/scripts/apply_final_codex_round.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check js/trait-engine.js
          node --check js/racial-trait-catalog.js
          node --check js/player-trait-runtime.js
          node --check js/dm-managed-effect-engine.js
          node --check tests/racial_trait_engine_regressions.spec.js
          node --check tests/firebase_shared_trait_rules.spec.js
          python -m json.tool database.rules.json >/dev/null

      - name: Run Trait regressions
        run: >-
          npx playwright test
          tests/trait_engine.spec.js
          tests/trait_engine_codex_regressions.spec.js
          tests/trait_catalog_core.spec.js
          tests/racial_trait_catalog.spec.js
          tests/racial_trait_engine_regressions.spec.js
          tests/player_trait_tabs.spec.js
          tests/dm_trait_catalog_importer.spec.js
          tests/barbarian_trait_rules_runtime.spec.js
          tests/universal_modifier_engine.spec.js
          tests/universal_speed_runtime.spec.js
          tests/universal_action_economy.spec.js
          tests/trait_standardization_review_fixes.spec.js
          tests/firebase_shared_trait_rules.spec.js
          --workers=1

      - name: Commit verified final Codex fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Battle-viewer.html database.rules.json js/player-trait-runtime.js js/racial-trait-catalog.js js/trait-engine.js js/dm-managed-effect-engine.js tests/racial_trait_engine_regressions.spec.js tests/firebase_shared_trait_rules.spec.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "fix: close final Codex trait blockers"
            git push origin HEAD:feat/racial-traits-automation
          fi
