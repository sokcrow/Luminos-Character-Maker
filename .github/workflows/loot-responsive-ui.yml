name: Loot responsive UI
on:
  pull_request:
    paths:
      - 'js/player-postcombat-loot.js'
      - 'css/postcombat-loot-corpse.css'
      - 'tests/loot-responsive-ui-smoke.mjs'
      - '.github/workflows/loot-responsive-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/player-postcombat-loot-auth-smoke.mjs
      - run: node tests/loot-mobile-queue-smoke.mjs
      - run: node tests/loot-responsive-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loot-responsive-screenshots
          path: test-results/loot-responsive
          retention-days: 7
