name: VTT Runtime Drag Performance Field

on:
  pull_request:
    paths:
      - 'js/vtt/**'
      - 'vtt.html'
      - 'tests/vtt_realtime_traversal_simplification.spec.js'
      - 'tests/vtt_procedural_runtime_performance.spec.js'
      - 'tests/vtt_token_view_browser_field.spec.js'
      - 'tests/vtt_drag_preview_browser_field.spec.js'
      - 'tests/vtt_webgl2_token_layer_browser_field.spec.js'
      - 'tests/vtt_token_texture_browser_field.spec.js'
      - 'tests/vtt_token_interaction_browser_field.spec.js'
      - 'playwright.config.cjs'
      - '.github/workflows/vtt-runtime-drag-performance-field.yml'
  push:
    paths:
      - 'js/vtt/**'
      - 'vtt.html'
      - 'tests/vtt_realtime_traversal_simplification.spec.js'
      - 'tests/vtt_procedural_runtime_performance.spec.js'
      - 'tests/vtt_token_view_browser_field.spec.js'
      - 'tests/vtt_drag_preview_browser_field.spec.js'
      - 'tests/vtt_webgl2_token_layer_browser_field.spec.js'
      - 'tests/vtt_token_texture_browser_field.spec.js'
      - 'tests/vtt_token_interaction_browser_field.spec.js'
      - 'playwright.config.cjs'
      - '.github/workflows/vtt-runtime-drag-performance-field.yml'

permissions:
  contents: read

jobs:
  runtime-drag-field:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Use preinstalled Chrome
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Start static VTT server
        run: |
          python3 -m http.server 4173 > /tmp/vtt-field-server.log 2>&1 &
          echo $! > /tmp/vtt-field-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/vtt.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vtt-field-server.log
          exit 1
      - name: Persistent TokenView, drag preview, GPU token, Actor texture, and interaction browser fields
        env:
          VTT_FIELD_URL: http://127.0.0.1:4173/vtt.html
        run: npx playwright test --config=playwright.config.cjs --workers=1 tests/vtt_token_view_browser_field.spec.js tests/vtt_drag_preview_browser_field.spec.js tests/vtt_webgl2_token_layer_browser_field.spec.js tests/vtt_token_texture_browser_field.spec.js tests/vtt_token_interaction_browser_field.spec.js --reporter=line
      - name: Integrated realtime movement and procedural performance field trace
        env:
          VTT_FIELD_URL: http://127.0.0.1:4173/vtt.html
        run: npx playwright test --config=playwright.config.cjs --workers=1 tests/vtt_realtime_traversal_simplification.spec.js tests/vtt_procedural_runtime_performance.spec.js --reporter=line
      - name: Server log on failure
        if: failure()
        run: cat /tmp/vtt-field-server.log || true
