name: World Texture Vendor

on:
  workflow_dispatch:
  push:
    branches:
      - feat/game-engine-water-bodies
    paths:
      - "scripts/vendor-world-water-textures.mjs"
      - "game-engine/src/world/WorldWaterBodies.js"
      - "game-engine/tests/world-water-bodies-smoke.mjs"
      - "game-engine/tests/world-water-texture-assets-smoke.mjs"
      - ".github/workflows/world-floor-textures-vendor.yml"

permissions:
  contents: write

jobs:
  vendor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download exact repository-local water textures
        run: node scripts/vendor-world-water-textures.mjs

      - name: Validate water body geometry and UVs
        run: node game-engine/tests/world-water-bodies-smoke.mjs

      - name: Validate local water texture files
        run: node game-engine/tests/world-water-texture-assets-smoke.mjs

      - name: Commit vendored water texture assets
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- Assets/Images/World/Water)" ]; then
            echo "Water texture assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Images/World/Water
          git commit -m "assets(world): vendor seamless water and coast foam"
          git push origin "HEAD:\${GITHUB_REF_NAME}"
