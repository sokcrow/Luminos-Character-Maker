name: Combat Runtime Smoke

on:
  push:
    branches:
      - feature/combat-runtime-integration
      - feature/combat-deck-engine
      - feature/battle-viewer-0.7.3-engine-migration
      - hotfix/unified-status-library
  pull_request:
    branches:
      - main

jobs:
  combat-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Combat Skill schema smoke
        run: node tests/combat-skill-schema-smoke.mjs
      - name: Unbreakable Red Coin smoke
        run: node tests/unbreakable-red-coin-smoke.mjs
      - name: Unified canonical Status Library smoke
        run: node tests/combat-v074-unified-status-library-smoke.mjs
      - name: Class Status semantics smoke
        run: node tests/class-status-semantics-smoke.mjs
      - name: Starter Tier 1 status skill catalog smoke
        run: node tests/starter-status-skill-catalog-smoke.mjs
      - name: Universal spell batch syntax
        run: |
          node --check js/spell-catalog-core.js
          node --check js/role-spell-catalog-core.js
          node --check js/spell-batch-pierre-runtime.js
          node --check js/spell-batch-angelo-runtime.js
      - name: Pierre universal spell batch smoke
        run: node tests/pierre-spell-batch-smoke.mjs
      - name: Angelo universal spell batch smoke
        run: node tests/angelo-spell-batch-smoke.mjs
      - name: Fighter Battle Master module syntax
        run: |
          node --check js/fighter-maneuver-catalog.js
          node --check js/battle-master-archetype-runtime.js
      - name: Battle Master archetype smoke
        run: node tests/battle-master-archetype-runtime-smoke.mjs
      - name: Kobold Unit Library smoke
        run: node tests/kobold-unit-library-smoke.mjs
      - name: Universal Unit rank command smoke
        run: node tests/unit-rank-command-smoke.mjs
      - name: G1-G2 Skill Forge smoke
        run: node tests/skill-forge-g2-smoke.mjs
      - name: G1-G2 Skill Forge runtime smoke
        run: node tests/skill-forge-runtime-g2-smoke.mjs
      - name: Team action economy smoke
        run: node tests/team-action-economy-smoke.mjs
      - name: CombatAction schema smoke
        run: node tests/combat-action-smoke.mjs
      - name: CombatAction resolver smoke
        run: node tests/combat-action-resolver-smoke.mjs
      - name: Combat Action Queue smoke
        run: node tests/combat-action-queue-smoke.mjs
      - name: Combat Runtime Integration smoke
        run: node tests/combat-runtime-integration-smoke.mjs
      - name: Combat Runtime Rules smoke
        run: node tests/combat-runtime-rules-smoke.mjs
      - name: Combat Deck Engine smoke
        run: node tests/combat-deck-engine-smoke.mjs
      - name: Orosh complete Theatre and Combat smoke
        run: node tests/orosh-lineage-runtime-smoke.mjs
      - name: Rogue Theatre and Combat smoke
        run: node tests/rogue-class-runtime-smoke.mjs
      - name: Mastermind archetype Theatre and Combat smoke
        run: node tests/mastermind-archetype-runtime-smoke.mjs
      - name: Mastermind Trait bridge smoke
        run: node tests/mastermind-trait-bridge-smoke.mjs
      - name: Battle Viewer 0.7.3 rules smoke
        run: node tests/combat-v073-rules-smoke.mjs
      - name: Battle Viewer 0.7.3 runtime authority smoke
        run: node tests/combat-v073-runtime-authority-smoke.mjs
      - name: VTT combat unit actor library smoke
        run: node tests/vtt-actor-library-units-smoke.mjs
      - name: Battle Viewer 0.7.4 progressive UI smoke
        run: node tests/combat-v074-progressive-ui-smoke.mjs
      - name: Battle Viewer 0.7.4 DM encounter roster smoke
        run: node tests/combat-v074-dm-encounter-roster-smoke.mjs
      - name: Battle Viewer 0.7.4 module syntax
        run: |
          node --check js/status-library.js
          node --check js/statusManager.js
          node --check js/class-status-semantics.js
          node --check js/battle-viewer-action-adapter-073.js
          node --check js/battle-viewer-firebase-session-074.js
          node --check js/combat-skill-loadout-074.js
          node --check js/combat-spell-loadout-074.js
          node --check js/battle-viewer-spell-adapter-074.js
          node --check js/battle-viewer-spell-runtime-074.js
          node --check js/battle-viewer-player-skill-planner-074.js
          node --check js/battle-viewer-player-spell-planner-074.js
          node --check js/battle-viewer-dm-console-074.js
          node --check js/battle-viewer-player-entry-074.js
          node --check js/battle-viewer-ownership-074.js
          node --check js/battle-viewer-dm-console-074-magic.js
          node --check js/battle-viewer-dm-encounter-roster-074.js
          node --check js/battle-viewer-progressive-ui-074.js
          node --check js/battle-viewer-runtime-074.js
          node --check js/elemental-status-compat.js
          node --check js/status-rupture-runtime.js
          node --check js/skill-catalog-starter-status-tier1.js
          node --check js/skill-catalog-kobold-tier1.js
          node --check js/unit-rank-runtime.js
          node --check js/unit-catalog-kobold-tier1.js
          node --check js/combat-team-economy-bridge.js
          node --check js/universal-action-economy.js
          node --check js/skill-forge-g2.js
          node --check js/skill-forge-runtime-g2.js
      - name: Battle Viewer 0.7.4 Firebase contract smoke
        run: node tests/combat-v074-firebase-contract-smoke.mjs
      - name: Battle Viewer 0.7.4 ownership smoke
        run: node tests/combat-v074-ownership-smoke.mjs
      - name: Battle Viewer 0.7.4 ownership resolution smoke
        run: node tests/combat-v074-ownership-resolution-smoke.mjs
      - name: Battle Viewer 0.7.4 canonical skill loadout smoke
        run: node tests/combat-v074-skill-loadout-smoke.mjs
      - name: Battle Viewer 0.7.4 canonical skill adapter smoke
        run: node tests/combat-v074-skill-loadout-adapter-smoke.mjs
      - name: Battle Viewer 0.7.4 player skill planner E2E smoke
        run: node tests/combat-v074-player-skill-planner-smoke.mjs
      - name: Battle Viewer 0.7.4 player spell planner E2E smoke
        run: node tests/combat-v074-player-spell-planner-smoke.mjs
      - name: Battle Viewer 0.7.4 DM player entry smoke
        run: node tests/combat-v074-player-entry-smoke.mjs
      - name: Battle Viewer 0.7.4 DM console smoke
        run: node tests/combat-v074-dm-console-smoke.mjs
