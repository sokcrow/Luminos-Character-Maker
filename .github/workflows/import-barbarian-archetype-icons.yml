name: Import Barbarian Archetype Icons from Imgur

on:
  push:
    branches:
      - feat/barbarian-archetype-tree-icons-20261012
    paths:
      - ".github/workflows/import-barbarian-archetype-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-barbarian-archetype-icons
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PNG validation
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and validate the two PNGs
        run: python scripts/import-barbarian-archetype-icons.py
      - name: Commit images to the feature branch
        shell: bash
        run: |
          # Other classes may also store icons in this shared directory.
          # Require only the two Barbarian files and preserve future artwork.
          for id in path_of_the_devil_lineage path_of_the_zealot; do
            test -f "Assets/Icons/archetypes/$id.png"
          done
          git add -- Assets/Icons/archetypes/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import two verified Barbarian Archetype PNG assets"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
