name: Temporary Skills and Clash Acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run check:combat-live
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.58.2 firebase@12.19.0 firebase-tools@14.12.1
      - run: npx playwright install --with-deps chromium
      - name: Assigned Skills, real Clash and audiovisual regressions
        env:
          CI: 'true'
        run: >-
          npx firebase emulators:exec --only auth,database
          --project demo-luminos-combat-phase0 --config firebase.combat-phase0.json
          -- "npx playwright test tests/combat-skills-clash.spec.mjs tests/combat-phase5-online.spec.mjs --config playwright.combat-phase0.config.cjs --reporter=line"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skills-clash-acceptance
          path: artifacts/combat-phase0/
          if-no-files-found: ignore
