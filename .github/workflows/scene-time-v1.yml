name: Scene Time v1

on:
  pull_request:
    paths:
      - "js/scene-time-core.js"
      - "js/scene-time-runtime.js"
      - "js/scene-time-engine.js"
      - "js/theatre-intervention-ux.js"
      - "js/theatre-intervention-ux-core.js"
      - "tests/scene_time_engine.spec.js"
      - ".github/workflows/scene-time-v1.yml"

permissions:
  contents: read

jobs:
  scene-time:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          node --check js/scene-time-core.js
          node --check js/scene-time-runtime.js
          node --check js/scene-time-engine.js
          node --check js/theatre-intervention-ux.js
          node --check js/theatre-intervention-ux-core.js
      - name: Scene Time and integration regressions
        run: >-
          npx playwright test
          tests/scene_time_engine.spec.js
          tests/theatre_intervention_ux.spec.js
          tests/theatre_viewer_scope.spec.js
          tests/theatre_check_coordinator.spec.js
          tests/weather_engine.spec.js
          --workers=1
      - name: Full regression suite
        run: npm test -- --workers=1
