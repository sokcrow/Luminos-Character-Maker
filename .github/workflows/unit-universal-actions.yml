name: Unit Universal Actions
# Deep regression suite: run on demand in Actions when its module changes.
# The pull-request gate is kept in ci-pr-essentials.yml to avoid redundant red checks.
on:
  workflow_dispatch:

jobs:
  universal-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Policy, authority and regressions
        run: |
          node scripts/build-combat-live.mjs --check
          node tests/unit-universal-action-policy-smoke.mjs
          node tests/unit-universal-action-runtime-smoke.mjs
          node tests/unit-universal-action-recovery-smoke.mjs
          node tests/unit-universal-ai-deck-smoke.mjs
          node tests/unit-universal-live-free-smoke.mjs
          node tests/unit-universal-ai-help-roster-smoke.mjs
          node tests/unit-universal-assist-guard-smoke.mjs
          node tests/npc-belongings-smoke.mjs
          node tests/unit-independent-intents-smoke.mjs
          node tests/team-action-economy-smoke.mjs
          node tests/mastermind-archetype-runtime-smoke.mjs
          node tests/combat-mobile-boot-smoke.mjs
          npm run test:individual-goap
      - name: Browser acceptance
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/unit-universal-actions-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-actions-responsive
          path: artifacts/universal-actions/
          if-no-files-found: ignore
