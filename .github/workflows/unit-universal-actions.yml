name: Unit Universal Actions
on:
  pull_request:
    branches: [main]
    paths: ['combat/**','Battle-viewer.html','js/**','css/combat-mobile-runtime.css','database.rules.json','tests/unit-universal*','tests/unit-independent*','.github/workflows/unit-universal-actions.yml']
jobs:
  universal-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Policy, authority and regressions
        run: |
          node scripts/build-combat-live.mjs --check
          node tests/unit-universal-action-policy-smoke.mjs
          node tests/unit-universal-action-runtime-smoke.mjs
          node tests/unit-independent-intents-smoke.mjs
          node tests/team-action-economy-smoke.mjs
          node tests/mastermind-archetype-runtime-smoke.mjs
          node tests/combat-mobile-boot-smoke.mjs
          npm run test:individual-goap
      - name: Browser acceptance
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/unit-universal-actions-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-actions-responsive
          path: artifacts/universal-actions/
          if-no-files-found: ignore
