name: Import original Sapphire Spider image into Units folder

on:
  push:
    branches:
      - feat/sapphire-spider-family-hard-units-20261024
    paths:
      - .github/workflows/import-sapphire-spider-original.yml

permissions:
  contents: write

jobs:
  import-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original image from the user-supplied Imgur link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, urllib.request

          image_id = '0c9WpCr'
          folder = Path('Assets/Images/Units/Cave_Crystal')
          folder.mkdir(parents=True, exist_ok=True)
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36',
              'Referer': 'https://imgur.com/0c9WpCr',
              'Accept': 'image/png,image/jpeg,image/webp,image/*;q=0.8,*/*;q=0.1',
          }
          formats = [('png','image/png'),('jpg','image/jpeg'),('jpeg','image/jpeg'),('webp','image/webp')]
          output = None
          errors = []

          for requested_ext, _ in formats:
              url = f'https://i.imgur.com/{image_id}.{requested_ext}'
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=25) as response:
                      data = response.read(32 * 1024 * 1024)
                  if len(data) < 20_000:
                      raise ValueError(f'Image is suspiciously small ({len(data)} bytes)')
                  if data.startswith(b'\x89PNG\r\n\x1a\n'):
                      actual_ext = 'png'
                      width, height = struct.unpack('>II', data[16:24])
                  elif data.startswith(b'\xff\xd8\xff'):
                      actual_ext = 'jpg'
                      # JPEG dimensions are checked by ImageMagick's identify below.
                      width = height = None
                  elif data[:4] == b'RIFF' and data[8:12] == b'WEBP':
                      actual_ext = 'webp'
                      width = height = None
                  else:
                      raise ValueError('Response is not PNG, JPEG or WebP image bytes')
                  output = folder / f'sapphire_spider.{actual_ext}'
                  output.write_bytes(data)
                  print(f'SOURCE_URL={url}')
                  print(f'SPRITE_FILE={output}')
                  print(f'SPRITE_BYTES={len(data)}')
                  print(f'SPRITE_SHA256={hashlib.sha256(data).hexdigest()}')
                  break
              except Exception as exc:
                  errors.append(f'{url}: {exc}')

          if output is None:
              raise SystemExit('Unable to download actual sprite from Imgur:\n' + '\n'.join(errors))

          import subprocess
          result = subprocess.run(['identify', '-format', '%w %h', str(output)], capture_output=True, text=True)
          if result.returncode:
              raise SystemExit('Unable to identify image dimensions: ' + result.stderr)
          width, height = map(int, result.stdout.strip().split())
          print(f'SPRITE_DIMENSIONS={width}x{height}')
          if width < 512 or height < 512:
              raise SystemExit('Downloaded image is a low-resolution thumbnail, not an acceptable original')

          # One authoritative image file in the Units folder, shared by both unit variants.
          for ext in ('png','jpg','jpeg','webp'):
              other = folder / f'sapphire_spider.{ext}'
              if other != output and other.exists():
                  other.unlink()

          catalog = Path('js/unit-catalog-cave-sapphire-spiders.js')
          source = catalog.read_text()
          import re
          match = re.search(r"const sharedSprite = 'Assets/Images/Units/Cave_Crystal/sapphire_spider\.[a-z]+';", source)
          if not match:
              raise SystemExit('Unit catalog did not contain expected image reference')
          source = source[:match.start()] + f"const sharedSprite = '{output.as_posix()}';" + source[match.end():]
          catalog.write_text(source)

          smoke = Path('tests/cave-sapphire-spiders-smoke.mjs')
          source = smoke.read_text()
          source = source.replace("const spritePath = 'Assets/Images/Units/Cave_Crystal/sapphire_spider.webp';",
                                  f"const spritePath = '{output.as_posix()}';")
          old = """assert.equal(rendered.toString('ascii', 0, 4), 'RIFF');
          assert.equal(rendered.toString('ascii', 8, 12), 'WEBP');
          assert.ok(rendered.length > 2000, 'A real binary image asset, not a data URL or placeholder');"""
          new = """assert.ok(rendered.length > 20000, 'Sprite must be a full-resolution repository asset');
          if (spritePath.endsWith('.png')) assert.equal(rendered.toString('hex', 0, 8), '89504e470d0a1a0a');
          else if (spritePath.endsWith('.jpg')) assert.equal(rendered.toString('hex', 0, 2), 'ffd8');
          else if (spritePath.endsWith('.webp')) assert.equal(rendered.toString('ascii', 0, 4), 'RIFF');"""
          if old not in source:
              raise SystemExit('Smoke test no longer matches expected asset check')
          smoke.write_text(source.replace(old, new))

          doc = Path('docs/cave-sapphire-spiders-hard-units.md')
          text = doc.read_text()
          text = text.replace(
            'Both load the same **real binary repository image** at Assets/Images/Units/Cave_Crystal/sapphire_spider.webp. The current checked-in file is a 64×64 WebP rendition of the user-supplied artwork. **This is not yet the original 1254×1254 PNG**; the original must replace the low-resolution rendition for full-size battle rendering.',
            f'Both units load the exact same full-resolution original image from the user-supplied Imgur ID 0c9WpCr: {output.as_posix()} ({width}×{height}). The original image bytes are stored as a binary file in the repository Units folder, not as a data URL or thumbnail.'
          )
          doc.write_text(text)
          PY
      - name: Verify source image and commit replacement to the pull request branch
        shell: bash
        run: |
          node tests/cave-sapphire-spiders-smoke.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/import-sapphire-spider-original.yml
          git add Assets/Images/Units/Cave_Crystal/ js/unit-catalog-cave-sapphire-spiders.js tests/cave-sapphire-spiders-smoke.mjs docs/cave-sapphire-spiders-hard-units.md .github/workflows/import-sapphire-spider-original.yml
          git commit -m "assets(units): use original Imgur Sapphire Spider sprite for both units"
          git push origin HEAD:refs/heads/feat/sapphire-spider-family-hard-units-20261024
