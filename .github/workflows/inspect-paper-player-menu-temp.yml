name: Apply Paper Player Menu Icon Size

on:
  push:
    branches:
      - fix/game-player-menu-icon-size
    paths:
      - '.github/workflows/inspect-paper-player-menu-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-player-menu-icon-size
          fetch-depth: 0

      - name: Resize the actual game player menu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game-engine/lab/game/forest-0.3.3.1.html")
          s = p.read_text(encoding="utf-8")

          replacements = {
              "width:auto;max-width:0;height:66px;margin:0;padding:5px 0;":
                  "width:auto;max-width:0;height:122px;margin:0;padding:5px 0;",
              "position:relative;flex:0 0 auto;width:56px;height:56px;min-width:56px;min-height:56px;margin:0;padding:0;":
                  "position:relative;flex:0 0 auto;width:112px;height:112px;min-width:112px;min-height:112px;margin:0;padding:0;",
              ".paper-menu-hex svg{position:relative;z-index:1;width:25px;height:25px;stroke:currentColor;fill:none;pointer-events:none}":
                  ".paper-menu-hex svg{position:relative;z-index:1;width:100px;height:100px;stroke:currentColor;fill:none;pointer-events:none}",
              ".paper-menu-hex img{position:relative;z-index:1;width:28px;height:28px;display:block;object-fit:contain;pointer-events:none}":
                  ".paper-menu-hex img{position:relative;z-index:1;width:100px;height:100px;display:block;object-fit:contain;pointer-events:none}",
              ".paper-menu-hex{width:50px;height:50px;min-width:50px;min-height:50px}#paperPlayerMenuStrip{height:60px}":
                  ".paper-menu-hex{width:112px;height:112px;min-width:112px;min-height:112px}#paperPlayerMenuStrip{height:122px}",
              ".paper-menu-hex{width:44px;height:44px;min-width:44px;min-height:44px}":
                  ".paper-menu-hex{width:112px;height:112px;min-width:112px;min-height:112px}",
              ".paper-menu-hex img{width:24px;height:24px}":
                  ".paper-menu-hex img{width:100px;height:100px}",
              "#paperPlayerMenuStrip{height:50px;gap:5px}":
                  "#paperPlayerMenuStrip{height:122px;gap:5px}",
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match for {old!r}, found {count}")
              s = s.replace(old, new)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate game menu contract
        shell: bash
        run: |
          set -euo pipefail
          node game-engine/tests/visual-lab-smoke.mjs
          grep -F '.paper-menu-hex img{position:relative;z-index:1;width:100px;height:100px;' game-engine/lab/game/forest-0.3.3.1.html
          grep -F 'width:112px;height:112px;min-width:112px;min-height:112px' game-engine/lab/game/forest-0.3.3.1.html

      - name: Commit real menu fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-paper-player-menu-temp.yml
          git add game-engine/lab/game/forest-0.3.3.1.html
          git commit -m "ui: render game player menu icons at 100px"
          git push origin HEAD:fix/game-player-menu-icon-size
