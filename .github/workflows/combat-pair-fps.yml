name: Single Player Clash FPS
on:
  pull_request:
    paths:
      - 'Battle-viewer.html'
      - 'js/combat-v073-economy-menu.js'
      - 'tests/combat-nine-browser-benchmark.spec.mjs'
      - 'tests/combat-pair-report.mjs'
      - 'tests/combat-*-invalidation-smoke.mjs'
      - '.github/workflows/combat-pair-fps.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: ['[360,800]', '[390,844]', '[844,390]', '[768,1024]', '[1280,720]', '[1920,1080]']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - name: Base of this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add "$RUNNER_TEMP/combat-baseline" "$BASE_SHA"
      - name: Targeted regressions and canonical bundle
        run: |
          node tests/combat-overlay-invalidation-smoke.mjs
          node tests/combat-menu-invalidation-smoke.mjs
          node tests/combat-shared-compositor-smoke.mjs
          node tests/combat-overlay-batch-smoke.mjs
          node tests/combat-hud-coalescing-smoke.mjs
          node tests/combat-v073-player-renderer-performance-smoke.mjs
          node tests/combat-playback-dirty-render-smoke.mjs
          node tests/combat-playback-catchup-smoke.mjs
          npm run check:combat-live
      - name: One DM and one Player; ABBA; three rounds without reload
        env:
          COMBAT_BENCH_PLAYERS: '1'
          COMBAT_BENCH_VIEWPORT: ${{ matrix.viewport }}
          COMBAT_BENCH_BASELINE_ROOT: ${{ runner.temp }}/combat-baseline
          COMBAT_BENCH_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          COMBAT_BENCH_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config combat-results-firebase.json 'npx playwright test tests/combat-nine-browser-benchmark.spec.mjs --workers=1 --reporter=line --output=artifacts/combat-pair/playwright'
      - name: Report measured FPS separately from skew; reject incomplete runs
        if: always()
        run: node tests/combat-pair-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-pair-${{ strategy.job-index }}
          path: artifacts/combat-pair
