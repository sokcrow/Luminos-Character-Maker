name: Combat READY reentry temporary QA
on:
  pull_request:
    branches: [main]
    paths: ['combat/**', 'Battle-viewer.html', 'js/combat-v073-*.js', 'css/combat-v073-hud-motion.css', 'tests/combat-ready-reentry-temporary*', '.github/workflows/combat-ready-reentry-temporary.yml']
jobs:
  shared-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            combat
            css
            js
            Fonts
            assets
            tests
            scripts
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install --no-save @playwright/test@1.55.0 firebase-tools@14.22.0
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir .qa-sdk
          for name in app auth database; do curl --fail --retry 3 https://www.gstatic.com/firebasejs/8.10.1/firebase-$name.js -o .qa-sdk/firebase-$name.js; done
          node tests/combat-ready-reentry-temporary.mjs
          npm run check:combat-live
          npm run test:combat-mobile
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/shared-http.log 2>&1 &
          npx firebase emulators:exec --only auth,database --project demo-limbus 'npx playwright test tests/combat-ready-reentry-temporary.spec.mjs --workers=1 --reporter=line'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-shared-planning-evidence
          path: |
            artifacts/shared-planning/
            test-results/
            database-debug.log
            firebase-debug.log
