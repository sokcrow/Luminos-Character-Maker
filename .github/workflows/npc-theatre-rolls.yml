name: NPC Theatre Rolls

on:
  pull_request:
    paths:
      - "js/coin-engine-core.js"
      - "js/npc-stats-engine.js"
      - "js/character-manager-npc-stats.js"
      - "css/character-manager-npc-stats.css"
      - "js/dm-npc-rolls.js"
      - "css/dm-npc-rolls.css"
      - "js/dm-character-manager-takeover.js"
      - "js/character-manager-live-sync.js"
      - "tests/npc_theatre_rolls.spec.js"
      - ".github/workflows/npc-theatre-rolls.yml"
  push:
    paths:
      - "js/coin-engine-core.js"
      - "js/npc-stats-engine.js"
      - "js/character-manager-npc-stats.js"
      - "css/character-manager-npc-stats.css"
      - "js/dm-npc-rolls.js"
      - "css/dm-npc-rolls.css"
      - "js/dm-character-manager-takeover.js"
      - "js/character-manager-live-sync.js"
      - "tests/npc_theatre_rolls.spec.js"
      - ".github/workflows/npc-theatre-rolls.yml"

jobs:
  npc-theatre-rolls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check js/coin-engine-core.js
      - run: node --check js/npc-stats-engine.js
      - run: node --check js/character-manager-npc-stats.js
      - run: node --check js/dm-npc-rolls.js
      - run: node --check js/dm-character-manager-takeover.js
      - run: node --check js/character-manager-live-sync.js
      - run: npx playwright test tests/npc_theatre_rolls.spec.js
