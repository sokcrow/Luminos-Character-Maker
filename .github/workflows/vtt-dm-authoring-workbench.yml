name: VTT DM Authoring Workbench

on:
  pull_request:
    paths:
      - 'js/vtt/dm-authoring-shell-polish.js'
      - 'tests/vtt_dm_authoring_workbench.spec.js'
      - '.github/workflows/vtt-dm-authoring-workbench.yml'
  workflow_dispatch:

concurrency:
  group: vtt-dm-authoring-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dm-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax
        run: node --input-type=module --check < js/vtt/dm-authoring-shell-polish.js
      - name: Workbench contracts
        run: npx playwright test tests/vtt_dm_authoring_workbench.spec.js
      - name: Zone Creator and streaming regression
        run: >-
          npx playwright test
          tests/vtt_procedural_dm_ui.spec.js
          tests/vtt_zone_creator_completion.spec.js
          tests/vtt_procedural_chunk_streaming_performance.spec.js
          tests/vtt_procedural_chunk_streaming_authority.spec.js
          tests/vtt_procedural_lazy_preview_performance.spec.js
          tests/vtt_performance_guard.spec.js
      - name: Authoring dependency regression
        run: >-
          npx playwright test
          tests/vtt_semantic_map_foundation.spec.js
          tests/vtt_building_semantic_model.spec.js
          tests/vtt_building_archetypes.spec.js
          tests/vtt_building_navigation_graph.spec.js
          tests/vtt_topology.spec.js
