name: Remove legacy status codex entries

on:
  push:
    branches:
      - docs/status-effects-current-only

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/status-effects-current-only
      - name: Remove non-current codex entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('status-effects/index.html')
          s = p.read_text()

          start = s.find("{id:'sleep'")
          end = s.find("].filter(x=>x.icon);", start)
          if start < 0 or end < 0:
              raise SystemExit('Sleep/Confusion legacy block not found')
          s = s[:start] + s[end:]

          s = s.replace(
              '.warning,.legacy{border:1px solid #785e2f;background:#191309;padding:12px;color:#d8bd82;font-size:12px;line-height:1.55;margin:10px 0}',
              '.warning{border:1px solid #785e2f;background:#191309;padding:12px;color:#d8bd82;font-size:12px;line-height:1.55;margin:10px 0}'
          )
          s = s.replace("${x.legacy?'<span class=\"badge warn\">Legacy</span>':''}", '')
          s = s.replace(
              "${x.legacy?'Legacy / no verificado':x.warning?'Runtime con discrepancia':'Verificado en main'}",
              "${x.warning?'Runtime con discrepancia':'Verificado en main'}"
          )
          s = s.replace(
              "${x.legacy?'<div class=\"legacy\"><b>LEGACY //</b> No se localizó una definición ejecutable equivalente en los runtimes actuales revisados. Se conserva la información heredada sin inventar comportamiento nuevo.</div>':''}",
              ''
          )
          s = s.replace('El texto descriptivo heredado de statusManager menciona', 'El texto descriptivo de statusManager menciona')
          s = s.replace('del texto heredado.', 'del texto descriptivo.')

          low = s.lower()
          forbidden = ['legacy', 'heredad', 'no verificado', "{id:'sleep'", "{id:'confusion'"]
          leftovers = [term for term in forbidden if term in low]
          if leftovers:
              raise SystemExit(f'Forbidden codex leftovers: {leftovers}')

          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('status-effects/index.html').read_text()
          m = re.search(r'<script>\s*(.*?)\s*</script>', s, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/status-effects.js').write_text(m.group(1))
          PY
          node --check /tmp/status-effects.js
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/remove-status-effects-legacy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status-effects/index.html .github/workflows/remove-status-effects-legacy.yml
          git commit -m "docs: remove legacy status codex entries"
          git push origin HEAD:docs/status-effects-current-only
