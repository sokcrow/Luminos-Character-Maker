name: Temporary Encounter Rollover and Reinforcement Acceptance
on:
  pull_request:
    branches: [main]
jobs:
  real-firebase-playback-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @playwright/test@1.55.0 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - run: npm run check:combat-live
      - name: Auth, RTDB, live animations, real loot and production close controls
        run: npx firebase emulators:exec --project demo-combat-results --only auth,database --config tmp-combat-results-firebase.json 'npx playwright test tests/tmp-combat-results.spec.mjs --workers=1 --reporter=line'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-rollover-results
          path: test-results
