name: Inventory HUD Mobile + Desktop Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'hoja_personaje.html'
      - 'hoja_personaje.css'
      - 'js/inventory-hud-v2.js'
      - 'js/item-icon-registry.js'
      - 'css/inventory-hud-v2.css'
      - 'css/inventory-gothic-art.css'
      - 'css/inventory-hud-reference.css'
      - 'Assets/Icons/items/**'
      - 'tests/inventory-reference-popup.spec.mjs'
      - 'tests/inventory-hud-reference-smoke.mjs'
      - '.github/workflows/inventory-hud-visual-validation.yml'
  push:
    branches: [main]
    paths:
      - 'hoja_personaje.html'
      - 'hoja_personaje.css'
      - 'js/inventory-hud-v2.js'
      - 'js/item-icon-registry.js'
      - 'css/inventory-hud-v2.css'
      - 'css/inventory-gothic-art.css'
      - 'css/inventory-hud-reference.css'
      - 'Assets/Icons/items/**'
      - 'tests/inventory-reference-popup.spec.mjs'
      - 'tests/inventory-hud-reference-smoke.mjs'
      - '.github/workflows/inventory-hud-visual-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-hud-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-inventory:
    name: Responsive HUD + Live Item Popup
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production HTML, CSS and real-item registry contract
        run: |
          node --check js/inventory-hud-v2.js
          node --check tests/inventory-reference-popup.spec.mjs
          node tests/inventory-hud-reference-smoke.mjs
          node tests/item-icon-registry-smoke.cjs
          node tests/item-icon-assets-smoke.cjs
      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Six physical viewports / image loading / popup / realtime focus
        run: npx playwright test tests/inventory-reference-popup.spec.mjs --workers=1 --reporter=line --trace=retain-on-failure
      - name: Attach 6 screen-size HUD and popup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-hud-visual-evidence
          path: test-results/inventory-hud-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-hud-regression-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
