name: Temporary Combat Loop Acceptance
on:
  pull_request:
    branches: [main]
jobs:
  real-firebase-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @playwright/test@1.55.0 firebase@8.10.1 firebase-tools@14.19.1
      - run: npx playwright install --with-deps chromium
      - run: npm run check:combat-live
      - run: node tests/tmp-combat-core.cjs
      - name: Real Auth, RTDB rules, browser and isolated encounters
        run: npx firebase emulators:exec --project demo-combat-loop --only auth,database --config tmp-combat-firebase.json 'npx playwright test tests/tmp-combat-loop.spec.mjs --workers=1 --reporter=line'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-loop-acceptance
          path: |
            test-results
            playwright-report
