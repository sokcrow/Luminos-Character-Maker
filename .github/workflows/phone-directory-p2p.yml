name: Phone directory and P2P regression

on:
  pull_request:
    paths:
      - "hoja_personaje.js"
      - "hoja_personaje.html"
      - "database.rules.json"
      - "pantalla_dm.html"
      - "tests/phone-directory-p2p-smoke.mjs"
      - "tests/dm-p2p-live-ledger-smoke.mjs"
      - ".github/workflows/phone-directory-p2p.yml"
  push:
    branches: [main]
    paths:
      - "hoja_personaje.js"
      - "hoja_personaje.html"
      - "database.rules.json"
      - "pantalla_dm.html"
      - "tests/phone-directory-p2p-smoke.mjs"
      - "tests/dm-p2p-live-ledger-smoke.mjs"

jobs:
  phone-p2p-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check hoja_personaje.js
      - name: Run phone/P2P regression checks
        run: node tests/phone-directory-p2p-smoke.mjs
      - name: Run DM realtime P2P ledger checks
        run: node tests/dm-p2p-live-ledger-smoke.mjs
