name: "Theatre Engine #511"

on:
  pull_request:
    paths:
      - "js/theatre-engine.js"
      - "js/theatre-controls.js"
      - "js/on-game-dashboard.js"
      - "tests/theatre_issue_511.spec.js"
      - ".github/workflows/theatre-issue-511.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theatre-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Reset to main and apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          cat > /tmp/theatre.patch.gz.b64 <<'PATCH64'

PATCH64
          base64 -d /tmp/theatre.patch.gz.b64 | gzip -d > /tmp/theatre-final.patch
          git apply --index /tmp/theatre-final.patch

      - name: Install dependencies
        run: npm ci

      - name: Validate Theatre JavaScript
        run: |
          node --check hoja_personaje.js
          node --check js/theatre-engine.js
          node --check js/on-game-dashboard.js
          node --check js/theatre-controls.js

      - name: Validate diff
        run: git diff --cached --check

      - name: Run Theatre tests
        run: npx playwright test tests/player_theatre_regression.spec.js tests/theatre_realtime.spec.js tests/theatre_issue_511.spec.js tests/theatre_hud_detail_patch.spec.js --workers=1

      - name: Commit and publish exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sokcrow"
          git config user.email "sokutsuko2@gmail.com"
          git commit -m "fix theatre HUD identity and player controls"
          git push --force origin HEAD:fix/theatre-hud-detail-patch
