name: Class Runtime Manifest

on:
  pull_request:
    paths:
      - "js/*-class-runtime.js"
      - "js/*-archetype-runtime.js"
      - "js/*-combat-runtime.js"
      - "js/*-theatre-runtime.js"
      - "js/class-runtime-manifest.js"
      - "scripts/generate-class-runtime-manifest.mjs"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "js/*-class-runtime.js"
      - "js/*-archetype-runtime.js"
      - "js/*-combat-runtime.js"
      - "js/*-theatre-runtime.js"
      - "js/class-runtime-manifest.js"
      - "scripts/generate-class-runtime-manifest.mjs"
      - "package.json"

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:class-runtime-manifest
