name: Player Inventory Runtime Cutover

on:
  push:
    branches:
      - refactor/player-inventory-runtime-cutover
    paths:
      - scripts/player-inventory-runtime-cutover.py
      - .github/workflows/player-inventory-runtime-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/player-inventory-runtime-cutover
          fetch-depth: 0

      - name: Remove obsolete player inventory source
        run: python scripts/player-inventory-runtime-cutover.py

      - name: Validate source cutover
        run: |
          node --check hoja_personaje.js
          node --check js/inventory-hud-v2.js
          ! grep -q 'window.renderInventoryGrid = function' hoja_personaje.js
          ! grep -q 'item-move-action' hoja_personaje.js
          ! grep -q 'item-load-action' hoja_personaje.js
          ! grep -q 'playerInventoryListenerActive' hoja_personaje.js
          ! grep -q 'id="equipment-panel"' hoja_personaje.html
          ! grep -q 'id="detail-equip-btn-container"' hoja_personaje.html
          grep -q 'id="inv-active-grid"' hoja_personaje.html
          grep -q 'id="inv-stash-grid"' hoja_personaje.html
          grep -q 'id="inv-sintesis"' hoja_personaje.html

      - name: Commit cutover and remove one-shot tooling
        run: |
          rm -f scripts/player-inventory-runtime-cutover.py
          rm -f .github/workflows/player-inventory-runtime-cutover.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hoja_personaje.js hoja_personaje.html scripts/player-inventory-runtime-cutover.py .github/workflows/player-inventory-runtime-cutover.yml
          git commit -m "refactor(items): remove legacy player inventory implementation"
          git push origin HEAD:refactor/player-inventory-runtime-cutover
