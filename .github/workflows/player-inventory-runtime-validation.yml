      - js/item-equipment-bridge.js
      - js/item-inventory-runtime.js
      - js/item-persistence-runtime.js
      - js/item-realtime-sync.js
      - js/player-ux-polish.js
      - css/inventory-hud-v2.css
      - css/dm-item-instance-editor.css
      - tests/item-icon-registry-smoke.cjs
      - tests/item-quality-engine-smoke.cjs
      - tests/item-affinity-engine-smoke.cjs
      - tests/item-culinary-affinity-data-smoke.cjs
      - tests/item-size-lineage-engine-smoke.cjs
      - tests/item-harvest-integrity-engine-smoke.cjs
      - tests/item-catalog-hp-healing-smoke.cjs
      - tests/item-catalog-sp-healing-smoke.cjs
      - tests/item-catalog-hybrid-healing-smoke.cjs
      - tests/item-catalog-status-cure-smoke.cjs
      - tests/item-catalog-medical-supply-smoke.cjs
      - tests/item-catalog-meat-smoke.cjs
      - tests/item-catalog-food-smoke.cjs
      - tests/item-catalog-hide-pelt-smoke.cjs
      - tests/item-catalog-hard-parts-smoke.cjs
      - tests/item-catalog-scale-shell-chitin-smoke.cjs
      - tests/item-catalog-feather-raw-fiber-smoke.cjs
      - tests/item-catalog-organ-gland-smoke.cjs
      - tests/item-catalog-blood-ichor-smoke.cjs
      - tests/item-catalog-venom-secretion-smoke.cjs
      - tests/item-catalog-ooze-gel-smoke.cjs
      - tests/item-catalog-essence-core-smoke.cjs
      - tests/item-catalog-plant-produce-smoke.cjs
      - tests/item-catalog-ore-ingot-gem-smoke.cjs
      - tests/item-catalog-tools-smoke.cjs
      - tests/item-catalog-craft-components-smoke.cjs
      - tests/item-catalog-weapons-smoke.cjs
      - tests/item-weapon-composition-smoke.cjs
      - tests/injury-narrative-speed-smoke.cjs
      - tests/inventory-runtime-cutover.spec.cjs
      - tests/dm-item-instance-editor.spec.cjs
      - .github/workflows/player-inventory-runtime-validation.yml
  push:
    branches:
      - refactor/player-inventory-runtime-cutover

jobs:
  inventory-runtime-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax validation
        run: |
          node --check hoja_personaje.js
          node --check js/injury-engine.js
          node --check js/inventory-hud-v2.js
          node --check js/dm-item-instance-editor.js
          node --check js/dm-player-dnd-studio-hotfix.js
          node --check js/item-icon-registry.js
          node --check js/item-quality-engine.js
          node --check js/item-affinity-engine.js
          node --check js/item-culinary-affinity-data.js
          node --check js/item-size-lineage-engine.js
          node --check js/item-harvest-integrity-engine.js
          node --check js/item-catalog-hp-healing.js
          node --check js/item-catalog-sp-healing.js
          node --check js/item-catalog-hybrid-healing.js
          node --check js/item-catalog-status-cure.js
          node --check js/item-catalog-medical-supply.js
          node --check js/item-catalog-meat.js
          node --check js/item-catalog-food.js
          node --check js/item-catalog-hide-pelt.js
          node --check js/item-catalog-hard-parts.js
          node --check js/item-catalog-scale-shell-chitin.js
          node --check js/item-catalog-feather-raw-fiber.js
          node --check js/item-catalog-organ-gland.js
          node --check js/item-catalog-blood-ichor.js
          node --check js/item-catalog-venom-secretion.js
          node --check js/item-catalog-ooze-gel.js
          node --check js/item-catalog-essence-core.js
          node --check js/item-catalog-plant-produce.js
          node --check js/item-catalog-ore-ingot-gem.js
          node --check js/item-catalog-tools.js
          node --check js/item-catalog-craft-components.js
          node --check js/item-catalog-weapons.js
          node --check js/item-catalog-weapon-components.js
          node --check js/item-weapon-composition-engine.js
          node --check js/item-inventory-runtime.js
          node --check js/item-equipment-bridge.js
          node --check js/item-persistence-runtime.js
          node --check js/item-realtime-sync.js
      - name: Item icon registry smoke
        run: node tests/item-icon-registry-smoke.cjs
      - name: Item quality engine smoke
        run: node tests/item-quality-engine-smoke.cjs
      - name: Item affinity engine smoke
        run: node tests/item-affinity-engine-smoke.cjs
      - name: Culinary affinity data smoke
        run: node tests/item-culinary-affinity-data-smoke.cjs
      - name: Item size and lineage smoke
        run: node tests/item-size-lineage-engine-smoke.cjs
      - name: Harvest integrity engine smoke
        run: node tests/item-harvest-integrity-engine-smoke.cjs
      - name: HP healing catalog smoke
        run: node tests/item-catalog-hp-healing-smoke.cjs
      - name: SP healing catalog smoke
        run: node tests/item-catalog-sp-healing-smoke.cjs
      - name: Hybrid healing catalog smoke
        run: node tests/item-catalog-hybrid-healing-smoke.cjs
      - name: Status cure catalog smoke
        run: node tests/item-catalog-status-cure-smoke.cjs
      - name: Medical supply catalog smoke
        run: node tests/item-catalog-medical-supply-smoke.cjs
      - name: Meat ingredient catalog smoke
        run: node tests/item-catalog-meat-smoke.cjs
      - name: Food and ration catalog smoke
        run: node tests/item-catalog-food-smoke.cjs
      - name: Hide and pelt catalog smoke
        run: node tests/item-catalog-hide-pelt-smoke.cjs
      - name: Hard Parts catalog smoke
        run: node tests/item-catalog-hard-parts-smoke.cjs
      - name: Scale shell chitin catalog smoke
        run: node tests/item-catalog-scale-shell-chitin-smoke.cjs
      - name: Feather raw fiber catalog smoke
        run: node tests/item-catalog-feather-raw-fiber-smoke.cjs
      - name: Organ gland catalog smoke
        run: node tests/item-catalog-organ-gland-smoke.cjs
      - name: Blood ichor catalog smoke
        run: node tests/item-catalog-blood-ichor-smoke.cjs
      - name: Venom secretion catalog smoke
        run: node tests/item-catalog-venom-secretion-smoke.cjs
      - name: Ooze gel catalog smoke
        run: node tests/item-catalog-ooze-gel-smoke.cjs
      - name: Essence core catalog smoke
        run: node tests/item-catalog-essence-core-smoke.cjs
      - name: Plant produce catalog smoke
        run: node tests/item-catalog-plant-produce-smoke.cjs
      - name: Ore ingot gem catalog smoke
        run: node tests/item-catalog-ore-ingot-gem-smoke.cjs
      - name: Tool catalog smoke
        run: node tests/item-catalog-tools-smoke.cjs
      - name: Craft component catalog smoke
        run: node tests/item-catalog-craft-components-smoke.cjs
      - name: Weapon catalog smoke
        run: node tests/item-catalog-weapons-smoke.cjs
      - name: Weapon composition engine smoke
        run: node tests/item-weapon-composition-smoke.cjs
      - name: Injury narrative Speed smoke
        run: node tests/injury-narrative-speed-smoke.cjs
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inventory runtime ownership tests
        run: npx playwright test tests/inventory-runtime-cutover.spec.cjs tests/dm-item-instance-editor.spec.cjs --workers=1
