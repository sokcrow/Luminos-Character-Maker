name: Inventory Runtime Validation

on:
  pull_request:
    paths:
      - hoja_personaje.js
      - hoja_personaje.html
      - pantalla_dm.html
      - js/injury-engine.js
      - js/inventory-hud-v2.js
      - js/dm-item-instance-editor.js
      - js/dm-player-dnd-studio-hotfix.js
      - js/item-icon-registry.js
      - js/item-quality-engine.js
      - js/item-affinity-engine.js
      - js/item-culinary-affinity-data.js
      - js/item-size-lineage-engine.js
      - js/item-harvest-integrity-engine.js
      - js/item-catalog-hp-healing.js
      - js/item-catalog-sp-healing.js
      - js/item-catalog-hybrid-healing.js
      - js/item-catalog-status-cure.js
