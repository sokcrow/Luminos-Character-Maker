name: L777 Biome Validation V2 Runtime

on:
  push:
    branches:
      - feat/item-icon-families
    paths:
      - ".github/workflows/l777-biome-validation-v2-runtime.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static Game Engine tests
        run: |
          node game-engine/tests/core-smoke.mjs
          node game-engine/tests/continuous-movement-smoke.mjs
          node game-engine/tests/visual-lab-smoke.mjs

      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate all current biomes in browser
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/l777-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          cat > biome-validation-v2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const regions=['gNW','gN','gNE','gC','gSW','gS','gSE'];
          const browser=await chromium.launch({headless:true});
          const rows=[];

          for(const id of regions){
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(
              `http://127.0.0.1:4173/game-engine/lab/game/forest-0.3.3.1.html?qa=procedural&region=${id}`,
              {waitUntil:'domcontentloaded',timeout:120000}
            );
            await page.waitForFunction(
              regionId=>window.__BIOME_VALIDATION_QA__?.regionId===regionId&&window.__QA__,
              id,{timeout:120000}
            );
            const result=await page.evaluate(()=>window.__BIOME_VALIDATION_QA__);
            console.log('BIOME_V2_REGION',JSON.stringify(result));
            assert.equal(result.regionId,id);
            assert.equal(result.ok,true,`${id} failed: ${JSON.stringify(result.checks)}`);
            assert.equal(result.generation.visibleGridGeometry,false);
            assert.equal(result.generation.geologyAudit?.ok,true);
            assert.equal(pageErrors.length,0,`${id} runtime errors: ${pageErrors.join(' | ')}`);
            rows.push(result);
            await page.screenshot({path:`biome-${id}.png`,fullPage:false});
            await page.close();
          }

          const page=await browser.newPage({viewport:{width:1280,height:720}});
          await page.goto('http://127.0.0.1:4173/game-engine/lab/game/forest-0.3.3.1.html?qa=procedural&region=gC',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>window.BiomeValidationV2&&window.__QA__,null,{timeout:120000});
          const aggregate=await page.evaluate(()=>window.BiomeValidationV2.auditAll('owC'));
          console.log('BIOME_V2_ALL',JSON.stringify(aggregate));
          assert.equal(aggregate.ok,true);
          assert.equal(aggregate.regions.length,7);
          await page.close();

          fs.writeFileSync('biome-validation-v2.json',JSON.stringify({ok:true,regions:rows,aggregate},null,2));
          await browser.close();
          EOF
          node biome-validation-v2.mjs
          rm -f biome-validation-v2.mjs

      - name: Build L777.zip
        shell: python
        run: |
          import os,zipfile
          root=os.getcwd()
          out=os.path.join(root,"L777.zip")
          skip={".git","node_modules"}
          excluded={
            "L777.zip",
            ".github/workflows/l777-biome-validation-v2-runtime.yml",
            ".github/workflows/l777-biome-validation-probe.yml",
            "biome-validation-v2.json",
          }
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for base,dirs,files in os.walk(root):
                  dirs[:]=[d for d in dirs if d not in skip]
                  for name in files:
                      path=os.path.join(base,name)
                      rel=os.path.relpath(path,root).replace(os.sep,"/")
                      if rel in excluded or (rel.startswith("biome-") and rel.endswith(".png")):
                          continue
                      z.write(path,rel)

      - name: Upload validated package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: L777-biome-validation-v2
          path: |
            L777.zip
            biome-validation-v2.json
            biome-gNW.png
            biome-gN.png
            biome-gNE.png
            biome-gC.png
            biome-gSW.png
            biome-gS.png
            biome-gSE.png
          if-no-files-found: error
          retention-days: 1
