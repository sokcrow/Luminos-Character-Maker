# CI policy: subsystem workflows own focused contracts; this workflow owns the single full-suite safety net.
name: Luminous Regression Baseline

on:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - '*.html'
      - 'tests/**'
      - 'database.rules.json'
      - 'storage.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - '*.html'
      - 'tests/**'
      - 'database.rules.json'
      - 'storage.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: luminous-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full repository regression
        run: npx playwright test --workers=1
