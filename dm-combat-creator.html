<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite & UI Preview Editor</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>

        /* --- VARIABLES BASE --- */
        :root {
            --limbus-hp-orange: #ff4a22;
            --limbus-speed-yellow: #ffe877;
            --limbus-slot-dark: #1a1510;
            --limbus-slot-border: #4a3520;
            --limbus-focused-ui-bg: #110000;
            --limbus-focused-ui-border: #440000;
            --limbus-hp-focused: #ff2222;
        }

        body { margin: 0; padding: 0; background-color: #050010; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* --- CONTENEDOR DE UNIDAD --- */
        .combatant {
            position: relative;
            width: 260px;
            height: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* --- UI SUPERIOR (Velocidad y Slots) --- */
        .top-ui-panel {
            position: absolute;
            top: -60px; /* Asegurar que quede por encima del sprite */
            display: flex;
            align-items: flex-start;
            gap: 6px;
            z-index: 10;
        }
        .speed-number { color: var(--limbus-speed-yellow); font-size: 50px; font-family: 'Bebas Neue', cursive; line-height: 0.9; }
        .action-slot-svg { width: 44px; height: 44px; }
        .slot-heptagon-bg { fill: var(--limbus-slot-dark); stroke: var(--limbus-slot-border); stroke-width: 10; }

        /* --- CENTRO (Sprite) --- */
        .sprite-anchor {
            position: relative;
            z-index: 5;
        }
        .sprite-img {
            max-height: 200px;
            transform-origin: bottom center;
            /* Placeholder styles if empty */
            min-width: 100px;
            min-height: 100px;
            object-fit: contain;
            object-position: bottom;
            filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.8));
        }

        /* --- UI INFERIOR (HP Base Unfocused) --- */
        .diegetic-floor {
            position: absolute;
            bottom: -110px; /* Debajo de los pies */
            width: 220px;
            height: 220px;
            transform: rotateX(65deg);
            z-index: 1;
        }
        .floor-bg-poly { fill: rgba(255, 80, 0, 0.2); stroke: rgba(255, 200, 50, 0.5); stroke-width: 3; }
        .hp-track { fill: none; stroke: rgba(30, 5, 5, 0.8); stroke-width: 22; stroke-linecap: butt; }
        .hp-fill-line { fill: none; stroke: var(--limbus-hp-orange); stroke-width: 22; transition: stroke-dashoffset 0.4s ease-out; filter: drop-shadow(0px 0px 10px var(--limbus-hp-orange)); }

        /* --- UI DE FOCUSED (RECTANGULAR) --- */
        .focused-ui-rect {
            position: absolute; bottom: -90px; width: 350px; height: 60px;
            background: var(--limbus-focused-ui-bg); border: 3px solid var(--limbus-focused-ui-border); border-radius: 4px;
            z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(100,50,0,0.5); pointer-events: auto;
        }
        .focused-hp-bar-container { width: 95%; height: 25px; background: #220000; border: 2px solid #441111; position: relative; overflow: hidden; }
        .focused-hp-fill-rect { height: 100%; background: var(--limbus-hp-focused); width: 100%; transition: width 0.4s ease-out; filter: drop-shadow(0px 0px 8px var(--limbus-hp-focused)); }

    </style>
</head>
<body>

        <!-- Buscador -->

        </fieldset>
    </div>

        // Utilidades SVG
        function generateHeptagonPoints(radius) {
            const sides = 7; const points = []; const startAngle = Math.PI / 2;
            for (let i = 0; i < sides; i++) {
                const angle = startAngle + (i * 2 * Math.PI / sides);
                points.push({ x: (radius * Math.cos(angle)).toFixed(1), y: (radius * Math.sin(angle)).toFixed(1) });
            }
            const fullPoly = points.map(p => `${p.x},${p.y}`).join(' ');
            const frontHalf = `${points[5].x},${points[5].y} ${points[6].x},${points[6].y} ${points[0].x},${points[0].y} ${points[1].x},${points[1].y} ${points[2].x},${points[2].y}`;
            return { full: fullPoly, front: frontHalf };
        }

        const heptagonBase = generateHeptagonPoints(85);

        // Variables de estado
        const ENTITY_DB = {
            players: [
                { id: "p_1", name: "Jeske", tags: ["sinner", "frontline"], isCombatant: true, combatTemplate: {} }

            npcs: [
                { id: "n_1", name: "Pierre", tags: ["ally", "syndicate", "bistrot"], isCombatant: true, combatTemplate: {} }

        let currentState = {

        function renderPreview() {
            const previewContainer = document.getElementById("editor-preview");

            // Layout offsets
            const spriteTransform = `translate(${currentState.visual.spriteX}px, ${currentState.visual.spriteY}px) scale(${currentState.visual.scale})`;
            const uiTransform = `translate(${currentState.visual.uiX}px, ${currentState.visual.uiY}px)`;

            let bottomUI = '';
            if (currentState.visual.isFocused) {
                bottomUI = `
                    <div class="focused-ui-rect" style="transform: ${uiTransform}; cursor: pointer;" onclick="document.getElementById('uiXSlider').focus();">
                        <div class="focused-hp-bar-container">
                            <div class="focused-hp-fill-rect" style="width: 100%;"></div>
                        </div>
                    </div>
                `;
            } else {
                bottomUI = `
                    <svg class="diegetic-floor" viewBox="-100 -100 200 200" style="transform: rotateX(65deg) ${uiTransform}; cursor: pointer;" onclick="document.getElementById('uiXSlider').focus();">
                        <polygon class="floor-bg-poly" points="${heptagonBase.full}" />
                        <polyline class="hp-track" points="${heptagonBase.front}" />
                        <polyline class="hp-fill-line" points="${heptagonBase.front}" pathLength="100" style="stroke-dasharray: 100; stroke-dashoffset: 0;" />
                    </svg>
                `;
            }

            // Always render 3 slots for visual reference
            const slotsHtml = [1, 2, 3].map(() => `
                <svg class="action-slot-svg" viewBox="0 0 100 100">
                    <polygon class="slot-heptagon-bg" points="50,95 15,78 6,40 30,9 70,9 94,40 85,78" />
                </svg>
            `).join('');

            previewContainer.innerHTML = `
                <div class="combatant">
                    <div class="top-ui-panel" style="transform: ${uiTransform}; cursor: pointer;" onclick="document.getElementById('uiXSlider').focus();">
                        <div class="speed-number">${currentState.mechanics.speed}</div>
                        ${slotsHtml}
                    </div>

                    <div class="sprite-anchor" style="transform: ${spriteTransform}; cursor: pointer;" onclick="document.getElementById('spriteXSlider').focus();">
                        ${currentState.visual.spriteUrl ? `<img src="${currentState.visual.spriteUrl}" class="sprite-img">` : `<div style="width:100px; height:100px; background:#444; border:2px dashed #888;"></div>`}
                    </div>

                    ${bottomUI}
                </div>
            `;
        }

        function generateStatusOptions() {
            let options = '';
            for (const [id, data] of Object.entries(STATUS_REGISTRY)) {
                options += `<option value="${id}">${data.name}</option>`;
            }
            return options;
        }

        function createEffectEditorHtml(isCoinEffect) {
            const triggers = isCoinEffect
                ? `<option value="[On Hit]">[On Hit]</option><option value="[On Heads Hit]">[On Heads Hit]</option><option value="[On Tails Hit]">[On Tails Hit]</option>`
                : `<option value="[On Use]">[On Use]</option><option value="[On Clash Win]">[On Clash Win]</option><option value="[On Clash Lose]">[On Clash Lose]</option>`;

            return `
                <div class="effect-row" style="display:flex; gap: 5px; margin-bottom: 5px; background: #222; padding: 5px; border: 1px solid #444;">
                    <select class="eff-trigger" style="flex:1; font-size:10px;">${triggers}</select>
                    <select class="eff-target" style="flex:0.8; font-size:10px;"><option value="self">Gain</option><option value="target">Apply</option></select>
                    <input type="number" class="eff-potency" placeholder="Pot" style="width:40px; font-size:10px;">
                    <input type="number" class="eff-count" placeholder="Cnt" style="width:40px; font-size:10px;">
                    <select class="eff-status" style="flex:1.5; font-size:10px;">${generateStatusOptions()}</select>
                    <button type="button" class="eff-remove" style="background:#dc3545; color:white; border:none; cursor:pointer; font-size:10px;">X</button>
                </div>
            `;
        }

        function bindEffectList(containerId, isCoinEffect) {
            const container = document.getElementById(containerId);
            container.addEventListener('click', (e) => {
                if(e.target.classList.contains('eff-remove')) {
                    e.target.closest('.effect-row').remove();
                }
            });
            return function addEffect() {
                container.insertAdjacentHTML('beforeend', createEffectEditorHtml(isCoinEffect));
            };
        }

        function gatherEffects(container) {
            const effects = [];
            container.querySelectorAll('.effect-row').forEach(row => {
                effects.push({
                    trigger: row.querySelector('.eff-trigger').value,
                    target: row.querySelector('.eff-target').value,
                    potency: parseInt(row.querySelector('.eff-potency').value) || 0,
                    count: parseInt(row.querySelector('.eff-count').value) || 0,
                    status: row.querySelector('.eff-status').value
                });
            });
            return effects;
        }

        function generateSkillObject() {
            const isDefense = document.getElementById('sb-is-defense').checked;
            let sinType = document.getElementById('sb-sin').value;

            const skillObj = {
                id: document.getElementById('sb-id').value || "new_skill",
                name: document.getElementById('sb-name').value || "New Skill",
                tier: parseInt(document.getElementById('sb-tier').value) || 1,
                isItemSkill: document.getElementById('sb-is-item-skill').checked,
                basePower: parseInt(document.getElementById('sb-base').value) || 0,
                coinPower: parseInt(document.getElementById('sb-coin-power').value) || 0,
                coinAmount: parseInt(document.getElementById('sb-coin-count').value) || 1,
                affinity: isDefense && sinType === '' ? 'Sinless' : sinType, // enforce Sinless on defense if somehow empty
                weight: parseInt(document.getElementById('sb-weight').value) || 1,
                isDefense: isDefense,
                effects: gatherEffects(document.getElementById('sb-global-effects-container')),
                coins: []
            };

            if (isDefense) {
                skillObj.defenseSubtype = document.getElementById('sb-defense-subtype').value;
                const requiresUnlock = document.getElementById('sb-defense-requires-unlock').checked;
                if (['Counter', 'ClashableCounter', 'ClashableGuard'].includes(skillObj.defenseSubtype)) {
                    skillObj.requiresUnlock = requiresUnlock;
                }

                if (['ClashableGuard', 'ClashableCounter'].includes(skillObj.defenseSubtype)) {
                    skillObj.isClashable = true;
                }
            }

            const coinContainers = document.querySelectorAll('.sb-coin-block');
            for(let i = 0; i < skillObj.coinAmount; i++) {
                if (coinContainers[i]) {
                    skillObj.coins.push({
                        type: 'active',
                        effects: gatherEffects(coinContainers[i].querySelector('.coin-effects-container'))
                    });
                }
            }

            return skillObj;
        }

        function initSkillBuilder() {
            const addGlobalEffect = bindEffectList('sb-global-effects-container', false);
            document.getElementById('sb-btn-add-global').addEventListener('click', () => addGlobalEffect());

            document.getElementById('sb-is-defense').addEventListener('change', (e) => {
                document.getElementById('sb-defense-options').style.display = e.target.checked ? 'block' : 'none';
                if (e.target.checked) document.getElementById('sb-sin').value = 'Sinless';
            });

            document.getElementById('sb-coin-count').addEventListener('input', (e) => {
                let count = parseInt(e.target.value) || 1;
                count = Math.max(1, count);

                const container = document.getElementById('sb-coins-container');
                const fragment = document.createDocumentFragment();
                const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

                const existingBlocks = Array.from(container.querySelectorAll('.sb-coin-block'));

                for (let i = 0; i < count; i++) {
                    if (existingBlocks[i]) {
                        fragment.appendChild(existingBlocks[i]);
                    } else {
                        const block = document.createElement('div');
                        block.className = 'sb-coin-block';
                        block.style.cssText = 'background: #1a1a1a; padding: 5px; margin-bottom: 5px; border: 1px solid #333;';
                        block.innerHTML = `
                            <div style="font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #ffdd44;">Moneda ${roman[i] || (i+1)}</div>
                            <div class="coin-effects-container"></div>
                            <button type="button" class="sb-btn-add-coin-effect" style="background: #444; color: white; border: none; padding: 2px 5px; font-size: 10px; cursor: pointer;">+ Añadir Efecto</button>
                        `;
                        const effectContainer = block.querySelector('.coin-effects-container');
                        block.querySelector('.sb-btn-add-coin-effect').addEventListener('click', () => {
                            effectContainer.insertAdjacentHTML('beforeend', createEffectEditorHtml(true));
                        });
                        effectContainer.addEventListener('click', (e) => {
                            if(e.target.classList.contains('eff-remove')) {
                                e.target.closest('.effect-row').remove();
                            }
                        });
                        fragment.appendChild(block);
                    }
                }
                container.innerHTML = '';
                container.appendChild(fragment);
            });

            // Trigger initial generation
            document.getElementById('sb-coin-count').dispatchEvent(new Event('input'));

            document.getElementById('sb-btn-push-skill').addEventListener('click', () => {
                try {
                    const skillObj = generateSkillObject();
                    const skillsTextarea = document.getElementById('statSkills');
                    let currentSkills = [];
                    try {
                        currentSkills = JSON.parse(skillsTextarea.value);
                    } catch (e) {
                        currentSkills = [];
                    }

                    if (Array.isArray(currentState.mechanics.skills)) {
                        currentState.mechanics.skills.push(skillObj);
                    } else {
                        currentState.mechanics.skills = [skillObj];
                    }
                    skillsTextarea.value = JSON.stringify(currentState.mechanics.skills, null, 2);

                    alert(`Habilidad "${skillObj.name}" añadida a la unidad.`);
                } catch (e) {
                    alert("Error generando skill JSON.");
                }
            });
        }

        function switchTab(tabName) {
            currentDirectoryTab = tabName;
            filterDirectory();
        }

        function filterDirectory() {
            const query = document.getElementById('tag-search').value.toLowerCase().trim();
            const listContainer = document.getElementById('directory-list');
            listContainer.innerHTML = ''; // Limpiar lista

            // Buscar coincidencias parciales en el nombre o en el arreglo de tags
            const results = ENTITY_DB[currentDirectoryTab].filter(entity => {
                const matchName = entity.name.toLowerCase().includes(query);
                const matchTag = entity.tags.some(tag => tag.toLowerCase().includes(query));
                return matchName || matchTag;
            });

            // Renderizar botones de selección
            results.forEach(entity => {
                const btn = document.createElement('div');
                btn.style.cssText = "padding: 4px; border-bottom: 1px solid #332211; cursor: pointer; color: #ccc; font-size: 11px;";
                btn.innerHTML = `<strong>${entity.name}</strong> <span style="color: #886633;">[${entity.tags.join(', ')}]</span>`;

                btn.onclick = () => loadEntityIntoEditor(entity);

                // Efecto hover simple
                btn.onmouseover = () => btn.style.background = '#221100';
                btn.onmouseout = () => btn.style.background = 'transparent';

                listContainer.appendChild(btn);
            });
        }

        function loadEntityIntoEditor(entity) {
            if (!entity.isCombatant || !entity.combatTemplate) {
                console.warn("La entidad seleccionada no tiene datos de combate vinculados.");
                return;
            }
            console.log("Cargando plantilla en el editor:", entity.name);
            loadTemplate(entity.combatTemplate);
        }

        function initEditor() {
            console.log("DM Autenticado. Editor Inicializado.");

            // Inputs binding
            const bindInput = (id, statePath, isNumber = false) => {
                const el = document.getElementById(id);
                el.addEventListener('input', (e) => {
                    let val = e.target.value;
                    if(e.target.type === 'checkbox') val = e.target.checked;
                    else if (isNumber) val = parseFloat(val) || 0;

                    const paths = statePath.split('.');
                    if(paths.length === 2) currentState[paths[0]][paths[1]] = val;

                    renderPreview();
                });
            };

            bindInput('spriteUrl', 'visual.spriteUrl');
            bindInput('isFocusedToggle', 'visual.isFocused');
            bindInput('scaleSlider', 'visual.scale', true);
            bindInput('spriteXSlider', 'visual.spriteX', true);
            bindInput('spriteYSlider', 'visual.spriteY', true);
            bindInput('uiXSlider', 'visual.uiX', true);
            bindInput('uiYSlider', 'visual.uiY', true);

            bindInput('statHp', 'mechanics.hp', true);
            bindInput('statLevel', 'mechanics.level', true);
            bindInput('statSpeed', 'mechanics.speed');
            bindInput('statSlots', 'mechanics.actionSlots', true);
            bindInput('statMaxSlots', 'mechanics.maxSlotsLimit', true);

            document.getElementById('statSkills').addEventListener('input', (e) => {
                try { currentState.mechanics.skills = JSON.parse(e.target.value); } catch(err) { /* ignore parse errors while typing */ }
            });

            initSkillBuilder();

            bindInput('metaName', 'meta.name');
            bindInput('metaLinkedNpc', 'meta.linkedNPC');

            document.getElementById('metaTags').addEventListener('input', (e) => {
                currentState.meta.tags = e.target.value.split(',').map(s => s.trim()).filter(s => s);
            });

            // Save logic
            document.getElementById('btnSave').addEventListener('click', () => {
                if(!currentState.meta.name) {
                    alert("Por favor ingresa un Nombre del Template.");
                    return;
                }
                if(!currentState.meta.tags || currentState.meta.tags.length === 0) {
                    alert("Por favor ingresa al menos un Tag (ej. Facción, Tipo, Rango).");
                    return;
                }
                const templateRef = db.ref('combatTemplates').push();
                templateRef.set(currentState)
                    .then(() => alert('Template guardado exitosamente con ID: ' + templateRef.key))
                    .catch(err => alert('Error al guardar: ' + err.message));
            });

            // Search logic
            document.getElementById('btnSearch').addEventListener('click', () => {
                const term = document.getElementById('searchTemplateInput').value.toLowerCase();
                if(!term) return;

                db.ref('combatTemplates').once('value').then(snap => {
                    const data = snap.val();
                    const resultsContainer = document.getElementById('searchResults');
                    resultsContainer.innerHTML = '';
                    if(!data) return;

                    Object.entries(data).forEach(([key, template]) => {
                        if (template.meta && template.meta.name && template.meta.name.toLowerCase().includes(term)) {
                            const div = document.createElement('div');
                            div.style.padding = '5px';
                            div.style.borderBottom = '1px solid #444';
                            div.style.cursor = 'pointer';
                            div.innerText = template.meta.name;
                            div.addEventListener('click', () => {
                                loadTemplate(template);
                            });
                            resultsContainer.appendChild(div);
                        }
                    });
                });
            });

            renderPreview();
        }

        function loadTemplate(template) {
            currentState = JSON.parse(JSON.stringify(template)); // deep copy

            // Update UI inputs
            document.getElementById('spriteUrl').value = currentState.visual.spriteUrl || '';
            document.getElementById('isFocusedToggle').checked = currentState.visual.isFocused || false;

            document.getElementById('scaleSlider').value = currentState.visual.scale;
            document.getElementById('spriteXSlider').value = currentState.visual.spriteX;
            document.getElementById('spriteYSlider').value = currentState.visual.spriteY;
            document.getElementById('uiXSlider').value = currentState.visual.uiX;
            document.getElementById('uiYSlider').value = currentState.visual.uiY;

            document.getElementById('statHp').value = currentState.mechanics.hp;
            document.getElementById('statLevel').value = currentState.mechanics.level;
            document.getElementById('statSpeed').value = currentState.mechanics.speed;
            document.getElementById('statSlots').value = currentState.mechanics.actionSlots;
            document.getElementById('statMaxSlots').value = currentState.mechanics.maxSlotsLimit !== undefined ? currentState.mechanics.maxSlotsLimit : 3;
            document.getElementById('statSkills').value = JSON.stringify(currentState.mechanics.skills);

            // Removed rawSkillEffects loading

            document.getElementById('metaName').value = currentState.meta.name || '';
            document.getElementById('metaLinkedNpc').value = currentState.meta.linkedNPC || '';
            document.getElementById('metaTags').value = (currentState.meta.tags || []).join(', ');

            renderPreview();
            alert("Template cargado: " + currentState.meta.name);
        }
    </script>

</body>
</html>
